<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SBANCA!</title>
<style>
:root{--x-glass:rgba(22,22,28,.58);--x-line:rgba(255,255,255,.13);--x-fg:#f4f4f6;--x-mut:#a3a3ad;--x-chip:#8f86f2;--x-chip-hi:#cdc7ff;--x-chip-lo:#5b51cc;
--x-gold:#f5b14c;--x-teal:#3fd0c9;--x-red:#ff6969;--x-disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter Tight","Inter",system-ui,sans-serif;
--x-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--x-fg);font-family:var(--x-body);touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.g{background:var(--x-glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--x-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.35)}
#top{position:fixed;left:10px;right:10px;top:calc(10px + var(--top));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;pointer-events:none;z-index:5}
.team{border-radius:16px;padding:7px 10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.th{display:flex;align-items:center;gap:6px;font:700 11px/1 var(--x-disp);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.th .dot{width:8px;height:8px;border-radius:50%;flex:none}.th .tot{margin-left:auto;font-size:13px;letter-spacing:0}
.th .chi{color:var(--x-mut);font-weight:500;letter-spacing:0;text-transform:none;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;gap:3px}.bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
#mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#timer{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;position:relative}
#timer svg{position:absolute;inset:0}#timer b{font:800 20px/1 var(--x-disp)}
#wind{border-radius:999px;padding:5px 10px;display:flex;align-items:center;gap:6px;font:600 10px/1 var(--x-disp);letter-spacing:.06em;white-space:nowrap}
#wind .w{display:flex;gap:2px}#wind .w i{width:4px;height:9px;border-radius:2px;background:rgba(255,255,255,.16)}#wind .w i.on{background:var(--x-teal)}
#info{position:fixed;left:50%;transform:translateX(-50%);top:calc(112px + var(--top));display:flex;gap:6px;pointer-events:none;z-index:5;max-width:calc(100vw - 20px)}
@media (max-width:600px){.th .chi{display:none}#info .pill{padding:5px 9px;font-size:10px}}
.pill{border-radius:999px;padding:6px 12px;font:600 11px/1 var(--x-disp);white-space:nowrap;display:flex;align-items:center;gap:6px}
.pill img{width:16px;height:16px;object-fit:contain}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:6;pointer-events:none;border-radius:22px;padding:14px 22px;text-align:center}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner h2{font:800 24px/1.1 var(--x-disp);white-space:nowrap}#banner{max-width:calc(100vw - 30px)}#banner p{font:500 13px/1.3 var(--x-body);color:var(--x-mut);margin-top:4px}
#ctl{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(14px + var(--bot));display:none;align-items:flex-end;justify-content:space-between;z-index:5;pointer-events:none}
#ctl.on{display:flex}
#ctl>*{pointer-events:auto}
.btn{border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:none;color:#fff}
.btn:active,.btn.pr{background:rgba(143,134,242,.35)}
.lbl{font:600 9px/1 var(--x-disp);letter-spacing:.08em;color:var(--x-mut);text-transform:uppercase;text-align:center;margin-top:5px}
.col{display:flex;flex-direction:column;align-items:center}
#fire{width:82px;height:82px;background:radial-gradient(circle at 35% 30%,#cdc7ff,#8f86f2 45%,#5b51cc);box-shadow:0 0 0 6px rgba(143,134,242,.18),0 12px 30px rgba(91,81,204,.55),inset 0 2px 0 rgba(255,255,255,.5);border:none;font:800 14px/1 var(--x-disp);letter-spacing:.06em}
#fire.off{filter:grayscale(.8) brightness(.6)}
#armi{border-radius:18px;padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:120px}
#armi img{width:34px;height:34px;object-fit:contain}#armi b{display:block;font:700 12px/1.1 var(--x-disp)}#armi small{font:500 10px/1 var(--x-body);color:var(--x-mut)}
#pann{position:fixed;left:10px;right:10px;bottom:calc(120px + var(--bot));max-width:560px;margin:0 auto;border-radius:24px;padding:12px;display:none;z-index:8}
#pann.on{display:block}
#pann .gr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.wc{position:relative;border-radius:14px;aspect-ratio:1;display:grid;place-items:center;border:1px solid transparent;cursor:pointer}
.wc img{width:70%;height:70%;max-width:100%;object-fit:contain}.wc.sel{background:rgba(143,134,242,.35);border-color:var(--x-chip-hi)}
.wc.off{opacity:.32}.wc em{position:absolute;right:4px;bottom:3px;font:700 9px/1 var(--x-disp);font-style:normal}.wc i{position:absolute;left:5px;top:4px;font:700 8px/1 var(--x-disp);font-style:normal;color:var(--x-gold)}
#pann h3{font:700 13px/1 var(--x-disp);margin:2px 4px 10px;display:flex;justify-content:space-between}#pann h3 span{color:var(--x-mut);font-weight:500}
#fuse{display:none;gap:4px;margin-bottom:8px;justify-content:flex-end}#fuse.on{display:flex}
#fuse b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--x-disp);cursor:pointer}
#fuse b.sel{background:rgba(245,177,76,.45);border-color:var(--x-gold)}
#ud{display:none;flex-direction:column;gap:8px;margin-right:8px}#ud.on{display:flex}
#err{position:fixed;left:50%;bottom:calc(130px + var(--bot));transform:translateX(-50%);z-index:9;opacity:0;transition:opacity .3s;pointer-events:none}
#err.on{opacity:1}.pill.allarme{border-color:rgba(255,105,105,.75)!important;animation:allarme 1.1s ease-in-out infinite}@keyframes allarme{50%{box-shadow:0 0 0 3px rgba(255,105,105,.35),0 0 18px rgba(255,90,90,.45)}}#err.lungo{white-space:normal;line-height:1.35;text-align:center;max-width:min(420px,calc(100vw - 32px));width:max-content}
#fine{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);opacity:0;pointer-events:none;transition:all .45s cubic-bezier(.2,.8,.2,1);z-index:12;border-radius:28px;padding:22px 26px;text-align:center;min-width:260px}
#fine.on{opacity:1;transform:translate(-50%,-50%) scale(1)}#fine h2{font:800 30px/1.1 var(--x-disp)}#fine p{color:var(--x-mut);font:500 13px/1.4 var(--x-body);margin:6px 0 12px}
#fs{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font:600 12px/1.2 var(--x-disp);text-align:left}#fs span{color:var(--x-mut);font-weight:500}
#ruota{position:fixed;width:300px;height:300px;z-index:15;display:none;border-radius:50%;background:radial-gradient(circle,rgba(22,22,28,.86) 0 64%,rgba(22,22,28,.6) 65% 100%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--x-line);box-shadow:0 20px 50px rgba(0,0,0,.5)}
#ruota.on{display:block;animation:rIn .16s cubic-bezier(.2,.8,.2,1)}@keyframes rIn{from{transform:scale(.7);opacity:0}}
.ri{position:absolute;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid transparent;transition:transform .12s}
.ri:hover{transform:scale(1.22);background:rgba(143,134,242,.35);border-color:var(--x-chip-hi)}.ri.sel{background:rgba(143,134,242,.28)}.ri.off{opacity:.3}
.ri img{width:30px;height:30px;object-fit:contain}.ri em{position:absolute;right:-2px;bottom:-2px;font:700 9px/1 var(--x-disp);font-style:normal;background:#000;border-radius:6px;padding:2px 4px}.ri i{position:absolute;left:-2px;top:-2px;font:700 8px/1 var(--x-disp);font-style:normal;color:var(--x-gold)}
.rc{position:absolute;left:105px;top:122px;width:90px;text-align:center}.rc b{display:block;font:700 11px/1.15 var(--x-disp)}.rc small{font:500 9px/1.4 var(--x-body);color:var(--x-mut)}
#hint{position:fixed;left:50%;bottom:calc(16px + var(--bot));transform:translateX(-50%);display:none;z-index:6;pointer-events:none;border-radius:999px;padding:8px 16px;font:600 12px/1 var(--x-disp);white-space:nowrap;color:#e8e8ee}
body.pc #hint{display:block}body.pc #ctl{display:none!important}body.pc #pann{display:none!important}
#pbar{position:fixed;left:50%;bottom:calc(52px + var(--bot));transform:translateX(-50%);width:260px;height:10px;border-radius:6px;overflow:hidden;display:none;z-index:6}#pbar.on{display:block}
#pbi{height:100%;width:0;background:linear-gradient(90deg,#3fd0c9,#f5b14c 60%,#ff6969);border-radius:6px}
#aiuto{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:16;border-radius:24px;padding:18px 22px;display:none;min-width:420px}#aiuto.on{display:block}
#aiuto h3{font:800 16px/1 var(--x-disp);margin-bottom:12px}#aiuto .k{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font:500 12px/1.3 var(--x-body);color:#d8d8de}
#aiuto kbd{display:inline-block;min-width:20px;padding:2px 6px;border-radius:6px;border:1px solid var(--x-line);background:rgba(255,255,255,.08);font:600 11px/1.3 var(--x-disp);color:#fff;margin-right:3px;text-align:center}
.bu{flex:1;display:flex;align-items:center;gap:4px;min-width:0}.bu .bar{flex:1;position:relative}.bar i.tr{position:absolute;left:0;top:0;background:rgba(255,255,255,.85)!important;transition:width 1s .35s}
.av{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.1);object-fit:cover;pointer-events:auto;cursor:pointer;transition:filter .5s;flex:none}.av.morto{filter:grayscale(1) brightness(.45)}

#menu{position:fixed;inset:0;z-index:30;display:none;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#2a2340 0%,#0b0a10 60%,#000 100%);padding:calc(18px + var(--top)) 14px calc(24px + var(--bot))}
#menu.on{display:block;animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0}}
.mc{max-width:720px;margin:0 auto;border-radius:28px;padding:20px 18px 22px}
.mt{text-align:center}.mt h1{font:900 46px/1 var(--x-disp);letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#cdc7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.mt p{font:600 11px/1.4 var(--x-disp);letter-spacing:.12em;color:var(--x-mut);margin-top:6px}
.ml{display:flex;justify-content:center;gap:4px;margin:12px 0 4px}.ml img{height:62px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
#menu h4{font:700 10px/1 var(--x-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--x-mut);margin:16px 2px 8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.sg,.tg{flex:1;min-width:110px;text-align:center;border-radius:14px;padding:10px 8px;font:700 12px/1 var(--x-disp);background:rgba(255,255,255,.06);border:1px solid var(--x-line);cursor:pointer;transition:all .18s}
.sg.on,.tg.on{background:rgba(143,134,242,.32);border-color:var(--x-chip-hi);box-shadow:0 0 18px rgba(143,134,242,.35)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.cards.mp{grid-template-columns:repeat(5,minmax(0,1fr))}
.cd{border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--x-line);padding:8px 6px;text-align:center;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:6px}
.cd:hover{transform:translateY(-2px)}.cd.on{background:rgba(143,134,242,.28);border-color:var(--x-chip-hi);box-shadow:0 0 20px rgba(143,134,242,.35)}
.cd img{height:62px;max-width:100%;object-fit:contain}.mp .cd img{height:auto;width:100%;border-radius:10px;aspect-ratio:2/1;object-fit:cover}
.cd span{font:700 10px/1.15 var(--x-disp)}.sorp{width:100%;aspect-ratio:2/1;border-radius:10px;display:grid;place-items:center;font:900 30px/1 var(--x-disp);background:linear-gradient(135deg,#3a2f66,#1a1626)}
#mgo{display:block;width:100%;margin-top:20px;border:none;border-radius:18px;padding:16px;font:900 18px/1 var(--x-disp);letter-spacing:.08em;color:#fff;cursor:pointer;background:radial-gradient(circle at 35% 30%,#cdc7ff,#8f86f2 45%,#5b51cc);box-shadow:0 12px 30px rgba(91,81,204,.5),inset 0 2px 0 rgba(255,255,255,.4)}
#mgo:active{transform:scale(.98)}
@media (max-width:600px){.cards,.cards.mp{grid-template-columns:repeat(3,minmax(0,1fr))}.mt h1{font-size:38px}}
#tut{position:fixed;left:50%;top:calc(150px + var(--top));transform:translateX(-50%) translateY(-8px);opacity:0;transition:all .35s var(--x-ease);z-index:7;border-radius:20px;padding:12px 16px;width:min(440px,calc(100vw - 24px));pointer-events:none}
#tut.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}#tut small{font:700 9px/1 var(--x-disp);letter-spacing:.12em;color:var(--x-gold)}#tut b{display:block;font:800 16px/1.2 var(--x-disp);margin:4px 0}
#tut p{font:500 12px/1.45 var(--x-body);color:#dcdce2}#tut .dots{display:flex;gap:5px;margin-top:8px}#tut .dots i{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}#tut .dots i.on{background:var(--x-gold)}
#tut .tb{margin-top:10px}#tut button,#fb button{border:none;border-radius:14px;padding:11px 18px;font:800 13px/1 var(--x-disp);color:#fff;cursor:pointer;background:radial-gradient(circle at 35% 30%,#cdc7ff,#8f86f2 45%,#5b51cc)}
#fb{display:flex;gap:8px;justify-content:center;margin-top:16px}#fb button.sec{background:rgba(255,255,255,.1);border:1px solid var(--x-line)}
#fine.on{pointer-events:auto}#fs{grid-template-columns:minmax(120px,auto) repeat(5,auto)!important;gap:8px 12px!important;align-items:center}#fs span{font-size:9px;letter-spacing:.08em;text-transform:uppercase}#fs b{text-align:center}
.fn{display:flex;align-items:center;gap:6px}.fn img{width:24px;height:24px;border-radius:50%}.fn em{color:var(--x-gold);font-style:normal}
#wind.pulsa{animation:pul 1s ease-in-out infinite;border-color:var(--x-gold)}@keyframes pul{50%{box-shadow:0 0 0 6px rgba(245,177,76,.25)}}
#chi{position:fixed;left:50%;top:calc(146px + var(--top));transform:translateX(-50%);z-index:5;border-radius:999px;padding:6px 14px;font:600 11px/1 var(--x-disp);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;display:flex;align-items:center;gap:6px;border-color:var(--c)}
#chi.on{opacity:1}#chi.mio{box-shadow:0 0 0 2px var(--c),0 0 22px var(--c);animation:pul2 1.4s ease-in-out infinite}@keyframes pul2{50%{box-shadow:0 0 0 2px var(--c),0 0 8px var(--c)}}
#chi .dot{width:9px;height:9px;display:inline-block}
body.tuto #chi{top:calc(112px + var(--top))}body.tuto #info{display:none}
#bmuto{position:fixed;right:12px;top:calc(76px + var(--top));z-index:6;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
#bmuto.off svg path.on{display:none}#bmuto:not(.off) svg path.offx{display:none}
#bmira{position:fixed;left:12px;top:calc(116px + var(--top));z-index:6;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
#timer.fretta{animation:fretta .5s ease-in-out infinite}#timer.fretta b{color:#ff8a8a}@keyframes fretta{50%{transform:scale(1.12);box-shadow:0 0 0 4px rgba(255,105,105,.35)}}
#bmenu{position:fixed;left:12px;top:calc(76px + var(--top));z-index:6;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
@media (min-width:900px) and (orientation:landscape){#bmuto,#bmenu{top:calc(84px + var(--top))}#bmira{top:calc(124px + var(--top))}#chi{top:calc(112px + var(--top))}}
@media (orientation:landscape) and (max-height:500px){#top{transform:scale(.86);transform-origin:top center}#info{top:calc(96px + var(--top))}#chi{top:calc(128px + var(--top))}#tut{top:calc(150px + var(--top))}#bmuto,#bmenu{top:calc(62px + var(--top))}}

#load{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:20;font:600 14px/1 var(--x-disp);color:var(--x-mut)}
#pronto{position:fixed;right:14px;bottom:calc(104px + var(--bot));z-index:6;pointer-events:none;border-radius:999px;padding:7px 12px;font:700 11px/1 var(--x-disp);letter-spacing:.03em;white-space:nowrap;opacity:0;transition:opacity .2s;display:flex;align-items:center;gap:7px;color:#ececf2;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis}
#pronto.on{opacity:1}#pronto i{flex:none;width:8px;height:8px;border-radius:50%;background:#6edc96;box-shadow:0 0 8px #6edc96}#pronto.no i{background:#ff6969;box-shadow:0 0 8px #ff6969}#pronto.att i{background:#f5b14c;box-shadow:0 0 8px #f5b14c}#pronto.no{color:#ffc2c2}
body.pc #pronto{right:auto;left:50%;transform:translateX(-50%);bottom:calc(58px + var(--bot))}body.pc #pronto.carica{opacity:0}
#fire{transition:filter .15s,transform .1s}#fire.off{filter:grayscale(1) brightness(.45)}#fire.no{animation:no .28s}@keyframes no{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (min-width:900px) and (orientation:landscape){#top{left:18px;right:18px;grid-template-columns:300px auto 300px;justify-content:space-between}#info{top:calc(18px + var(--top));left:auto;right:340px;transform:none}}

/* ── ITERAZIONE 8 (17/11): guscio SBANCA! (titolo, GIOCA, ALLENATI, SQUADRE, MAPPE, REGOLE, IMPOSTAZIONI) ── */
:root{--sh-gold:#ffc94d;--sh-gold2:#f59e1b;--sh-gold3:#9a5200;--sh-ink:#1a0d2e;--sh-pur:#8f86f2;--sh-cream:#fff4dc;--sh-mut:#b9b2d6;
--sh-anton:SBAnton,Impact,"Arial Black",sans-serif;--sh-russo:SBRusso,"Arial Black",system-ui,sans-serif}
#sh{position:fixed;inset:0;z-index:30;display:none;color:#fff;overflow:hidden;background:radial-gradient(120% 90% at 50% 18%,#2a1d5c 0%,#140d2c 45%,#07060d 100%);touch-action:manipulation}
#sh.on{display:block}
#sh .shf{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#sh button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#sh button:focus{outline:none}#sh button:focus-visible{outline:3px solid var(--sh-gold);outline-offset:3px}
#sh .scr{position:absolute;inset:0;display:none}
#sh .scr.on{display:block}
/* entrata degli elementi (a cascata) */
#sh .scr.on .en{animation:shSale .42s cubic-bezier(.2,1.35,.4,1) both;animation-delay:calc(var(--i,0) * .055s + .05s)}
@keyframes shSale{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
body.rm #sh .scr.on .en{animation:shFade .2s both}@keyframes shFade{from{opacity:0}}
/* ── HOME ── */
#sh .home{display:none;position:absolute;inset:0;padding:calc(14px + var(--top)) 16px calc(14px + var(--bot));
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(120px,1fr) auto;grid-template-areas:"logo" "palco" "menu";row-gap:6px;justify-items:center}
#sh .scr.on.home{display:grid}
#sh .logo{grid-area:logo;position:relative;text-align:center;margin-top:clamp(4px,3vh,34px);pointer-events:none}
#sh .lg{position:relative;display:inline-block;font:400 clamp(70px,22vw,150px)/.9 var(--sh-anton);letter-spacing:.01em;transform:skewX(-8deg) rotate(-3deg)}

/* SBANCA_PONTE_RT_1711 — la pagina dentro la mini app (?rt=1): niente socket sue.
   La "WebSocket" della pagina diventa un ponte postMessage verso il guscio dell index
   (SBRT, stessa origine), che parla col server real-time vero sulla socket della mini app.
   Traduce i messaggi del server nel formato del server di prova (start, {t:s,s}, err) e
   manda su solo in/aim/act/rientra. Fuori da ?rt=1 non fa niente: la pagina resta quella di prova. */
(function(){
  "use strict";
  var Q=new URLSearchParams(location.search);
  if(Q.get('rt')!=='1'||window.parent===window)return;
  var ORIG=location.origin,vivo=null,ultimoStart=null,finita=false;
  window.__SBRT_PONTE={giu:0,su:0,start:0,err:0,ult:[]};
  function su(o){try{window.parent.postMessage(o,ORIG);}catch(e){}}
  function traduci(m){
    if(!m||typeof m!=='object')return null;
    if(m.t==='s'){
      if(m.g!=='sbanca')return null;
      if(m.over)finita=true;
      var s={},k;for(k in m){if(k!=='t'&&k!=='time')s[k]=m[k];}
      s.t=(typeof m.time==='number')?m.time:0;
      return {t:'s',s:s};
    }
    if(m.t==='start'){
      if(m.game!=='sbanca'||!m.map)return null;
      var you=(m.spec||m.you==null)?null:String(m.you);
      try{var pr=m.profiles||{},sq=m.map.squadre||{},pid;
        for(pid in sq){if(String(pid).indexOf('bot:')===0)continue;var n=pr[pid]&&pr[pid].name;if(n&&String(n).indexOf('bot:')!==0){n=String(n).replace(/[\u0000-\u001f<>&"]/g,'').trim().slice(0,16);if(n)sq[pid].nome=n;}}}catch(e){}

    }

    return null;
  }

    this.onopen=this.onmessage=this.onclose=this.onerror=null;vivo=this;

    },0);
  }
  FintaWS.CONNECTING=0;FintaWS.OPEN=1;FintaWS.CLOSING=2;FintaWS.CLOSED=3;
  FintaWS.prototype._giu=function(x){if(this.readyState!==1||!this.onmessage)return;try{this.onmessage({data:JSON.stringify(x)});}catch(e){su({sm:'err',msg:'ponte: '+String(e&&e.message||e)});}};

    if(!o||typeof o!=='object')return;
    if(o.t==='ping')return;                                   // la socket e la sua salute sono del guscio
    if(o.t==='resync'){if(!finita)su({sm:'su',m:{t:'rientra'}});return;}

    if(d.sm==='bordi'){try{var R=document.documentElement.style,px=function(v){v=Number(v);return (isFinite(v)&&v>0&&v<200)?Math.round(v):0;};

  d.querySelectorAll('button').forEach(b=>b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')shSuona('tick');}));
  d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!d.contains(b))return;
    if(b.dataset.lv){SH.sel.lv=b.dataset.lv;LS('lv',SH.sel.lv);d.querySelectorAll('[data-lv]').forEach(x=>x.classList.toggle('on',x===b));shSuona('click');return;}
    if(b.dataset.tema!=null&&sch!=='mappe'){SH.sel.tema=b.dataset.tema;LS('tema',SH.sel.tema);d.querySelectorAll('[data-tema]').forEach(x=>x.classList.toggle('on',x===b));shSuona('click');return;}
    if(b.dataset.tema!=null&&sch==='mappe'){SH.sel.tema=b.dataset.tema;LS('tema',SH.sel.tema);d.querySelectorAll('[data-tema]').forEach(x=>x.classList.toggle('on',x===b));shSuona('click');return;}
    if(b.dataset.sq){SH.vis=b.dataset.sq;shStage();shSuona('click');return;}
    if(b.dataset.lang){if(b.dataset.lang===LANG)return;LS('lang',b.dataset.lang);const u=new URL(location.href);u.searchParams.set('lang',b.dataset.lang);u.searchParams.set('sch','imp');location.href=u;return;}
    const a=b.dataset.a;if(!a)return;shAzione(a,b);});
  d.querySelectorAll('input[type=range]').forEach(r=>r.addEventListener('input',()=>{impostaVol(r.dataset.vol,r.value/100);if(r.dataset.vol==='mus')shAvviaAudio();}));
  d.querySelectorAll('input[type=range]').forEach(r=>r.addEventListener('change',()=>{if(r.dataset.vol!=='mus')shSuona('via');}));
  if(sch==='squadre')shStage();
  if(sch==='gioca'&&!SH_HOST){const i=d.querySelector('#shcod');if(i){i.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')shAzione('entraCod',i);});i.addEventListener('input',()=>{i.value=i.value.toUpperCase().replace(/[^A-Z0-9]/g,'');});}}
}
function shAzione(a,b){
  const vai=s=>shPremi(b,()=>shVai(s));
  if(a==='indietro')return shPremi(b,shIndietro);
  if(a==='gioca'){if(SH_HOST)SH.attesa=Date.now();return shPremi(b,()=>{shVai('gioca');if(SH_HOST)shChiediCoda();});}
  if(a==='allena'||a==='squadre'||a==='mappe'||a==='regole'||a==='imp'){if(a==='allena'&&SH.sch==='gioca'&&SH_HOST)shManda({t:'annulla'});return vai(a);}
  if(a==='palco')return;
  if(a==='esci')return shPremi(b,()=>shManda({t:'esci'}));
  if(a==='tutorial')return shPremi(b,()=>shParti({modo:'tutorial',sq:SH.sel.sq}));
  if(a==='rapida')return shPremi(b,()=>shParti({modo:'bot',lv:'medio',sq:SH.sel.sq,tema:MP_ORD[(Math.random()*4)|0]}));
  if(a==='guarda')return shPremi(b,()=>shParti({modo:'botbot',tema:SH.sel.tema||MP_ORD[(Math.random()*4)|0]}));
  if(a==='iniziaBot')return shPremi(b,()=>shParti({modo:'bot',lv:SH.sel.lv,sq:SH.sel.sq,tema:SH.sel.tema}));
  if(a==='qui')return shPremi(b,()=>{if(!SH.sel.tema){SH.sel.tema='tavolo';LS('tema','tavolo');}shVai('allena');});
  if(a==='creaCod'){const c=Math.random().toString(36).slice(2,7).toUpperCase();return shPremi(b,()=>shParti({modo:'pvp',stanza:c,sq:SH.sel.sq,tema:SH.sel.tema}));}
  if(a==='entraCod'){const i=document.getElementById('shcod');const c=(i&&i.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<3){if(i){i.focus();i.animate&&i.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:240});}return;}
    return shPremi(b,()=>shParti({modo:'pvp',stanza:c,sq:SH.sel.sq}));}
  if(a==='sceglisq'){SH.sel.sq=SH.vis;LS('sq',SH.vis);shManda({t:'squadra',sq:SH.vis});shSuona('via');shStage();return;}
  if(a==='audio'){ac();muta(!mutoUtente);b.classList.toggle('on',!mutoUtente);if(!mutoUtente)shAvviaAudio();shSuona('click');return;}
  if(a==='rm'){RM=!RM;LS('rm',RM?'1':'0');b.classList.toggle('on',RM);document.body.classList.toggle('rm',RM);shSuona('click');return;}
  if(a==='annullaCoda'){shManda({t:'annulla'});return shPremi(b,()=>shVai('home'));}
  if(a==='riprovaCoda'){return shPremi(b,shChiediCoda);}
}
// GIOCA con la pagina ospite: si chiede la coda, la pagina ospite risponde con 'coda' (testo) e poi 'avvia' (stanza + ticket)
let shCodaT=0;

  shCodaT=setTimeout(()=>{if(SH.sch!=='gioca'||SH.risposta>SH.attesa)return;const p=document.getElementById('shlob');if(p){p.textContent=TXS.nessuna;const at=document.getElementById('shatt');
    if(at&&!at.querySelector('[data-a=riprovaCoda]')){const x=document.createElement('button');x.className='grande';x.dataset.a='riprovaCoda';x.innerHTML='<span>'+TXS.riprova+'</span>';x.style.width='min(100%,360px)';at.appendChild(x);}}},8000);}
// ── API per la pagina ospite (postMessage o chiamata diretta) ──
const SH_OK=/^[A-Za-z0-9_-]{1,64}$/;
function shAvviaDaHost(o){const p={};for(const k of ['modo','stanza','tema','sq','lv','seed'])if(o[k]!=null&&SH_OK.test(String(o[k])))p[k]=String(o[k]);
  if(!['bot','pvp','botbot','tutorial'].includes(p.modo))p.modo='pvp';if(!p.sq)p.sq=SH.sel.sq;
  const tk=o.ticket!=null?String(o.ticket):SH_CTX.ticket;if(tk&&/^[A-Za-z0-9._~:=+\/-]{1,600}$/.test(tk))p.ticket=tk;
  SH.occ=false;shParti(p);}
function shContesto(o){if(!o)return;SH.risposta=Date.now();
  if(PIATT==='tg'){if(o.posta!=null)SH_CTX.posta=shTxt(o.posta,60);if(o.lobby!=null)SH_CTX.lobby=shTxt(o.lobby,80);}
  else{if(o.lobby!=null)SH_CTX.lobby=DC?dcPulito(shTxt(o.lobby,80)):shTxt(o.lobby,80);} // in dc la posta non esiste: ignorata
  if(o.ticket!=null&&/^[A-Za-z0-9._~:=+\/-]{0,600}$/.test(String(o.ticket)))SH_CTX.ticket=String(o.ticket);
  if(SH.sch==='home'){const s=document.getElementById('shsub');if(s)s.textContent=PIATT==='tg'?(SH_CTX.posta||SH_CTX.lobby||TXS.giocaTg):(DC?(SH_CTX.lobby||TXS.giocaDc):TXS.giocaLoc);
    const pd=document.getElementById('shpiede');if(pd&&PIATT==='tg')pd.innerHTML=(SH_CTX.posta?'<span class="badge oro">'+shEsc(SH_CTX.posta)+'</span>':'')+(SH_CTX.lobby?'<span class="badge">'+shEsc(SH_CTX.lobby)+'</span>':'');}
  if(SH.sch==='gioca'){const p=document.getElementById('shlob');if(p)p.textContent=SH_CTX.lobby||TXS.cercoP;}}
function shMsg(o){if(!o||typeof o!=='object')return;const t=o.t;
  if(t==='contesto'||t==='coda')shContesto(o);
  else if(t==='avvia')shAvviaDaHost(o);
  else if(t==='annulla'){if(SH.sch==='gioca')shVai('home');}
  else if(t==='apri'&&typeof o.schermo==='string'&&(o.schermo==='home'||SH_TIT[o.schermo]))shVai(o.schermo);}

window.SBANCA={v:1,piatt:PIATT,contesto:o=>shMsg(Object.assign({},o,{t:'contesto'})),coda:o=>shMsg(Object.assign({},o,{t:'coda'})),avvia:o=>shMsg(Object.assign({},o,{t:'avvia'})),
  annulla:()=>shMsg({t:'annulla'}),apri:s=>shMsg({t:'apri',schermo:s}),on:(t,f)=>{(SH_ASC[t]=SH_ASC[t]||[]).push(f);}};
// ── fondo animato: porta del caveau, fari, scintille, i 5 personaggi sul palco ──
const SHF={c:null,x:null,w:0,h:0,dpr:1,porta:null,ruota:null,pt:[],pg:[],t0:0,last:0};
function shFondoTela(){if(SHF.c)return SHF.c;const c=document.createElement('canvas');c.className='shf';SHF.c=c;SHF.x=c.getContext('2d');return c;}
function shBake(){const R=Math.round(Math.min(SHF.w,SHF.h)*.42*SHF.dpr)||200;const mk=(n)=>{const c=document.createElement('canvas');c.width=c.height=n;return [c,c.getContext('2d')];};
  const [p,x]=mk(R*2+8),C=R+4;x.translate(C,C);
  let g=x.createRadialGradient(0,-R*.3,R*.1,0,0,R);g.addColorStop(0,'#5b5480');g.addColorStop(.7,'#2c2648');g.addColorStop(1,'#151126');x.fillStyle=g;x.beginPath();x.arc(0,0,R,0,7);x.fill();
  x.lineWidth=R*.05;x.strokeStyle='#0c0a18';x.stroke();x.lineWidth=R*.018;x.strokeStyle='rgba(255,215,130,.55)';x.beginPath();x.arc(0,0,R*.97,Math.PI*1.05,Math.PI*1.75);x.stroke();
  for(const rr of [.8,.62]){x.lineWidth=R*.03;x.strokeStyle='rgba(10,8,22,.8)';x.beginPath();x.arc(0,0,R*rr,0,7);x.stroke();x.lineWidth=R*.012;x.strokeStyle='rgba(255,255,255,.12)';x.beginPath();x.arc(0,0,R*rr-R*.02,Math.PI*1.1,Math.PI*1.7);x.stroke();}
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2,bx=Math.cos(a)*R*.89,by=Math.sin(a)*R*.89,br=R*.035;const bg=x.createRadialGradient(bx-br*.3,by-br*.3,br*.1,bx,by,br);bg.addColorStop(0,'#d8cfa0');bg.addColorStop(1,'#5a4a26');x.fillStyle=bg;x.beginPath();x.arc(bx,by,br,0,7);x.fill();}
  SHF.porta=p;const [w,y]=mk(Math.round(R*1.3)),W2=w.width/2;y.translate(W2,W2);y.strokeStyle='#d9a540';y.lineCap='round';
  y.lineWidth=R*.06;for(let i=0;i<6;i++){const a=i/6*Math.PI*2;y.beginPath();y.moveTo(Math.cos(a)*R*.12,Math.sin(a)*R*.12);y.lineTo(Math.cos(a)*R*.5,Math.sin(a)*R*.5);y.stroke();y.fillStyle='#f5c860';y.beginPath();y.arc(Math.cos(a)*R*.53,Math.sin(a)*R*.53,R*.05,0,7);y.fill();}
  y.lineWidth=R*.05;y.beginPath();y.arc(0,0,R*.36,0,7);y.stroke();const hg=y.createRadialGradient(-R*.04,-R*.04,R*.02,0,0,R*.15);hg.addColorStop(0,'#fff0b0');hg.addColorStop(1,'#b07a18');y.fillStyle=hg;y.beginPath();y.arc(0,0,R*.14,0,7);y.fill();
  SHF.ruota=w;SHF.R=R;}
function shResize(){const c=shFondoTela();SHF.dpr=Math.min(1.75,window.devicePixelRatio||1);SHF.w=innerWidth;SHF.h=innerHeight;c.width=SHF.w*SHF.dpr|0;c.height=SHF.h*SHF.dpr|0;shBake();
  const st=document.querySelector('#shstage canvas');if(st){const r=st.getBoundingClientRect();st.width=r.width*SHF.dpr|0;st.height=r.height*SHF.dpr|0;}}
function shParticelle(){SHF.pt=[];const n=RM?14:42;for(let i=0;i<n;i++)SHF.pt.push({x:Math.random(),y:Math.random(),v:.012+Math.random()*.03,s:.6+Math.random()*1.8,f:Math.random()*6,k:Math.random()<.18?(1+(Math.random()*4|0)):0});}
// personaggi del titolo: la squadra scelta al centro, gli altri ai lati; ognuno ogni tanto fa il suo gesto
function shPersonaggi(){const ord=SQ_ORD.filter(s=>s!==SH.sel.sq);const pos=[ord[2],ord[0],SH.sel.sq,ord[1],ord[3]];
  SHF.pg=pos.map((sq,i)=>({sq,i,pose:'idle',pt:0,next:1.5+Math.random()*4+i*.4,hop:0,ph:Math.random()*6}));}
const SH_GESTI=[['fidget',1.1],['win',.9],['aim',1],['shoulder',1],['windup',.5]];
function shDisegnaPg(x,p,cx,base,h,dir,t,dt){if(!SHF.pg)return;
  p.pt+=dt;if(p.pose==='idle'&&t>p.next){const g=SH_GESTI[(Math.random()*SH_GESTI.length)|0];p.pose=g[0];p.dur=g[1];p.pt=0;if(p.pose==='win')p.hop=1;}
  else if(p.pose!=='idle'&&p.pt>p.dur){if(p.pose==='windup'){p.pose='release';p.dur=.45;p.pt=0;}else{p.pose='idle';p.next=t+2.5+Math.random()*5;}}
  const [f,im]=pivotSprite(p.sq,p.pose);if(!f||!im)return;const s=h/120;
  let oy=0,sx=1,sy=1;const b=Math.sin(t*2.4+p.ph);if(p.pose==='idle'){sy=1+b*.018;sx=1-b*.012;}
  if(p.hop){const q=Math.min(1,p.pt/.55);oy=-Math.sin(q*Math.PI)*h*.22;if(q>=1)p.hop=0;sy=q<.15?.9:1.04;sx=q<.15?1.08:.97;}
  x.save();x.globalAlpha=.35;x.fillStyle='#000';x.beginPath();x.ellipse(cx,base+2,h*.32*(1+oy/h),h*.06,0,0,7);x.fill();x.restore();
  x.save();x.translate(cx,base+oy);x.scale(dir*sx,sy);x.drawImage(im,f.x,f.y,f.w,f.h,-f.w*s/2,-f.h*s,f.w*s,f.h*s);x.restore();}
function shFrame(now){SHF.raf=0;const r=shEl();if(!r||!r.classList.contains('on'))return;SHF.raf=requestAnimationFrame(shFrame);if(document.hidden)return;
  const t=now/1000,dt=Math.min(.05,SHF.last?t-SHF.last:.016);SHF.last=t;const x=SHF.x,c=SHF.c,D=SHF.dpr;if(!x)return;
  x.setTransform(D,0,0,D,0,0);x.clearRect(0,0,SHF.w,SHF.h);const home=SH.sch==='home';
  // porta del caveau dietro il logo (sul titolo), piu' piccola e scura nelle schermate interne
  let cx=SHF.w/2,cy=SHF.h*.36,rs=1,al=.5;
  if(home){const lg=r.querySelector('.logo'),pc=r.querySelector('.palco');if(lg&&pc){const a=lg.getBoundingClientRect(),b=pc.getBoundingClientRect();cx=(b.left+b.right)/2;cy=(a.top+b.bottom)/2;
    const hh=(b.bottom-a.top)*.54,ww=(b.right-b.left)*.47;rs=Math.max(.45,Math.min(hh,ww)/(SHF.R/D));}al=.62;}
  else{cx=SHF.w*.82;cy=SHF.h*.78;rs=1.1;al=.18;}
  if(SHF.porta){const R=SHF.R/D*rs;x.globalAlpha=al;x.drawImage(SHF.porta,cx-R-4*rs,cy-R-4*rs,(SHF.R*2+8)/D*rs,(SHF.R*2+8)/D*rs);
    x.save();x.translate(cx,cy);x.rotate(RM?0:t*.25);const w=SHF.ruota.width/D*rs;x.drawImage(SHF.ruota,-w/2,-w/2,w,w);x.restore();x.globalAlpha=1;}
  // fari che girano
  if(!RM){x.save();x.globalCompositeOperation='lighter';for(const [bx,ph] of [[0,0],[SHF.w,2.2]]){const a=-Math.PI/2+Math.sin(t*.45+ph)*.55,L=SHF.h*1.2;
    const g=x.createLinearGradient(bx,SHF.h,bx+Math.cos(a)*L,SHF.h+Math.sin(a)*L);g.addColorStop(0,'rgba(170,150,255,.16)');g.addColorStop(1,'rgba(170,150,255,0)');x.fillStyle=g;
    x.beginPath();x.moveTo(bx,SHF.h);x.lineTo(bx+Math.cos(a-.12)*L,SHF.h+Math.sin(a-.12)*L);x.lineTo(bx+Math.cos(a+.12)*L,SHF.h+Math.sin(a+.12)*L);x.closePath();x.fill();}x.restore();}
  // scintille e semi delle carte che salgono
  for(const p of SHF.pt){if(!RM){p.y-=p.v*dt;p.x+=Math.sin(t*.7+p.f)*.0004;}if(p.y<-.05){p.y=1.05;p.x=Math.random();}
    const px=p.x*SHF.w,py=p.y*SHF.h,tw=.45+.55*Math.abs(Math.sin(t*1.6+p.f));
    if(p.k){x.globalAlpha=.16*tw;x.fillStyle=p.k<3?'#ff7a8a':'#c3b8ff';x.font=(10+p.s*6)+'px serif';x.fillText(['','♠','♥','♦','♣'][p.k],px,py);}
    else{x.globalAlpha=.55*tw;x.fillStyle=p.s>1.6?'#ffd968':'#cfc8ff';x.beginPath();x.arc(px,py,p.s,0,7);x.fill();}}
  x.globalAlpha=1;
  // personaggi sul palco del titolo
  if(home){const pc=r.querySelector('.palco');if(pc&&SHF.pg.length){const b=pc.getBoundingClientRect();const n=5,ww=b.width,hh=b.height;

  if(SH.sch==='squadre')shStageFrame(t,dt);}

  const pose=STG.seq[STG.i][0];const [f,im]=pivotSprite(SH.vis,pose);if(!f||!im)return;const nar=w<520;const H0=Math.min(h*(nar?.5:.62),w*.62),s=H0/120;
