<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b3b24">
<title>Poker 1v1</title>
<style>
:root{
  --felt:#0f5a36; --felt2:#0a3f26; --felt3:#06291a; --oro:#e8c15a; --oro2:#b8872a;
  --rosso:#e0343f; --bianco:#fbf7ee; --ink:#10151a; --verde-ok:#3ddc84;
  --sa-top:0px; --sa-bot:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--felt3);color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;}
#app{position:fixed;inset:0;overflow:hidden;}
#felt{position:absolute;inset:0;
  background:
   radial-gradient(ellipse 120% 70% at 50% 45%, rgba(255,255,255,.10), transparent 60%),
   radial-gradient(ellipse 140% 90% at 50% 50%, var(--felt) 0%, var(--felt2) 62%, var(--felt3) 100%);}
#felt:after{content:"";position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay;background-image:var(--grana);}
#ovale{position:absolute;left:50%;top:46%;width:min(150vw,760px);height:min(92vw,470px);
  transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(232,193,90,.18);
  box-shadow:0 0 0 12px rgba(232,193,90,.04) inset, 0 0 60px rgba(0,0,0,.25) inset;pointer-events:none;}
#stage{position:absolute;left:50%;top:0;bottom:0;width:100%;max-width:520px;transform:translateX(-50%);
  display:flex;flex-direction:column;padding:calc(6px + var(--sa-top)) 12px calc(8px + var(--sa-bot));}
#top{display:flex;align-items:center;gap:8px;height:44px;flex:0 0 auto;}
.tbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.28);color:#fff;font-size:18px;font-weight:800;cursor:pointer;}
#info{flex:1;text-align:center;line-height:1.05;}
#i-mano{font-size:15px;font-weight:900;letter-spacing:.08em;color:var(--oro);}
#i-sub{font-size:11px;font-weight:700;opacity:.78;letter-spacing:.04em;margin-top:3px;}
/* posti */
.seat{display:flex;align-items:center;gap:10px;flex:0 0 auto;height:58px;position:relative;}
.av{width:50px;height:50px;border-radius:50%;flex:0 0 auto;position:relative;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;}
.av .ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.av svg{width:100%;height:100%;}
.av .ring{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .2s;
  -webkit-mask:radial-gradient(circle, transparent 58%, #000 59%);mask:radial-gradient(circle, transparent 58%, #000 59%);}
.av .dealer{position:absolute;right:-6px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;
  font-size:12px;font-weight:1000;display:none;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.5);z-index:2;}
.av .dealer.on{display:flex;}
.seat .nm{flex:1;min-width:0;}
.seat .nm b{display:block;font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tag{display:inline-block;margin-top:3px;font-size:12px;font-weight:900;letter-spacing:.05em;padding:3px 8px;
  border-radius:999px;background:rgba(0,0,0,.35);color:#dfe;}
.tag.ok{background:rgba(61,220,132,.2);color:var(--verde-ok);box-shadow:0 0 0 1px rgba(61,220,132,.45) inset;}
.tag.oro{background:rgba(232,193,90,.18);color:var(--oro);box-shadow:0 0 0 1px rgba(232,193,90,.5) inset;}
.tag.no{background:rgba(224,52,63,.2);color:#ff8088;box-shadow:0 0 0 1px rgba(224,52,63,.5) inset;}
.tag.ai{background:linear-gradient(180deg,#ff5a64,#b1121f);color:#fff;box-shadow:0 0 14px rgba(255,60,70,.6);}
.pensa:after{content:"";display:inline-block;width:1.2em;text-align:left;animation:puntini 1.2s steps(4) infinite;}
@keyframes puntini{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.st{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:900;color:var(--oro);text-shadow:0 2px 0 rgba(0,0,0,.35);}
.st .fchip{width:24px;height:24px;}
.seat.vince .av .ph{border-color:var(--oro);box-shadow:0 0 0 4px rgba(232,193,90,.35),0 0 28px rgba(232,193,90,.8);}
.seat.fuori{opacity:.55;}
/* file */
.row{position:relative;flex:0 0 auto;}
#row-lui{height:calc(var(--chL) + 6px);}
#row-io{height:calc(var(--chB) + 8px);}
.bet{position:relative;height:30px;flex:0 0 auto;}
.bet .bx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;
  font-size:16px;font-weight:900;background:rgba(0,0,0,.35);border-radius:999px;padding:3px 10px 3px 4px;opacity:0;transition:opacity .2s;}
.bet .bx.on{opacity:1;}
.bet .bx .fchip{width:20px;height:20px;}
#middle{flex:1 1 auto;position:relative;min-height:150px;}
#pot{position:absolute;left:50%;top:8px;transform:translateX(-50%);text-align:center;white-space:nowrap;}
#pot-lbl{font-size:12px;font-weight:900;letter-spacing:.14em;color:rgba(255,255,255,.8);}
#pot-lbl b{font-size:24px;color:var(--oro);letter-spacing:0;margin-left:6px;vertical-align:-2px;}
#pot-stack{position:absolute;left:calc(50% - 112px);top:30px;width:1px;height:1px;}
#pot.pulsa{animation:pulsa .6s ease-out;}
@keyframes pulsa{0%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}
#board{position:absolute;left:0;right:0;top:50%;transform:translateY(-38%);height:var(--chM);}
#board .slot{position:absolute;top:0;width:var(--cwM);height:var(--chM);border-radius:9%/6.4%;
  border:2px dashed rgba(255,255,255,.12);}
#deck{position:absolute;right:-2px;top:6px;width:var(--cwL);height:var(--chL);transform:rotate(8deg);}
#deck .d{position:absolute;inset:0;border-radius:9%/6.4%;}
#sig{position:absolute;left:2px;top:8px;font-size:11px;font-weight:800;color:rgba(255,255,255,.55);max-width:92px;line-height:1.25;cursor:pointer;}
#sig b{display:block;font-size:16px;color:rgba(232,193,90,.9);}
#sig-t{display:none;}
#punto{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:13px;font-weight:900;letter-spacing:.06em;
  color:#fff;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .25s;}
#punto.on{opacity:1;}
#punto-lui{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:900;color:#fff;
  background:rgba(0,0,0,.55);padding:3px 10px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .25s;z-index:3;}
#punto-lui.on{opacity:1;}
.bet.pl .bx{visibility:hidden;}
/* azioni */
#azioni{flex:0 0 auto;position:relative;padding-top:6px;}
#timer{height:6px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;margin:0 2px 8px;}
#timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--verde-ok),var(--oro));transform-origin:0 50%;will-change:transform;}
#timer.corto i{background:linear-gradient(90deg,var(--rosso),#ff8a3d);}
#preset{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px;}
.pr{height:36px;border-radius:10px;border:0;background:rgba(0,0,0,.35);color:#fff;font-weight:900;font-size:12px;letter-spacing:.03em;cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,255,255,.16) inset;}
.pr small{display:block;font-size:10px;opacity:.7;font-weight:800;}
.pr.on{background:rgba(232,193,90,.22);color:var(--oro);box-shadow:0 0 0 2px var(--oro) inset;}
.pr:disabled{opacity:.35;}
#cursore{width:100%;margin:0 0 8px;accent-color:#e8c15a;height:26px;}
#btns{display:grid;grid-template-columns:1fr 1.15fr 1.25fr;gap:8px;}
.ab{height:60px;border-radius:16px;border:0;font-size:16px;font-weight:900;letter-spacing:.03em;color:#fff;cursor:pointer;line-height:1.05;
  box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.3);transition:transform .08s,filter .2s,opacity .2s;}
.ab small{display:block;font-size:11px;font-weight:800;opacity:.85;letter-spacing:.02em;margin-top:3px;}
.ab:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35);}
.ab[data-a=lascia]{background:linear-gradient(180deg,#e0484f,#a8222a);}
.ab[data-a=chiama]{background:linear-gradient(180deg,#2fbf71,#1c8c50);}
.ab[data-a=rilancia]{background:linear-gradient(180deg,#f2c14e,#c08a1e);color:#2a1a02;}
.ab[data-a=rilancia].ai{background:linear-gradient(180deg,#ff5a64,#b1121f);color:#fff;}
.ab:disabled{filter:grayscale(.85) brightness(.55);opacity:.5;cursor:default;transform:none;}
#attesa{text-align:center;font-size:13px;font-weight:800;color:rgba(255,255,255,.85);height:18px;margin-top:6px;}
#spett{display:none;text-align:center;font-weight:900;letter-spacing:.12em;color:var(--oro);padding:18px 0;}
/* carte */
#layer{position:absolute;inset:0;pointer-events:none;}
.card{position:absolute;left:0;top:0;will-change:transform;perspective:700px;}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .34s cubic-bezier(.3,.7,.3,1);}
.card.su .in{transform:rotateY(180deg);}
.card .fc2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:9%/6.4%;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.4);}
.card .fr{transform:rotateY(180deg);background:#fff;}
.card canvas{display:block;width:100%;height:100%;}
.card.spento .fr{filter:grayscale(.7) brightness(.55);}
.card.luce .fc2{box-shadow:0 0 0 2px var(--oro),0 0 20px rgba(232,193,90,.95);}
.fiche{position:absolute;left:0;top:0;width:24px;height:24px;will-change:transform;}
.fchip{display:inline-block;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, #fff7df 0 30%, #c9922b 31% 37%, transparent 38%),
   repeating-conic-gradient(var(--c1,#d23b3b) 0 22.5deg, #fff 22.5deg 30deg, var(--c1,#d23b3b) 30deg 45deg);
  box-shadow:0 2px 0 rgba(0,0,0,.45),0 3px 6px rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.18);}
.fiche .fchip{width:100%;height:100%;}
.pila{position:absolute;left:0;top:0;width:34px;height:34px;}
.pila .fchip{position:absolute;width:34px;height:34px;left:0;}
/* scritte grandi */
#banner{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;pointer-events:none;z-index:5;}
.bn{display:inline-block;background:rgba(3,20,12,.6);border-radius:22px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);font-weight:1000;
  font-size:clamp(30px,10vw,54px);letter-spacing:.02em;padding:6px 18px;font-family:"Arial Black","Segoe UI Black",system-ui,sans-serif;}
.bn.ai{color:#fff;text-shadow:0 3px 0 #6e0d14,0 0 26px rgba(255,60,70,.9);font-size:clamp(40px,14vw,74px);}
.bn.win{color:#fff;text-shadow:0 3px 0 #0d5a33,0 0 26px rgba(61,220,132,.9);font-size:clamp(24px,7.5vw,40px);}
.bn.lose{color:#ffd0d3;text-shadow:0 3px 0 #551017;font-size:clamp(24px,7.5vw,40px);}
.bn.oro{color:#ffe08a;text-shadow:0 3px 0 #9a6412,0 0 30px rgba(255,210,90,.9);font-size:clamp(26px,8vw,44px);}
.bn small{display:block;font-size:.4em;letter-spacing:.06em;margin-top:2px;font-family:system-ui,sans-serif;font-weight:900;}
.coriandolo{position:absolute;width:8px;height:12px;border-radius:2px;left:0;top:0;will-change:transform;}
#stage.trema{animation:trema .35s;}
@keyframes trema{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
/* sovrapposizioni */
#ovl{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;overflow:auto;
  background:radial-gradient(ellipse at 50% 40%, rgba(6,41,26,.94), rgba(3,18,11,.985));padding:20px;}
#ovl.on{display:flex;}
.box{width:100%;max-width:420px;text-align:center;margin:auto;}
.logo{font-family:"Arial Black","Segoe UI Black",system-ui,sans-serif;font-size:44px;line-height:.95;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35);}
.logo b{color:var(--oro);display:block;font-size:62px;}
.regole{margin:16px 0;text-align:left;font-size:14px;line-height:1.45;background:rgba(0,0,0,.28);border-radius:16px;padding:12px 15px;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;}
.regole p{margin:0 0 7px;}
.regole b{color:var(--oro);}
.big{display:block;width:100%;height:58px;border:0;border-radius:16px;margin-top:10px;font-size:19px;font-weight:900;letter-spacing:.05em;cursor:pointer;
  background:linear-gradient(180deg,#f7d774,#c9922b);color:#2a1a02;box-shadow:0 5px 0 #7a5410,0 10px 22px rgba(0,0,0,.35);}
.big.sec{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset;}
.livelli{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px;}
.lv{height:52px;border-radius:14px;border:0;background:rgba(0,0,0,.35);color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset;}
.lv.on{background:rgba(232,193,90,.22);color:var(--oro);box-shadow:0 0 0 2px var(--oro) inset;}
.esito-t{font-family:"Arial Black","Segoe UI Black",system-ui,sans-serif;font-size:40px;line-height:1;}
.esito-t.v{color:var(--oro);text-shadow:0 0 30px rgba(232,193,90,.6);}
.punteggio{font-size:46px;font-weight:1000;margin:10px 0 2px;}
.punteggio span{color:var(--oro);}
.storia{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px 0 4px;}
.storia i{width:22px;height:22px;border-radius:50%;font-style:normal;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.storia i.v{background:var(--verde-ok);color:#05301a;}
.storia i.p{background:#8f1a22;color:#fff;}
.storia i.x{background:rgba(255,255,255,.2);color:#fff;}
.soldi{font-size:22px;font-weight:900;margin:8px 0;color:var(--verde-ok);}
.verifica{font-size:12px;opacity:.8;margin-top:8px;cursor:pointer;text-decoration:underline;}
#fps{position:absolute;right:6px;bottom:6px;z-index:20;font:700 11px monospace;background:rgba(0,0,0,.6);padding:3px 6px;border-radius:6px;display:none;}
@media (max-height:700px){ #cursore{display:none;} .seat{height:50px;} .av{width:44px;height:44px;} #middle{min-height:120px;} }
@media (prefers-reduced-motion:reduce){ .card .in{transition-duration:.01s;} }
</style>
</head>
<body>
<div id="app">
  <div id="felt"></div><div id="ovale"></div>
  <div id="stage">
    <div id="top">
      <button class="tbtn" id="b-esci" aria-label="esci">✕</button>
      <div id="info"><div id="i-mano">POKER 1v1</div><div id="i-sub">&nbsp;</div></div>
      <button class="tbtn" id="b-suono" aria-label="suono">🔊</button>
      <button class="tbtn" id="b-regole" aria-label="regole">?</button>
    </div>
    <div class="seat" id="seat-lui">
      <div class="av" id="av-lui"><div class="ring"></div><div class="ph"></div><div class="dealer">D</div></div>
      <div class="nm"><b id="nm-lui">—</b><span class="tag" id="tag-lui">&nbsp;</span></div>
      <div class="st"><span class="fchip"></span><span id="st-lui">500</span></div>
    </div>
    <div class="row" id="row-lui"></div>
    <div class="bet" id="bet-lui"><div class="bx"><span class="fchip"></span><span class="n">0</span></div><div id="punto-lui"></div></div>
    <div id="middle">
      <div id="sig"><b>🔒</b><span id="sig-t"></span></div>
      <div id="pot"><div id="pot-lbl"><span id="pot-w">PIATTO</span><b id="pot-n">0</b></div></div>
      <div id="pot-stack"></div>
      <div id="deck"></div>
      <div id="board"></div>
      <div id="punto"></div>
    </div>
    <div class="bet" id="bet-io"><div class="bx"><span class="fchip"></span><span class="n">0</span></div></div>
    <div class="row" id="row-io"></div>
    <div class="seat" id="seat-io">
      <div class="av" id="av-io"><div class="ring"></div><div class="ph"></div><div class="dealer">D</div></div>
      <div class="nm"><b id="nm-io">—</b><span class="tag" id="tag-io">&nbsp;</span></div>
      <div class="st"><span class="fchip"></span><span id="st-io">500</span></div>
    </div>
    <div id="azioni">
      <div id="timer"><i></i></div>
      <div id="preset">
        <button class="pr" data-p="min"><span data-t="MIN">MIN</span><small>0</small></button>
        <button class="pr" data-p="mezzo"><span data-t="½ PIATTO">½ PIATTO</span><small>0</small></button>
        <button class="pr" data-p="piatto"><span data-t="PIATTO">PIATTO</span><small>0</small></button>
        <button class="pr" data-p="max"><span>ALL-IN</span><small>0</small></button>
      </div>
      <input type="range" id="cursore" min="0" max="100" step="1" value="0">
      <div id="btns">
        <button class="ab" data-a="lascia" disabled><span data-t="LASCIA">LASCIA</span><small data-t="butti le carte">butti le carte</small></button>
        <button class="ab" data-a="chiama" disabled><span id="l-chiama">PASSO</span><small id="s-chiama">&nbsp;</small></button>
        <button class="ab" data-a="rilancia" disabled><span id="l-ril">PUNTA</span><small id="s-ril">&nbsp;</small></button>
      </div>
      <div id="attesa"></div>
    </div>
    <div id="spett">👁 SPETTATORE</div>
  </div>
  <div id="layer"></div>
  <div id="banner"></div>
  <div id="ovl"></div>
  <div id="fps"></div>
</div>
<script>
/* pk_regole.js — POKER 1v1: lo stesso motore di poker1v1_rt.py, in JS.
   ES5 puro. Serve alla DEMO (partita contro il bot, senza rete) e al dorato
   JS=Python (dorato.py): stesse regole, stesso mazzo a parita' di seme, stessa
   vista, stesso bot. Le regole sono in REGOLE.md. Sul server comanda il Python. */
(function (root) {
  "use strict";
  var RANGHI = "A23456789TJQK", SEMI = "SHDC";
  var ALLIN_CORTO_RIAPRE = false;
  var LIVELLI = [[10, 20], [15, 30], [20, 40], [30, 60], [40, 80], [50, 100],
    [75, 150], [100, 200], [150, 300], [200, 400], [250, 500]];

  function pkMulberry(seme) {
    var a = seme >>> 0;
    var f = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a) >>> 0;
      t = ((t + (Math.imul(t ^ (t >>> 7), 61 | t) >>> 0)) >>> 0) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
    f.sotto = function (n) { return f() % n; };
    f.random = function () { return f() / 4294967296; };
    return f;
  }
  function pkMescola(sotto) {
    var m = [], i, j, x;
    for (i = 0; i < 52; i++) m.push(i);
    for (i = 51; i > 0; i--) { j = sotto(i + 1); x = m[i]; m[i] = m[j]; m[j] = x; }
    return m;
  }
  function pkVal(c) { var r = c % 13; return r === 0 ? 14 : r + 1; }
  function pkNome(c) { return RANGHI.charAt(c % 13) + SEMI.charAt(Math.floor(c / 13)); }

  /* ── il valutatore: stesso intero del Python (categoria*16^5 + 5 valori) ── */
  function cod(cat, vals) {
    var x = cat, i;
    for (i = 0; i < 5; i++) x = x * 16 + (i < vals.length ? vals[i] : 0);
    return x;
  }
  function scala(vs) {
    var s = {}, i, h;
    for (i = 0; i < vs.length; i++) s[vs[i]] = 1;
    if (s[14]) s[1] = 1;
    for (h = 14; h > 4; h--) if (s[h] && s[h - 1] && s[h - 2] && s[h - 3] && s[h - 4]) return h;
    return 0;
  }
  function desc(a, b) { return b - a; }
  function pkValuta(carte) {

    else if (v.io >= 0) h += '<div style="opacity:.6;font-size:13px;margin:6px 0">' + t("ALLENAMENTO · gratis") + "</div>";
    if (v.svela && v.svela.length) h += '<div class="verifica" id="b-ver">🔒 ' + t("verifica i mazzi") + " (" + v.svela.length + ")</div>";
  }
  h += bottoni + "</div>";
  var o = $("ovl"); o.innerHTML = h; o.classList.add("on");
  var bv = $("b-ver"); if (bv) bv.onclick = function(){ verificaMazzi(v.svela, bv); };
  if (ho) { coriandoli(60); SU.grande(); } else SU.perdi();
}
function sha256hex(s){
  if (!window.crypto || !crypto.subtle) return Promise.resolve("");
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0" + x.toString(16)).slice(-2); }).join("");
  });
}
function verificaMazzi(sv, el){
  var ok = 0, male = 0, fatti = 0;
  sv.forEach(function(x){
    sha256hex(x.sale + ":" + x.mazzo.join(",")).then(function(h){
      fatti++;
      if (!x.sigillo || h === x.sigillo) ok++; else male++;
      if (fatti === sv.length) el.textContent = (male ? "⚠️ " + male + " / " : "✅ ") + ok + " " + t("mazzi verificati");
    });
  });
}

try { D.liv = localStorage.getItem("pk1_liv") || "medio"; } catch(e){}
var NOMI_BOT = { facile: "Ivo", medio: "Nadia", esperto: "Rocco" };
function demoMenu(){

  $("b-gioca").onclick = function(){ SU.sblocca(); SU.clic(); o.classList.remove("on"); demoAvvia(); };

function demoAvvia(){
  vReset(); V.me = "tu"; V.profili = {};
  var foto = Q.foto || "";
  try { var tu = window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user; if (tu && tu.photo_url) foto = tu.photo_url; } catch(e){}
  V.profili.tu = { photo_url: foto };
  var opz = { nomi: [t("TU"), NOMI_BOT[D.liv]] };
  if (Q.seme !== undefined) opz.seme_fisso = (+Q.seme >>> 0);
  D.m = new K.Pk1(["tu", "bot:1"], opz);
  D.rng = K.pkMulberry((Math.random() * 4294967296) >>> 0);
  D.pensa = {}; D.fine = false; D.last = 0; D.feedS = 0;
  geometria();
}
function demoPasso(dt){
  var m = D.m; if (!m) return;
  m.tick(dt);
  if (m.fase === "scelta" && m.order[m.turno] === "bot:1") {
    var k = m.mano + ":" + m.strada + ":" + m.puntata.join(",");
    if (D.pensa.k !== k) D.pensa = { k: k, quando: m.t + 0.8 + Math.random()*1.6 };
    else if (m.t >= D.pensa.quando) {
      var d = K.pkBotDecidi(m.vista("bot:1"), D.liv, D.rng);
      if (!m.action("bot:1", d[0], d[1])) { m.action("bot:1", "passo") || m.action("bot:1", "vedo") || m.action("bot:1", "lascia"); }
    }
  }
  var sn = m.snapshot("tu", D.feedS);
  if (sn.feed.length) D.feedS = sn.feed[sn.feed.length - 1].s;
  V.feedT = ORA();
  consumaFeed(sn.feed, true);
  applica(sn.pk);
  if (m.over && !D.fine) {
    D.fine = true; V.vinceUid = m.winner;
    setTimeout(function(){
      mostraFine(m.vista("tu"), null, '<button class="big" id="b-riv">' + t("RIVINCITA") + '</button><button class="big sec" id="b-cam">' + t("CAMBIA AVVERSARIO") + "</button>");
      $("b-riv").onclick = function(){ SU.clic(); $("ovl").classList.remove("on"); demoAvvia(); };
      $("b-cam").onclick = function(){ SU.clic(); demoMenu(); };
    }, 2200);
  }
}

/* ═══════════ IL GUSCIO: dentro la mini app ═══════════ */
var G = { start: null, pausa: false, over: null, origine: location.origin };
function su(msg){ try { parent.postMessage(msg, G.origine); } catch(e){} }
function gestisci(m){
  if (!m || typeof m !== "object") return;
  if (m.t === "pausa") { G.pausa = true; return; }
  if (m.t === "riprendi") { G.pausa = false; return; }
  if (m.t === "bordi") {
    var r = document.documentElement.style;
    r.setProperty("--sa-top", (m.top | 0) + "px"); r.setProperty("--sa-bot", (m.bottom | 0) + "px");
    setTimeout(geometria, 30); return;
  }
  if (m.t === "start") {
    var nuova = !G.start || !G.start.map || !m.map || G.start.map.firma !== m.map.firma;
    G.start = m;
    if (nuova) { vReset(); G.over = null; $("ovl").classList.remove("on"); }
    V.me = String(m.you || ""); V.profili = m.profiles || {};
    geometria();
    return;
  }
  if (m.t === "err" && m.code === "pk_act_no") { V.scelta = null; if (V.vista) applica(V.vista); return; }
  if (m.t === "s" && m.pk) {
    if (m.g && m.g !== "pk1v1") return;
    V.feedT = ORA();
    consumaFeed(m.feed, !G.pausa);
    applica(m.pk);
    return;
  }
  if (m.t === "over") {
    G.over = m;
    var v = V.vista;
    setTimeout(function(){
      if (!v) { su({ pk: "fine_scena" }); return; }
      V.vinceUid = m.winner;
      mostraFine(V.vista || v, m, '<button class="big" id="b-cont">' + t("CONTINUA") + "</button>");
      $("b-cont").onclick = function(){ SU.clic(); su({ pk: "fine_scena" }); };
      setTimeout(function(){ su({ pk: "fine_scena" }); }, 6000);
    }, m.annullata ? 100 : 2000);
    return;
  }
}
if (GUSCIO) {
  window.addEventListener("message", function(ev){
    if (ev.origin !== G.origine || ev.source !== parent) return;
    var d = ev.data; if (!d || d.pk !== "giu") return;
    try { gestisci(d.m); } catch(e){ su({ pk: "err", msg: String(e && e.message || e).slice(0, 200) }); }
  });
}

/* ═══════════ IL CICLO ═══════════ */
var FPS = { on: Q.fps === "1", n: 0, prec: 0, lista: [] };
if (FPS.on) $("fps").style.display = "block";
function ciclo(ts){
  if (!D.last) D.last = ts;
  var dt = Math.min(0.1, (ts - D.last)/1000); D.last = ts;
  if (FPS.prec) { FPS.lista.push(ts - FPS.prec); if (FPS.lista.length > 600) FPS.lista.shift(); }
  FPS.prec = ts;
  if (FPS.on && ++FPS.n % 30 === 0) { var s = FPS.lista.slice().sort(function(a, b){ return a - b; }); var p50 = s[s.length >> 1] || 0, p95 = s[Math.floor(s.length*.95)] || 0;
    $("fps").textContent = (1000/p50).toFixed(0) + " fps · p95 " + p95.toFixed(1) + " ms"; }
  if (!GUSCIO && !G.pausa) demoPasso(dt * (Q.veloce ? +Q.veloce : 1));
  if (V) giraOrologio();
  requestAnimationFrame(ciclo);
}
vReset();
setTimeout(function(){
  geometria();
  if (GUSCIO) su({ pk: "pronto" });
  else if (Q.auto === "1") demoAvvia();
  else demoMenu();
  requestAnimationFrame(ciclo);
}, 30);
window.__pk = { D: D, V: function(){ return V; }, G: G, agisci: agisci, gestisci: gestisci, FPS: FPS, K: K };
})();
