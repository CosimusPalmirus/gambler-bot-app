<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAST CALL — How to play</title>
<meta property="og:title" content="LAST CALL — How to play">
<meta property="og:description" content="Don't get thrown out of the bar. The last one still seated wins.">
<meta property="og:image" content="https://cosimuspalmirus.github.io/gambler-bot-app/lastcall/buttafuori.webp">
<style>
:root{--bg:#0d0a0c;--card:#1a1418;--line:#3a2a30;--txt:#f3ece4;--mut:#b5a89e;--gold:#e8b44c;--red:#e0475a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:34px;letter-spacing:.06em;margin:8px 0 2px;color:var(--gold)}
.sub{color:var(--mut);margin:0 0 16px}
.lang{display:flex;gap:8px;margin:0 0 18px}
.lang button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.lang button.on{border-color:var(--gold);color:var(--gold)}
.play{display:block;text-align:center;background:var(--gold);color:#1a1000;font-weight:800;text-decoration:none;border-radius:12px;padding:14px;margin:0 0 26px;letter-spacing:.04em}
h2{font-size:15px;letter-spacing:.14em;color:var(--gold);margin:30px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.fsub{color:var(--mut);margin:-4px 0 12px;font-size:14px}
.r{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.r .i{font-size:22px;line-height:1.2}
.r b{display:block;letter-spacing:.04em;margin-bottom:2px}
.c{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.c img{width:84px;height:auto;flex:none;border-radius:8px;align-self:flex-start;background:#000}
.c .n{font-weight:800;letter-spacing:.05em}
.c .q{color:var(--gold);font-size:12px;letter-spacing:.08em;margin:1px 0 6px}
.c p{margin:0 0 6px}
.c .o{color:var(--mut);font-size:14px;margin:0}
.err{color:var(--red)}
@media (max-width:420px){.c img{width:64px}h1{font-size:28px}}
</style>
</head>
<body>
<div class="w">
  <h1>LAST CALL</h1>
  <p class="sub" id="sub"></p>
  <div class="lang"><button id="b-en" onclick="lang('en')">English</button><button id="b-it" onclick="lang('it')">Italiano</button></div>
  <a class="play" id="play" href="https://t.me/Master_Gambler_bot?startapp=torneo"></a>
  <div id="out"><p class="sub">Loading…</p></div>
</div>
<script src="lastcall/istruzioni.js"></script>
<script>
var L=(/[?&]lang=it/.test(location.search)||(!/[?&]lang=en/.test(location.search)&&/^it/i.test(navigator.language||"")))?"it":"en";
var T={
  en:{sub:"How to play · Gambler Bot",play:"PLAY ON GAMBLER BOT",game:"THE GAME",cards:"THE CARDS",money:"MONEY AND TOURNAMENTS",err:"Could not load the rules. Please reload the page."},
  it:{sub:"Come si gioca · Gambler Bot",play:"GIOCA SU GAMBLER BOT",game:"LA PARTITA",cards:"LE CARTE",money:"SOLDI E TORNEI",err:"Impossibile caricare le regole. Ricarica la pagina."}
};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function righe(a){var h="";for(var i=0;i<a.length;i++)h+='<div class="r"><div class="i">'+esc(a[i][0])+'</div><div><b>'+esc(a[i][1])+'</b>'+esc(a[i][2])+'</div></div>';return h;}
function lang(l){
  L=l;document.documentElement.lang=l;
  document.getElementById("b-en").className=l==="en"?"on":"";
  document.getElementById("b-it").className=l==="it"?"on":"";
  document.getElementById("sub").textContent=T[l].sub;
  document.getElementById("play").textContent=T[l].play;
  var I=window.LC_ISTR,out=document.getElementById("out");
  if(!I){out.innerHTML='<p class="err">'+T[l].err+'</p>';return;}
  var h="<h2>"+T[l].game+"</h2>"+righe(I.partita[l]);
  h+="<h2>"+T[l].cards+"</h2>";
  for(var f=0;f<I.fam.length;f++){
    var F=I.fam[f];
    h+='<h2 style="margin-top:22px;font-size:13px">'+esc(F[l])+'</h2><p class="fsub">'+esc(l==="it"?F.sit:F.sen)+'</p>';
    for(var j=0;j<I.carte.length;j++){
      var c=I.carte[j];if(c.f!==F.k)continue;var t=c[l];
      h+='<div class="c"><img loading="lazy" src="lastcall/'+esc(c.id)+'.webp" alt=""><div><div class="n">'+esc(t.n)+'</div><div class="q">'+esc(t.q)+'</div><p>'+esc(t.x)+'</p>'+(t.o?'<p class="o">'+esc(t.o)+'</p>':'')+'</div></div>';
    }
  }
  h+="<h2>"+T[l].money+"</h2>"+righe(I.soldi[l]);
  out.innerHTML=h;
}
lang(L);
</script>
</body>
</html>
