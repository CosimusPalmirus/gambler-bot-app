<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>LAST CALL — How to play</title>
<meta property="og:title" content="LAST CALL — How to play">
<meta property="og:description" content="Don't get thrown out of the bar. The last one still seated wins.">
<meta property="og:image" content="https://cosimuspalmirus.github.io/gambler-bot-app/lastcall/buttafuori.webp">
<!-- 15/11/2026 linea Apple vetro (restyle_1311, zona regole): stessa fonte lastcall/istruzioni.js, stessi testi,
     icone di vetro SVG al posto delle emoji. Nessuna logica nuova: lingua, tasto GIOCA e link uguali a prima. -->
<style>
:root{--grey:#8e8e93;--sep:rgba(84,84,88,.6);--txt:#d1d1d6;--viola:#8b83f0;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter Tight","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --vetro:linear-gradient(165deg,rgba(255,255,255,.085),rgba(255,255,255,.035) 55%,rgba(255,255,255,.05));
  --vetro-ombra:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 .5px rgba(255,255,255,.1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#000}
body{margin:0;min-height:100vh;color:#fff;font:400 16px/1.47 var(--body);-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 50% at 50% -8%,rgba(139,131,240,.18),rgba(139,131,240,0) 60%) no-repeat,linear-gradient(180deg,#0b0b10 0,#000 640px) no-repeat,#000}
.w{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 34px) 20px calc(env(safe-area-inset-bottom,0px) + 56px)}
.sopra{display:block;font:600 13px/1.2 var(--body);letter-spacing:.02em;text-transform:uppercase;color:var(--grey);margin:0 0 6px}
h1{font:700 34px/1.08 var(--disp);letter-spacing:-.03em;margin:0 0 10px}
.sub{color:var(--grey);margin:0 0 20px;font-size:15px}
.lang{display:flex;gap:2px;padding:3px;margin:0 0 18px;background:rgba(118,118,128,.24);border-radius:999px;width:max-content}
.lang button{height:32px;padding:0 16px;border:0;border-radius:999px;background:none;color:#fff;font:600 14px var(--body);cursor:pointer;transition:background .2s,color .2s}
.lang button.on{background:#fff;color:#000;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.play{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:25px;background:#fff;color:#000;font:600 17px var(--body);letter-spacing:-.01em;text-decoration:none;margin:0 0 34px;transition:transform .15s}
.play:active{transform:scale(.97)}
h2{font:700 22px/1.2 var(--disp);letter-spacing:-.02em;margin:34px 0 12px}
h3{font:600 13px/1.2 var(--body);letter-spacing:.02em;text-transform:uppercase;color:var(--grey);margin:26px 4px 6px}
.fsub{color:#aeaeb2;margin:0 4px 10px;font-size:14px;line-height:1.4}
.grp{border-radius:20px;overflow:hidden;background:var(--vetro);box-shadow:var(--vetro-ombra)}
.r{position:relative;display:flex;gap:14px;align-items:flex-start;padding:14px 16px}
.r+.r::before{content:"";position:absolute;left:62px;right:0;top:0;height:.5px;background:var(--sep)}
.i{flex:0 0 32px;width:32px;height:32px;display:grid;place-items:center;border-radius:9px;margin-top:1px;
  background:linear-gradient(180deg,rgba(139,131,240,.38),rgba(139,131,240,.12));box-shadow:inset 0 .5px 0 rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.1)}
.i svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(139,131,240,.75))}
.r b{display:block;font:600 16px/1.3 var(--body);letter-spacing:-.01em;margin:4px 0}
.r span{display:block;color:var(--txt);font-size:15px}
.c{display:flex;gap:14px;align-items:flex-start;padding:12px;margin:0 0 12px;border-radius:22px;background:var(--vetro);box-shadow:var(--vetro-ombra)}
.c img{width:92px;height:auto;flex:none;border-radius:12px;background:#0d0d12;box-shadow:0 6px 16px rgba(0,0,0,.35);cursor:zoom-in}
.c.grande{flex-direction:column}
.c.grande img{width:min(100%,320px);align-self:center;cursor:zoom-out}
.c .n{font:600 16px/1.3 var(--body);letter-spacing:-.01em}
.c .q{font:600 12px/1.3 var(--body);letter-spacing:.02em;text-transform:uppercase;color:var(--grey);margin:3px 0 7px}
.c p{margin:0;color:var(--txt);font-size:15px}
.c .o{margin-top:9px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1);font-size:14px;line-height:1.45}
.err{color:#ff6961}
@media (max-width:370px){h1{font-size:30px}.c img{width:76px}}
</style>
</head>
<body>
<div class="w">
  <span class="sopra" id="sopra"></span>
  <h1>Last Call</h1>
  <p class="sub" id="sub"></p>
  <div class="lang"><button id="b-en" onclick="lang('en')">English</button><button id="b-it" onclick="lang('it')">Italiano</button></div>
  <a class="play" id="play" href="https://t.me/Master_Gambler_bot?startapp=torneo"></a>
  <div id="out"><p class="sub">Loading…</p></div>
</div>
<script src="lastcall/istruzioni.js"></script>
<script>
var L=(/[?&]lang=it/.test(location.search)||(!/[?&]lang=en/.test(location.search)&&/^it/i.test(navigator.language||"")))?"it":"en";
var T={
  en:{sopra:"How to play",sub:"Gambler Bot",play:"Play on Gambler Bot",game:"The game",cards:"The cards",money:"Money and tournaments",err:"Could not load the rules. Please reload the page."},
  it:{sopra:"Come si gioca",sub:"Gambler Bot",play:"Gioca su Gambler Bot",game:"La partita",cards:"Le carte",money:"Soldi e tornei",err:"Impossibile caricare le regole. Ricarica la pagina."}
};
/* icone di vetro (linea) al posto delle emoji della fonte: si sceglie dall'emoji, il testo non cambia */
var SVG={
  mira:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".9"/>',
  carte:'<rect x="3.5" y="6" width="11" height="15" rx="2" transform="rotate(-10 9 13.5)"/><rect x="9.5" y="4" width="11" height="15" rx="2"/>',
  giro:'<path d="M19.5 12a7.5 7.5 0 0 1-13.3 4.8M4.5 12a7.5 7.5 0 0 1 13.3-4.8"/><path d="M18 3.5v4h-4M6 20.5v-4h4"/>',
  teschio:'<path d="M12 3.5c-4.4 0-7.5 3-7.5 7 0 2.4 1.1 4.2 2.8 5.2V19a1.5 1.5 0 0 0 1.5 1.5h6.4a1.5 1.5 0 0 0 1.5-1.5v-3.3c1.7-1 2.8-2.8 2.8-5.2 0-4-3.1-7-7.5-7z"/><circle cx="9.2" cy="11.5" r="1.6"/><circle cx="14.8" cy="11.5" r="1.6"/><path d="M10.5 20.5v-2M13.5 20.5v-2"/>',
  mano:'<path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11M11 10.5V4a1.5 1.5 0 0 1 3 0v6.5M14 10.5V5.5a1.5 1.5 0 0 1 3 0V13"/><path d="M8 11.5V9a1.5 1.5 0 0 0-3 0v5c0 4 2.8 6.5 6.5 6.5h.5c3.5 0 5-2.5 5-6.5v-1"/>',
  moneta:'<circle cx="12" cy="12" r="8.5"/><path d="M14.6 9.3a3 3 0 1 0 0 5.4M8 11h5M8 13h5"/>',
  porta:'<path d="M6 20.5V4.5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v16"/><path d="M3.5 20.5h17"/><circle cx="14.5" cy="12.5" r=".9"/>',
  tempo:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/>',
  lucchetto:'<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
  dito:'<path d="M9.5 12V5a1.5 1.5 0 0 1 3 0v6l4.2.8a2 2 0 0 1 1.6 2.2l-.6 4.5a2.5 2.5 0 0 1-2.5 2H11a3 3 0 0 1-2.4-1.2L5.8 15.5a1.4 1.4 0 0 1 2-2L9.5 15"/>',
  biglietto:'<path d="M3.5 8a2 2 0 0 0 0 4v4.5h17V12a2 2 0 0 1 0-4V3.5h-17z" transform="translate(0 2)"/><path d="M14 5.5v13" stroke-dasharray="1.6 2"/>',
  coppa:'<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5A3.5 3.5 0 0 1 16.5 11M12 14v4M8.5 20.5h7"/>',
  esci:'<path d="M14 4.5h4.5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H14"/><path d="M10 8l-4 4 4 4M6 12h10"/>',
  robot:'<rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V4.5M9.5 13h.01M14.5 13h.01M9.5 16h5"/>',
  medaglia:'<circle cx="12" cy="14.5" r="5.5"/><path d="M8.5 3.5l3.5 6 3.5-6M12 12.3v4.4"/>',
  scudo:'<path d="M12 3.5l7 2.5v5.5c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/>',
  punto:'<circle cx="12" cy="12" r="3.5"/>'
};
var EMO={"1F3AF":"mira","1F0CF":"carte","1F504":"giro","1F480":"teschio","270B":"mano","1FA99":"moneta","1F6AA":"porta","23F1":"tempo","1F512":"lucchetto",
  "1F446":"dito","1F39F":"biglietto","1F3C6":"coppa","1F6B6":"esci","1F916":"robot","1F3C5":"medaglia","1F9EF":"scudo","1F4B0":"moneta","1F3B4":"carte"};
function icona(e){var c=String(e||"").codePointAt(0),k=c?EMO[c.toString(16).toUpperCase()]:"";return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(SVG[k]||SVG.punto)+'</svg>';}
/* solo le intestazioni TUTTE MAIUSCOLE diventano frase (i nomi delle carte e i testi restano come sono) */
function frase(s){s=String(s||"");if(s!==s.toUpperCase()||!/[A-ZÀ-Ý]{3}/.test(s))return s;s=s.toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function righe(a){var h='<div class="grp">';for(var i=0;i<a.length;i++)h+='<div class="r"><div class="i">'+icona(a[i][0])+'</div><div><b>'+esc(frase(a[i][1]))+'</b><span>'+esc(a[i][2])+'</span></div></div>';return h+'</div>';}
function lang(l){
  L=l;document.documentElement.lang=l;
  document.getElementById("b-en").className=l==="en"?"on":"";
  document.getElementById("b-it").className=l==="it"?"on":"";
  document.getElementById("sopra").textContent=T[l].sopra;
  document.getElementById("sub").textContent=T[l].sub;
  document.getElementById("play").textContent=T[l].play;
  var I=window.LC_ISTR,out=document.getElementById("out");
  if(!I){out.innerHTML='<p class="err">'+T[l].err+'</p>';return;}
  var h="<h2>"+T[l].game+"</h2>"+righe(I.partita[l]);
  h+="<h2>"+T[l].cards+"</h2>";
  for(var f=0;f<I.fam.length;f++){
    var F=I.fam[f];
    h+='<h3>'+esc(F[l])+'</h3><p class="fsub">'+esc(l==="it"?F.sit:F.sen)+'</p>';
    for(var j=0;j<I.carte.length;j++){
      var c=I.carte[j];if(c.f!==F.k)continue;var t=c[l];
      h+='<div class="c"><img loading="lazy" src="lastcall/'+esc(c.id)+'.webp" alt="" onclick="this.parentNode.classList.toggle(\'grande\')"><div><div class="n">'+esc(frase(t.n))+'</div><div class="q">'+esc(t.q)+'</div><p>'+esc(t.x)+'</p>'+(t.o?'<p class="o">'+esc(t.o)+'</p>':'')+'</div></div>';
    }
  }
  h+="<h2>"+T[l].money+"</h2>"+righe(I.soldi[l]);
  out.innerHTML=h;
}
lang(L);
</script>
</body>
</html>
