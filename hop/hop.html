    if(!S.partita||S.finita||S.spec||document.visibilityState==='hidden')return;
    if(Date.now()-S.ultimoFoto>5000){S.ultimoFoto=Date.now();P.rientra++;su({sm:'su',m:{t:'rientra'}});}
  },1000);
  // le uscite della pagina: Menu della scheda di fine, Esci dopo il KO -> l index (rtdBack o l esito)
  document.addEventListener('click',function(ev){
    var t=ev.target&&ev.target.closest&&ev.target.closest('#f-lobby,#esci');
    if(!t)return;
    ev.preventDefault();ev.stopImmediatePropagation();
    su({sm:'esci'});
  },true);
  // la scheda di fine della pagina: 3,5 s dopo che compare, l index mostra l esito vero (soldi, tabellone)
  function guardaFine(){
    var el=document.getElementById('fine');
    if(!el||!window.MutationObserver)return false;
    new MutationObserver(function(){
      if(!el.classList.contains('nasc')&&S.finita&&!S.fineMandata){
        P.fine++;
        setTimeout(function(){if(!S.fineMandata){S.fineMandata=true;su({sm:'fine_scena'});}},3500);
      }
    }).observe(el,{attributes:true,attributeFilter:['class']});
    return true;
  }
  if(!guardaFine())document.addEventListener('DOMContentLoaded',guardaFine);
  window.addEventListener('error',function(e){su({sm:'err',msg:String(e&&e.message||'')+' @'+String(e&&e.lineno||'')});});
})();
</script>
