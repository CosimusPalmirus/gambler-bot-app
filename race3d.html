<html lang="it">

<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>STREET RACE 3D</title>
<!-- race3d.html — LA PAGINA 3D DI STREET RACE (gioco `race`).
     Non c'e' motore, non c'e' rete, non ci sono comandi: una tela WebGL e il ponte
     window.RACE3D. La pagina padre (index.html) resta padrona di rete, soldi, lobby,
     HUD, levetta, pedali, interpolazione, suoni e vibrazioni. Stessa origine:
     il padre chiama iframe.contentWindow.RACE3D direttamente (come derby3d/gcr3d).
     In gara pointer-events:none: l'iframe non ruba mai un tocco. In vetrina
     (?vetrina=1, il personalizzatore) le dita girano l'auto. -->
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070d}

html.vetrina,html.vetrina body,html.vetrina #cv3d{pointer-events:auto;cursor:grab}
html.vetrina body{background:#000}
#cv3d{position:fixed;left:0;top:0;display:block}
#err{position:fixed;z-index:9;inset:0;display:none;align-items:center;justify-content:center;background:#2a0b0b;color:#fecaca;font:600 12px/1.45 ui-monospace,monospace;padding:16px;white-space:pre-wrap}
</style>
