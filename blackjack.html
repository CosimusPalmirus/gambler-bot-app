<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b3b24">
<title>Blackjack 1v1</title>
<style>
:root{
  --felt:#0f5a36; --felt2:#0a3f26; --felt3:#06291a; --oro:#e8c15a; --oro2:#b8872a;
  --rosso:#e0343f; --bianco:#fbf7ee; --ink:#10151a; --verde-ok:#3ddc84;
  --sa-top:0px; --sa-bot:0px; --sa-l:0px; --sa-r:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--felt3);color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;}
#app{position:fixed;inset:0;overflow:hidden;}
#felt{position:absolute;inset:0;
  background:
   radial-gradient(ellipse 120% 70% at 50% 45%, rgba(255,255,255,.10), transparent 60%),
   radial-gradient(ellipse 140% 90% at 50% 50%, var(--felt) 0%, var(--felt2) 62%, var(--felt3) 100%);}
#felt:after{content:"";position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay;background-image:var(--grana);}
#arco{position:absolute;left:50%;top:50%;width:min(120vw,720px);height:min(120vw,720px);
  transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(232,193,90,.16);
  box-shadow:0 0 0 10px rgba(232,193,90,.04) inset;pointer-events:none;}
#stage{position:absolute;left:50%;top:0;bottom:0;width:100%;max-width:520px;transform:translateX(-50%);
  display:flex;flex-direction:column;padding:calc(6px + var(--sa-top)) 12px calc(10px + var(--sa-bot));}
/* ── testata ── */
#top{display:flex;align-items:center;gap:8px;height:44px;flex:0 0 auto;}
.tbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.28);color:#fff;font-size:18px;font-weight:800;cursor:pointer;}
#info{flex:1;text-align:center;line-height:1.05;}
#i-mano{font-size:15px;font-weight:900;letter-spacing:.08em;color:var(--oro);}
#i-sub{font-size:11px;font-weight:700;opacity:.78;letter-spacing:.04em;margin-top:3px;}
/* ── posti ── */
.seat{display:flex;align-items:center;gap:10px;flex:0 0 auto;height:58px;}
.av{width:50px;height:50px;border-radius:50%;flex:0 0 auto;position:relative;overflow:hidden;
  border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.av svg{width:100%;height:100%;}
.seat .nm{flex:1;min-width:0;}
.seat .nm b{display:block;font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tag{display:inline-block;margin-top:3px;font-size:12px;font-weight:900;letter-spacing:.05em;padding:3px 8px;
  border-radius:999px;background:rgba(0,0,0,.35);color:#dfe;}
.tag.ok{background:rgba(61,220,132,.2);color:var(--verde-ok);box-shadow:0 0 0 1px rgba(61,220,132,.45) inset;}
.tag.oro{background:rgba(232,193,90,.18);color:var(--oro);box-shadow:0 0 0 1px rgba(232,193,90,.5) inset;}
.tag.no{background:rgba(224,52,63,.2);color:#ff8088;box-shadow:0 0 0 1px rgba(224,52,63,.5) inset;}
.pensa:after{content:"";display:inline-block;width:1.2em;text-align:left;animation:puntini 1.2s steps(4) infinite;}
@keyframes puntini{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.fc{display:flex;align-items:center;gap:6px;font-size:28px;font-weight:900;color:var(--oro);
  text-shadow:0 2px 0 rgba(0,0,0,.35);}
.fc .fchip{width:26px;height:26px;}
.fc small{font-size:12px;color:#fff;opacity:.7;font-weight:800;margin-left:1px;}
.seat.vince .av{border-color:var(--oro);box-shadow:0 0 0 4px rgba(232,193,90,.35),0 0 28px rgba(232,193,90,.8);}
/* ── file di carte ── */
.row{position:relative;flex:0 0 auto;}
#row-lui{height:calc(var(--chL) + 34px);}
#row-io{height:calc(var(--chB) + 40px);}
#middle{flex:1 1 auto;position:relative;min-height:120px;}
#pot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;}
#pot-stack{position:relative;width:60px;height:62px;margin:0 auto;}
#pot-lbl{font-size:13px;font-weight:900;letter-spacing:.12em;color:rgba(255,255,255,.8);margin-top:4px;}
#pot-lbl b{font-size:24px;color:var(--oro);letter-spacing:0;margin-left:4px;vertical-align:-2px;}
#pot-rip{font-size:11px;font-weight:800;color:var(--oro);opacity:0;transition:opacity .3s;height:14px;}
#pot.pulsa{animation:pulsa .7s ease-out;}
@keyframes pulsa{0%{transform:translate(-50%,-50%) scale(1)}35%{transform:translate(-50%,-50%) scale(1.18)}100%{transform:translate(-50%,-50%) scale(1)}}
#shoe{position:absolute;right:2px;top:50%;width:var(--cwL);height:var(--chL);transform:translateY(-50%) rotate(8deg);}
#shoe .d{position:absolute;inset:0;border-radius:calc(var(--cwL)*.09);background-size:100% 100%;
  box-shadow:0 1px 0 rgba(0,0,0,.4);}
#sig{position:absolute;left:2px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;
  color:rgba(255,255,255,.55);max-width:92px;line-height:1.25;cursor:pointer;}
#sig b{display:block;font-size:16px;color:rgba(232,193,90,.9);}
.totb{position:absolute;left:50%;transform:translateX(-50%);min-width:54px;padding:4px 12px;border-radius:12px;
  font-size:22px;font-weight:900;text-align:center;background:rgba(0,0,0,.55);color:#fff;
  box-shadow:0 0 0 2px rgba(255,255,255,.18) inset;white-space:nowrap;transition:transform .2s;}
.totb.bj{background:linear-gradient(180deg,#f7d774,#c9922b);color:#2a1a02;box-shadow:0 0 18px rgba(232,193,90,.8);}
.totb.bust{background:#8f1a22;color:#fff;box-shadow:0 0 0 2px rgba(255,120,120,.5) inset;}
.totb.pop{animation:totpop .35s cubic-bezier(.3,1.6,.5,1);}
@keyframes totpop{0%{transform:translateX(-50%) scale(.7)}100%{transform:translateX(-50%) scale(1)}}
#tot-io{bottom:-2px;}
#tot-lui{bottom:-4px;font-size:18px;min-width:44px;}
/* ── tasti ── */
#azioni{flex:0 0 auto;position:relative;padding-top:10px;}
#timer{height:6px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;margin:0 2px 10px;}
#timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--verde-ok),var(--oro));
  transform-origin:0 50%;will-change:transform;}
#timer.corto i{background:linear-gradient(90deg,var(--rosso),#ff8a3d);}
#btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.ab{height:62px;border-radius:16px;border:0;font-size:17px;font-weight:900;letter-spacing:.04em;color:#fff;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.3);transition:transform .08s,filter .2s,opacity .2s;}
.ab small{display:block;font-size:10px;font-weight:800;opacity:.8;letter-spacing:.02em;margin-top:2px;}
.ab:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35);}
.ab[data-a=carta]{background:linear-gradient(180deg,#2fbf71,#1c8c50);}
.ab[data-a=stai]{background:linear-gradient(180deg,#e0484f,#a8222a);}
.ab[data-a=raddoppia]{background:linear-gradient(180deg,#f2c14e,#c08a1e);color:#2a1a02;}
.ab:disabled{filter:grayscale(.85) brightness(.55);opacity:.55;cursor:default;transform:none;}
.ab.scelto{outline:3px solid #fff;outline-offset:2px;filter:none;opacity:1;}
#attesa{text-align:center;font-size:13px;font-weight:800;color:rgba(255,255,255,.85);height:18px;margin-top:8px;}
/* ── carte ── */
#layer{position:absolute;inset:0;pointer-events:none;}
.card{position:absolute;left:0;top:0;will-change:transform;perspective:700px;}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .32s cubic-bezier(.3,.7,.3,1);}
.card.su .in{transform:rotateY(180deg);}
.card .fc2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:9%/6.4%;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.4);}
.card .fr{transform:rotateY(180deg);background:#fff;}
.card canvas{display:block;width:100%;height:100%;}
.card.spento .fr{filter:grayscale(.7) brightness(.62);}
.card.luce .fc2{box-shadow:0 0 0 2px var(--oro),0 0 22px rgba(232,193,90,.9);}
.fiche{position:absolute;left:0;top:0;width:30px;height:30px;will-change:transform;}
.fchip{display:inline-block;border-radius:50%;
  background:
   radial-gradient(circle at 50% 50%, #fff7df 0 30%, #c9922b 31% 37%, transparent 38%),
   repeating-conic-gradient(#d23b3b 0 22.5deg, #fff 22.5deg 30deg, #d23b3b 30deg 45deg);
  box-shadow:0 2px 0 #7a1717,0 3px 6px rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.18);}
.fiche .fchip{width:100%;height:100%;}
/* ── scritte grandi ── */
#banner{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;pointer-events:none;z-index:5;}
.bn{display:inline-block;background:rgba(3,20,12,.55);border-radius:22px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);font-weight:1000;font-size:clamp(34px,11vw,58px);letter-spacing:.02em;padding:6px 18px;
  font-family:"Arial Black","Segoe UI Black",system-ui,sans-serif;}
.bn.bj{color:#ffe08a;text-shadow:0 3px 0 #9a6412,0 6px 0 #5a3a08,0 0 30px rgba(255,210,90,.9);}
.bn.bust{color:#ff5a64;text-shadow:0 3px 0 #6e0d14,0 0 24px rgba(255,60,70,.7);}
.bn.win{color:#fff;text-shadow:0 3px 0 #0d5a33,0 0 26px rgba(61,220,132,.9);font-size:clamp(26px,8vw,42px);}
.bn.lose{color:#ffd0d3;text-shadow:0 3px 0 #551017;font-size:clamp(26px,8vw,42px);}
.bn.pari{color:var(--oro);text-shadow:0 3px 0 #3a2a06;font-size:clamp(26px,8vw,40px);}
.bn small{display:block;font-size:.36em;letter-spacing:.06em;margin-top:2px;font-family:system-ui,sans-serif;font-weight:900;}
.coriandolo{position:absolute;width:8px;height:12px;border-radius:2px;left:0;top:0;will-change:transform;}
.scuoti{animation:scuoti .42s cubic-bezier(.36,.07,.19,.97);}
@keyframes scuoti{10%,90%{transform:translateX(-50%) translate3d(-2px,0,0)}20%,80%{transform:translateX(-50%) translate3d(4px,0,0)}30%,50%,70%{transform:translateX(-50%) translate3d(-7px,0,0)}40%,60%{transform:translateX(-50%) translate3d(7px,0,0)}}
#stage.trema{animation:trema .35s;}
@keyframes trema{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 5px))}75%{transform:translateX(calc(-50% + 5px))}}
/* ── sovrapposizioni ── */
#ovl{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%, rgba(6,41,26,.82), rgba(3,18,11,.96));padding:20px;}
#ovl.on{display:flex;}
.box{width:100%;max-width:420px;text-align:center;}
.logo{font-family:"Arial Black","Segoe UI Black",system-ui,sans-serif;font-size:46px;line-height:.95;color:#fff;
  text-shadow:0 4px 0 rgba(0,0,0,.35);}
.logo b{color:var(--oro);display:block;font-size:64px;}
.regole{margin:18px 0;text-align:left;font-size:15px;line-height:1.45;background:rgba(0,0,0,.28);border-radius:16px;padding:14px 16px;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;}
.regole p{margin:0 0 8px;}
.regole b{color:var(--oro);}
.big{display:block;width:100%;height:60px;border:0;border-radius:16px;margin-top:10px;font-size:19px;font-weight:900;letter-spacing:.05em;cursor:pointer;
  background:linear-gradient(180deg,#f7d774,#c9922b);color:#2a1a02;box-shadow:0 5px 0 #7a5410,0 10px 22px rgba(0,0,0,.35);}
.big.sec{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset;}
.livelli{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px;}
.lv{height:52px;border-radius:14px;border:0;background:rgba(0,0,0,.35);color:#fff;font-weight:900;font-size:15px;cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,255,255,.18) inset;}
.lv.on{background:rgba(232,193,90,.22);color:var(--oro);box-shadow:0 0 0 2px var(--oro) inset;}
.esito-t{font-family:"Arial Black","Segoe UI Black",system-ui,sans-serif;font-size:40px;line-height:1;}
.esito-t.v{color:var(--oro);text-shadow:0 0 30px rgba(232,193,90,.6);}
.punteggio{font-size:56px;font-weight:1000;margin:10px 0 2px;}
.punteggio span{color:var(--oro);}
.storia{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px;}
.storia i{width:26px;height:26px;border-radius:50%;font-style:normal;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.storia i.v{background:var(--verde-ok);color:#05301a;}
.storia i.p{background:#8f1a22;color:#fff;}
.storia i.x{background:rgba(255,255,255,.2);color:#fff;}
.soldi{font-size:22px;font-weight:900;margin:8px 0;color:var(--verde-ok);}
#fps{position:absolute;right:6px;bottom:6px;z-index:20;font:700 11px monospace;background:rgba(0,0,0,.6);padding:3px 6px;border-radius:6px;display:none;}
@media (min-height:760px){ .seat{height:62px;} .av{width:54px;height:54px;} }
@media (prefers-reduced-motion:reduce){ .card .in{transition-duration:.01s;} }
</style>
</head>
<body>
<div id="app">
  <div id="felt"></div><div id="arco"></div>
  <div id="stage">
    <div id="top">
      <button class="tbtn" id="b-esci" aria-label="esci">✕</button>
      <div id="info"><div id="i-mano">BLACKJACK 1v1</div><div id="i-sub">&nbsp;</div></div>
      <button class="tbtn" id="b-suono" aria-label="suono">🔊</button>
      <button class="tbtn" id="b-regole" aria-label="regole">?</button>
    </div>
    <div class="seat" id="seat-lui">
      <div class="av" id="av-lui"></div>
      <div class="nm"><b id="nm-lui">—</b><span class="tag" id="tag-lui">&nbsp;</span></div>
      <div class="fc"><span class="fchip"></span><span id="fc-lui">0</span><small id="fcs-lui">/5</small></div>
    </div>
    <div class="row" id="row-lui"><div class="totb" id="tot-lui" style="display:none"></div></div>
    <div id="middle">
      <div id="sig"><b>🔒</b><span id="sig-t"></span></div>
      <div id="pot"><div id="pot-stack"></div><div id="pot-lbl"><span id="pot-w">PIATTO</span><b id="pot-n">1</b></div><div id="pot-rip"></div></div>
      <div id="shoe"></div>
    </div>
    <div class="row" id="row-io"><div class="totb" id="tot-io" style="display:none"></div></div>
    <div class="seat" id="seat-io">
      <div class="av" id="av-io"></div>
      <div class="nm"><b id="nm-io">—</b><span class="tag" id="tag-io">&nbsp;</span></div>
      <div class="fc"><span class="fchip"></span><span id="fc-io">0</span><small id="fcs-io">/5</small></div>
    </div>
    <div id="azioni">
      <div id="timer"><i></i></div>
      <div id="btns">
        <button class="ab" data-a="carta" disabled><span data-t="CARTA">CARTA</span><small data-t="prendi una carta">prendi una carta</small></button>
        <button class="ab" data-a="stai" disabled><span data-t="STAI">STAI</span><small data-t="ti fermi">ti fermi</small></button>
        <button class="ab" data-a="raddoppia" disabled><span data-t="RADDOPPIA">RADDOPPIA</span><small data-t="+1 fiche, 1 carta">+1 fiche, 1 carta</small></button>
      </div>
      <div id="attesa"></div>
    </div>
  </div>
  <div id="layer"></div>
  <div id="banner"></div>
  <div id="ovl"></div>
  <div id="fps"></div>
</div>
<script>
/* bj21_regole.js — BLACKJACK 1v1: lo stesso motore di blackjack_rt.py, in JS.
   ES5 puro. Serve alla DEMO (partita contro il bot, senza rete) e al dorato
   JS=Python (dorato.mjs): stesse regole, stesso mazzo a parita' di seme,
   stessa vista. Le regole sono in REGOLE.md. Sul server comanda il Python. */
(function (root) {
  "use strict";
  var RANGHI = "A23456789TJQK", SEMI = "SHDC";

  function bjMulberry(seme) {
    var a = seme >>> 0;
    var f = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a) >>> 0;
      t = ((t + (Math.imul(t ^ (t >>> 7), 61 | t) >>> 0)) >>> 0) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
    f.sotto = function (n) { return f() % n; };
    return f;
  }

  function bjValore(carte) {
    var tot = 0, assi = 0, i, r;
    for (i = 0; i < carte.length; i++) {
      r = carte[i] % 13;
      if (r === 0) { tot += 11; assi++; }
      else if (r >= 9) tot += 10;
      else tot += r + 1;
    }
    while (tot > 21 && assi) { tot -= 10; assi--; }
    return [tot, assi > 0];
  }
  function bjNaturale(c) { return c.length === 2 && bjValore(c)[0] === 21; }
  function bjNome(c) { return RANGHI.charAt(c % 13) + SEMI.charAt(Math.floor(c / 13)); }
  function bjConfronta(ca, cb) {
    var ta = bjValore(ca)[0], tb = bjValore(cb)[0], sa = ta > 21, sb = tb > 21;
    if (sa && sb) return 0;
    if (sa) return -1;
    if (sb) return 1;
    var na = bjNaturale(ca), nb = bjNaturale(cb);
    if (na && !nb) return 1;
    if (nb && !na) return -1;
    if (ta > tb) return 1;
    if (tb > ta) return -1;
    return 0;
  }
  function bjMescola(sotto) {
    var m = [], i, j, x;
    for (i = 0; i < 52; i++) m.push(i);
    for (i = 51; i > 0; i--) { j = sotto(i + 1); x = m[i]; m[i] = m[j]; m[j] = x; }
    return m;
  }
  function bjAlta(c) { var r = c % 13; return r === 0 ? 14 : r + 1; }
  function copia(o) { return JSON.parse(JSON.stringify(o)); }

  var DIFETTI = {
    TARGET: 5, MANI_MAX: 15, SPAREGGIO_MAX: 10, SCELTA_S: 15.0, INTRO_S: 1.8,
    GIRATA_S: 2.6, PAGA_S: 2.2, CAP_GIOCO: 480.0, CAP_ASSOLUTO: 840.0, AFK_MAX: 3,
    FEED_MAX: 80
  };

  /* opz: {seme_fisso (obbligatorio in JS: la demo non ha soldi), SCELTA_S,...} */
  function Bj21(ids, opz) {
    opz = opz || {};
    var k, i;
    for (k in DIFETTI) this[k] = (opz[k] !== undefined) ? opz[k] : DIFETTI[k];
    this.order = [String(ids[0]), String(ids[1])];
    var seme = (opz.seme_fisso !== undefined) ? opz.seme_fisso
      : Math.floor(Math.random() * 4294967296);
    this._rnd = bjMulberry(seme);
    this.t = 0; this.over = false; this.winner = null; this.torneo = false;
    this.perche = null; this.feed = []; this._feed_n = 0;
    this.players = {};
    for (i = 0; i < 2; i++) this.players[this.order[i]] = { id: this.order[i], seat: i, score: 0,
      name: (opz.nomi && opz.nomi[i]) || this.order[i] };
    this._salti = {}; this._salti[this.order[0]] = 0; this._salti[this.order[1]] = 0;
    this.mano = 0; this.riporto = 0; this.piatto = 0; this.spareggio = false;
    this.n_spareggio = 0; this.storia = []; this.esito = null; this.carta_alta = null;
    this.mazzo = []; this.sigillo = ""; this._svela = null; this.pos = [0, 0]; this.mani = {};
    this.fase = "intro"; this.orologio = this.INTRO_S;
    this.firma = ("00000000" + this._rnd().toString(16)).slice(-8);
    this._nuova_mano();
  }
  var P = Bj21.prototype;
  P.MOSSE = ["carta", "stai", "raddoppia"];
  P.opp = function (u) { return u === this.order[0] ? this.order[1] : this.order[0]; };
  P._ev = function (k, kw) {
    this._feed_n++;
    var e = { s: this._feed_n, k: k, t: Math.round(this.t * 100) / 100 }, x;
    if (kw) for (x in kw) e[x] = kw[x];
    this.feed.push(e);
    if (this.feed.length > this.FEED_MAX) this.feed.shift();
    return e;
  };
