<title>DERBY 3D</title>

<!-- ═══════════════════════════════════════════════════════════════════════════
     guscio3d.html — IL GUSCIO DI derby3d.html (la pagina 3D DEL GIOCO VERO)
     ───────────────────────────────────────────────────────────────────────────
     Non e' la demo. Qui non c'e' menu, non c'e' motore, non ci sono comandi e
     non c'e' HUD: c'e' UNA TELA WebGL e il ponte (90_ponte.js).
     La pagina padre (index.html) resta padrona di rete, soldi, lobby, HUD,
     levetta, tre tasti, interpolazione e predizione. Questo riquadro DISEGNA.
       · nessun ascoltatore di dita o di tasti: le dita vanno al padre;
       · niente HUD (60_hud.js NON e' cucito dentro): niente da allineare;
       · pointer-events:none su tutto: l'iframe non ruba mai un tocco.
     Il modello e' gcr3d.html di GAMBLER CITY (stessa origine, chiamate dirette
     su iframe.contentWindow.BLG3D: nessun postMessage, nessuna copia).
     ═════════════════════════════════════════════════════════════════════════ -->

  vC = aC * (0.80 + 0.26 * bob + ol * 0.55);

  const FS_FOLLA = `
varying vec3 vW; varying vec3 vN; varying vec3 vC; varying vec2 vQ;
void main(){

  gl_FragColor = vec4(ombreggiaAttore(alb, normalize(vN), vW, 0.0) * 0.58, 1.0);

  // OMBRE: ellissi appiattite sul prato. aO = [x, z, raggio, alfa]

attribute vec4 aO;
uniform float uRy;
varying vec2 vQ; varying float vA;

varying vec3 vW;
void main(){

  /* ═══ 2. LA TELA DEL PRATO ════════════════════════════════════════════════
     Tutto il campo (16 bande, grana, veli delle aree, righe, cerchi, archi,
     dischetti, linee di porta colorate) finisce in UNA tela → 1 draw call e
     2 triangoli. I colori sono quelli MISURATI in DERBY_REVAMP_V2 §3.3 e non
     vanno cambiati: schiarire il prato cancella i giocatori rossi.          */
  function dipingiPrato(W, H, ad, aw, TW) {
    const TH = Math.max(64, Math.round(TW * H / W));
    const cv = document.createElement('canvas'); cv.width = TW; cv.height = TH;
    const g = cv.getContext('2d');
    const s = TW / W;                       // pixel per unita' di mondo
    const X = u => u * s, Z = u => u * s;

    // 16 bande di tosaerba — l'unica cosa che scorre sotto i giocatori
    g.fillStyle = PAL.erbaA; g.fillRect(0, 0, TW, TH);
    const bw = TW / 16;
    g.fillStyle = PAL.erbaB;
    for (let i = 1; i < 16; i += 2) g.fillRect(Math.round(i * bw), 0, Math.ceil(bw) + 1, TH);
    // il taglio: un filo chiaro sul bordo di ogni banda (dice «qui e' passata la lama»)
    g.fillStyle = 'rgba(255,255,255,.040)';
    for (let i = 0; i < 16; i++) g.fillRect(Math.round(i * bw), 0, Math.max(1, s * 0.018), TH);

    // grana a puntini: leggerissima, serve a togliere la plastica
    const nd = Math.max(600, Math.round(TW * TH / 560));
    for (let i = 0; i < nd; i++) {
      const hx = HS(i, 7), hy = HS(i + 911, 13), hv = HS(i + 31, 5);
      g.fillStyle = hv > 0.5 ? 'rgba(255,255,255,.030)' : 'rgba(0,0,0,.060)';
      const k = 1 + ((hv * 2) | 0);
      g.fillRect((hx * TW) | 0, (hy * TH) | 0, k, k);
    }
    // macchie larghe di erba piu' fitta
    for (let i = 0; i < 26; i++) {
      const cx = HS(i + 5, 21) * TW, cz = HS(i + 61, 3) * TH, r = (0.6 + HS(i, 9) * 1.6) * s;
      const gr = g.createRadialGradient(cx, cz, 0, cx, cz, r);
      gr.addColorStop(0, HS(i, 77) > 0.5 ? 'rgba(255,255,255,.028)' : 'rgba(0,0,0,.055)');
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(cx - r, cz - r, r * 2, r * 2);
    }

    // aree di rigore: il velo «terra consumata» (§3.3)
    g.fillStyle = 'rgba(0,0,0,.10)';
    g.fillRect(0, Z((H - aw) / 2), X(ad), Z(aw));
    g.fillRect(X(W - ad), Z((H - aw) / 2), X(ad), Z(aw));

    // ── i segni ──
    const lw = Math.max(2, 0.085 * s);
    g.strokeStyle = PAL.riga; g.fillStyle = PAL.riga; g.lineWidth = lw; g.lineCap = 'butt';
    g.strokeRect(lw / 2, lw / 2, TW - lw, TH - lw);                     // bordo
    g.beginPath(); g.moveTo(TW / 2, 0); g.lineTo(TW / 2, TH); g.stroke();  // meta' campo
    const rc = H * 0.185 * s;
    g.beginPath(); g.arc(TW / 2, TH / 2, rc, 0, TAU); g.stroke();       // cerchio di centro
    g.beginPath(); g.arc(TW / 2, TH / 2, 0.10 * s, 0, TAU); g.fill();
    g.strokeRect(0, Z((H - aw) / 2), X(ad), Z(aw));                     // aree
    g.strokeRect(X(W - ad), Z((H - aw) / 2), X(ad), Z(aw));
    g.beginPath(); g.arc(X(ad * 0.58), TH / 2, 0.085 * s, 0, TAU); g.fill();   // dischetti
    g.beginPath(); g.arc(X(W - ad * 0.58), TH / 2, 0.085 * s, 0, TAU); g.fill();
    const ra = 0.52 * s;                                                // archi d'angolo
    g.beginPath(); g.arc(0, 0, ra, 0, Math.PI / 2); g.stroke();
    g.beginPath(); g.arc(TW, 0, ra, Math.PI / 2, Math.PI); g.stroke();
    g.beginPath(); g.arc(TW, TH, ra, Math.PI, Math.PI * 1.5); g.stroke();
    g.beginPath(); g.arc(0, TH, ra, Math.PI * 1.5, TAU); g.stroke();

    // linee di porta nel colore di chi difende: e' COSI' che capisci al volo
    // qual e' la tua porta. Squadra 0 (rosso) difende x=0, squadra 1 x=W.
    const alone = 1.15 * s, spess = Math.max(4, 0.26 * s);
    let gr = g.createLinearGradient(0, 0, alone, 0);
    gr.addColorStop(0, rgba(PAL.t0, 0.44)); gr.addColorStop(1, rgba(PAL.t0, 0));
    g.fillStyle = gr; g.fillRect(0, 0, alone, TH);
    g.fillStyle = PAL.t0; g.fillRect(0, 0, spess, TH);
    gr = g.createLinearGradient(TW, 0, TW - alone, 0);
    gr.addColorStop(0, rgba(PAL.t1, 0.44)); gr.addColorStop(1, rgba(PAL.t1, 0));
    g.fillStyle = gr; g.fillRect(TW - alone, 0, alone, TH);
    g.fillStyle = PAL.t1; g.fillRect(TW - spess, 0, spess, TH);

    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.NoColorSpace;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.anisotropy = 8;
    return tex;
  }

  /* ═══ IL CONTRATTO ════════════════════════════════════════════════════════ */
  function crea(scene, opt) {
    opt = opt || {};
    const W = opt.W || 16, H = opt.H || 9;
    const gw0 = opt.gw || 3.0, ad = opt.ad || 2.4, aw = opt.aw || 5.0;
    const conFondo = opt.fondo !== false;
    const alta = (D3.qualita.cur.folla >= 0.7);
    const RIS = opt.ris || (alta ? 2048 : 1024);

    const cx = W / 2, cz = H / 2;
    const gruppo = new THREE.Group(); gruppo.matrixAutoUpdate = false;
    gruppo.name = 'stadio';

    // il campo dentro le uniformi condivise (gw lo muove aggiorna())
    U.uCampo.value.set(W, H, gw0, ad);

    // ── uniformi proprie dello stadio ──
    const uGw0 = { value: gw0 };
    const uPrato = { value: null };
    const uFari = { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] };
    const uRete = { value: [new THREE.Vector4(), new THREE.Vector4()] };
    const uFolla = { value: 0 };
    const uOla = { value: new THREE.Vector2(0, 0) };
    const uOsserv = { value: new THREE.Vector2(cx, cz) };
    const uColRete = { value: new THREE.Vector3(C.rete[0], C.rete[1], C.rete[2]) };
    const uColAlone = { value: new THREE.Vector3(PAL.farA[0], PAL.farA[1], PAL.farA[2]) };
    const uRy = { value: opt.ombraRy == null ? 0.42 : opt.ombraRy };

    /* ── geometria della conca ────────────────────────────────────────────── */
    const mL = SPO_W + 0.95;            // margine sui lati lunghi (cordolo + pista)
    const mS = RETE_D + 1.30;           // margine sui lati corti (oltre la rete)
    const RIS_L = 0.40, PED_L = 0.62, NR_L = 9;   // gradinata lunga
    const RIS_S = 0.34, PED_S = 0.60, NR_S = 6;   // gradinata corta
    const DL = NR_L * PED_L, DS = NR_S * PED_S;
    // la conca e' un rettangolo pulito: i lati lunghi si fermano dove iniziano
    // i corti, e gli ANGOLI sono dei lati corti (se si sovrappongono i gradini
    // si compenetrano e gli spettatori finiscono dentro il cemento).
    const XL = -mS, XR = W + mS;                  // estensione delle gradinate lunghe
    const ZL = -(mL + DL), ZR = H + mL + DL;      // estensione delle gradinate corte
    const HT = 7.4;                               // altezza delle torri dei fari
    const RECINTO = 84;                           // mezzo lato del piazzale
    const R_CIELO = 88;                           // raggio del fondale

    /* ═══ 3. SOLIDI — una sola tela, un solo materiale ═══════════════════════ */
    const T = new Tela();
    const tris = {};                               // conto dei triangoli per pezzo
    let t0c = 0;
    const segna = nome => { tris[nome] = T.tris() - t0c; t0c = T.tris(); };

    // ── piazzale: senza questo la pista e le gradinate galleggiano nel vuoto
    T.set(C.terra, 0).quad(cx - RECINTO, -0.03, cz + RECINTO, cx + RECINTO, -0.03, cz + RECINTO,
      cx + RECINTO, -0.03, cz - RECINTO, cx - RECINTO, -0.03, cz - RECINTO);
    segna('piazzale');

    // ── cordolo (il campo e' chiuso alla Haxball: la palla rimbalza qui) ────
    // rail(): dall'interno verso l'esterno, con la striscia lucida in cima.
    function rail(ax, az, bx, bz, ox, oz, gA, gB, colLip, emLip) {
      const lip = 0.075;
      const cl = colLip || C.lip, el = emLip === undefined ? 0.16 : emLip;
      const a2x = ax + ox * SPO_W, a2z = az + oz * SPO_W;
      const b2x = bx + ox * SPO_W, b2z = bz + oz * SPO_W;
      const alx = ax + ox * lip, alz = az + oz * lip;
      const blx = bx + ox * lip, blz = bz + oz * lip;
      // faccia interna (guarda il campo)
      T.set(C.cordolo, 0).gw(gA, gB, gB, gA)
        .quad(ax, 0, az, bx, 0, bz, bx, SPO_H, bz, ax, SPO_H, az);
      // striscia lucida in cima, sul filo interno
      T.set(cl, el).gw(gA, gB, gB, gA)
        .quad(ax, SPO_H, az, bx, SPO_H, bz, blx, SPO_H, blz, alx, SPO_H, alz);
      // resto della cima
      T.set(C.cordoloTop, 0).gw(gA, gB, gB, gA)
        .quad(alx, SPO_H, alz, blx, SPO_H, blz, b2x, SPO_H, b2z, a2x, SPO_H, a2z);
      // faccia esterna
      T.set(C.cordolo, 0).gw(gA, gB, gB, gA)
        .quad(a2x, SPO_H, a2z, b2x, SPO_H, b2z, b2x, 0, b2z, a2x, 0, a2z);
    }
    // lati lunghi, interi (coprono anche gli angoli)
    rail(-SPO_W, 0, W + SPO_W, 0, 0, -1, 0, 0);
    rail(W + SPO_W, H, -SPO_W, H, 0, 1, 0, 0);
    // lati corti, spezzati dalle due bocche delle porte (il coefficiente gw
    // sul vertice interno fa seguire la bocca quando la porta si allarga).
    // Il filo lucido del cordolo QUI prende il colore di chi difende: e' il
    // segno piu' grosso che dice «questa e' la tua porta» (la riga dipinta
    // sul prato da sola, a schermo piccolo, non basta).
    // (il giro dei vertici NON e' libero: la normale esce dal prodotto
    //  vettoriale, e una normale rovesciata accende il bordo — rim — invece
    //  del piano. Questi quattro vanno percorsi da dentro verso fuori.)
    const zA = cz - gw0 / 2, zB = cz + gw0 / 2;
    rail(0, zA, 0, 0, -1, 0, -1, 0, C.t0, 0.62);  rail(0, H, 0, zB, -1, 0, 0, +1, C.t0, 0.62);
    rail(W, 0, W, zA, 1, 0, 0, -1, C.t1, 0.62);   rail(W, zB, W, H, 1, 0, +1, 0, C.t1, 0.62);
    segna('cordolo');

    // ── porte: pali tondi, traversa, e il gw che si allarga ────────────────
    function palo(pcx, pcz, gwc, y1, r, seg, col, em) {
      T.set(col, em);
      for (let i = 0; i < seg; i++) {
        const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
        const x0 = pcx + Math.cos(a0) * r, z0 = pcz + Math.sin(a0) * r;
        const x1 = pcx + Math.cos(a1) * r, z1 = pcz + Math.sin(a1) * r;
        // giro orario visto da fuori: cosi' la normale punta VERSO fuori
        T.gw(gwc, gwc, gwc, gwc).quad(x1, 0, z1, x0, 0, z0, x0, y1, z0, x1, y1, z1);
      }
      for (let i = 0; i < seg; i++) {                       // tappo in cima
        const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
        T.gw(gwc, gwc, gwc).nrm(0, 1, 0).tri(pcx, y1, pcz,
          pcx + Math.cos(a1) * r, y1, pcz + Math.sin(a1) * r,
          pcx + Math.cos(a0) * r, y1, pcz + Math.sin(a0) * r);
      }
    }
    function traversa(bx, y, za, zb, r, seg, col, em) {
      T.set(col, em);
      for (let i = 0; i < seg; i++) {
        const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
        const x0 = bx + Math.cos(a0) * r, y0 = y + Math.sin(a0) * r;
        const x1 = bx + Math.cos(a1) * r, y1 = y + Math.sin(a1) * r;
        const am = (a0 + a1) / 2;
        T.gw(-1, 1, 1, -1).nrm(Math.cos(am), Math.sin(am), 0)
          .quad(x0, y0, za, x0, y0, zb, x1, y1, zb, x1, y1, za);
      }
    }
    for (let lato = 0; lato < 2; lato++) {
      const gx = lato === 0 ? 0 : W;
      palo(gx, zA, -1, ALT_PORTA, POST_R, 10, C.palo, 0.0);
      palo(gx, zB, +1, ALT_PORTA, POST_R, 10, C.palo, 0.0);
      traversa(gx, ALT_PORTA, zA, zB, POST_R * 0.92, 10, C.palo, 0.0);
    }
    segna('porte');

    // ── gradinate: quattro lati, piu' alte sui lati lunghi ─────────────────
    // lato 0 = z<0 · 1 = z>H · 2 = x<0 · 3 = x>W. d = fuori dal campo, a = lungo il lato.
    const PT = [0, 0, 0];
    function pw(lato, d, a, y) {
      if (lato === 0) { PT[0] = a; PT[1] = y; PT[2] = -d; }
      else if (lato === 1) { PT[0] = a; PT[1] = y; PT[2] = H + d; }
      else if (lato === 2) { PT[0] = -d; PT[1] = y; PT[2] = a; }
      else { PT[0] = W + d; PT[1] = y; PT[2] = a; }
      return PT;
    }
    const posti = [];       // x,y,z dei posti: li riempie il pubblico
    // Sui lati 1 (z>H) e 2 (x<0) il verso della lunghezza e' rovesciato
    // rispetto a 0 e 3: percorrerli nello stesso ordine darebbe normali
    // all'indietro (e una gradinata illuminata da dentro, difetto visto a
    // 1280x720 sulla tribuna di sinistra).
    function verso(lato, a0, a1) { return (lato === 1 || lato === 2) ? [a1, a0] : [a0, a1]; }
    function gradinata(lato, front, nRow, ris, ped, ia0, ia1) {
      const vv = verso(lato, ia0, ia1), a0 = vv[0], a1 = vv[1];
      for (let r = 0; r < nRow; r++) {
        const d0 = front + r * ped, d1 = d0 + ped;
        const y0 = r * ris, y1 = (r + 1) * ris;
        let p;
        // alzata (verticale, guarda il campo)
        T.set(C.trib, 0);
        p = pw(lato, d0, a0, y0); const A = [p[0], p[1], p[2]];
        p = pw(lato, d0, a1, y0); const B = [p[0], p[1], p[2]];
        p = pw(lato, d0, a1, y1); const Cc = [p[0], p[1], p[2]];
        p = pw(lato, d0, a0, y1); const Dd = [p[0], p[1], p[2]];
        T.quad(A[0], A[1], A[2], B[0], B[1], B[2], Cc[0], Cc[1], Cc[2], Dd[0], Dd[1], Dd[2]);
        // pedata (orizzontale)
        T.set(C.tribA, 0);
        p = pw(lato, d0, a0, y1); const E = [p[0], p[1], p[2]];
        p = pw(lato, d0, a1, y1); const F = [p[0], p[1], p[2]];
        p = pw(lato, d1, a1, y1); const G = [p[0], p[1], p[2]];
        p = pw(lato, d1, a0, y1); const I = [p[0], p[1], p[2]];
        T.quad(E[0], E[1], E[2], F[0], F[1], F[2], G[0], G[1], G[2], I[0], I[1], I[2]);
        // posti: al centro della pedata
        const dm = d0 + ped * 0.55, ym = y1 + 0.01;
        const passo = 0.36;
        const n = Math.max(1, Math.floor(Math.abs(a1 - a0) / passo));
        for (let k = 0; k < n; k++) {
          const a = a0 + (k + 0.5) * (a1 - a0) / n + (HS(k + r * 31, lato * 7 + 3) - 0.5) * 0.14;
          const q = pw(lato, dm + (HS(k, r + lato * 11) - 0.5) * 0.13, a, ym);
          posti.push(q[0], q[1], q[2], lato, k, r);
        }
      }
      // muro di fondo dietro l'ultima fila
      const dF = front + nRow * ped, yF = nRow * ris;
      T.set(C.trib, 0);
      let p = pw(lato, dF, a0, 0); const A = [p[0], p[1], p[2]];
      p = pw(lato, dF, a1, 0); const B = [p[0], p[1], p[2]];
      p = pw(lato, dF, a1, yF + 0.55); const Cc = [p[0], p[1], p[2]];
      p = pw(lato, dF, a0, yF + 0.55); const Dd = [p[0], p[1], p[2]];
      T.quad(A[0], A[1], A[2], B[0], B[1], B[2], Cc[0], Cc[1], Cc[2], Dd[0], Dd[1], Dd[2]);
    }
    gradinata(0, mL, NR_L, RIS_L, PED_L, XL, XR);
    gradinata(1, mL, NR_L, RIS_L, PED_L, XL, XR);
    gradinata(2, mS, NR_S, RIS_S, PED_S, ZL, ZR);
    gradinata(3, mS, NR_S, RIS_S, PED_S, ZL, ZR);

    // ── muro perimetrale: senza, da inquadratura bassa si vede il piazzale
    // vuoto sotto le gradinate e lo stadio non legge come un edificio chiuso.
    // +0,14 fuori dal muro di fondo delle gradinate: complanari litigavano in
    // profondita' (righe sfarfallanti sulla facciata, viste a 1280x720)
    const FU = 0.14;
    const MX0 = -(mS + DS) - FU, MX1 = W + mS + DS + FU, MZ0 = -(mL + DL) - FU, MZ1 = H + mL + DL + FU;
    const HW = NR_L * RIS_L + 1.05, RIM = 0.17;
    // percorsi in modo che la normale esca dallo stadio
    const MB = [[MX1, MZ0, MX0, MZ0], [MX0, MZ1, MX1, MZ1], [MX0, MZ0, MX0, MZ1], [MX1, MZ1, MX1, MZ0]];
    for (let i = 0; i < 4; i++) {
      const a = MB[i];
      T.set(C.trib, 0).quad(a[0], 0, a[1], a[2], 0, a[3], a[2], HW, a[3], a[0], HW, a[1]);
      // filo di luce sul coronamento: e' la sagoma dello stadio nella notte
      T.set(C.lip, 0.55).quad(a[0], HW - RIM, a[1], a[2], HW - RIM, a[3], a[2], HW, a[3], a[0], HW, a[1]);
    }
    segna('gradinate');

    // ── cartelloni: SOLO luce colorata, nessuna scritta ───────────────────
    const CB = [0, 0, 0];
    function cartelli(lato, off, ia0, ia1) {
      const vv = verso(lato, ia0, ia1), a0 = vv[0], a1 = vv[1];
      const larg = 1.35;
      const n = Math.max(2, Math.round(Math.abs(a1 - a0) / larg));
      const sg = a1 > a0 ? 1 : -1;
      for (let k = 0; k < n; k++) {
        const b0 = a0 + k * (a1 - a0) / n + 0.05 * sg, b1 = a0 + (k + 1) * (a1 - a0) / n - 0.05 * sg;
        // ogni pannello ha la SUA intensita': tutti a tinta piena la fascia
        // diventa un arcobaleno di caramelle e ruba la scena al campo.
        const base = C['n' + ((HS(k + lato * 13, 5) * NEON.length) | 0)];
        // meno accesi della prima passata (erano 0,34-0,96 con emissione 0,80):
        // la fascia dei cartelloni deve fare da cornice, non da protagonista
        const f = 0.24 + HS(k * 5 + lato, 23) * 0.40;
        CB[0] = base[0] * f; CB[1] = base[1] * f; CB[2] = base[2] * f;
        const col = CB;
        const pul = HS(k, lato + 9) > 0.78 ? (0.40 + HS(k, 3) * 0.6) : 0;
        // pannello inclinato indietro di ~0,12 u
        let p = pw(lato, off, b0, 0.07); const A = [p[0], p[1], p[2]];
        p = pw(lato, off, b1, 0.07); const B = [p[0], p[1], p[2]];
        p = pw(lato, off + 0.12, b1, CAR_H); const Cc = [p[0], p[1], p[2]];
        p = pw(lato, off + 0.12, b0, CAR_H); const Dd = [p[0], p[1], p[2]];
        T.set(col, 0.42, pul, HS(k, lato) * 6.28)
          .quad(A[0], A[1], A[2], B[0], B[1], B[2], Cc[0], Cc[1], Cc[2], Dd[0], Dd[1], Dd[2]);
        // zoccolo scuro
        p = pw(lato, off, b0, 0); const E = [p[0], p[1], p[2]];
        p = pw(lato, off, b1, 0); const F = [p[0], p[1], p[2]];
        T.set(C.cordolo, 0)
          .quad(E[0], E[1], E[2], F[0], F[1], F[2], B[0], B[1], B[2], A[0], A[1], A[2]);
      }
    }
    cartelli(0, SPO_W + 0.16, -0.6, W + 0.6);
    cartelli(1, SPO_W + 0.16, -0.6, W + 0.6);
    cartelli(2, RETE_D + 0.60, -0.6, H + 0.6);
    cartelli(3, RETE_D + 0.60, -0.6, H + 0.6);
    segna('cartelloni');

    // ── fari: quattro torri con lampade emissive ───────────────────────────
    const fari = [];     // x,y,z della testa, per gli aloni e le uniformi
    const CU = [-1, 1, 1, -1], CV = [-1, -1, 1, 1];   // i 4 angoli di un quadrato
    function torre(tx, tz) {
      let dx = cx - tx, dz = cz - tz;
      const L = Math.hypot(dx, dz) || 1; dx /= L; dz /= L;
      const rx = -dz, rz = dx;                        // destra della torre
      // fusto rastremato a base quadrata
      const hb = 0.30, ht = 0.15;
      T.set(C.torre, 0);
      for (let k = 0; k < 4; k++) {
        const u0 = CU[k], v0 = CV[k], u1 = CU[(k + 1) & 3], v1 = CV[(k + 1) & 3];
        const ax = tx + rx * u0 * hb + dx * v0 * hb, az = tz + rz * u0 * hb + dz * v0 * hb;
        const bx = tx + rx * u1 * hb + dx * v1 * hb, bz = tz + rz * u1 * hb + dz * v1 * hb;
        const axT = tx + rx * u0 * ht + dx * v0 * ht, azT = tz + rz * u0 * ht + dz * v0 * ht;
        const bxT = tx + rx * u1 * ht + dx * v1 * ht, bzT = tz + rz * u1 * ht + dz * v1 * ht;
        T.quad(ax, 0, az, bx, 0, bz, bxT, HT, bzT, axT, HT, azT);
      }
      // due anelli di traliccio
      T.set(C.torreS, 0);
      for (let a = 0; a < 2; a++) {
        const y = HT * (a === 0 ? 0.34 : 0.62), hw = hb * (1 - y / HT * 0.5) + 0.09, sp = 0.10;
        for (let k = 0; k < 4; k++) {
          const u0 = CU[k], v0 = CV[k], u1 = CU[(k + 1) & 3], v1 = CV[(k + 1) & 3];
          const ax = tx + rx * u0 * hw + dx * v0 * hw, az = tz + rz * u0 * hw + dz * v0 * hw;
          const bx = tx + rx * u1 * hw + dx * v1 * hw, bz = tz + rz * u1 * hw + dz * v1 * hw;
          T.quad(ax, y, az, bx, y, bz, bx, y + sp, bz, ax, y + sp, az);
        }
      }
      // testa: cassa scura inclinata verso il campo
      const hy = HT + 0.52, hw = 0.95, hh = 0.44, hd = 0.17;
      const HX = tx + dx * 0.26, HZ = tz + dz * 0.26;
      const P8 = [];
      for (let s = 0; s < 8; s++) {
        const u = (s & 1) ? 1 : -1, v = (s & 2) ? 1 : -1, yy = (s & 4) ? 1 : -1;
        P8.push(HX + rx * u * hw + dx * v * hd, hy + yy * hh, HZ + rz * u * hw + dz * v * hd);
      }
      const q = (a, b, c, d) => T.quad(P8[a * 3], P8[a * 3 + 1], P8[a * 3 + 2], P8[b * 3], P8[b * 3 + 1], P8[b * 3 + 2],
        P8[c * 3], P8[c * 3 + 1], P8[c * 3 + 2], P8[d * 3], P8[d * 3 + 1], P8[d * 3 + 2]);
      T.set(C.torre, 0);
      q(0, 1, 5, 4); q(3, 2, 6, 7); q(2, 0, 4, 6); q(1, 3, 7, 5); q(4, 5, 7, 6); q(2, 3, 1, 0);
      // lampade: 4 x 2 quad emissivi sulla faccia verso il campo
      T.set(C.lampada, 1.0);
      for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) {
        const u = (-1.5 + i) * 0.44, yy = (j - 0.5) * 0.40;
        const lx = HX + dx * (hd + 0.035), lz = HZ + dz * (hd + 0.035);
        const w2 = 0.185, h2 = 0.155;
        T.nrm(dx, 0.12, dz).quad(
          lx + rx * (u - w2), hy + yy - h2, lz + rz * (u - w2),
          lx + rx * (u + w2), hy + yy - h2, lz + rz * (u + w2),
          lx + rx * (u + w2), hy + yy + h2, lz + rz * (u + w2),
          lx + rx * (u - w2), hy + yy + h2, lz + rz * (u - w2));
      }
      fari.push(HX + dx * 0.30, hy, HZ + dz * 0.30);
    }
    const TXA = -(mS + DS + 1.1), TXB = W + mS + DS + 1.1;
    const TZA = -(mL + DL + 1.1), TZB = H + mL + DL + 1.1;
    torre(TXA, TZA); torre(TXB, TZA); torre(TXA, TZB); torre(TXB, TZB);
    segna('fari');
    for (let i = 0; i < 4; i++) uFari.value[i].set(fari[i * 3], fari[i * 3 + 1], fari[i * 3 + 2], 0.52);

    // ── citta' lontana: lo stesso mondo di GAMBLER CITY, molto sobrio ──────
    if (conFondo) {
      // LONTANA e PICCOLA: a raggio 54 e 26 di altezza i palazzi incombevano
      // sullo stadio e leggevano come quinte di cartone. Qui sono un
      // profilo all'orizzonte, non un quartiere.
      const RR = 58, NCIT = 42;
      for (let i = 0; i < NCIT; i++) {
        const a = i / NCIT * TAU + 0.11, rr = RR + HS(i, 3) * 19;
        const bx = cx + Math.cos(a) * rr, bz = cz + Math.sin(a) * rr;
        const hgt = 3.5 + HS(i, 17) * 13, lw2 = 1.1 + HS(i, 29) * 1.9, dw = 1.0 + HS(i, 41) * 1.6;
        // solo le tre facce che si vedono da dentro: verso il centro e i due fianchi
        let dx = cx - bx, dz = cz - bz; const L = Math.hypot(dx, dz) || 1; dx /= L; dz /= L;
        const rx = -dz, rz = dx;
        const fx = bx + dx * dw, fz = bz + dz * dw;
        T.set(C.citta, 0);
        T.quad(fx + rx * lw2, 0, fz + rz * lw2, fx - rx * lw2, 0, fz - rz * lw2,
          fx - rx * lw2, hgt, fz - rz * lw2, fx + rx * lw2, hgt, fz + rz * lw2);
        for (let s = -1; s <= 1; s += 2) {
          const ex = bx + rx * lw2 * s, ez = bz + rz * lw2 * s;
          const px = ex + dx * dw, pz = ez + dz * dw;
          if (s > 0) T.quad(ex, 0, ez, px, 0, pz, px, hgt, pz, ex, hgt, ez);
          else T.quad(px, 0, pz, ex, 0, ez, ex, hgt, ez, px, hgt, pz);
        }
        // finestre: fasce emissive (mai una scritta, mai una texture scaricata)
        const nf = 2 + ((HS(i, 7) * 4) | 0);
        const fw = 0.42 + HS(i, 37) * 0.48;
        CB[0] = C.finestra[0] * fw; CB[1] = C.finestra[1] * fw; CB[2] = C.finestra[2] * fw;
        T.set(CB, 0.80, HS(i, 11) > 0.75 ? 0.30 + HS(i, 13) * 0.4 : 0, HS(i, 19) * 6.28);
        for (let f = 0; f < nf; f++) {
          const y = hgt * (0.22 + 0.68 * (f + 0.5) / nf), hb2 = 0.10 + HS(i + f, 5) * 0.09;
          const gx2 = fx + dx * 0.16, gz2 = fz + dz * 0.16;
          T.nrm(dx, 0, dz).quad(gx2 - rx * lw2 * 0.82, y - hb2, gz2 - rz * lw2 * 0.82,
            gx2 + rx * lw2 * 0.82, y - hb2, gz2 + rz * lw2 * 0.82,
            gx2 + rx * lw2 * 0.82, y + hb2, gz2 + rz * lw2 * 0.82,
            gx2 - rx * lw2 * 0.82, y + hb2, gz2 - rz * lw2 * 0.82);
        }
      }
      segna('citta');
    }

    const matSol = D3.materialeMondo(VS_SOL, FS_SOL, {
      uniforms: { uGw0: uGw0 }, side: THREE.DoubleSide
    });
    const mSolidi = new THREE.Mesh(T.geom(), matSol);
    mSolidi.frustumCulled = false; mSolidi.matrixAutoUpdate = false;
    mSolidi.name = 'solidi'; gruppo.add(mSolidi);

    /* ═══ 4. RETE ═══════════════════════════════════════════════════════════ */
    const R = new Tela();
    const ALT_R = ALT_PORTA * 0.90;                      // la rete dietro e' piu' bassa
    function rete(lato) {
      const s = lato === 0 ? 1 : -1;                     // verso il campo
      const gx = lato === 0 ? 0 : W;
      const bx = gx - s * RETE_D;                        // piano di fondo
      const NX = 10, NY = 6, ND = 3;
      const zi = k => cz + (2 * k / NX - 1) * gw0 / 2;   // z costruito a gw0
      const gi = k => (2 * k / NX - 1);                  // coefficiente gw
      // fondo (normale verso il campo)
      R.ax(lato, 0, 0);
      for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) {
        const y0 = ALT_R * j / NY, y1 = ALT_R * (j + 1) / NY;
        R.gw(gi(i), gi(i + 1), gi(i + 1), gi(i)).nrm(s, 0, 0)
          .quad(bx, y0, zi(i), bx, y0, zi(i + 1), bx, y1, zi(i + 1), bx, y1, zi(i));
      }
      // cima (dalla traversa al fondo)
      R.ax(lato, 1, 0);
      for (let i = 0; i < NX; i++) for (let j = 0; j < ND; j++) {
        const t0 = j / ND, t1 = (j + 1) / ND;
        const xa = gx - s * RETE_D * t0, xb = gx - s * RETE_D * t1;
        const ya = ALT_PORTA + (ALT_R - ALT_PORTA) * t0, yb = ALT_PORTA + (ALT_R - ALT_PORTA) * t1;
        R.gw(gi(i), gi(i + 1), gi(i + 1), gi(i)).nrm(0, 1, 0)
          .quad(xa, ya, zi(i), xa, ya, zi(i + 1), xb, yb, zi(i + 1), xb, yb, zi(i));
      }
      // fianchi
      R.ax(lato, 2, 0);
      for (let e = 0; e < 2; e++) {
        const k = e === 0 ? 0 : NX, sg = e === 0 ? -1 : 1;
        for (let i = 0; i < ND; i++) for (let j = 0; j < NY; j++) {
          const t0 = i / ND, t1 = (i + 1) / ND;
          const xa = gx - s * RETE_D * t0, xb = gx - s * RETE_D * t1;
          const ha = ALT_PORTA + (ALT_R - ALT_PORTA) * t0, hb = ALT_PORTA + (ALT_R - ALT_PORTA) * t1;
          const ya0 = ha * j / NY, ya1 = ha * (j + 1) / NY;
          const yb0 = hb * j / NY, yb1 = hb * (j + 1) / NY;
          R.gw(gi(k), gi(k), gi(k), gi(k)).nrm(0, 0, sg)
            .quad(xa, ya0, zi(k), xb, yb0, zi(k), xb, yb1, zi(k), xa, ya1, zi(k));
        }
      }
    }
    rete(0); rete(1);
    const matRete = D3.materialeMondo(VS_RETE, FS_RETE, {
      uniforms: { uGw0: uGw0, uRete: uRete, uColRete: uColRete },
      side: THREE.DoubleSide, transparent: true, depthWrite: false
    });
    const gRete = new THREE.BufferGeometry();
    gRete.setAttribute('position', new THREE.Float32BufferAttribute(R.P, 3));
    gRete.setAttribute('normal', new THREE.Float32BufferAttribute(R.N, 3));
    gRete.setAttribute('aX', new THREE.Float32BufferAttribute(R.X, 4));
    const mRete = new THREE.Mesh(gRete, matRete);
    mRete.frustumCulled = false; mRete.matrixAutoUpdate = false;
    mRete.renderOrder = 6; mRete.name = 'rete'; gruppo.add(mRete);
    tris.rete = R.tris();

    /* ═══ 2bis. PRATO ═══════════════════════════════════════════════════════ */
    uPrato.value = dipingiPrato(W, H, ad, aw, RIS);
    const gPrato = new THREE.PlaneGeometry(W, H, 1, 1);
    gPrato.rotateX(-Math.PI / 2); gPrato.translate(cx, 0, cz);
    const matPrato = D3.materialeMondo(VS_PRATO, FS_PRATO, {
      uniforms: { uPrato: uPrato, uFari: uFari }
    });
    const mPrato = new THREE.Mesh(gPrato, matPrato);
    mPrato.matrixAutoUpdate = false; mPrato.name = 'prato'; gruppo.add(mPrato);
    tris.prato = 2;

    /* ═══ 5. PUBBLICO ═══════════════════════════════════════════════════════ */
    // i posti sono in `posti` (x,y,z,lato,k,r). Li mescoliamo in modo
    // deterministico: cosi' abbassare instanceCount dirada TUTTE le tribune
    // invece di svuotarne una.
    const nPosti = Math.min(MAX_SPETT, posti.length / 6);
    const ord = new Int32Array(posti.length / 6);
    for (let i = 0; i < ord.length; i++) ord[i] = i;
    for (let i = ord.length - 1; i > 0; i--) {
      const j = (HS(i, 4242) * (i + 1)) | 0, t2 = ord[i]; ord[i] = ord[j]; ord[j] = t2;
    }
    const aP = new Float32Array(nPosti * 3), aC = new Float32Array(nPosti * 3), aQ = new Float32Array(nPosti * 4);
    for (let n = 0; n < nPosti; n++) {
      const i = ord[n], x = posti[i * 6], y = posti[i * 6 + 1], z = posti[i * 6 + 2];
      const lato = posti[i * 6 + 3], k = posti[i * 6 + 4], r = posti[i * 6 + 5];
      aP[n * 3] = x; aP[n * 3 + 1] = y; aP[n * 3 + 2] = z;
      // macchie di tifo: settori di ~3,2 u nei due colori squadra + qualche neutro
      const sett = Math.floor((lato < 2 ? x : z) / 3.2) + lato * 17;
      const hh = HS(sett, r + 1);
      let ci;
      if (hh < 0.40) ci = HS(k + r, sett) < 0.16 ? 2 : 0;
      else if (hh < 0.80) ci = HS(k + r, sett) < 0.16 ? 3 : 1;
      else ci = 4 + ((HS(k, sett + 5) * 3) | 0);
      const col = C['f' + Math.min(6, ci)];
      const lum = 0.78 + HS(k * 3 + r, sett + 2) * 0.42;
      aC[n * 3] = col[0] * lum; aC[n * 3 + 1] = col[1] * lum; aC[n * 3 + 2] = col[2] * lum;
      aQ[n * 4] = HS(k, r * 5 + lato) * 6.283;              // fase
      aQ[n * 4 + 1] = 2.2 + HS(r, k * 7) * 2.6;             // velocita' del dondolio
      aQ[n * 4 + 2] = (Math.atan2(z - cz, x - cx) / TAU + 0.5);   // giro (per l'ola)
      aQ[n * 4 + 3] = 0.30 + HS(k + 3, r) * 0.09;           // taglia
    }
    const baseQ = new THREE.PlaneGeometry(1, 1);
    const gFolla = new THREE.InstancedBufferGeometry();
    gFolla.setIndex(baseQ.index);
    gFolla.setAttribute('position', baseQ.attributes.position);
    gFolla.setAttribute('aP', new THREE.InstancedBufferAttribute(aP, 3));
    gFolla.setAttribute('aC', new THREE.InstancedBufferAttribute(aC, 3));
    gFolla.setAttribute('aQ', new THREE.InstancedBufferAttribute(aQ, 4));
    gFolla.instanceCount = nPosti;
    const matFolla = D3.materialeMondo(VS_FOLLA, FS_FOLLA, {
      uniforms: { uFolla: uFolla, uOla: uOla, uOsserv: uOsserv }, side: THREE.DoubleSide
    });
    const mFolla = new THREE.Mesh(gFolla, matFolla);
    mFolla.frustumCulled = false; mFolla.matrixAutoUpdate = false;
    mFolla.name = 'pubblico'; gruppo.add(mFolla);

    /* ═══ 6. OMBRE ══════════════════════════════════════════════════════════ */
    const aO = new Float32Array(MAX_OMBRE * 4);
    const gOmbra = new THREE.InstancedBufferGeometry();
    gOmbra.setIndex(baseQ.index);
    gOmbra.setAttribute('position', baseQ.attributes.position);
    const attO = new THREE.InstancedBufferAttribute(aO, 4);
    attO.setUsage(THREE.DynamicDrawUsage);
    gOmbra.setAttribute('aO', attO);
    gOmbra.instanceCount = 0;
    const matOmbra = D3.materialeMondo(VS_OMBRA, FS_OMBRA, {
      uniforms: { uRy: uRy }, transparent: true, depthWrite: false, side: THREE.DoubleSide
    });
    matOmbra.polygonOffset = true; matOmbra.polygonOffsetFactor = -2; matOmbra.polygonOffsetUnits = -4;
    const mOmbra = new THREE.Mesh(gOmbra, matOmbra);
    mOmbra.frustumCulled = false; mOmbra.matrixAutoUpdate = false;
    mOmbra.renderOrder = 2; mOmbra.name = 'ombre'; gruppo.add(mOmbra);

    /* ═══ ALONI dei fari ════════════════════════════════════════════════════ */
    const NA = 8;   // 4 torri x (nucleo + alone largo)
    const posA = new Float32Array(NA * 4 * 3), idxA = new Uint16Array(NA * 6);
    const attA = new Float32Array(NA * 4 * 4), attB = new Float32Array(NA * 4 * 4);
    for (let k = 0; k < NA; k++) {
      const t2 = k >> 1, largo = (k & 1) === 1;
      const raggio = largo ? 3.4 : 1.25, forza = largo ? 0.30 : 0.95;
      const qx = [-0.5, 0.5, 0.5, -0.5], qy = [-0.5, -0.5, 0.5, 0.5];
      for (let v = 0; v < 4; v++) {
        const o = (k * 4 + v);
        posA[o * 3] = qx[v]; posA[o * 3 + 1] = qy[v]; posA[o * 3 + 2] = 0;
        attA[o * 4] = fari[t2 * 3]; attA[o * 4 + 1] = fari[t2 * 3 + 1]; attA[o * 4 + 2] = fari[t2 * 3 + 2]; attA[o * 4 + 3] = raggio;
        attB[o * 4] = forza;
      }
      idxA[k * 6] = k * 4; idxA[k * 6 + 1] = k * 4 + 1; idxA[k * 6 + 2] = k * 4 + 2;
      idxA[k * 6 + 3] = k * 4; idxA[k * 6 + 4] = k * 4 + 2; idxA[k * 6 + 5] = k * 4 + 3;
    }
    const gAlone = new THREE.BufferGeometry();
    gAlone.setAttribute('position', new THREE.BufferAttribute(posA, 3));
    gAlone.setAttribute('aA', new THREE.BufferAttribute(attA, 4));
    gAlone.setAttribute('aB', new THREE.BufferAttribute(attB, 4));
    gAlone.setIndex(new THREE.BufferAttribute(idxA, 1));
    const matAlone = D3.materialeMondo(VS_ALONE, FS_ALONE, {
      uniforms: { uColAlone: uColAlone }, transparent: true, depthWrite: false, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });

  ];
  const CAP_LOOK = [V.FEDORA, V.COPPOLA, V.BANDANA, V.CILINDRO, V.CAPELLI];

  // ── colori senza allocare (identico) ──────────────────────────────────────
  function esa(str, out, o) {
    if (typeof str !== 'string' || str.charCodeAt(0) !== 35) return false;
    const h = c => (c >= 48 && c <= 57 ? c - 48 : c >= 97 && c <= 102 ? c - 87 : c >= 65 && c <= 70 ? c - 55 : 0);
    if (str.length >= 7) {
      out[o] = (h(str.charCodeAt(1)) * 16 + h(str.charCodeAt(2))) / 255; out[o + 1] = (h(str.charCodeAt(3)) * 16 + h(str.charCodeAt(4))) / 255; out[o + 2] = (h(str.charCodeAt(5)) * 16 + h(str.charCodeAt(6))) / 255;
    } else if (str.length >= 4) {
      out[o] = h(str.charCodeAt(1)) * 17 / 255; out[o + 1] = h(str.charCodeAt(2)) * 17 / 255; out[o + 2] = h(str.charCodeAt(3)) * 17 / 255;
    } else return false;
    return true;
  }
  const TMP3 = new Float32Array(3);
  function misto(out, o, a, ao, b, bo, k) { for (let i = 0; i < 3; i++) out[o + i] = a[ao + i] + (b[bo + i] - a[ao + i]) * k; }
  function scala3(out, o, k) { out[o] *= k; out[o + 1] *= k; out[o + 2] *= k; }
  const SCURO = new Float32Array([0.09, 0.1, 0.15]), BIANCO = new Float32Array([0.93, 0.92, 0.88]), CAPELLI_C = new Float32Array([0.1, 0.07, 0.05]),
    CAPELLI_D = new Float32Array([0.2, 0.09, 0.06]), CAPELLI_R = new Float32Array([0.16, 0.18, 0.22]), NERO_T = new Float32Array([0.06, 0.07, 0.12]);
  // REGOLA DI LEGGIBILITA' (dai mafiosi): sotto 0,2 di luminanza si schiarisce
  // verso [0.36,0.40,0.52], altrimenti la sagoma si perde nel prato di notte.
  function leggibile(c, o) {
    const lum = c[o] * 0.3 + c[o + 1] * 0.55 + c[o + 2] * 0.15;
    if (lum < 0.2) { const k = (0.2 - lum) / 0.2 * 0.55; c[o] += (0.36 - c[o]) * k; c[o + 1] += (0.4 - c[o + 1]) * k; c[o + 2] += (0.52 - c[o + 2]) * k; }
  }

  function configura(sl) {
    const a = ARCH[sl.arch], lk = sl.look, c = sl.col;
    let mA = 1, mB = 0;
    const bit = b => { if (b < 0) return; if (b < 24) mA |= (1 << b); else mB |= (1 << (b - 24)); };
    const gk = sl.gk, divisa = sl.divisa;
    if (divisa) {
      bit(gk ? V.MAGLIA_GK : V.MAGLIA);
      if (gk) bit(V.GUANTI); else bit(V.BRACCIO_NUDO);
      if (!gk && sl.righe) bit(V.MAGLIA_RIGHE);
      bit(V.NUMERO); bit(V.PANTALONCINI); bit(V.CALZETTONI); bit(V.SCARPINI); bit(V.GAMBA_NUDA);
      if (sl.capitano) bit(V.FASCIA);
      for (let i = 0; i < a.acc.length; i++) bit(a.acc[i]);
    } else {
      for (let i = 0; i < a.bit.length; i++) bit(a.bit[i]);
      for (let i = 0; i < a.acc.length; i++) bit(a.acc[i]);
      bit(V.PANT_LUNGHI);
    }
    bit(V.OCCHI);
    // cappello: il look vince. E' la firma del personaggio: c'e' sempre.
    let cap = a.cap;
    if (lk && lk.hat != null) { cap = CAP_LOOK[(lk.hat | 0) % 5]; if (cap === V.CAPELLI && sl.arch === 4) cap = V.CHIGNON; }
    bit(cap); sl.cap = cap;
    const acc = lk && lk.acc != null ? (lk.acc | 0) : 0;
    if (acc === 1) bit(sl.arch === 5 ? V.OCC_TONDI : V.OCC_SCURI);
    if (acc === 1 && sl.arch !== 5) mA &= ~(1 << V.OCC_TONDI);
    if (acc === 2) bit(V.SIGARO);
    if (acc === 3) bit(V.CATENA);
    if (acc === 4) bit(V.CICATRICE);
    if (mA & (1 << V.OCC_SCURI)) mB &= ~(1 << (V.OCCHI - 24));
    if (mA & (1 << V.OCC_TONDI)) mB &= ~(1 << (V.OCCHI - 24));
    sl.maskA = mA; sl.maskB = mB;

    // ── colori ──
    // il secondo colore (colletto, righe, anelli dei calzettoni) sta nello slot 0
    if (!esa(sl.col2, c, 0)) { if (!(lk && esa(lk.suit, c, 0))) esa(a.suit, c, 0); }
    leggibile(c, 0);
    const skin = lk && lk.skin != null ? (lk.skin | 0) % 5 : (sl.arch * 3 + sl.hashId) % 4;
    esa(G3.PAL.pelli[skin], c, 9);
    let hatOk = lk && esa(lk.hatCol, c, 12);
    if (!hatOk) { c[12] = c[0] * 0.6; c[13] = c[1] * 0.6; c[14] = c[2] * 0.6; }
    // colore squadra (maglia, calzettoni)
    if (!esa(sl.col1, c, 15)) {
      if (hatOk) { c[15] = c[12]; c[16] = c[13]; c[17] = c[14]; } else { c[15] = 0.75; c[16] = 0.12; c[17] = 0.16; }
    }
    leggibile(c, 15);
    if (cap === V.FEDORA || cap === V.CILINDRO) { TMP3[0] = c[12]; TMP3[1] = c[13]; TMP3[2] = c[14]; misto(c, 12, TMP3, 0, NERO_T, 0, 0.5); }
    const ch = skin === 4 ? CAPELLI_R : sl.arch === 4 ? CAPELLI_D : CAPELLI_C;
    c[18] = ch[0]; c[19] = ch[1]; c[20] = ch[2];
    if (divisa) {
      // maglia = squadra · pantaloncini = squadra scurita · numero = bianco
      c[6] = BIANCO[0]; c[7] = BIANCO[1]; c[8] = BIANCO[2];
      misto(c, 3, c, 15, SCURO, 0, 0.55);
      if (!esa(sl.colGk, c, 21)) esa(G3.PAL.portiere, c, 21);     // ambra del portiere
    } else {
      // il vestito del mafioso, come in GAMBLER CITY

        if (lk) { sl.kSuit = lk.suit; sl.kHat = lk.hat; sl.kHatCol = lk.hatCol; sl.kSkin = lk.skin; sl.kAcc = lk.acc; }
      }
    }

    let nIst = 0;
    function fine(dt, t) {
      dt = dt > 0.1 ? 0.1 : dt < 0 ? 0 : dt;
      let riga = 0;
      for (let i = 0; i < MAX; i++) {
        const sl = SL[i];
        if (!sl.usato) continue;
        if (!sl.visto) { sl.usato = false; mappa.delete(sl.id); sl.riga = -1; continue; }
        sl.riga = riga;
        posa(sl, D, riga * TW * 4, dt, t, SCALA);
        riga++;
      }
      nIst = riga;
      geo.instanceCount = riga;
      mesh.visible = riga > 0;
      tex.needsUpdate = true;
    }

    // Riscaldamento del JIT e degli shader: passa per TUTTE le 15 pose prima
    // della partita, cosi' non ci sono de-ottimizzazioni (ne' allocazioni) al
    // primo tiro o al primo tuffo. Una volta per pagina.
    if (!RISCALDATO) (function riscalda() {
      RISCALDATO = true;
      const st = [];
      for (let i = 0; i < 16; i++) {
        st.push({
          x: 4 + i * 0.5, y: 4.5, hy: 0, fx: 1, fy: 0.3 * (i % 3 - 1), ax: i % 2 ? -1 : 0.2, ay: 1,
          vel: (i % 4) * 1.3, squadra: i % 2, ruolo: i % 5 === 0 ? 'portiere' : 'campo',
          look: i % 4 ? { suit: '#22d3ee', hatCol: '#ffd700', hat: i % 5, skin: i % 5, acc: i % 5, arch: i % 6 } : null,
          colSquadra: i % 2 ? '#38bdf8' : '#ef4444', colSquadra2: i % 2 ? '#0c4a6e' : '#7f1d1d',
          capitano: i % 6 === 0, righe: i % 3 === 0, divisa: i !== 7, io: i === 0,
          possesso: false, stordito: false, carica: 0, vivo: true, alfa: 1, codice: [1, 0, 0], eventi: {}
        });
      }
      let t = 100;
      for (let f = 0; f < 150; f++) {
        t += 1 / 30;
        const c = f % 30, giro = (f / 30) | 0;
        inizio();
        for (let i = 0; i < st.length; i++) {
          const s = st[i], e = s.eventi, k = (i + giro) % 15;
          s.possesso = k === 2; s.stordito = k === 11;
          s.carica = k === 3 ? c / 30 : 0;
          s.vel = k === 1 ? 4.2 : k === 2 ? 2.2 : (i % 4) * 0.4;
          e.calcio = k === 4 ? t - c / 30 * 0.42 : -1e9; e.pw = (i % 3) / 2;
          e.passaggio = k === 5 ? t - c / 30 * 0.26 : -1e9;
          e.cross = k === 6 ? t - c / 30 * 0.4 : -1e9;
          e.nokick = k === 14 ? t - c / 30 * 0.25 : -1e9;
          e.parata = k === 10 ? t - c / 30 * 0.3 : -1e9;
          e.gol = k === 13 ? t - c / 30 * 2.4 : -1e9;
          e.scivolata = k === 7 ? { t0: t - c / 30 * 1.1, dur: 0.55 } : null;
          e.tuffo = k === 9 ? { t0: t - c / 30 * 1.6, dur: 0.45, dx: i % 2 ? 1 : -1, dy: 0.2 } : null;
          e.fallo = k === 12 ? { t0: t - c / 30 * 1.0, dx: 1, dy: 0.3 } : null;
          s.ruolo = (k === 8 || k === 9 || k === 10) ? 'portiere' : (i % 5 === 0 ? 'portiere' : 'campo');
          s.x = 4 + i * 0.5 + Math.sin(t) * 0.2;
          aggiungi('__riscaldo' + i, s);
        }
        fine(1 / 30, t);
      }
      inizio(); fine(0, t);
      for (let i = 0; i < MAX; i++) SL[i].nuovo = true;
    })();

    const R = {
      mesh, materiali: mats, patchFrammento: patchOk,
      inizio, aggiungi, fine,
      punti(id) { const sl = mappa.get(id); return sl && sl.riga >= 0 ? sl.punti : null; },
      stat() { return { istanze: nIst, triangoliPerOmino: triMax, triangoliGeometria: nV / 3, drawCalls: nIst > 0 ? 1 : 0 }; },
      ARCHETIPI: ARCH.map(a => a.nome), POSE: NOMI_POSE, altezza: 0.93 * SCALA, scala: SCALA
    };
    return R;
  }

  // ═══ SCRITTURA DI UN OSSO (identica) ══════════════════════════════════════
  function scriviOsso(D, base, b, F, sx, sy, sz) {
    const o = base + (TX_OSSA + b * 3) * 4;
    D[o] = F[0] * sx; D[o + 1] = F[1] * sy; D[o + 2] = F[2] * sz; D[o + 3] = F[3];
    D[o + 4] = F[4] * sx; D[o + 5] = F[5] * sy; D[o + 6] = F[6] * sz; D[o + 7] = F[7];
    D[o + 8] = F[8] * sx; D[o + 9] = F[9] * sy; D[o + 10] = F[10] * sz; D[o + 11] = F[11];
  }

  // ═══ LA POSA DI UN CALCIATORE ═════════════════════════════════════════════
  function posa(sl, D, base, dt, t, S) {
    const ar = ARCH[sl.arch];
    const bac = ar.bac, bus = ar.bus, tes = ar.tes, bra = ar.bra, gam = ar.gam;
    const yM = Math.atan2(-sl.fy, sl.fx);
    const yAim = sl.haMira ? Math.atan2(-sl.ay, sl.ax) : yM;
    if (sl.nuovo) {
      sl.yH = yM; sl.yA = yAim; sl.velS = sl.vel; sl.px = sl.x; sl.pz = sl.z; sl.nuovo = false;
      sl.carK = sl.carica; sl.posK = sl.possesso ? 1 : 0; sl.gkK = sl.gk ? 1 : 0; sl.stunK = sl.stordito ? 1 : 0;
    }
    sl.velS = damp(sl.velS, sl.vel, 10, dt);
    const vS = sl.velS, moving = vS > 0.3;
    sl.px = sl.x; sl.pz = sl.z;
    // il bacino segue il moto, il busto e la testa la palla
    let hipT;
    if (moving) {
      const d = angDiff(yAim, yM);
      hipT = Math.abs(d) > 1.75 ? yAim + clamp(angDiff(yAim, yM + Math.PI), -0.9, 0.9) : yAim + clamp(d, -1.1, 1.1);
    } else { const d = angDiff(yAim, sl.yH); hipT = Math.abs(d) > 0.9 ? yAim : sl.yH; }
    sl.yH += angDiff(sl.yH, hipT) * (1 - Math.exp(-(moving ? 12 : 7) * dt));
    sl.yA += angDiff(sl.yA, yAim) * (1 - Math.exp(-22 * dt));

    // ── tempi degli eventi ──
    const aKi = t - sl.eCalcio, aPa = t - sl.ePass, aCr = t - sl.eCross, aNo = t - sl.eNok,
      aPar = t - sl.eParata, aGo = t - sl.eGol, aSc = t - sl.scT0, aTu = t - sl.tuT0, aFa = t - sl.faT0;
    let colpo = -1, ck = 0;
    if (aKi >= 0 && aKi < T_CALCIO) { colpo = 0; ck = aKi / T_CALCIO; }
    else if (aCr >= 0 && aCr < T_CROSS) { colpo = 2; ck = aCr / T_CROSS; }
    else if (aPa >= 0 && aPa < T_PASS) { colpo = 1; ck = aPa / T_PASS; }
    else if (aNo >= 0 && aNo < T_NOK) { colpo = 3; ck = aNo / T_NOK; }
    const scOn = sl.scT0 > -1e8 && aSc >= 0 && aSc < sl.scDur + T_RIALZO;
    const tuOn = sl.tuT0 > -1e8 && aTu >= 0 && aTu < sl.tuDur + T_GK_GIU + T_GK_SU;
    const faOn = sl.faT0 > -1e8 && aFa >= 0 && aFa < T_FALLO;
    const aTerra = scOn || tuOn || faOn;
    const golOn = aGo >= 0 && aGo < T_GOL + T_GOL_CORSA && !aTerra;

    // ── stati smorzati ──
    sl.posK = damp(sl.posK, (sl.possesso && !aTerra) ? 1 : 0, 8, dt);
    sl.carK = damp(sl.carK, sl.carica, 12, dt);
    sl.stunK = damp(sl.stunK, (sl.stordito && !aTerra) ? 1 : 0, 7, dt);
    const gkPronto = sl.gk && !aTerra && !sl.stordito && colpo < 0 && !golOn ? (1 - smooth(0.3, 1.4, vS)) : 0;
    sl.gkK = damp(sl.gkK, gkPronto, 8, dt);
    sl.fase = (sl.fase + dt * vS * TAU / (0.95 - 0.30 * sl.posK)) % TAU;

    // ── parametri della posa ──
    let rootX = sl.x, rootY = sl.hy, rootZ = sl.z, rootYaw = sl.yH;
    const hip0 = 0.03 + 0.34 * gam[1];
    let hipDrop = 0, bob = 0, bendF = ar.curvo * 0.35, bendS = 0, nod = -ar.curvo * 0.6;
    let thL = 0, thxL = 0, shL = 0, thR = 0, thxR = 0, shR = 0;
    let swL = 0.08, abL = 0.1, elL = 0.3, swR = 0.08, abR = 0.1, elR = 0.3;
    let alfa = clamp(sl.alfa, 0, 1);
    let ang = 0, roll = 0, spin = 0, pivY = 0, lift = 0;
    const guarda = angDiff(sl.yH, sl.yA);
    let twist = clamp(guarda, -1.0, 1.0);
    let headYaw = clamp(guarda - twist, -0.85, 0.85);

    // ── 1·2·3 camminata, corsa, conduzione palla ──
    const runK = smooth(0.6, 2.8, vS), mk = Math.min(1, vS / 0.9);
    const posK = sl.posK;
    const walkA = moving ? (0.30 + 0.36 * runK) * mk * (1 - 0.24 * posK) : 0;
    const delta = angDiff(sl.yH, yM), fwd = Math.cos(delta), side = -Math.sin(delta);
    const ph = sl.fase, s1 = Math.sin(ph), c1 = Math.cos(ph);
    thL = walkA * s1 * fwd; thxL = -walkA * s1 * side * 0.8;
    thR = -walkA * s1 * fwd; thxR = walkA * s1 * side * 0.8;
    const kn = (0.2 + 0.9 * runK) * mk;
    shL = -kn * Math.max(0, c1); shR = -kn * Math.max(0, -c1);
    bob = moving ? Math.abs(c1) * (0.006 + 0.02 * runK) * mk : Math.sin(t * 2.1 + sl.hashId) * 0.0035;
    // in corsa piena il busto va avanti; con la palla si abbassa ancora
    bendF += 0.30 * runK * fwd * mk + Math.sin(t * 1.9 + sl.hashId) * 0.012 + 0.20 * posK;
    bendS += 0.10 * runK * side * mk;
    const swA = walkA * (0.9 + 0.55 * runK);
    swL = 0.08 - swA * s1; swR = 0.08 + swA * s1;
    elL = elR = 0.3 + 1.0 * runK * mk + 0.45 * posK;
    abL = 0.1 + 0.40 * posK; abR = 0.1 + 0.40 * posK;
    nod += 0.22 * posK;                                    // sguardo alla palla
    // fermo: respiro, peso che oscilla, testa che segue la palla
    if (!moving) {
      const q = 1 - mk;
      bendS += Math.sin(t * 1.05 + sl.hashId) * 0.055 * q;
      thxL += 0.05 * q; thxR -= 0.05 * q;
      thL += 0.06 * q; shL -= 0.12 * q; shR -= 0.08 * q;
      nod += Math.sin(t * 1.6 + sl.hashId) * 0.05 * q;
      abL += 0.06 * q; abR += 0.06 * q;
    }

    // ── 9 portiere pronto ──
    const gk = sl.gkK;
    if (gk > 0.001) {
      hipDrop -= 0.115 * gk; thL += 0.24 * gk; thR += 0.24 * gk; shL -= 0.58 * gk; shR -= 0.58 * gk;
      thxL += 0.32 * gk; thxR -= 0.32 * gk; bendF += 0.30 * gk;
      swL = lerp(swL, 0.82, gk); swR = lerp(swR, 0.82, gk);
      abL = lerp(abL, 0.64, gk); abR = lerp(abR, 0.64, gk);
      elL = lerp(elL, 0.72, gk); elR = lerp(elR, 0.72, gk);
      bob *= 1 - 0.6 * gk;
    }

    // ── 4 carica del tiro ──
    // durante il colpo la carica si spegne: il colpo comanda la gamba
    const carK = sl.carK * (colpo >= 0 ? 1 - ease(ck / 0.25) : 1);
    if (carK > 0.001) {
      const c = carK;
      thR -= 1.25 * c; shR -= 0.85 * c;                    // gamba di calcio tutta dietro
      thL += 0.18 * c; shL -= 0.32 * c; thxL += 0.06 * c;  // piede d'appoggio piantato
      twist += 0.55 * c; bendF -= 0.10 * c; bendS -= 0.16 * c;
      hipDrop -= 0.04 * c; nod += 0.10 * c;
      swL -= 1.05 * c; abL += 0.45 * c; elL += 0.25 * c;   // braccio opposto in alto
      swR += 0.30 * c; abR += 0.18 * c;
    }

    // ── 5·6·7·15 tiro, passaggio, cross, tiro mancato ──
    if (colpo >= 0) {
      const C = COLPI[colpo], amp = 1 + C.pw * (sl.pw - 0.5) * 0.55;
      let th, sh, apri;
      if (ck < 0.26) { const e = ease(ck / 0.26); th = lerp(C.dietro, C.av * amp, e); sh = lerp(-0.85, -0.10, e); }
      else if (ck < 0.48) { const e = ease((ck - 0.26) / 0.22); th = lerp(C.av * amp, C.fol * amp, e); sh = lerp(-0.10, -0.04, e); }
      else { const e = ease((ck - 0.48) / 0.52); th = lerp(C.fol * amp, 0, e); sh = lerp(-0.04, 0, e); }
      apri = C.apri * (ck < 0.6 ? 1 : 1 - ease((ck - 0.6) / 0.4));
      thR = th; shR = sh; thxR = apri;
      const st = ck < 0.48 ? ease(ck / 0.34) : 1 - ease((ck - 0.48) / 0.52);
      thL = 0.14 + 0.12 * st; shL = -0.28 - 0.18 * st; thxL = 0.08;
      let twK;
      if (ck < 0.26) twK = 1 - 2 * ease(ck / 0.26);
      else if (ck < 0.48) twK = -1;
      else twK = -1 + ease((ck - 0.48) / 0.52);
      twist += C.tw * twK;
      const bell = Math.sin(Math.PI * Math.min(1, ck / 0.85));
      bendF += C.bend * bell;
      const armK = Math.sin(Math.PI * Math.min(1, ck / 0.92));
      swL -= 1.05 * armK; abL += 0.48 * armK; elL = lerp(elL, 0.35, armK);
      swR += 0.34 * armK; abR += 0.22 * armK;
      rootY += C.salto * S * Math.sin(Math.PI * cl01(ck / 0.55));
      headYaw = clamp(headYaw + 0.2 * armK, -0.9, 0.9); nod += 0.18 * armK;
      if (colpo === 3) {                                   // tiro mancato: perde l'equilibrio
        const q = Math.sin(Math.PI * ck);
        bendS += 0.34 * q * ((sl.hashId & 8) ? 1 : -1);
        hipDrop -= 0.05 * q; shL -= 0.3 * q; abR += 0.4 * q; elR = lerp(elR, 0.2, q);
      }
    }

    // ── 11 parata in piedi ──
    if (aPar >= 0 && aPar < T_PARATA && !aTerra) {
      const q = Math.sin(Math.PI * cl01(aPar / T_PARATA));
      swL = lerp(swL, 1.55, q); swR = lerp(swR, 1.55, q);
      elL = lerp(elL, 0.16, q); elR = lerp(elR, 0.16, q);
      abL += 0.42 * q; abR += 0.42 * q;
      bendF += 0.30 * q; hipDrop -= 0.07 * q; nod += 0.14 * q;
      thL += 0.16 * q; thR += 0.16 * q; shL -= 0.3 * q; shR -= 0.3 * q;
    }

    // ── 12 stordito ──
    const stun = sl.stunK;
    if (stun > 0.001) {
      const w1 = Math.sin(t * 3.3 + sl.hashId), w2 = Math.sin(t * 2.1 + sl.hashId * 0.7);
      bendS = lerp(bendS, w1 * 0.30, stun); bendF = lerp(bendF, 0.22 + w2 * 0.12, stun);
      nod = lerp(nod, -0.45, stun); headYaw = lerp(headYaw, w1 * 0.3, stun);
      swL = lerp(swL, 0.04 + w1 * 0.20, stun); swR = lerp(swR, 0.04 - w1 * 0.20, stun);
      elL = lerp(elL, 0.18, stun); elR = lerp(elR, 0.22, stun);
      abL = lerp(abL, 0.24 + 0.1 * w1, stun); abR = lerp(abR, 0.24 - 0.1 * w1, stun);
      thL = lerp(thL, 0.18 + w2 * 0.24, stun); thR = lerp(thR, 0.10 - w2 * 0.24, stun);
      shL = lerp(shL, -0.34, stun); shR = lerp(shR, -0.30, stun);
      hipDrop -= 0.05 * stun; rootYaw += w1 * 0.10 * stun; twist *= 1 - 0.6 * stun;
    }

    // ── 14 esultanza (3 varianti col hashId) ──
    if (golOn) {
      const v = sl.hashId % 3, q = 1 - smooth(T_GOL - 0.2, T_GOL + 0.25, aGo);
      if (v === 0) {
        // braccia al cielo, due-tre salti, busto indietro
        const jp = Math.max(0, Math.sin(aGo * Math.PI / 0.44)), ju = jp * jp;
        rootY += 0.11 * S * ju * q;
        // una avanti una indietro E bene aperte: la tesa della fedora e' piu' larga
        // delle spalle, con le braccia dritte in su dall'alto non si vedrebbero.
        // il braccio e' corto e la tesa della fedora e' larga: dritte in su le mani
        // non spuntano dal cappello. In alto E BENE APERTE si leggono da ogni lato.
        swL = lerp(swL, -2.95, q); swR = lerp(swR, 2.95, q);
        abL = lerp(abL, 0.50, q); abR = lerp(abR, 0.50, q);
        elL = lerp(elL, 0.08, q); elR = lerp(elR, 0.08, q);
        bendF = lerp(bendF, -0.30, q); nod = lerp(nod, 0.35, q);
        thL = lerp(thL, 0.9 * ju, q); thR = lerp(thR, 0.6 * ju, q);
        shL = lerp(shL, -1.5 * ju, q); shR = lerp(shR, -1.2 * ju, q);
      } else if (v === 1) {
        // pugni chiusi verso la tribuna
        const pu = Math.sin(aGo * Math.PI / 0.32);
        swL = lerp(swL, 2.5 + 0.45 * pu, q); swR = lerp(swR, 2.5 - 0.45 * pu, q);
        elL = lerp(elL, 1.05 - 0.35 * pu, q); elR = lerp(elR, 1.05 + 0.35 * pu, q);
        abL = lerp(abL, 0.45, q); abR = lerp(abR, 0.45, q);
        twist += 0.32 * pu * q; bendF = lerp(bendF, -0.12, q); nod = lerp(nod, 0.22, q);
        const jp = Math.max(0, Math.sin(aGo * Math.PI / 0.44));
        rootY += 0.085 * S * jp * jp * q;
        thL = lerp(thL, 0.3, q); shL = lerp(shL, -0.5, q); thR = lerp(thR, 0.2, q); shR = lerp(shR, -0.4, q);
      } else {
        // ginocchia a terra
        const dw = ease(aGo / 0.35), up = ease((aGo - 1.15) / 0.4), kk = q * dw * (1 - up);
        hipDrop -= 0.175 * kk;
        thL = lerp(thL, -0.10, kk); thR = lerp(thR, -0.14, kk);
        shL = lerp(shL, -1.70, kk); shR = lerp(shR, -1.66, kk);
        thxL = lerp(thxL, 0.10, kk); thxR = lerp(thxR, -0.10, kk);
        swL = lerp(swL, -2.92, kk); swR = lerp(swR, 2.92, kk);
        abL = lerp(abL, 0.50, kk); abR = lerp(abR, 0.50, kk);
        elL = lerp(elL, 0.1, kk); elR = lerp(elR, 0.1, kk);
        bendF = lerp(bendF, -0.32, kk); nod = lerp(nod, 0.4, kk);
      }
      // dopo l'esultanza: corsa con le braccia larghe
      const w = smooth(T_GOL - 0.3, T_GOL + 0.15, aGo) * (1 - smooth(T_GOL + T_GOL_CORSA - 0.4, T_GOL + T_GOL_CORSA, aGo));
      abL += 0.62 * w; abR += 0.62 * w; elL = lerp(elL, 0.22, w); elR = lerp(elR, 0.22, w);
      swL = lerp(swL, -0.35, w * 0.6); swR = lerp(swR, -0.35, w * 0.6);
    }

    // ── 8 scivolata (+ rialzo) ──
    if (scOn) {
      const inn = smooth(0, 0.16, aSc), su = aSc - sl.scDur;
      const kr = su > 0 ? ease(su / T_RIALZO) : 0, lay = inn * (1 - kr);
      pivY = 0.42 * S;
      ang = 1.34 * lay; spin = sl.scSegno * 0.95 * lay;
      hipDrop -= 0.02 * lay;
      // gamba destra tesa avanti, sinistra piegata sotto
      thR = lerp(thR, -0.10, lay); shR = lerp(shR, -0.06, lay); thxR = lerp(thxR, -0.10, lay);
      thL = lerp(thL, 0.95, lay); shL = lerp(shL, -1.65, lay); thxL = lerp(thxL, 0.18, lay);
      // braccio a terra + busto ruotato
      swL = lerp(swL, -1.85, lay); abL = lerp(abL, 0.55, lay); elL = lerp(elL, 0.35, lay);
      swR = lerp(swR, -1.15, lay); abR = lerp(abR, 0.30, lay); elR = lerp(elR, 0.55, lay);
      bendF = lerp(bendF, -0.18, lay); bendS = lerp(bendS, -0.22 * sl.scSegno, lay);
      nod = lerp(nod, -0.30, lay); twist *= 1 - 0.7 * lay; headYaw *= 1 - 0.5 * lay;
      if (kr > 0.001) {                                    // si rimette in ginocchio e si alza
        const sb = Math.sin(Math.PI * kr);
        thL += 1.25 * sb; thR += 1.0 * sb; shL -= 1.55 * sb; shR -= 1.3 * sb;
        bendF += 0.55 * sb; swL += 0.6 * sb; swR += 0.5 * sb;
      }
      bob = 0;
    }

    // ── 10 tuffo del portiere ──
    if (tuOn) {
      const aria = cl01(aTu / sl.tuDur), aL = aTu - sl.tuDur;
      pivY = 0.45 * S;
      const su = aL > T_GK_GIU ? ease((aL - T_GK_GIU) / T_GK_SU) : 0;
      const lay = smooth(0, sl.tuDur * 0.45, aTu) * (1 - su);
      roll = sl.tuSegno * 1.45 * lay;
      if (aL < 0) {
        rootY += 0.34 * S * 4 * aria * (1 - aria);          // decollo
        thL = -0.24; thR = -0.18; shL = -0.45; shR = -0.32; thxL = 0.05; thxR = -0.05;
        swL = 2.95; swR = 2.95; abL = 0.14; abR = 0.14; elL = 0.06; elR = 0.06;
        bendF = -0.12; bendS = 0; nod = -0.30; twist = 0; headYaw = 0;
      } else {
        if (aL < 0.18) rootY += 0.055 * S * Math.sin(Math.PI * aL / 0.18);   // rimbalzo
        thL = lerp(-0.24, 0, su); thR = lerp(-0.18, 0, su);
        shL = lerp(-0.45, 0, su); shR = lerp(-0.32, 0, su);
        swL = lerp(2.75, 0.1, su); swR = lerp(2.75, 0.1, su);
        abL = lerp(0.2, 0.1, su); abR = lerp(0.2, 0.1, su);
        elL = lerp(0.12, 0.3, su); elR = lerp(0.12, 0.3, su);
        bendF = lerp(-0.08, 0, su); nod = lerp(-0.25, 0, su); twist = 0; headYaw = 0;
        if (su > 0.001) {                                  // si rialza
          const sb = Math.sin(Math.PI * su);
          thL += 1.3 * sb; thR += 1.1 * sb; shL -= 1.6 * sb; shR -= 1.4 * sb; bendF += 0.6 * sb;
        }
      }
      bob = 0; hipDrop = 0;
    }

    // ── 13 fallo subito (cade e SI RIALZA sempre) ──
    if (faOn) {
      const giu = ease(aFa / 0.34), su = aFa > 0.55 ? ease((aFa - 0.55) / 0.35) : 0;
      const p = giu * (1 - su);
      pivY = 0.42 * S;
      rootYaw = sl.faYaw;
      ang = 1.5708 * p; spin = sl.faSegno * 0.85 * p;
      if (aFa > 0.30 && aFa < 0.52) ang -= Math.sin((aFa - 0.30) / 0.22 * Math.PI) * 0.12;   // colpo a terra
      thL = lerp(thL, 0.38, p); thR = lerp(thR, 0.62, p); shL = lerp(shL, -0.45, p); shR = lerp(shR, -0.85, p);
      thxL = lerp(thxL, 0.15, p); thxR = lerp(thxR, -0.10, p);
      swL = lerp(swL, -2.35, p); abL = lerp(abL, 0.5, p); elL = lerp(elL, 0.3, p);
      swR = lerp(swR, -1.95, p); abR = lerp(abR, 0.35, p); elR = lerp(elR, 0.5, p);
      bendF = lerp(bendF, -0.25, p); bendS = 0; nod = lerp(nod, -0.35, p);
      twist *= 1 - p; headYaw = lerp(headYaw, 0.3, p);
      if (su > 0.001) { const sb = Math.sin(Math.PI * su); thL += 1.3 * sb; thR += 1.1 * sb; shL -= 1.6 * sb; shR -= 1.4 * sb; bendF += 0.55 * sb; }
      bob = 0; hipDrop = 0;
    }

    // corpo a terra: alza il perno cosi' non attraversa il prato
    if (pivY) {
      const sa = Math.max(Math.abs(Math.sin(ang)), Math.abs(Math.sin(roll)));
      rootY -= pivY * sa; lift = 0.085 * sa;
    }

    // ═══ TELAI ═══
    mId(MR); mT(MR, rootX, rootY + lift * S, rootZ); mRy(MR, rootYaw);
    if (pivY) { mT(MR, 0, pivY, 0); mRx(MR, roll); mRz(MR, ang); mRy(MR, spin); mT(MR, 0, -pivY, 0); }
    else if (ang) mRz(MR, ang);
    mScala(MR, S);
    const H = FR[O_BAC]; mCp(H, MR); mT(H, 0, hip0 + hipDrop + bob, 0);
    // gambe
    let F = FR[O_CSX]; mCp(F, H); mT(F, 0, 0, -0.062 * bac[2]); mRz(F, thL); mRx(F, thxL);
    let G = FR[O_SSX]; mCp(G, F); mT(G, 0, -L_CO * gam[1], 0); mRz(G, shL);
    F = FR[O_CDX]; mCp(F, H); mT(F, 0, 0, 0.062 * bac[2]); mRz(F, thR); mRx(F, thxR);
    G = FR[O_SDX]; mCp(G, F); mT(G, 0, -L_CO * gam[1], 0); mRz(G, shR);
    // busto, testa, cappello
    const B = FR[O_BUS]; mCp(B, H); mT(B, 0, 0.03 * bac[1], 0); mRy(B, twist); mRz(B, -bendF); mRx(B, bendS);
    const T = FR[O_TES]; mCp(T, B); mT(T, 0, 0.24 * bus[1], 0); mRy(T, headYaw); mRz(T, -nod);
    const C = FR[O_CAP]; mCp(C, T); mT(C, 0, 0.16 * tes[1] * TESTA_K, 0);
    // braccia
    const sY = 0.2 * bus[1], sZ = 0.165 * bus[2], L1 = L_BR * bra[1], L2 = L_AV * bra[1];
    let U = FR[O_BSX]; mCp(U, B); mT(U, 0, sY, -sZ); mRz(U, swL); mRx(U, abL);
    let A = FR[O_ASX]; mCp(A, U); mT(A, 0, -L1, -0.005); mRz(A, elL);
    U = FR[O_BDX]; mCp(U, B); mT(U, 0, sY, sZ); mRz(U, swR); mRx(U, -abR);
    A = FR[O_ADX]; mCp(A, U); mT(A, 0, -L1, 0.005); mRz(A, elR);

    // ═══ PUNTI ═══
    const pu = sl.punti;
    mP(FR[O_SDX], 0.03 * gam[0], -0.178 * gam[1], 0, pu.piede, 0);
    mP(T, 0.004, 0.1 * tes[1] * TESTA_K, 0, pu.testa, 0);
    mP(B, 0, 0.11 * bus[1], 0, pu.busto, 0);

    // ═══ SCRITTURA NELLA TEXTURE ═══
    let mA = sl.maskA, mBk = sl.maskB;
    if (alfa < 0.01) { mA = 0; mBk = 0; }
    D[base] = mA; D[base + 1] = mBk; D[base + 2] = alfa; D[base + 3] = sl.gess;
    D[base + 4] = sl.cod[0]; D[base + 5] = sl.cod[1]; D[base + 6] = sl.cod[2]; D[base + 7] = 0;
    const col = sl.col;
    for (let k = 0; k < 8; k++) { const o = base + 8 + k * 4; D[o] = col[k * 3]; D[o + 1] = col[k * 3 + 1]; D[o + 2] = col[k * 3 + 2]; D[o + 3] = 0; }
    const ox = base + 40; D[ox] = 0; D[ox + 1] = 0; D[ox + 2] = 0.2 + 0.8 * sl.carK; D[ox + 3] = 1;
    scriviOsso(D, base, O_BAC, H, bac[0], bac[1], bac[2]);
    scriviOsso(D, base, O_BUS, B, bus[0], bus[1], bus[2]);
    scriviOsso(D, base, O_TES, T, tes[0] * TESTA_K, tes[1] * TESTA_K, tes[2] * TESTA_K);
    const cs = ar.cap_, largo = (sl.arch === 4 && sl.cap === V.FEDORA) ? 1.3 : 1;
    scriviOsso(D, base, O_CAP, C, cs[0] * largo * CAP_K, cs[1] * CAP_K, cs[2] * largo * CAP_K);
    scriviOsso(D, base, O_BSX, FR[O_BSX], bra[0], bra[1], bra[2]);
    scriviOsso(D, base, O_ASX, FR[O_ASX], bra[0], bra[1], bra[2]);
    scriviOsso(D, base, O_BDX, FR[O_BDX], bra[0], bra[1], bra[2]);
    scriviOsso(D, base, O_ADX, FR[O_ADX], bra[0], bra[1], bra[2]);
    scriviOsso(D, base, O_CSX, FR[O_CSX], gam[0], gam[1], gam[2]);
    scriviOsso(D, base, O_SSX, FR[O_SSX], gam[0], gam[1], gam[2]);
    scriviOsso(D, base, O_CDX, FR[O_CDX], gam[0], gam[1], gam[2]);
    scriviOsso(D, base, O_SDX, FR[O_SDX], gam[0], gam[1], gam[2]);
    // ossa 12-16 (falde, arma, pezzo mobile, vampata): morte, nessuna geometria le legge.
  }
  const SCALA_BASE = 1.08;
  const TESTA_K = 1.1, CAP_K = 1.16;   // testa e cappello eroici: e' la sagoma che si legge dall'alto

  G3.registra('calciatori', { crea: crea, ARCHETIPI: ARCH.map(a => a.nome), POSE: NOMI_POSE });

})();
