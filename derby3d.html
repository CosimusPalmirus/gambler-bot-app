<script>

/* ═══════════════════════════════════════════════════════════════════════════
   DERBY 3D · 35_palla.js — LA PALLA
   ───────────────────────────────────────────────────────────────────────────
   Il difetto piu' grave del derby 2D era che la palla e «sei tu» erano due
   quadrati bianchi quasi uguali (DERBY_REVAMP_V2 §3.1). In 3D la palla ha
   quattro canali suoi e nessun altro li usa:
     1. la FORMA — una sfera bianca a spicchi scuri, tonda, inconfondibile;
     2. la ROTAZIONE — rotola davvero: dice direzione e velocita';
     3. la SCIA — un nastro che guarda la camera, si accorcia da sola;
     4. la QUOTA — l'ombra resta a terra e la palla se ne stacca. E' l'unico
        modo in cui un gioco dall'alto racconta l'altezza (lezione di
        Sensible Soccer, §3.6). Oggi un cross vola 1,22 s sopra Z_PLAY e in 2D
        era disegnato IDENTICO a una palla che rotola.
   L'ombra la disegna lo stadio (S.ombra): qui si dice solo dove metterla.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const THREE = window.THREE, D3 = window.D3;
  const BR = D3.M.BALL_R, Z_PLAY = D3.M.Z_PLAY;

  // ── la tela della palla: bianca con gli spicchi scuri ─────────────────────
  // Disegnata in codice una volta sola. Non e' un pallone da regolamento: e'
  // un pallone che si legge a 40 px, che e' il metro del gioco.
  function telaPalla() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#f8fafc'; g.fillRect(0, 0, 256, 128);
    // grana leggerissima
    for (let i = 0; i < 1400; i++) {
      g.fillStyle = D3.hash(i, 5) > 0.5 ? 'rgba(255,255,255,.7)' : 'rgba(180,196,208,.35)';
      g.fillRect(D3.hash(i, 11) * 256, D3.hash(7, i) * 128, 2, 2);
    }
    // spicchi: una fila di pentagoni scuri sull'equatore + due ai poli
    function stella(cx, cy, r, n, rot) {
      g.beginPath();
      for (let i = 0; i < n; i++) {
        const a = rot + i / n * Math.PI * 2;
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.92;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.closePath(); g.fill();
    }
    g.fillStyle = '#18222c';
    for (let i = 0; i < 5; i++) stella(26 + i * 51, 64, 15, 5, Math.PI / 2 + (i % 2) * 0.6);
    for (let i = 0; i < 5; i++) { stella(51 + i * 51, 16, 12, 5, -Math.PI / 2); stella(51 + i * 51, 112, 12, 5, Math.PI / 2); }
    // cuciture
    g.strokeStyle = 'rgba(24,34,44,.30)'; g.lineWidth = 2;
    for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(i * 51, 0); g.lineTo(i * 51 + 14, 128); g.stroke(); }
    const tx = new THREE.CanvasTexture(c);
    tx.wrapS = THREE.RepeatWrapping; tx.wrapT = THREE.ClampToEdgeWrapping;
    tx.anisotropy = 4;
    return tx;
  }

  function crea(scene, opz) {
    const o = opz || {};
    const NS = 14;                       // punti della scia
    const tex = telaPalla();

    // ── il globo ──────────────────────────────────────────────────────────
    const mat = D3.materialeMondo(
      'attribute vec3 tangente; varying vec3 vW; varying vec3 vN; varying vec2 vUv;\n' +
      'void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; vUv=uv;\n' +
      '  vN=normalize(mat3(modelMatrix)*normal);\n' +
      '  gl_Position=projectionMatrix*viewMatrix*w; }',
      'uniform sampler2D uTex; varying vec3 vW; varying vec3 vN; varying vec2 vUv;\n' +
      'void main(){ vec3 alb=texture2D(uTex,vUv).rgb;\n' +
      // lucido vero: un colpo speculare stretto verso il sole
      '  vec3 n=normalize(vN); vec3 v=normalize(cameraPosition-vW);\n' +
      '  vec3 hv=normalize(v+uSunDir); float sp=pow(max(dot(n,hv),0.0),42.0);\n' +
      '  vec3 col=ombreggiaAttore(alb,n,vW,0.0)+vec3(sp*0.85);\n' +
      '  gl_FragColor=vec4(col,1.0); }',
      { uniforms: { uTex: { value: tex } } });
    const geo = new THREE.SphereGeometry(BR, 16, 12);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    mesh.renderOrder = 4;
    scene.add(mesh);

    // ── la scia: un nastro che guarda la camera ───────────────────────────
    // Un solo draw call, geometria riscritta ogni fotogramma (2 vertici per
    // punto). L'alfa e la larghezza calano verso la coda.
    const sPos = new Float32Array(NS * 2 * 3);
    const sAl = new Float32Array(NS * 2);
    const sGeo = new THREE.BufferGeometry();
    sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
    sGeo.setAttribute('aAl', new THREE.BufferAttribute(sAl, 1));
    const idx = [];
    for (let i = 0; i < NS - 1; i++) {
      const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
      idx.push(a, b, c, b, d, c);
    }
    sGeo.setIndex(idx);
    sGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
    const sMat = D3.materialeMondo(
      'attribute float aAl; varying float vA;\n' +
      'void main(){ vA=aAl; vec4 w=modelMatrix*vec4(position,1.0);\n' +
      '  gl_Position=projectionMatrix*viewMatrix*w; }',
      'varying float vA;\n' +
      'void main(){ if(vA<=0.002) discard; gl_FragColor=vec4(0.94,0.97,1.0,vA); }',
      { transparent: true, depthWrite: false });
    const sMesh = new THREE.Mesh(sGeo, sMat);
    sMesh.frustumCulled = false;
    sMesh.renderOrder = 3;
    scene.add(sMesh);

    // ── stato ─────────────────────────────────────────────────────────────
    const St = {
      x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
      // anello della scia: NS posizioni, la 0 e' la piu' fresca
      tx: new Float64Array(NS), ty: new Float64Array(NS), tz: new Float64Array(NS),
      tn: 0, spin: 0, rotX: 0, rotZ: 0, ultimo: -1,
      sciaOn: true
    };
    const ax = new THREE.Vector3(), q = new THREE.Quaternion();
    const camR = new THREE.Vector3();

    function azzera(x, y, z) {
      St.x = x; St.y = y; St.z = z || 0;
      for (let i = 0; i < NS; i++) { St.tx[i] = x; St.ty[i] = z || 0; St.tz[i] = y; }
      St.tn = 0; St.spin = 0; St.ultimo = -1;
      mesh.quaternion.identity();
    }

    /* posa(b, dt): b = { x, y, vx, vy, z, vz } nelle unita' del motore.
     * x -> mondo x, y -> mondo z, z -> mondo y (la quota). */
    function posa(b, dt) {
      St.x = b.x; St.y = b.y; St.z = b.z;
      St.vx = b.vx; St.vy = b.vy; St.vz = b.vz;
      const wy = BR + b.z;                       // il centro sta sempre BR sopra il suolo
      mesh.position.set(b.x, wy, b.y);

      // rotolamento: asse perpendicolare alla velocita' orizzontale
      const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (sp > 1e-4 && dt > 0) {
        // in aria gira meno (non ha attrito con l'erba)
        const k = b.z > Z_PLAY ? 0.35 : 1.0;
        const ang = sp * dt / BR * k;
        ax.set(-b.vy, 0, b.vx).normalize();       // -y, 0, x  (rotola in avanti)
        q.setFromAxisAngle(ax, ang);
        mesh.quaternion.premultiply(q);
      }

      // scia: un punto nuovo se si e' mossa abbastanza
      const d = Math.hypot(b.x - St.tx[0], b.y - St.tz[0]);
      if (St.ultimo < 0 || d > 0.06) {
        for (let i = NS - 1; i > 0; i--) { St.tx[i] = St.tx[i - 1]; St.ty[i] = St.ty[i - 1]; St.tz[i] = St.tz[i - 1]; }
        St.tx[0] = b.x; St.ty[0] = BR + b.z; St.tz[0] = b.y;
        St.ultimo = 1;
        if (St.tn < NS) St.tn++;
      }
      // la scia si vede solo se la palla corre
      const forza = D3.smooth(2.2, 9.0, sp) * (St.sciaOn ? 1 : 0) * (D3.qualita.cur.scia ? 1 : 0);
      if (forza <= 0.002) { sMesh.visible = false; return; }
      sMesh.visible = true;
      camR.copy(D3.U.uCamR.value);
      const n = St.tn;
      for (let i = 0; i < NS; i++) {
        const k = i < n ? i / (NS - 1) : 1;
        const w = (BR * 0.95) * (1 - k) * (0.35 + 0.65 * forza);
        const px = i < n ? St.tx[i] : St.tx[n - 1 < 0 ? 0 : n - 1];
        const py = i < n ? St.ty[i] : St.ty[n - 1 < 0 ? 0 : n - 1];
        const pz = i < n ? St.tz[i] : St.tz[n - 1 < 0 ? 0 : n - 1];
        const o = i * 6;
        sPos[o] = px - camR.x * w; sPos[o + 1] = py - camR.y * w; sPos[o + 2] = pz - camR.z * w;
        sPos[o + 3] = px + camR.x * w; sPos[o + 4] = py + camR.y * w; sPos[o + 5] = pz + camR.z * w;
        const a = (1 - k) * (1 - k) * 0.42 * forza;
        sAl[i * 2] = a; sAl[i * 2 + 1] = a;
      }
      sGeo.attributes.position.needsUpdate = true;
      sGeo.attributes.aAl.needsUpdate = true;
    }

    return {
      mesh, sMesh, materiale: mat, posa, azzera, St,
      scia(on) { St.sciaOn = !!on; },
      // dove va l'ombra e quanto e' grande: la quota la fa piccola e piu' pallida
      ombraR() { return BR * (1 - 0.22 * Math.min(2.2, St.z)); },
      ombraA() { return 0.42 / (1 + St.z * 0.55); },
      stat() { return { drawCalls: 1 + (sMesh.visible ? 1 : 0), triangoli: 16 * 12 * 2 + (NS - 1) * 2 }; }
    };
  }

  D3.registra('palla', { crea });
})();


</script>
<script>

/* ═══════════════════════════════════════════════════════════════════════════
   DERBY 3D · 40_effetti.js — GLI EFFETTI
   ───────────────────────────────────────────────────────────────────────────
   Tutto a pozzo fisso, zero allocazioni nel fotogramma, due draw call in tutto
   (una per le particelle, una per i segni a terra).
     · particelle — zolle d'erba al calcio, polvere della scivolata, scintille
       del palo, spruzzo della rete, coriandoli del gol, sudore;
     · zolle — i segni della scivolata sul prato, che restano e sbiadiscono;
     · scossa — lo scossone della camera (la regia lo legge);
     · lampo — il bianco del gol e la cornice della squadra che ha segnato.
   Regola ereditata dal derby 2D (DERBY_REVAMP_V2 §4): niente animazioni
   perpetue, niente compositing additivo obbligatorio; ogni effetto vive dentro
   il fotogramma e a regime costa zero.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const THREE = window.THREE, D3 = window.D3;

  const NP = 260;          // particelle
  const NZ = 28;           // segni a terra

  // tipi: [colore r,g,b, vita, gravita, attrito, taglia, emissione]
  const TIPI = {
    erba:       { c: [0.16, 0.42, 0.20], vita: 0.70, g: -7.0, fr: 2.2, r: 0.085, em: 0.0 },
    polvere:    { c: [0.52, 0.55, 0.44], vita: 0.95, g: -1.4, fr: 3.4, r: 0.135, em: 0.0 },
    coriandoli: { c: [1.00, 1.00, 1.00], vita: 2.60, g: -2.6, fr: 1.1, r: 0.105, em: 0.25 },
    scintille:  { c: [1.00, 0.93, 0.62], vita: 0.42, g: -5.0, fr: 3.0, r: 0.065, em: 1.0 },
    spruzzo:    { c: [0.88, 0.93, 0.98], vita: 0.55, g: -4.0, fr: 3.6, r: 0.075, em: 0.30 },
    sudore:     { c: [0.80, 0.90, 1.00], vita: 0.45, g: -6.0, fr: 2.0, r: 0.045, em: 0.15 }
  };

  function crea(scene, opz) {
    const o = opz || {};

    /* ── particelle: quad che guardano la camera, a istanze ───────────────── */
    const pGeo = new THREE.InstancedBufferGeometry();
    pGeo.setAttribute('position', new THREE.Float32BufferAttribute(
      [-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, 1, 0], 3));
    pGeo.setIndex([0, 1, 2, 0, 2, 3]);
    const pP = new Float32Array(NP * 3);        // posizione
    const pC = new Float32Array(NP * 4);        // colore + emissione
    const pS = new Float32Array(NP * 2);        // raggio, alfa
    pGeo.setAttribute('iP', new THREE.InstancedBufferAttribute(pP, 3));
    pGeo.setAttribute('iC', new THREE.InstancedBufferAttribute(pC, 4));
    pGeo.setAttribute('iS', new THREE.InstancedBufferAttribute(pS, 2));
    pGeo.instanceCount = 0;
    pGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
    const pMat = D3.materialeMondo(
      'attribute vec3 iP; attribute vec4 iC; attribute vec2 iS;\n' +
      'varying vec4 vC; varying vec2 vQ;\n' +
      'void main(){ vC=vec4(iC.rgb,iS.y); vQ=position.xy;\n' +
      '  vec3 w=iP + uCamR*(position.x*iS.x) + uCamU*(position.y*iS.x);\n' +
      '  vC.rgb*= (0.55 + 0.75*iC.a);\n' +
      '  gl_Position=projectionMatrix*viewMatrix*vec4(w,1.0); }',
      'varying vec4 vC; varying vec2 vQ;\n' +
      'void main(){ float d=dot(vQ,vQ); if(d>1.0) discard;\n' +
      '  float a=vC.a*(1.0-d*0.55);\n' +
      '  if(a<0.004) discard;\n' +
      '  gl_FragColor=vec4(vC.rgb,a); }',
      { transparent: true, depthWrite: false });
    const pMesh = new THREE.Mesh(pGeo, pMat);
    pMesh.frustumCulled = false;
    pMesh.renderOrder = 6;
    scene.add(pMesh);

    // stato delle particelle (array paralleli: niente oggetti, niente GC)
    const P = {
      x: new Float64Array(NP), y: new Float64Array(NP), z: new Float64Array(NP),
      vx: new Float64Array(NP), vy: new Float64Array(NP), vz: new Float64Array(NP),
      t: new Float64Array(NP), vita: new Float64Array(NP),
      g: new Float64Array(NP), fr: new Float64Array(NP), r: new Float64Array(NP),
      cr: new Float64Array(NP), cg: new Float64Array(NP), cb: new Float64Array(NP),
      em: new Float64Array(NP), viva: new Uint8Array(NP), prossimo: 0
    };

    function nascita() {
      for (let k = 0; k < NP; k++) {
        const i = (P.prossimo + k) % NP;
        if (!P.viva[i]) { P.prossimo = (i + 1) % NP; return i; }
      }
      const i = P.prossimo; P.prossimo = (i + 1) % NP; return i;   // ruba la piu' vecchia
    }

    /* particelle(tipo, x, y, z, n, opz)
     *   x,y = unita' del motore (y diventa z del mondo), z = quota
     *   opz = { dx, dy, v, sparpaglio, colore:[r,g,b], scala } */
    function particelle(tipo, x, y, z, n, opz) {
      const T = TIPI[tipo] || TIPI.polvere;
      const q = opz || {};
      const kq = D3.qualita.cur.particelle;
      n = Math.max(1, Math.round(n * kq));
      const dx = q.dx === undefined ? 0 : q.dx, dy = q.dy === undefined ? 0 : q.dy;
      const v0 = q.v === undefined ? 2.2 : q.v;
      const sp = q.sparpaglio === undefined ? 1.0 : q.sparpaglio;
      const col = q.colore || T.c;
      const sc = q.scala === undefined ? 1 : q.scala;
      for (let k = 0; k < n; k++) {
        const i = nascita();
        const h1 = D3.hash(i * 7 + k, 13), h2 = D3.hash(k * 3 + 1, i + 5), h3 = D3.hash(i + k, 29);
        P.x[i] = x + (h1 - 0.5) * 0.22 * sp;
        P.z[i] = y + (h2 - 0.5) * 0.22 * sp;
        P.y[i] = (z || 0) + 0.04 + h3 * 0.12;
        const a = (h1 - 0.5) * 2.4 * sp, b = (h2 - 0.5) * 2.4 * sp;
        P.vx[i] = dx * v0 + a * v0 * 0.55;
        P.vz[i] = dy * v0 + b * v0 * 0.55;
        P.vy[i] = (0.5 + h3 * 1.1) * v0 * 0.55;
        P.t[i] = 0; P.vita[i] = T.vita * (0.7 + h3 * 0.6);
        P.g[i] = T.g; P.fr[i] = T.fr; P.r[i] = T.r * sc * (0.7 + h1 * 0.7);
        if (tipo === 'coriandoli' && q.colore === undefined) {
          const t2 = D3.PAL.tinte[(i + k) % D3.PAL.tinte.length];
          const c3 = D3.hex3(t2); P.cr[i] = c3[0]; P.cg[i] = c3[1]; P.cb[i] = c3[2];
        } else { P.cr[i] = col[0]; P.cg[i] = col[1]; P.cb[i] = col[2]; }
        P.em[i] = T.em;
        P.viva[i] = 1;
      }
    }

    /* ── segni a terra (le zolle della scivolata) ─────────────────────────── */
    const zGeo = new THREE.InstancedBufferGeometry();
    zGeo.setAttribute('position', new THREE.Float32BufferAttribute(
      [-0.5, 0, -0.5, 0.5, 0, -0.5, 0.5, 0, 0.5, -0.5, 0, 0.5], 3));
    zGeo.setIndex([0, 1, 2, 0, 2, 3]);
    const zP = new Float32Array(NZ * 4);        // x, z, cos, sin
    const zS = new Float32Array(NZ * 3);        // lunghezza, larghezza, alfa
    zGeo.setAttribute('iP', new THREE.InstancedBufferAttribute(zP, 4));
    zGeo.setAttribute('iS', new THREE.InstancedBufferAttribute(zS, 3));
    zGeo.instanceCount = 0;
    zGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
    const zMat = D3.materialeMondo(
      'attribute vec4 iP; attribute vec3 iS; varying vec2 vQ; varying float vA; varying vec3 vW;\n' +
      'void main(){ vQ=position.xz*2.0; vA=iS.z;\n' +
      '  float lx=position.x*iS.x, lz=position.z*iS.y;\n' +
      '  vec3 w=vec3(iP.x + lx*iP.z - lz*iP.w, 0.012, iP.y + lx*iP.w + lz*iP.z);\n' +
      '  vW=w; gl_Position=projectionMatrix*viewMatrix*vec4(w,1.0); }',
      'varying vec2 vQ; varying float vA; varying vec3 vW;\n' +
      'void main(){ float d=dot(vQ,vQ); if(d>1.0||vA<0.004) discard;\n' +
      '  float a=vA*(1.0-d*0.8);\n' +
      '  gl_FragColor=vec4(0.06,0.13,0.07,a*luce(vW)); }',
      { transparent: true, depthWrite: false });
    const zMesh = new THREE.Mesh(zGeo, zMat);
    zMesh.frustumCulled = false;
    zMesh.renderOrder = 2;
    scene.add(zMesh);
    const Z = { x: new Float64Array(NZ), z: new Float64Array(NZ), c: new Float64Array(NZ),
                s: new Float64Array(NZ), L: new Float64Array(NZ), W: new Float64Array(NZ),
                t: new Float64Array(NZ), viva: new Uint8Array(NZ), prossimo: 0 };
    const Z_VITA = 11.0;

    /* zolla(x, y, dx, dy, lung) — uno strappo d'erba lungo la direzione */
    function zolla(x, y, dx, dy, lung) {
      const i = Z.prossimo; Z.prossimo = (i + 1) % NZ;
      const d = Math.hypot(dx, dy) || 1;
      Z.x[i] = x; Z.z[i] = y;
      Z.c[i] = dx / d; Z.s[i] = dy / d;
      Z.L[i] = lung || 1.1; Z.W[i] = 0.30;
      Z.t[i] = 0; Z.viva[i] = 1;
    }

    /* ── scossa della camera ──────────────────────────────────────────────── */
    const Sc = { a: 0, t: 0 };
    function scossa(forza) { Sc.a = Math.max(Sc.a, Math.min(1.2, forza)); }
    // la regia chiama questo e sposta la camera di (dx, dy) in pixel-mondo
    function scossaVal(t) {
      if (Sc.a <= 0.001) return 0;
      return Sc.a * Math.sin(t * 61.0) * 0.5 + Sc.a * Math.sin(t * 37.0 + 1.7) * 0.5;
    }

    /* ── lampo del gol ────────────────────────────────────────────────────── */
    const La = { r: 1, g: 1, b: 1, a: 0, dur: 0.5 };
    function lampo(col, forza, dur) {
      const c = col ? D3.hex3(col) : [1, 1, 1];
      La.r = c[0]; La.g = c[1]; La.b = c[2];
      La.a = Math.max(La.a, forza === undefined ? 1 : forza);
      La.dur = dur || 0.5;
    }

    /* ── il fotogramma ────────────────────────────────────────────────────── */
    function aggiorna(dt, t) {
      if (dt > 0.1) dt = 0.1;
      // particelle
      let n = 0;
      for (let i = 0; i < NP; i++) {
        if (!P.viva[i]) continue;
        P.t[i] += dt;
        if (P.t[i] >= P.vita[i]) { P.viva[i] = 0; continue; }
        P.vy[i] += P.g[i] * dt;
        const f = Math.max(0, 1 - P.fr[i] * dt);
        P.vx[i] *= f; P.vz[i] *= f;
        P.x[i] += P.vx[i] * dt; P.z[i] += P.vz[i] * dt; P.y[i] += P.vy[i] * dt;
        if (P.y[i] < 0.02) { P.y[i] = 0.02; P.vy[i] = -P.vy[i] * 0.32; P.vx[i] *= 0.6; P.vz[i] *= 0.6; }
        const k = 1 - P.t[i] / P.vita[i];
        const o3 = n * 3, o4 = n * 4, o2 = n * 2;
        pP[o3] = P.x[i]; pP[o3 + 1] = P.y[i]; pP[o3 + 2] = P.z[i];
        pC[o4] = P.cr[i]; pC[o4 + 1] = P.cg[i]; pC[o4 + 2] = P.cb[i]; pC[o4 + 3] = P.em[i];
        pS[o2] = P.r[i] * (0.55 + 0.45 * k); pS[o2 + 1] = k * k * 0.92;
        n++;
      }
      pGeo.instanceCount = n;
      pMesh.visible = n > 0;
      if (n > 0) {
        pGeo.attributes.iP.needsUpdate = true;
        pGeo.attributes.iC.needsUpdate = true;
        pGeo.attributes.iS.needsUpdate = true;
      }
      // zolle
      let m = 0;
      for (let i = 0; i < NZ; i++) {
        if (!Z.viva[i]) continue;
        Z.t[i] += dt;
        if (Z.t[i] >= Z_VITA) { Z.viva[i] = 0; continue; }
        const k = 1 - Z.t[i] / Z_VITA;
        const o4 = m * 4, o3 = m * 3;
        zP[o4] = Z.x[i]; zP[o4 + 1] = Z.z[i]; zP[o4 + 2] = Z.c[i]; zP[o4 + 3] = Z.s[i];
        zS[o3] = Z.L[i]; zS[o3 + 1] = Z.W[i]; zS[o3 + 2] = 0.34 * k;
        m++;
      }
      zGeo.instanceCount = m;
      zMesh.visible = m > 0;
      if (m > 0) { zGeo.attributes.iP.needsUpdate = true; zGeo.attributes.iS.needsUpdate = true; }
      // scossa
      if (Sc.a > 0) { Sc.a -= dt * 3.4; if (Sc.a < 0) Sc.a = 0; }
      // lampo
      if (La.a > 0) {
        La.a -= dt / La.dur;
        if (La.a < 0) La.a = 0;
      }
      const u = D3.U.uGol.value;
      u.set(La.r, La.g, La.b, La.a * La.a * 0.9);
    }

    function azzera() {
      for (let i = 0; i < NP; i++) P.viva[i] = 0;
      for (let i = 0; i < NZ; i++) Z.viva[i] = 0;
      Sc.a = 0; La.a = 0;
      pGeo.instanceCount = 0; zGeo.instanceCount = 0;
      D3.U.uGol.value.set(1, 1, 1, 0);
    }

    return {
      particelle, zolla, scossa, scossaVal, lampo, aggiorna, azzera,
      pMesh, zMesh,
      stat() { return { drawCalls: (pMesh.visible ? 1 : 0) + (zMesh.visible ? 1 : 0),
                        particelle: pGeo.instanceCount, zolle: zGeo.instanceCount }; }
    };
  }

  D3.registra('effetti', { crea, TIPI });
})();

<script>

/* ═══════════════════════════════════════════════════════════════════════════
   DERBY 3D · 50_regia.js — LA CAMERA
   ───────────────────────────────────────────────────────────────────────────
   Il vincolo piu' duro del mandato: «una camera che segue l'azione senza dare
   la nausea». La nausea nei giochi dall'alto viene da tre cose, e qui sono
   tolte tutte e tre:
     1. la camera che GIRA. Qui non gira mai durante la partita: l'imbardata
        e' fissa e dipende solo da quale porta e' la tua e da come tieni il
        telefono. La TUA porta e' sempre in basso (in verticale) o a sinistra
        (in orizzontale) — la stessa regola del derby 2D (blgW2S).
     2. la camera che inSEGUE ogni passo. Qui c'e' una zona morta: dentro 0,55
        unita' la camera non si muove per niente, e fuori si muove smorzata.
     3. la camera che esce dal campo o si stringe troppo. Qui il bersaglio e'
        sempre tagliato dentro i bordi del campo, e sul calcio d'inizio e sul
        gol si allarga da sola.
   Due modi, che il giocatore puo' cambiare:
     · SEGUE — segue l'azione (piu' vicino, piu' cinematografico);
     · LARGA — tutto il campo sempre dentro lo schermo, la camera non si muove.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const THREE = window.THREE, D3 = window.D3;

  function crea(camera, opz) {
    const o = opz || {};
    const R = {
      W: o.W || 16, H: o.H || 9,
      squadra: o.squadra || 0,          // la mia squadra: decide dov'e' la mia porta
      orizzontale: false, pc: false,
      modo: o.modo || 'segue',          // 'segue' | 'larga'
      // bersaglio
      tx: (o.W || 16) / 2, tz: (o.H || 9) / 2,
      cx: (o.W || 16) / 2, cz: (o.H || 9) / 2,
      largo: 12, largoT: 12,
      yaw: 0, yawT: 0,
      pitch: 58, pitchT: 58,
      // quanto si allarga per un attimo (calcio d'inizio, gol)
      apri: 0,
      // zoom lento del gol
      micro: 0,
      fov: 30, aspect: 1,
      // la scossa arriva da fuori
      scossa: 0, scossaAng: 0,
      // LA SCENA DEL GOL: per un attimo la camera va su chi ha segnato
      scX: 0, scZ: 0, scLargo: 7, scT: 0, scDur: 0
    };

    const AVANTI = 0.26;         // sguardo in avanti sulla velocita' della palla
    const ZONA = 0.55;           // zona morta in unita'
    const K_SEGUE = 3.2;         // quanto e' pronta la camera (1/s)
    const K_LARGO = 2.4;

    /* L'IMBARDATA — quattro casi e basta, e dentro la partita non cambia mai.
     * La camera guarda verso (cos(yaw), -sin(yaw)) nel piano; con
     * l'inclinazione, «in alto sullo schermo» diventa quella direzione.
     *   verticale  squadra 0 (difende x=0, attacca +X): yaw 0      -> su = +X
     *   verticale  squadra 1 (difende x=W, attacca -X): yaw pi     -> su = -X
     *   orizzontale squadra 0: yaw +pi/2 -> destra = +X (mia porta a sinistra)
     *   orizzontale squadra 1: yaw -pi/2 -> destra = -X (mia porta a sinistra)
     * Verificato a mano sulla matrice di THREE.lookAt con up = (0,1,0). */
    function imbardata() {
      if (!R.orizzontale) return R.squadra === 0 ? 0 : Math.PI;
      return R.squadra === 0 ? Math.PI / 2 : -Math.PI / 2;
    }

    /* Imposta il campo (arriva da map_info) */
    R.campo = function (W, H) {
      R.W = W; R.H = H;
      R.tx = W / 2; R.tz = H / 2; R.cx = W / 2; R.cz = H / 2;
    };

    /* La mia squadra (0 o 1). Cambia solo fra le partite. */
    R.mia = function (tm) {
      R.squadra = tm | 0;
      R.yaw = imbardata(); R.yawT = R.yaw;
    };

    /* Computer o telefono? Su uno schermo grande si vede piu' campo. */
    R.schermo = function (pc) { R.pc = !!pc; };

    /* Il telefono e' girato? Chiamalo al cambio di orientamento. */
    R.gira = function (oriz) {
      if (R.orizzontale === !!oriz) return;
      R.orizzontale = !!oriz;
      R.yawT = imbardata();
      R.pitchT = R.orizzontale ? 50 : 58;
    };

    /* LA SCENA. Per `secondi` la camera lascia la palla e va su un punto —
     * si usa per il gol. E' l'unico momento in cui la camera fa di testa sua,
     * e lo fa a palla ferma (il motore congela 1,5 s dopo un gol), quindi non
     * puo' dare fastidio a chi sta giocando: non c'e' niente da giocare. */
    R.scena = function (x, z, largo, secondi) {
      R.scX = x; R.scZ = z; R.scLargo = largo || 7;
      R.scDur = secondi || 1.5; R.scT = R.scDur;
    };
    R.scenaFinita = function () { R.scT = 0; };

    /* Allarga per un attimo (calcio d'inizio, gol, fine) */
    R.allarga = function (quanto, secondi) { R.apri = Math.max(R.apri, quanto); R._apriT = secondi || 2.2; };
    /* Lo zoomino del gol: si stringe di poco e torna */
    R.microZoom = function (k) { R.micro = k; };

    R.cambiaModo = function () { R.modo = R.modo === 'segue' ? 'larga' : 'segue'; return R.modo; };

    /* quante unita' di mondo stanno in larghezza perche' TUTTO il campo entri.
     * Attenzione all'inclinazione: guardando il prato di sbieco, lungo l'asse
     * «in su» dello schermo ci sta di piu' che in larghezza diviso il rapporto
     * (di 1/sin(inclinazione)). Senza questa correzione la camera si allarga
     * troppo e il campo resta minuscolo in mezzo allo schermo. */
    function largoIntero(aspect) {
      const a = Math.min(aspect, 3.2);
      const Lw = R.orizzontale ? R.W : R.H;     // cosa va in larghezza
      const Ll = R.orizzontale ? R.H : R.W;     // cosa va in altezza
      const sp = Math.sin(THREE.MathUtils.degToRad(R.pitch));
      return Math.max(Lw * 1.10, Ll * 1.08 * a * sp);
    }

    /* passo(dt, st)
     *   st = { bx, bz, bvx, bvz,      la palla (unita' motore: bz = y)
     *          mx, mz,                io (o null)
     *          fermo,                 true = calcio d'inizio / fine: si allarga
     *          scossa }               ampiezza dello scossone (da 40_effetti) */
    R.passo = function (dt, st, aspect) {
      if (dt > 0.1) dt = 0.1;
      R.aspect = aspect;
      const intero = largoIntero(aspect);

      // ── il bersaglio ────────────────────────────────────────────────────
      if (R.scT > 0) { R.scT -= dt; if (R.scT < 0) R.scT = 0; }
      let bx, bz;
      if (R.scT > 0) { bx = R.scX; bz = R.scZ; }
      else if (R.modo === 'larga' || st.fermo) {
        bx = R.W / 2; bz = R.H / 2;
      } else {
        // 70% palla, 30% me: la palla comanda, ma non ti perdi mai di vista
        const px = st.bx + st.bvx * AVANTI, pz = st.bz + st.bvz * AVANTI;
        if (st.mx === null || st.mx === undefined) { bx = px; bz = pz; }
        else { bx = px * 0.70 + st.mx * 0.30; bz = pz * 0.70 + st.mz * 0.30; }
      }
      // zona morta: dentro ZONA la camera sta ferma (e' il rimedio n.1).
      // Nella scena del gol la zona morta non c'e': e' uno stacco voluto.
      const dd = Math.hypot(bx - R.tx, bz - R.tz);
      if (R.scT > 0) { R.tx = bx; R.tz = bz; }
      else if (dd > ZONA) {
        const k = (dd - ZONA) / dd;
        R.tx += (bx - R.tx) * k;
        R.tz += (bz - R.tz) * k;
      }

      // ── la larghezza ────────────────────────────────────────────────────
      if (R.apri > 0) { R.apri -= dt / (R._apriT || 2.2); if (R.apri < 0) R.apri = 0; }
      let lt;
      if (R.modo === 'larga') lt = intero;
      else {
        /* QUANTO SI STRINGE. Il derby 2D usa 1,6 (RTD_G.calcio.cam.z), ma
         * quello e' pensato per un telefono. Su uno schermo da computer 1,6
         * vuol dire vedere sei unita' di campo su sedici: sembra di giocare
         * col naso attaccato al prato (misurato: a 1280x720 si vedeva dal
         * cerchio di centro all'area, e basta).
         * La regola: il calciatore deve restare alto una quarantina di pixel
         * — il metro che si usa in questo progetto. Quindi su schermo grande
         * si allarga fin quasi a tutto il campo, sul telefono ci si stringe
         * un po' di piu'. */
        lt = intero / (R.pc ? 1.05 : 1.25);
        if (lt < 8.0) lt = 8.0;                    // mai piu' stretti di 8 unita'
        if (lt > intero) lt = intero;
        lt = lt + (intero - lt) * R.apri;          // il calcio d'inizio e' largo
        lt *= 1 - 0.05 * R.micro;                  // lo zoomino del gol
      }
      if (R.scT > 0) {
        // la scena si stringe e poi si riapre da sola sull'ultimo mezzo secondo
        const k = R.scT > 0.5 ? 1 : R.scT / 0.5;
        lt = lt + (Math.min(R.scLargo, lt) - lt) * k;
      }
      R.largoT = lt;
      // durante la scena la camera e' piu' pronta: e' un taglio, non un inseguimento
      R.largo = D3.damp(R.largo, R.largoT, R.scT > 0 ? 4.2 : K_LARGO, dt);
      if (R.micro > 0) { R.micro -= dt * 1.6; if (R.micro < 0) R.micro = 0; }

      // ── i bordi: il bersaglio non porta mai la camera fuori dal campo ────
      // margine: mezza vista, piu' un filo di tribuna
      const a = Math.min(aspect, 3.2);
      const visW = R.largo;
      const visH = R.largo / a / Math.sin(THREE.MathUtils.degToRad(R.pitch));
      const halfX = (R.orizzontale ? visW : visH) / 2;   // meta' vista sull'asse X del mondo
      const halfZ = (R.orizzontale ? visH : visW) / 2;   // meta' vista sull'asse Z del mondo
      const bordo = 0.9;                                  // quanta tribuna si accetta
      const minX = Math.min(R.W / 2, halfX - bordo), maxX = Math.max(R.W / 2, R.W - halfX + bordo);
      const minZ = Math.min(R.H / 2, halfZ - bordo), maxZ = Math.max(R.H / 2, R.H - halfZ + bordo);
      const gx = D3.clamp(R.tx, minX, maxX);
      const gz = D3.clamp(R.tz, minZ, maxZ);
      R.cx = D3.damp(R.cx, gx, K_SEGUE, dt);
      R.cz = D3.damp(R.cz, gz, K_SEGUE, dt);

      // ── imbardata e inclinazione: si muovono SOLO quando giri il telefono ─
      const dy = D3.angDiff(R.yaw, R.yawT);
      if (Math.abs(dy) > 1e-4) R.yaw += dy * (1 - Math.exp(-9 * dt));
      R.pitch = D3.damp(R.pitch, R.pitchT, 7, dt);

      // ── la camera ───────────────────────────────────────────────────────
      const p = THREE.MathUtils.degToRad(R.pitch);
      const dist = R.largo / (2 * Math.tan(THREE.MathUtils.degToRad(R.fov) / 2) * a);
      // la scossa: sposta il PUNTO GUARDATO, non l'imbardata (non gira niente)
      let sx = 0, sz = 0;
      if (st.scossa) {
        R.scossaAng += dt * 47;
        sx = Math.cos(R.scossaAng) * st.scossa * 0.11;
        sz = Math.sin(R.scossaAng * 1.37) * st.scossa * 0.11;
      }
      /* LO SCARTO PER I POLLICI.
       * I tre tasti stanno a destra e la levetta a sinistra in basso: su un
       * telefono in orizzontale coprono circa un quinto dello schermo a destra,
       * e in verticale l'angolo in basso. Se la camera tiene l'azione esatta-
       * mente al centro, la palla finisce sotto il tasto TIRA proprio quando
       * stai attaccando (misurato guardando le foto: succedeva ogni volta che
       * l'azione andava verso la porta avversaria).
       * Si sposta il PUNTO GUARDATO, non l'imbardata: il soggetto scivola un
       * po' a sinistra (in orizzontale) e un po' in alto (in verticale), e i
       * tasti restano su prato vuoto. Sul computer non serve: niente tasti. */
      const dxS = R.pc ? 0 : (R.orizzontale ? 0.115 : 0.0);
      const dyS = R.pc ? 0 : (R.orizzontale ? 0.0 : 0.075);
      let ox = 0, oz = 0;
      if (dxS || dyS) {
        const cy = Math.cos(R.yaw), sy2 = Math.sin(R.yaw);
        // destra dello schermo nel mondo = (sin yaw, cos yaw); su = (cos yaw, -sin yaw)
        ox = sy2 * (visW * dxS) + cy * (-visH * dyS);
        oz = cy * (visW * dxS) - sy2 * (-visH * dyS);
      }
      const lx = R.cx + sx + ox, lz = R.cz + sz + oz;
      // direzione «indietro» della camera nel piano, secondo l'imbardata
      const bxv = -Math.cos(R.yaw), bzv = Math.sin(R.yaw);
      camera.fov = R.fov;
      camera.aspect = aspect;
      camera.position.set(lx + bxv * Math.cos(p) * dist,
                          Math.sin(p) * dist,
                          lz + bzv * Math.cos(p) * dist);
      camera.up.set(0, 1, 0);
      camera.lookAt(lx, 0, lz);
      camera.near = Math.max(0.3, dist - 30);
      camera.far = dist + 140;
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();
      D3.U.uCamR.value.setFromMatrixColumn(camera.matrixWorld, 0);
      D3.U.uCamU.value.setFromMatrixColumn(camera.matrixWorld, 1);
      R.dist = dist;
    };

    /* mondo -> schermo, per i cartellini (numeri, nomi, il cuneo «sei tu») */
    const V = new THREE.Vector3();
    R.aSchermo = function (x, y, z, w, h) {
      V.set(x, y, z).project(camera);
      return [(V.x * 0.5 + 0.5) * w, (-V.y * 0.5 + 0.5) * h, V.z];
    };

    /* quante unita' di mondo vale un pixel (per scrivere testi della misura giusta) */
    R.unitaPerPixel = function (w) { return R.largo / w; };

    R.mia(R.squadra);
    return R;
  }

  D3.registra('regia', { crea });
})();

<script>

/* ═══════════════════════════════════════════════════════════════════════════
   DERBY 3D · 65_suono.js — IL SUONO, TUTTO SINTETIZZATO
   ───────────────────────────────────────────────────────────────────────────
   Nessun file audio: niente da scaricare, la demo resta un file solo. Tutto
   con WebAudio, come nelle demo del biliardo e della boxe. Il contesto nasce
   al PRIMO TOCCO (nelle webview parte sospeso).
   Il coro del pubblico e' un rumore filtrato che «respira» con il calore della
   partita: e' la cosa che da' piu' atmosfera e costa meno.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const D3 = window.D3;

  function crea() {
    let A = null, master = null, coro = null, coroG = null, coroF = null, rumore = null;
    const S = { acceso: true, pronto: false, caldo: 0, gesto: false };
    // Chrome rifiuta navigator.vibrate finche' nessuno ha toccato la pagina, e
    // lo scrive in console come ERRORE. Quindi si aspetta il primo tocco vero.
    try {
      const primo = function () { S.gesto = true; };
      window.addEventListener('pointerdown', primo, { once: true, capture: true });
      window.addEventListener('keydown', primo, { once: true, capture: true });
    } catch (_) { }

    function buffRumore(sec) {
      const n = Math.floor(A.sampleRate * sec);
      const b = A.createBuffer(1, n, A.sampleRate);
      const d = b.getChannelData(0);
      let v = 0;
      for (let i = 0; i < n; i++) { v = v * 0.86 + (Math.random() * 2 - 1) * 0.14; d[i] = v * 3.2; }
      return b;
    }

    function avvia() {
      if (S.pronto) { if (A.state === 'suspended') A.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { S.acceso = false; return; }
      A = new AC();
      master = A.createGain(); master.gain.value = 0.85; master.connect(A.destination);
      rumore = buffRumore(3.0);
      // il coro: rumore in anello, passa-banda che si apre col calore
      coro = A.createBufferSource(); coro.buffer = rumore; coro.loop = true;
      coroF = A.createBiquadFilter(); coroF.type = 'bandpass'; coroF.frequency.value = 420; coroF.Q.value = 0.8;
      coroG = A.createGain(); coroG.gain.value = 0.0;
      coro.connect(coroF); coroF.connect(coroG); coroG.connect(master);
      coro.start();
      S.pronto = true;
    }

    function env(g, a, d, v) {
      const t = A.currentTime;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    }

    function tono(f, f2, a, d, v, tipo) {
      if (!S.pronto || !S.acceso) return;
      const os = A.createOscillator(), g = A.createGain();
      os.type = tipo || 'sine';
      os.frequency.setValueAtTime(f, A.currentTime);
      if (f2 && f2 !== f) os.frequency.exponentialRampToValueAtTime(Math.max(20, f2), A.currentTime + a + d);
      os.connect(g); g.connect(master);
      env(g, a, d, v);
      os.start(); os.stop(A.currentTime + a + d + 0.05);
    }

    function botta(f, q, d, v) {
      if (!S.pronto || !S.acceso) return;
      const s = A.createBufferSource(); s.buffer = rumore;
      const fl = A.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = q || 1.2;
      const g = A.createGain();
      s.connect(fl); fl.connect(g); g.connect(master);
      env(g, 0.004, d, v);
      s.start(); s.stop(A.currentTime + d + 0.1);
    }

    S.avvia = avvia;
    S.interruttore = function (on) {
      S.acceso = on === undefined ? !S.acceso : !!on;
      if (master) master.gain.value = S.acceso ? 0.85 : 0;
      return S.acceso;
    };

    /* il calore del pubblico: 0..1 */
    S.calore = function (k, dt) {
      S.caldo = D3.damp(S.caldo, D3.clamp(k, 0, 1), 2.2, dt || 0.016);
      if (!S.pronto || !S.acceso) return;
      coroG.gain.value = 0.020 + 0.090 * S.caldo;
      coroF.frequency.value = 380 + 520 * S.caldo;
      coroF.Q.value = 0.9 - 0.35 * S.caldo;
    };

    /* gli effetti, uno per evento del gioco */
    S.sfx = function (k, v) {
      if (!S.pronto || !S.acceso) return;
      v = v === undefined ? 1 : v;
      switch (k) {
        case 'passaggio': botta(720, 1.4, 0.075, 0.30 * v); tono(180, 90, 0.005, 0.07, 0.16 * v, 'triangle'); break;
        case 'tiro': botta(420, 0.9, 0.13, 0.52 * v); tono(150, 62, 0.004, 0.13, 0.34 * v, 'triangle'); break;
        case 'cross': botta(540, 1.1, 0.10, 0.34 * v); tono(210, 150, 0.006, 0.16, 0.14 * v, 'sine'); break;
        case 'tocco': botta(880, 1.8, 0.05, 0.18 * v); break;
        case 'sponda': botta(320, 0.7, 0.09, 0.26 * v); break;
        case 'palo': tono(1180, 620, 0.002, 0.42, 0.40 * v, 'square'); botta(1600, 3.0, 0.08, 0.22 * v); break;
        case 'rete': botta(2400, 0.5, 0.20, 0.20 * v); break;
        case 'scivolata': botta(240, 0.5, 0.26, 0.24 * v); break;
        case 'fallo': botta(180, 0.6, 0.18, 0.30 * v); tono(90, 55, 0.005, 0.2, 0.2 * v, 'sawtooth'); break;
        case 'nokick': botta(300, 2.2, 0.06, 0.16 * v); break;
        case 'parata': botta(600, 0.8, 0.14, 0.34 * v); tono(260, 180, 0.006, 0.12, 0.14 * v); break;
        case 'fischio':
          tono(2450, 2500, 0.012, 0.26, 0.24 * v, 'square');
          tono(3100, 3150, 0.014, 0.24, 0.13 * v, 'square');
          break;
        case 'fischio3':
          for (let i = 0; i < 3; i++) setTimeout(() => S.sfx('fischio', v), i * 190);
          break;
        case 'boato':
          if (!S.pronto) return;
          {
            const s = A.createBufferSource(); s.buffer = rumore; s.loop = true;
            const fl = A.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 700; fl.Q.value = 0.55;
            const g = A.createGain(); s.connect(fl); fl.connect(g); g.connect(master);
            const t = A.currentTime;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.26 * v, t + 0.12);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 2.1);
            fl.frequency.setValueAtTime(520, t);
            fl.frequency.linearRampToValueAtTime(1150, t + 0.5);
            s.start(); s.stop(t + 2.3);
          }
          break;
        case 'delusione':
          {
            const s = A.createBufferSource(); s.buffer = rumore; s.loop = true;
            const fl = A.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 340;
            const g = A.createGain(); s.connect(fl); fl.connect(g); g.connect(master);
            const t = A.currentTime;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.13 * v, t + 0.2);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
            s.start(); s.stop(t + 1.6);
          }
          break;
      }
    };

    /* la carica del tiro: un tono che sale (si accende e si spegne) */
    let cOs = null, cG = null;
    S.carica = function (k) {
      if (!S.pronto || !S.acceso) { return; }
      if (k <= 0.001) {
        if (cOs) { try { cG.gain.setTargetAtTime(0.0001, A.currentTime, 0.03); cOs.stop(A.currentTime + 0.12); } catch (_) { } cOs = null; cG = null; }
        return;
      }
      if (!cOs) {
        cOs = A.createOscillator(); cG = A.createGain();
        cOs.type = 'sawtooth'; cG.gain.value = 0.0001;
        const fl = A.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 900;
        cOs.connect(fl); fl.connect(cG); cG.connect(master);
        cOs.start();
      }
      cOs.frequency.setTargetAtTime(120 + 300 * k, A.currentTime, 0.04);
      cG.gain.setTargetAtTime(0.020 + 0.045 * k, A.currentTime, 0.05);
    };

    S.haptic = function (kind) {
      try {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.HapticFeedback) { tg.HapticFeedback.impactOccurred(kind || 'light'); return; }
        if (S.gesto && navigator.vibrate) navigator.vibrate(kind === 'heavy' ? 26 : kind === 'medium' ? 14 : 8);
      } catch (_) { }
    };

    return S;
  }

  D3.registra('suono', { crea });
})();

<script>

/* ═══════════════════════════════════════════════════════════════════════════
   DERBY 3D · 90_ponte.js — window.BLG3D: il ponte fra index.html e il 3D
   ───────────────────────────────────────────────────────────────────────────
   DERIVATO DA: _levelup/gcr3d/p1/src/90_ponte.js (GAMBLER CITY 3D). Stessa
   forma, stesse regole, stesso patto di caduta.

   LA REGOLA CHE COMANDA TUTTO: **IL MOTORE NON SI TOCCA.**
   `football_rt.py` resta l'unica autorita'. Questo file non simula niente, non
   apre nessuna connessione, non manda nessun messaggio al server. Disegna
   quello che il 2D disegnava, leggendo gli STESSI dati.

   CHI FA CHE COSA
     il PADRE (index.html)   rete, lobby, soldi, HUD, levetta e tre tasti,
                             interpolazione (rtdLerp), predizione (blgPredStep),
                             telecronaca, timbri, suoni, telemetria (clog).
     l'IFRAME (questo)       una tela WebGL. Nessun ascoltatore di dita, nessun
                             HUD, nessun comando, nessun suono (salvo richiesta).

   L'iframe sta sulla STESSA ORIGINE del padre (Pages: derby3d.html accanto a
   index.html), quindi il padre chiama direttamente
   `iframe.contentWindow.BLG3D`: nessun postMessage, nessuna copia dello stato.
   E' il precedente gia' in produzione di gcr3d.html.

   ═══ IL CONTRATTO ═════════════════════════════════════════════════════════
   BLG3D.versione            stringa
   BLG3D.pronto              true quando WebGL2 e' su (subito dopo il carico)
   BLG3D.errore              null | stringa. Se non e' null il padre torna al 2D
   BLG3D.caricando           true finche' i programmi della GPU non sono legati:

                   colPortiere }           dentro la pagina, devono restare

       }

   BLG3D.fotogramma(now, dt, st)
       Da chiamare nel giro del padre DOPO l'interpolazione e la predizione, al
       posto del disegno sulla tela. `st` e' lo stato GIA' INTERPOLATO, un
       oggetto che il padre RIUSA a ogni fotogramma (zero allocazioni):
         st.n              quanti calciatori validi in st.righe
         st.righe[i] = {
             pid           chi e'
             x, y          posizione interpolata, in unita' di MONDO del motore
             fx, fy        dove guarda (versore)
             vel           modulo della velocita' (per la corsa)

             ch            carica 0..1

         st.bx, st.by, st.bz, st.bvx, st.bvy, st.bvz     la palla (z vero)
         st.gw            larghezza delle porte ADESSO (il gw vero del server)
         st.freeze        true durante il congelamento del calcio d'inizio

   BLG3D.evento(e)         un evento del feed del SERVER, uno per chiamata, per

   BLG3D.bordi(t,r,b,l)    i bordi di sistema. DENTRO L'IFRAME env(safe-area)
                           VALE ZERO (memoria «Bordi di sistema dentro
                           l'iframe»): li misura il padre e li passa qui.
   BLG3D.lingua(l)         'it' | 'en'
   BLG3D.orientamento(oriz, pc)   telefono girato / schermo da scrivania
   BLG3D.camera(modo)      'segue' | 'larga' (il tasto e' del padre)
   BLG3D.schermo()         dove sono ADESSO sullo schermo le teste e la punta

                           numeri e freccia sopra un 3D che li ha spostati:
                           { cart:[{x,y,vis,num,tm,gk,io,pos,k}], io:[x,y],
                             mira:[x,y]|null, w, h }
   BLG3D.ferma()           fine partita: smette di disegnare
   BLG3D.libera()          butta la scena (l'iframe resta vivo per la prossima)
   BLG3D.info()            { fps, lavoro_p50, lavoro_p95, intervallo_p95,
                             stalli50, calls, tris, programmi, qualita, pr }
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const D3 = window.D3, THREE = window.THREE;
  const BLG3D = window.BLG3D = {
    versione: 'p1-20260920', pronto: false, errore: null, perso: false, caricando: false
  };
  D3.ponte = BLG3D;

  const cv = document.getElementById('cv3d');
  let renderer = null;
  try {
    const t = document.createElement('canvas').getContext('webgl2');
    if (!t) throw new Error('WebGL2 assente');
    const lc = t.getExtension('WEBGL_lose_context'); if (lc) lc.loseContext();
    renderer = new THREE.WebGLRenderer({
      canvas: cv, antialias: false, powerPreference: 'high-performance',
      preserveDrawingBuffer: false, alpha: false
    });
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    renderer.setClearColor(D3.PAL.fuori);
    renderer.info.autoReset = true;
    BLG3D.pronto = true;
    /* Telefono che perde il contesto (memoria, app in secondo piano): il padre
       torna al 2D al primo fotogramma (fotogramma lancia -> blg3dCade). Un
       giocatore a soldi non deve restare con lo schermo nero. */
    cv.addEventListener('webglcontextlost', function (ev) {
      ev.preventDefault(); BLG3D.perso = true; BLG3D.errore = 'WebGL: contesto perso';
    }, false);
  } catch (e) { BLG3D.errore = String((e && e.message) || e); }

  const Q = D3.qualita;
  if (D3.qp('q')) {
    const i = Q.livelli.findIndex(l => l.nome === D3.qp('q'));
    if (i >= 0) { Q.i = i; Q.bloccata = true; }
  }

  let S = null;                 // la partita in corso
  const perf = { n: 0, ms: 0, max: 0, t: 0, fps: 0, lavoro: [], intervalli: [], ultimo: 0 };
  D3.perf = perf;
  const elPerf = document.getElementById('perf');
  let mostraPerf = D3.qb('perf');
  if (elPerf) elPerf.hidden = !mostraPerf;

  // i bordi di sistema: dentro l'iframe li sa solo il padre
  const BORDI = { t: 0, r: 0, b: 0, l: 0 };

  /* ── memoria di un calciatore fra un fotogramma e l'altro ────────────────
     Serve per le POSE: il motore non manda «ha iniziato a scivolare», manda il
     BIT della scivolata. La partenza si riconosce dal bit che si accende.
     E' la stessa lettura che fa `ricorda()`/`guarda()` in 70_partita.js, solo
     che li' si guardava il motore e qui si guardano i bit dello snapshot. */
  function nuovaMem() {
    return { fl: 0, kick: null, eventi: {}, visto: 0 };
  }

  function libera() {
    BLG3D.caricando = false;
    if (!S) return;
    try { if (S.suono) S.suono.spegni && S.suono.spegni(); } catch (e) { }
    try { if (S.stadio && S.stadio.distruggi) S.stadio.distruggi(); } catch (e) { }
    S.scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => m.dispose()); }
    });
    try { renderer.renderLists.dispose(); } catch (e) { }
    D3.luci.azzera();
    S = null;
  }

  /* ═══ AVVIA ════════════════════════════════════════════════════════════ */
  BLG3D.avvia = function (o) {
    if (!BLG3D.pronto) return false;
    try {
      o = o || {};
      const campo = o.campo || {};
      const W = +campo.W || 16, H = +campo.H || 9;
      const gw = +campo.gw || 3.0, ad = +campo.ad || 2.4, aw = +campo.aw || 5.0;
      if (!(W > 1 && H > 1)) throw new Error('misure del campo assenti');

      const nuovoCampo = !S || !S.stadio || S.W !== W || S.H !== H;
      const vecchio = S;
      // lo stadio si RIFA' solo se il campo cambia misura: fra due partite 2v2
      // si tiene tutto (e non si ricompila niente)
      let scene, camera, stadio, calciatori, palla, effetti, regia, suono;
      if (vecchio && !nuovoCampo) {

        dx = st.mira[0] / mm; dy = st.mira[1] / mm;
      }
      const lung = 1.6 + 3.2 * mioCarica;
      const sp = S.regia.aSchermo(mioX + dx * lung, 0.25, mioZ + dy * lung, S.w, S.h);
      SCHERMO.mira = [sp[0], sp[1]];
    }
    SCHERMO.n = nc; SCHERMO.io = mioTesta; SCHERMO.w = S.w; SCHERMO.h = S.h;
    SCHERMO.possesso = mioPossesso;

    perf.n++; perf.ms += ms; perf.max = Math.max(perf.max, ms);
    if (t1 - perf.t > 500) {
      perf.fps = perf.n / ((t1 - perf.t) / 1000);
      if (mostraPerf && elPerf) {
        const inf = renderer.info.render;
        elPerf.textContent = 'lavoro ' + (perf.ms / perf.n).toFixed(1) + ' ms (max ' + perf.max.toFixed(1) + ')'
          + '\nfps ' + perf.fps.toFixed(0) + ' ' + Q.cur.nome + ' pr' + renderer.getPixelRatio()
          + '\ncalls ' + inf.calls + ' tri ' + inf.triangles;
      }
      perf.n = 0; perf.ms = 0; perf.max = 0; perf.t = t1;
      // l'UNICA cosa che torna al padre a partita in corso: i fotogrammi al
      // secondo, per la telemetria che passa da `clog` (nessun messaggio nuovo)
      if (S.avvisa) try { S.avvisa('fps', perf.fps); } catch (e) { }
    }
  };

  BLG3D.schermo = function () { return (S && S.attivo) ? SCHERMO : null; };

  BLG3D.ferma = function () {
    if (!S) return;
    S.attivo = false;
    try { if (S.suono) { S.suono.calore(0, 1); S.suono.carica(0); } } catch (e) { }
  };
  BLG3D.libera = libera;
  // per il padre: «riesci a rifare la partita nella stessa pagina?» (come
  // GCR3D.avvio3d). Se manca, il padre rifa' l'iframe a ogni partita.
  BLG3D.riuso = true;

  BLG3D.info = function () {
    const ord = a => a.slice().sort((x, y) => x - y);
    const p = (a, q) => a.length ? a[Math.min(a.length - 1, Math.floor(a.length * q))] : 0;
    const L = ord(perf.lavoro), I = ord(perf.intervalli);
    return {
      fps: +perf.fps.toFixed(0),
      lavoro_p50: +p(L, 0.5).toFixed(2), lavoro_p95: +p(L, 0.95).toFixed(2),
      lavoro_max: +(L[L.length - 1] || 0).toFixed(2),
      intervallo_p95: +p(I, 0.95).toFixed(2), stalli50: I.filter(x => x > 50).length,
      calls: renderer ? renderer.info.render.calls : 0,
      tris: renderer ? renderer.info.render.triangles : 0,
      programmi: renderer ? renderer.info.programs.length : 0,
      programmi0: S ? (S.programmi0 || 0) : 0,
      qualita: Q.cur.nome, pr: renderer ? renderer.getPixelRatio() : 0,
      w: S ? S.w : 0, h: S ? S.h : 0, bordi: [BORDI.t, BORDI.r, BORDI.b, BORDI.l],
      stadio: (S && S.stadio && S.stadio.stat) ? S.stadio.stat() : null,
      calciatori: (S && S.calciatori && S.calciatori.stat) ? S.calciatori.stat() : null
    };
  };
  BLG3D.perf = function (on) { mostraPerf = !!on; if (elPerf) elPerf.hidden = !on; };
  BLG3D._S = function () { return S; };   // solo per i banchi
})();


</script>
<script>
/* Ultimo filo: se un modulo e' esploso al caricamento, il ponte non esiste e il
   padre deve tornare al 2D. Qui si fabbrica un BLG3D minimo che dice «errore»,
   cosi' il padre non aspetta 8 secondi per niente. */
(function () {
  'use strict';
  try {
    if (!window.BLG3D) window.BLG3D = { versione: 'guscio', pronto: false, errore: 'il ponte non si e\' caricato' };
  } catch (e) { }
  window.addEventListener('error', function (ev) {
    try {
      if (window.BLG3D && !window.BLG3D.errore) window.BLG3D.errore = 'errore di pagina: ' + (ev && ev.message);
      if (window.D3 && window.D3.qb && window.D3.qb('mostraerr')) {
        var d = document.getElementById('err');
        d.style.display = 'flex'; d.textContent = String((ev && ev.error && ev.error.stack) || (ev && ev.message) || ev);
      }
    } catch (e) { }
  }, false);
})();
</script>
