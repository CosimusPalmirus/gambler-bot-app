<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GAMBLER'S RUN — La Notte del Palazzo</title>
<!--
  GAMBLER'S RUN · LA NOTTE DEL PALAZZO — versione di PRODUZIONE: il motore sta in grun_motore.js (lo stesso file che rigioca il server),
  le immagini in grun_arte/.
  Il combattimento paga in CHIAVI, CUORI e PORTE, mai in denaro. Il denaro sta
  alla porta (posta + cambiale), al tavolo (un tiro a piano, EV 1,000) e nel pozzo.
  Costruito il motore 4a62dceafe53 · sorgenti in _levelup/gambler_run/src · arte in arte/gioco
  Modi di servizio: ?dbg (gancio __G) · ?pilota (gioca da solo) · ?banco (bot) · ?bench (fps)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Barlow+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ── GAMBLER'S RUN · stile ─────────────────────────────────────────────────
   Due palette separate (lezione di Sol Cesto): il MONDO è notte, prugna e
   sangue; l'INTERFACCIA è ottone e avorio. Un colore dell'interfaccia non
   compare mai nel mondo, e viceversa. */
:root{
  --notte:#0d0710; --prugna:#1c1020; --prugna2:#2a1730; --sangue:#b8202e; --magenta:#ff3d8b;
  --ottone:#e8b44a; --ottone2:#b98526; --avorio:#f1e6cf; --avorio2:#bdb09a; --ghiaccio:#bfe3e6;
  --verde:#58d68d; --rosso:#ff5a5f;
  --tit:"Limelight","Rye",Georgia,serif;
  --ui:"Barlow Condensed","Arial Narrow",Impact,system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--notte);color:var(--avorio);font-family:var(--ui);
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font-family:var(--ui);cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  background:radial-gradient(ellipse at 50% 40%,#231229 0%,#0d0710 70%)}
@media (min-width:561px){ #app{box-shadow:0 0 0 1px #3a2438,0 0 80px #000} body{background:#070408 repeating-linear-gradient(45deg,#0b060d 0 14px,#090509 14px 28px)} }

/* ── HUD: in alto, sempre uguale. In mezzo SOLO la stanza. ── */
#hud{flex:0 0 auto;padding:6px 8px 4px;background:linear-gradient(#170c1a,#100812);border-bottom:2px solid #3b2410;position:relative;z-index:5}
#hud .r1{display:flex;align-items:stretch;gap:6px}
#hud .blk{flex:1 1 0;min-width:0;background:#0b060d;border:1px solid #4a3219;border-radius:6px;padding:2px 6px 3px;line-height:1}
#hud .blk b{display:block;font-size:9px;letter-spacing:.14em;color:var(--ottone2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .blk span{display:block;font-size:19px;font-weight:800;color:var(--ottone);white-space:nowrap;font-variant-numeric:tabular-nums}
#hPozzo span{color:var(--ghiaccio)}
#hPiano{flex:0.9 1 0} #hPiano span{color:var(--avorio)}
#vPiatto.su{animation:su .4s} #vPiatto.giu{animation:giu .4s}
@keyframes su{0%{transform:scale(1.25);color:#fff6c8}100%{transform:none}}
@keyframes giu{0%{transform:translateX(-4px);color:var(--rosso)}50%{transform:translateX(4px)}100%{transform:none}}
#mini{flex:0 0 84px;height:44px;width:84px;background:#0b060d;border:1px solid #4a3219;border-radius:6px;cursor:pointer}
#btnMenu{flex:0 0 34px;background:#0b060d;border:1px solid #4a3219;border-radius:6px;color:var(--ottone);font-size:18px}
#hud .r2{display:flex;align-items:center;gap:8px;margin-top:5px}
.cbar{position:relative;flex:1;height:12px;background:#0b060d;border:1px solid #4a3219;border-radius:7px;overflow:hidden}
.cfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7a5214,var(--ottone));transition:width .3s cubic-bezier(.3,1.6,.5,1)}
.cfill.coperta{background:linear-gradient(90deg,#2e8a55,var(--verde));animation:lamp .5s 3}
@keyframes lamp{50%{filter:brightness(1.8)}}
.ctac{position:absolute;inset:0}
.ctac i{position:absolute;top:0;bottom:0;width:2px;background:#f1e6cf55}
.ctxt{flex:0 0 auto;font-size:11px;letter-spacing:.06em;color:var(--avorio2);font-weight:700;white-space:nowrap}
.ctxt b{color:var(--ottone)}
#hud .r3{display:flex;align-items:center;gap:8px;margin-top:4px;height:20px}
#cuori{display:flex;gap:1px}
#cuori .cu{width:18px;height:18px;position:relative}
#cuori .cu img{width:100%;height:100%;display:block}
#cuori .cu.mezzo img{clip-path:inset(0 50% 0 0)} #cuori .cu.vuoto img{filter:grayscale(1) brightness(.35)}
#cuori .cu.mezzo::after{content:"";position:absolute;inset:0;background:url() ;}
#cuori.colpo{animation:giu .3s}
#chiavi{display:flex;align-items:center;gap:2px;font-weight:800;color:var(--ottone);font-size:15px}
#chiavi img{width:18px;height:18px}
#poteri{display:flex;gap:2px;flex:1;overflow:hidden}
#poteri img{width:18px;height:18px;filter:drop-shadow(0 0 2px #000)}
#ingr{display:flex;gap:1px} #ingr img{width:16px;height:16px}

/* ── la scena ── */
#scena{position:relative;flex:1 1 auto;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#banner{position:absolute;left:0;right:0;top:12%;text-align:center;pointer-events:none;font-family:var(--tit);
  font-size:22px;color:var(--ottone);text-shadow:0 3px 0 #000,0 0 18px #000;opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s cubic-bezier(.3,1.8,.5,1)}
#banner.on{opacity:1;transform:none}
#banner small{display:block;font-family:var(--ui);font-size:13px;letter-spacing:.2em;color:var(--avorio);margin-top:4px}
#tocca{position:absolute;display:none;transform:translate(-50%,-100%);padding:6px 12px;border-radius:14px;background:var(--ottone);color:#1a0c08;
  font-weight:800;font-size:13px;letter-spacing:.08em;box-shadow:0 3px 0 #6a4510,0 0 12px #000;pointer-events:auto;cursor:pointer;animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{margin-top:-5px}}

/* ── la fascia dei pollici: i comandi non coprono mai il campo ── */
#pad{position:relative;flex:0 0 auto;height:0;display:none;background:linear-gradient(#120914,#07040a);border-top:2px solid #3b2410;padding-bottom:env(safe-area-inset-bottom,0px)}
body.touch #pad{display:block;height:128px}
.joy{position:absolute;bottom:8px;width:110px;height:110px;border-radius:50%;touch-action:none;
  background:radial-gradient(circle,#ffffff08,#ffffff02 60%,transparent 72%);border:2px solid #e8b44a33}
.joy.on{border-color:#e8b44aaa}
#joyL{left:12px} #joyR{right:12px;border-color:#ff3d8b44} #joyR.on{border-color:#ff3d8bcc}
.knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 36% 32%,#fff3cf,#e8b44a 55%,#7a5214);box-shadow:0 2px 6px #000}
#knobR{background:radial-gradient(circle at 36% 32%,#ffd0e2,#ff3d8b 55%,#7a1040)}
.jlab{position:absolute;left:0;right:0;top:-15px;text-align:center;font-size:9px;letter-spacing:.14em;color:#f1e6cf66}
#btnDash{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;
  border:2px solid #e8b44a88;background:radial-gradient(circle at 40% 34%,#e8b44a44,#e8b44a0a);color:var(--ottone);
  font-size:11px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;touch-action:none}
#btnDash.cool{opacity:.35}

/* ── la CARTA (Reigns): si apre dalla porta, a tutto schermo ── */
#velo{position:fixed;inset:0;background:#07030999;opacity:0;pointer-events:none;transition:opacity .18s;z-index:20}
#velo.on{opacity:1;pointer-events:auto}
#carta{position:fixed;left:50%;top:50%;width:min(94vw,420px);max-height:96vh;transform:translate(-50%,-50%);z-index:21;
  display:flex;flex-direction:column;align-items:center;padding:22px 20px 18px;border-radius:16px;
  background:#140a16;box-shadow:0 20px 60px #000,0 0 0 2px #4a3219,0 0 0 5px #120812;overflow:hidden}
#carta.off{display:none}
#carta.entra{animation:entra .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes entra{0%{transform:translate(-50%,-30%) scale(.55) rotate(-6deg);opacity:0}100%{transform:translate(-50%,-50%);opacity:1}}
#carta.via-s{animation:vias .26s ease-in forwards} #carta.via-d{animation:viad .26s ease-in forwards}
@keyframes vias{to{transform:translate(-150%,-45%) rotate(-18deg);opacity:0}} @keyframes viad{to{transform:translate(50%,-45%) rotate(18deg);opacity:0}}
#carta .cornice{position:absolute;inset:0;pointer-events:none;background-size:100% 100%;opacity:.42;mix-blend-mode:screen}
#carta .ritr{position:relative;width:62%;aspect-ratio:2/2.4;max-height:36vh;margin-top:2px;display:flex;align-items:flex-end;justify-content:center}
#carta .ritr img{position:relative;max-width:100%;max-height:100%;transform-origin:50% 100%;animation:respiro 3.6s ease-in-out infinite;will-change:transform;filter:drop-shadow(0 6px 0 #000)}
@keyframes respiro{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.028) translateY(-1px)}}
#carta .aura{position:absolute;left:50%;top:48%;width:118%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#e8b44a22 0 6deg,transparent 6deg 15deg);animation:gira 40s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes gira{to{transform:translate(-50%,-50%) rotate(360deg)}}
#carta .luce{position:absolute;inset:-10%;background:radial-gradient(ellipse at 50% 20%,#ffcf7a22,transparent 60%);animation:trema 2.3s steps(1) infinite;pointer-events:none}
@keyframes trema{0%{opacity:1}13%{opacity:.7}17%{opacity:1}61%{opacity:.85}64%{opacity:1}}
.cnome{position:relative;margin-top:8px;font-family:var(--tit);font-size:21px;letter-spacing:.04em;color:var(--ottone);text-shadow:0 2px 0 #000;text-align:center}
.ctesto{position:relative;margin:8px 2px 12px;font-size:17px;line-height:1.3;color:var(--avorio);text-align:center;min-height:3.9em;font-weight:500}
.ctesto em{color:var(--ottone);font-style:normal}
.cscelte{position:relative;display:flex;flex-direction:column;gap:8px;width:100%}
.scelta{width:100%;text-align:left;padding:10px 14px 9px;border-radius:10px;border:2px solid #6a4a1c;background:linear-gradient(#2a1a10,#1a0f0a);
  color:var(--avorio);font-size:17px;font-weight:700;box-shadow:0 3px 0 #000;transition:transform .08s}
.scelta small{display:block;font-size:13px;font-weight:500;color:var(--avorio2);margin-top:2px;letter-spacing:.02em}
.scelta:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.scelta.oro{border-color:var(--ottone);background:linear-gradient(#5a3a10,#2a1a08)}
.scelta.piccola{padding:8px 12px;font-size:15px;text-align:center}
/* le PORTE del tavolo: tre carte in fila, la forma della scommessa scritta sopra */
.porte{display:flex;gap:7px;width:100%;margin-bottom:8px}
.porta{flex:1;min-width:0;border-radius:10px;border:2px solid #6a4a1c;background:linear-gradient(#24121e,#12080e);padding:9px 5px 8px;
  text-align:center;color:var(--avorio);box-shadow:0 4px 0 #000;transition:transform .1s}
.porta:active{transform:translateY(2px)}
.porta .pi{font-size:26px;line-height:1;color:var(--ottone)}
.porta .pn{font-size:13px;font-weight:800;letter-spacing:.05em;margin-top:4px;min-height:2.2em;display:flex;align-items:center;justify-content:center;line-height:1.05}
.porta .pp{font-size:24px;font-weight:800;color:var(--ottone);margin-top:3px}
.porta .pw{font-size:20px;font-weight:800;color:var(--verde)}
.porta .pk{font-size:12px;color:var(--avorio2);margin-top:4px;line-height:1.15}
.porta .pk.rossa{color:var(--rosso);font-weight:800}
.porta .pv{font-size:11px;color:var(--avorio2);margin-top:3px}
.porta.su{border-color:var(--rosso);box-shadow:0 0 12px #ff5a5f66,0 4px 0 #000}
.porta.scelta-fatta{transform:scale(1.06);border-color:var(--ottone)}
.porta.spenta{opacity:.25;transform:scale(.94)}
.esito{font-family:var(--tit);font-size:34px;text-align:center;margin:6px 0 2px;text-shadow:0 3px 0 #000}
.esito.v{color:var(--verde)} .esito.p{color:var(--rosso)}
.conta{font-size:30px;font-weight:800;text-align:center;color:var(--ottone);font-variant-numeric:tabular-nums}
.pop{position:fixed;left:50%;top:40%;z-index:40;pointer-events:none;transform:translate(-50%,-50%) scale(.3);font-family:var(--tit);font-size:64px;
  color:var(--ottone);text-shadow:0 5px 0 #000,0 0 30px #000;animation:pop .6s cubic-bezier(.2,1.8,.4,1) forwards;display:flex;align-items:center;gap:8px}
.pop img{width:96px;height:96px}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}

/* ── schermate intere: titolo, porta, finale, banco ── */
#schermo{position:fixed;inset:0;z-index:30;overflow-y:auto;overflow-x:hidden;background:var(--notte);display:flex;flex-direction:column;align-items:center}
#schermo.off{display:none}
.fondo{position:fixed;inset:0;background-size:cover;background-position:50% 30%;animation:parallax 18s ease-in-out infinite alternate}
@keyframes parallax{from{transform:scale(1.06) translate(-1%,-1%)}to{transform:scale(1.12) translate(1%,1.5%)}}
.pioggia{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 22px,#bfe3e612 22px 23px);background-size:60px 60px;animation:piove .45s linear infinite}
@keyframes piove{to{background-position:-14px 60px}}
.scuro{position:fixed;inset:0;background:linear-gradient(#0d071000 25%,#0d0710cc 52%,#0d0710 80%)}
.col{position:relative;width:min(100%,460px);padding:18px 18px 30px;display:flex;flex-direction:column;align-items:center;min-height:100%}
.logo{width:92%;margin-top:14%;filter:drop-shadow(0 8px 0 #000);animation:logo 3s ease-in-out infinite}
@keyframes logo{50%{transform:translateY(-4px) rotate(-.6deg)}}
.grande{font-family:var(--tit);font-size:30px;color:var(--ottone);text-align:center;text-shadow:0 3px 0 #000;margin:10px 0 4px}
.sotto{font-size:15px;color:var(--avorio2);text-align:center;line-height:1.35;margin-bottom:10px}
.btn{display:block;width:100%;margin:6px 0;padding:14px 16px;border-radius:12px;border:2px solid var(--ottone);background:linear-gradient(#5a3a10,#2a1a08);
  color:var(--avorio);font-size:19px;font-weight:800;letter-spacing:.08em;box-shadow:0 4px 0 #000}
.btn.sec{border-color:#6a4a1c;background:linear-gradient(#24121e,#12080e);font-size:16px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #000}
.fiches{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 10px}
.fic{width:52px;height:52px;border-radius:50%;border:3px dashed #f1e6cf;background:radial-gradient(circle,#b8202e 55%,#7a1018 56%);color:#fff;
  font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #000}
.fic.on{background:radial-gradient(circle,#e8b44a 55%,#9a6a18 56%);color:#1a0c08;transform:translateY(-3px) scale(1.08)}
.fic:nth-child(3n+2){background:radial-gradient(circle,#2a2a2a 55%,#111 56%)} .fic:nth-child(3n+3){background:radial-gradient(circle,#8a1f6a 55%,#5a1044 56%)}
.fic.on:nth-child(n){background:radial-gradient(circle,#e8b44a 55%,#9a6a18 56%)}
.cambs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin:4px 0 10px}
.camb{padding:8px 4px;border-radius:10px;border:2px solid #6a4a1c;background:#140a12;color:var(--avorio);text-align:center}
.camb b{display:block;font-size:22px;color:var(--ottone)} .camb small{display:block;font-size:12px;color:var(--avorio2);line-height:1.15}
.camb.on{border-color:var(--ottone);background:linear-gradient(#5a3a10,#2a1a08)}
.riassunto{width:100%;border:1px solid #4a3219;border-radius:10px;padding:10px 12px;background:#0b060d;font-size:15px;line-height:1.45}
.riassunto b{color:var(--ottone)} .riassunto .n{float:right;font-weight:800;color:var(--avorio)}
.nota{font-size:12px;color:var(--avorio2);text-align:center;margin-top:6px;line-height:1.35}
.saldo{font-size:14px;color:var(--avorio2);letter-spacing:.1em;margin-top:4px} .saldo b{color:var(--ottone);font-size:18px}
.timbro{position:fixed;left:50%;top:45%;z-index:45;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;border:8px double var(--sangue);
  color:var(--sangue);font-family:var(--tit);font-size:30px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;
  transform:rotate(-14deg) scale(3);opacity:0;animation:timbro .42s cubic-bezier(.5,0,.8,.4) forwards;background:#f1e6cf10;pointer-events:none}
@keyframes timbro{60%{opacity:1;transform:rotate(-14deg) scale(.92)}100%{opacity:1;transform:rotate(-14deg) scale(1)}}
.fin-tit{font-family:var(--tit);font-size:32px;color:var(--ottone);text-align:center;text-shadow:0 3px 0 #000,0 0 14px #000,0 0 30px #000;margin-top:64%;padding:8px 12px;background:radial-gradient(ellipse,#0d0710cc 30%,transparent 72%)}
.fin-r{font-size:17px;line-height:1.35;text-align:center;margin:8px 0;color:var(--avorio);opacity:0;animation:appare .5s forwards}
.fin-r:nth-of-type(2){animation-delay:.5s}.fin-r:nth-of-type(3){animation-delay:1.1s}.fin-r:nth-of-type(4){animation-delay:1.8s}
@keyframes appare{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tab{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.tab th{color:var(--ottone2);font-weight:700;text-align:right;padding:4px 3px;border-bottom:1px solid #4a3219;font-size:12px;letter-spacing:.06em}
.tab td{text-align:right;padding:5px 3px;border-bottom:1px solid #2a1a20;font-variant-numeric:tabular-nums}
.tab td:first-child,.tab th:first-child{text-align:left}
.tab .ok{color:var(--verde);font-weight:800}
.guida{font-size:15px;line-height:1.4;color:var(--avorio);width:100%}
.guida h3{font-family:var(--tit);color:var(--ottone);font-size:18px;margin:12px 0 4px;font-weight:400}
.guida p{margin:3px 0 6px;color:var(--avorio2)} .guida b{color:var(--avorio)}

#mappaG{position:fixed;inset:0;z-index:25;background:#0d0710f2;display:flex;flex-direction:column;align-items:center;justify-content:center}
#mappaG.off{display:none}
#mapCv{width:min(96vw,440px);height:min(70vh,520px)}
.mtit{font-family:var(--tit);color:var(--ottone);font-size:22px;margin:6px}
.mchiudi{margin-top:8px;padding:10px 26px;border-radius:10px;border:2px solid var(--ottone);background:#2a1a08;color:var(--avorio);font-weight:800;font-size:16px}
#lampo{position:fixed;inset:0;pointer-events:none;z-index:50;background:#fff;opacity:0}
#dbg{position:fixed;left:2px;bottom:2px;font:10px monospace;color:#7ff;background:#000a;padding:2px 4px;z-index:60;display:none;pointer-events:none}
.off{display:none}

@keyframes slam{0%{transform:scale(2.4);opacity:0}60%{transform:scale(.94);opacity:1}100%{transform:none;opacity:1}}
#carta .ritr img{max-height:36vh}
#btnIncassa{margin-left:auto;flex:0 0 auto;height:20px;padding:0 8px;border-radius:10px;border:1px solid var(--ottone);background:#2a1a08;color:var(--ottone);font-size:11px;font-weight:800;letter-spacing:.06em;white-space:nowrap}
#btnIncassa.no{opacity:.35}
.reg{width:100%;font-size:14px;border-collapse:collapse;margin:4px 0 8px} .reg td{padding:4px 3px;border-bottom:1px solid #2a1a20} .reg td:last-child{text-align:right;color:var(--ottone);font-weight:800} .reg .bar{height:6px;background:var(--ottone2);border-radius:3px}
.ctesto,.nota,.reg,.porta,.scelta{text-shadow:0 1px 2px #000} .cscelte{background:radial-gradient(ellipse at 50% 50%,#0d0710dd 55%,transparent 80%)}

/* ══ TITOLO e PORTA (rifatti il 24/09) ══ */
#schermo.titolo,#schermo.porta{overflow:hidden;background:#070308 repeating-linear-gradient(45deg,#0b060d 0 14px,#090509 14px 28px)}
#tit,#port{position:relative;width:100%;max-width:560px;height:100%;margin:0 auto;overflow:hidden;background:#0a0510}
