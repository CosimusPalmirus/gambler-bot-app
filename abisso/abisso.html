<script>
/* ABISSO_PONTE_RT_1711 — la pagina dentro la mini app (?rt=1): niente socket sue.
   La "WebSocket" della pagina diventa un ponte postMessage verso il guscio dell index (ABRT, stessa origine), che
   parla col server real-time vero sulla socket della mini app. Traduce i messaggi del server nel formato del server
   di prova su cui la pagina e' stata collaudata:
     start (game=abisso)   -> {t:"info", info: map}        (map = map_info() del motore: nomi, n, D, firma, a_soldi, B...)
     s (g=abisso)          -> {t:"snap", s}                (il tempo torna in s.t; eventi del feed gia visti: tolti)
     over (game=abisso)    -> {t:"fine", extra, premi:null} (i soldi li mostra l index dopo la scheda finale)
     err code=ab_act_no    -> {t:"no", a}
   e manda su solo {t:"act", a, ax} e rientra. Fuori da ?rt=1 non fa niente: la pagina resta quella di prova. */
(function(){
  "use strict";
  var Q=new URLSearchParams(location.search);
  if(Q.get('rt')!=='1'||window.parent===window)return;
  var ORIG=location.origin,vivo=null,ultimoInfo=null,finita=false,firma='',visto=0,ultimoSnap=0,partita=false;
  window.__ABRT_PONTE={giu:0,su:0,start:0,no:0,doppi:0,rientra:0,fine:0,ult:[]};
  try{document.documentElement.classList.add('in-rt');}catch(e){}
  function su(o){try{window.parent.postMessage(o,ORIG);}catch(e){}}
  function nomePulito(n){return String(n||'').replace(/[\u0000-\u001f<>&"]/g,'').trim().slice(0,16);}
  // FOTO_VERE_1711 (regola del proprietario: ogni umano col suo nome e la sua foto). La fonte e' la stessa delle altre
  // pagine: `profiles[uid].photo_url` dello start (il server l'ha gia' filtrata: Telegram, o la nostra /foto/<uid>.jpg).
  // Un posto per seggio (map.seggi), mai per i bot; lo spettatore riceve i profili senza photo_url: resta il colore.
  function fotoBuona(u){
    u=String(u||'');if(!/^https:\/\/[^\s"'<>\\]+$/.test(u)||u.length>600)return '';
    try{var h=new URL(u).hostname.toLowerCase();
      if(h==='cdn.discordapp.com'&&/\.discordsays\.com$/.test(location.hostname))return '/.proxy/avatar'+new URL(u).pathname;   // dentro Discord passa dal mapping /avatar
    }catch(e){return '';}
    return u;
  }
  function fotoDaProfili(m,info){
    var out=[],pr=(m&&m.profiles&&typeof m.profiles==='object')?m.profiles:{},sg=Array.isArray(info.seggi)?info.seggi:[],i;
    for(i=0;i<(Number(info.n)||sg.length)&&i<8;i++){
      var s=sg[i]||{},uid=String(s.uid==null?'':s.uid),p=pr[uid];
      out.push((uid&&uid.indexOf('bot:')!==0&&p&&typeof p==='object')?fotoBuona(p.photo_url):'');
    }
    return out;
  }
  function traduci(m){
    if(!m||typeof m!=='object')return null;
    if(m.t==='s'){
      if(m.g!=='abisso')return null;
      var s={},k;for(k in m){if(k!=='t'&&k!=='time')s[k]=m[k];}
      s.t=(typeof m.time==='number')?m.time:0;
      // il rientro rimanda gli ultimi eventi del feed: quelli gia visti non si rigiocano
      if(Array.isArray(s.feed)){
        var f=[],i;for(i=0;i<s.feed.length;i++){var e=s.feed[i];if(e&&typeof e.s==='number'&&e.s<=visto){window.__ABRT_PONTE.doppi++;continue;}f.push(e);if(e&&typeof e.s==='number')visto=Math.max(visto,e.s);}
        s.feed=f;
      }
      if(s.fine)finita=true;
      ultimoSnap=Date.now();
      return {t:'snap',s:s};
    }
    if(m.t==='start'){
      if(m.game!=='abisso'||!m.map||m.map.abisso!==1)return null;
      var info={},k2;for(k2 in m.map)info[k2]=m.map[k2];
      // i nomi: quelli del motore (profilo dell hello per gli umani, nomi dei ladri per i bot); mai un uid
      try{if(Array.isArray(info.nomi))info.nomi=info.nomi.map(function(n,i){var p=nomePulito(n);return (p&&p.indexOf('bot:')!==0)?p:('#'+(i+1));});}catch(e){}
      info.foto=fotoDaProfili(m,info);               // FOTO_VERE_1711: la foto vera degli umani (bot e senza foto: colore)
      info.spec=!!(m.spec||m.you==null);
      info.rt=1;
      var f2=String(info.firma||'')+'|'+String(info.n||'');
      if(f2!==firma){firma=f2;visto=0;finita=false;}   // una partita nuova: si riparte da zero
      window.__ABRT_PONTE.start++;partita=true;ultimoSnap=Date.now();
      return {t:'info',info:info};
    }
    if(m.t==='over'){
      if(m.game!=='abisso')return null;
      finita=true;
      var ex={},k3;for(k3 in m){if(k3!=='t')ex[k3]=m[k3];}
      return {t:'fine',extra:ex,premi:null,rt:1};
    }
    if(m.t==='err'&&m.code==='ab_act_no'){window.__ABRT_PONTE.no++;return {t:'no',a:String(m.a||'')};}
    return null;
  }
  function FintaWS(url){
    var me=this;this.url=String(url);this.readyState=0;this.binaryType='blob';this.bufferedAmount=0;this.extensions='';this.protocol='';
    this.onopen=this.onmessage=this.onclose=this.onerror=null;vivo=this;
    setTimeout(function(){
      if(vivo!==me)return;me.readyState=1;
      try{if(me.onopen)me.onopen({type:'open'});}catch(e){}
      su({sm:'pronto'});
      if(ultimoInfo)me._giu(ultimoInfo);       // una seconda connessione riceve lo start che c era
    },0);
  }
  FintaWS.CONNECTING=0;FintaWS.OPEN=1;FintaWS.CLOSING=2;FintaWS.CLOSED=3;
  FintaWS.prototype._giu=function(x){if(this.readyState!==1||!this.onmessage)return;try{this.onmessage({data:JSON.stringify(x)});}catch(e){su({sm:'err',msg:'ponte: '+String(e&&e.message||e)});}};
  FintaWS.prototype.send=function(raw){
    if(this.readyState!==1)return;
    var o;try{o=JSON.parse(raw);}catch(e){return;}
    if(!o||typeof o!=='object'||typeof o.a!=='string')return;
    var m={t:'act',a:o.a.slice(0,16)};
    if(typeof o.ax==='number'&&isFinite(o.ax)&&Math.floor(o.ax)===o.ax&&Math.abs(o.ax)<64)m.ax=o.ax;
    var P=window.__ABRT_PONTE;P.su++;P.ult.push(m.a);if(P.ult.length>20)P.ult.shift();
    su({sm:'su',m:m});
  };
  FintaWS.prototype.close=function(){this.readyState=3;};
  FintaWS.prototype.addEventListener=function(){};FintaWS.prototype.removeEventListener=function(){};
  window.WebSocket=FintaWS;
  window.addEventListener('message',function(ev){
    if(ev.origin!==ORIG||ev.source!==window.parent)return;
    var d=ev.data;if(!d||typeof d!=='object')return;
    if(d.sm==='bordi'){        // i bordi del telefono dal guscio (dentro l iframe env(safe-area-inset-*) vale 0)
      try{var r=document.documentElement.style,l=['top','bottom','left','right'],i;
        for(i=0;i<l.length;i++){var v=Number(d[l[i]]);if(isFinite(v)&&v>=0&&v<=200)r.setProperty('--sa-'+l[i],Math.round(v)+'px');}}catch(e){}
      return;
    }
    if(d.sm!=='giu')return;
    window.__ABRT_PONTE.giu++;
    var x=traduci(d.m);if(!x)return;
    if(x.t==='info')ultimoInfo=x;
    if(vivo)vivo._giu(x);
  });
  // il guardiano: senza fotogrammi per 5 s a partita in corso si chiede di rientrare (il guscio ne lascia passare uno ogni 3 s)
  setInterval(function(){
    if(!partita||finita||document.visibilityState==='hidden')return;
    if(Date.now()-ultimoSnap>5000){ultimoSnap=Date.now();window.__ABRT_PONTE.rientra++;su({sm:'su',m:{t:'rientra'}});}
  },1000);
  // la fine e le uscite della pagina: la scheda finale e pronta -> il guscio mostra l esito vero (soldi)
  window.addEventListener('abisso',function(e){
    var m=e&&e.detail;if(!m)return;
    if(m.t==='fine'){window.__ABRT_PONTE.fine++;setTimeout(function(){su({sm:'fine_scena'});},3500);}   // la scheda di fine resta 3,5 s prima dell esito dell index
    else if(m.t==='rivincita'){su({sm:'fine_scena'});}
    else if(m.t==='menu'){su({sm:'esci'});}
  });
  window.addEventListener('error',function(e){su({sm:'err',msg:String(e&&e.message||'')+' @'+String(e&&e.lineno||'')});});
})();
</script>
