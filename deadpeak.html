<script>/* js/fisica.js */
/* DEAD PEAK MEAT — fisica del corpo (GIRO 2).
   Porto di sclPhysics / sclMoveX / sclMoveY / sclApplyJump / sclDoWallJump della
   pagina online (_levelup/torneo_1309/vivo/index.html, che copia climb_rt.py).
   Giro 2: il mondo ha due strati in piu' per gli OGGETTI (celle piazzate: muro, pioli;
   superfici: colla, sapone, trampolino), le pareti fragili, e il corpo ha gli stati degli
   oggetti (stordito, tirato dal rampino, magnesite, colla, spinta).
   Ogni costante toccata sta in DPM.K_TABELLA con PRIMA / DOPO / PERCHE': quella tabella
   va portata nel motore. Le colonne: [nome, motore/pagina online, giro 1, giro 2, perche'].
   Unita': celle. y cresce verso l'ALTO. Piedi a (x,y), corpo largo 2R alto PH. */
(function(){
var DPM = globalThis.DPM || (globalThis.DPM = {});

/* ONLINE 15/09 — MATEMATICA DETERMINISTICA. Il motore autoritativo e' in Python: Math.hypot, Math.sin/cos/atan2 e
   Math.pow NON danno gli stessi bit in V8 e nella libm del server (1 ulp basta a cambiare un fotogramma di collisione).
   Qui solo + - * / e sqrt (arrotondata correttamente in IEEE ovunque): climb2_rt.py fa le STESSE operazioni nello
   STESSO ordine, quindi i due motori danno gli stessi bit. */
var _HPI = Math.PI / 2;
function _sinS(r) { var r2 = r * r; return r * (1 - r2 / 6 * (1 - r2 / 20 * (1 - r2 / 42 * (1 - r2 / 72 * (1 - r2 / 110 * (1 - r2 / 156 * (1 - r2 / 210 * (1 - r2 / 272)))))))); }
function _cosS(r) { var r2 = r * r; return 1 - r2 / 2 * (1 - r2 / 12 * (1 - r2 / 30 * (1 - r2 / 56 * (1 - r2 / 90 * (1 - r2 / 132 * (1 - r2 / 182 * (1 - r2 / 240 * (1 - r2 / 306)))))))); }
function _quad(x) { var k = Math.floor(x / _HPI + 0.5); return [x - k * _HPI, ((k % 4) + 4) % 4]; }
DPM.dsin = function (x) { var q = _quad(x), r = q[0], k = q[1]; return k === 0 ? _sinS(r) : k === 1 ? _cosS(r) : k === 2 ? -_sinS(r) : -_cosS(r); };
DPM.dcos = function (x) { var q = _quad(x), r = q[0], k = q[1]; return k === 0 ? _cosS(r) : k === 1 ? -_sinS(r) : k === 2 ? -_cosS(r) : _sinS(r); };
var _S3 = Math.sqrt(3), _T12 = 2 - _S3, _PI6 = Math.PI / 6;
function _atanS(u) { var u2 = u * u, s = 0, i; for (i = 27; i >= 3; i -= 2) s = u2 * (1 / i - s); return u * (1 - s); }

DPM.datan2 = function (y, x) {
  var ax = Math.abs(x), ay = Math.abs(y), a;
  if (ax === 0 && ay === 0) return 0;
  if (ay <= ax) a = _atan01(ay / ax); else a = _HPI - _atan01(ax / ay);
  if (x < 0) a = Math.PI - a;
  return y < 0 ? -a : a;
};
DPM.hyp = function (a, b) { return Math.sqrt(a * a + b * b); };

// [nome, motore (SC/climb_rt), giro 1, giro 2, perche']
var TAB = [
  ['PASSO',   0.05,  1/60, 1/60, 'il motore gira a 20 Hz: 50 ms di granulosita\' per un salto al millimetro sono troppi (in SMB si decide al fotogramma). Il corpo va integrato a 60 Hz'],

  ['VRUN',     9.2,  10.5, 10.5, 'velocita\' piena col momento'],
  ['MOMT',     0.50,  0.45, 0.33, 'GIRO 2: la mappa e\' larga il doppio e le corse orizzontali sono lunghe; col momento lento la corsa piena arrivava dopo 517 ms e ogni ripartenza dopo un salto sembrava impastata. Ora ~390 ms'],
  ['AGROUND', 110.0, 120.0, 120.0, 'partenza da fermo a piena velocita\' in 0,06 s'],
  ['FGROUND',  95.0, 110.0, 110.0, 'frenata secca: ci si ferma sul bordo di una lama'],
  ['AAIR',     85.0,  90.0, 90.0, 'controllo in aria forte (in SMB si corregge tutto in volo)'],
  ['WSLIDEV',   3.0,   2.0,  2.0, 'la scivolata parte lenta: attaccarsi al muro e\' un riposo'],
  ['WSACC',    11.0,   7.0,  7.0, 'e accelera piano'],
  ['WSVMAX',   12.0,   8.0,  8.0, 'tetto della scivolata'],
  ['WJVX',     10.5,   9.0,  9.0, 'stacco dal muro meno largo: i camini sono di 3-4 celle'],
  ['WJVY',     16.5,  19.0, 19.0, 'stacco dal muro alto: il muro e\' il verbo principale'],
  ['WJMOM',     0.5,   0.3,  0.3, 'meno spinta dal momento (in un camino stretto sbatteva)'],
  ['WJSAME',    0.55,  0.72, 0.72, 'lo stesso muro si scala piano e il camino a due muri resta la via svelta'],
  ['WJLOCK',    0.08,  0.11, 0.11, 'dopo lo stacco lo stick verso il muro e\' ignorato per 7 fotogrammi'],
  ['WCLIMBV',   3.4,   0.0,  0.0, 'TOLTA l\'arrampicata a fiato: in SMB il muro si sale solo saltando'],
  ['MANTLE',    1,     0,    0,   'TOLTA la presa del bordo con montata: spezza il ritmo. Al suo posto LEDGEPOP'],
  ['LEDGEPOP',  0,     0.42, 0.52, 'GIRO 2: se il piede sbatte contro lo spigolo di un ripiano entro questa quota si sale sopra senza fermarsi. Col 0,42 il banco dava 0,36 celle utili: i salti «quasi arrivati» contro gli spigoli dei ripiani larghi erano il primo errore ingiusto delle vie lunghe'],
  ['CN2',       0.34,  0.34, 0.40, 'GIRO 2: quanto la testa puo\' sporgere sotto uno spigolo del soffitto ed essere spostata di lato invece di sbattere (camini e grate delle porte: la porta a grata larga 3 si prende anche arrivando storti)'],
  ['HURT',      0,     0.26, 0.26, 'la scatola che muore e\' piu\' piccola del corpo (0,52 x 0,95)'],
  ['DROPMY',    0.5,   0.5,  0.8, 'GIRO 2: le porte sono grate e scendere e\' giu\' + salto. Con la levetta a meta\' strada (0,5) chi saltava col pollice un po\' basso cadeva dalla porta: ora serve la levetta quasi tutta giu\''],

  ['MAGJUMP',   1.15,  0,    1.15, 'MAGNESITE (CHALK_JUMP_MUL): salto +15% per 5 s = 4,6 celle: apre i ripiani da 4'],
  ['PULLV',     13.0,  0,    15.0, 'RAMPINO (PULL_SPD_SELF 13): volo verso l\'anello. 15 perche\' a 13 un anello a 8 celle costava 0,6 s, piu\' della via a piedi'],
  ['PADVY',     26.0,  0,    25.5, 'TRAMPOLINO (PAD_CAP 26): rimbalzo fisso a 25,5 = 5,2 celle sopra la pedana. Fisso e non proporzionale alla caduta: in SMB il rimbalzo si deve leggere, sempre uguale'],
  ['GLUEV',     2.79,  0,    3.2,  'COLLA (V_WALK*GLUE_MUL): tetto di corsa nella colla'],
  ['ICEA',      30.0,  0,    26.0, 'SAPONE: accelerazione a terra'],
  ['ICEF',      6.0,   0,    4.0,  'SAPONE: attrito a terra (FGROUND 110 -> 4): non ci si ferma'],
  ['DASHV',     0,     0,    13.0, 'SPINTA a mani vuote: scatto in avanti a 13 celle/s per 0,15 s'],
  ['DASHT',     0,     0,    0.15, 'durata dello scatto']
];
var K = {};
for (var i = 0; i < TAB.length; i++) K[TAB[i][0]] = TAB[i][3];
// costanti rimaste IDENTICHE alla pagina (non stanno nella tabella)
var SAME = { COYOTE:0.12, JBUF:0.15, APEXVY:2.2, APEXMUL:0.75, AAIRAPEX:1.15, GCUT:3.0,
  FAIR:4.0, OVDRAG:6.0, LKT:0.25, LKDRAG:8.0, SKIDVMIN:1.5, FSKID:160.0, MOMVMIN:0.9, MOMDEC:0.15,
  WCOY:0.20, CEILEPS:0.001, BONKVY:0.8, CN0:0.10, CN1:0.22, DROPT:0.20 };
for (var k in SAME) K[k] = SAME[k];
DPM.K = K; DPM.K_TABELLA = TAB; DPM.K_UGUALI = SAME;

/* ---------- mondo a celle ----------
   tipi: 0 vuoto, 1 solido, 2 una-via (grata), 3 blocco che crolla, 4 asse che si sbriciola,
   5 parete fragile (solida finche' la piccozza o il masso non la rompono).
   dyn (celle piazzate dagli oggetti): 1 solido (MURO), 2 una-via (PIOLO della scala).
   sup (superficie sopra la cella): 1 colla, 2 sapone, 3 trampolino. */
function Mondo(W, H) {
  this.W = W; this.H = H;
  this.t = new Uint8Array(W * H);
  this.rotto = new Uint8Array(W * H);   // 1 = crollato / rotto (non collide)
  this.dyn = new Uint8Array(W * H);
  this.sup = new Uint8Array(W * H);
}
Mondo.prototype.tipo = function (cx, cy) {
  if (cx < 0 || cx >= this.W) return 1;
  if (cy < 0) return 1;
  if (cy >= this.H) return 0;
  return this.t[cy * this.W + cx];
};
Mondo.prototype.solido = function (cx, cy) {
  if (cx < 0 || cx >= this.W || cy < 0) return true;
  if (cy >= this.H) return false;
  var i = cy * this.W + cx, t = this.t[i];
  return t === 1 || ((t === 3 || t === 5) && !this.rotto[i]) || this.dyn[i] === 1;
};
Mondo.prototype.unavia = function (cx, cy) {
  if (cx < 0 || cx >= this.W || cy < 0 || cy >= this.H) return false;
  var i = cy * this.W + cx, t = this.t[i];
  return t === 2 || (t === 4 && !this.rotto[i]) || this.dyn[i] === 2;
};
DPM.Mondo = Mondo;

var _m = { x:0, y:0, hit:false, land:false, ceil:false, pop:false };
/* GIRO 2 — POSIZIONI SU UNA GRIGLIA DI 2^-20 CELLE. La stessa via rigiocata in un'altra stanza della
   torre (tutto spostato di 90 righe) divergeva dopo 14 fotogrammi: 1,8 + 1,2 e 91,8 + 1,2 non si
   arrotondano uguali in virgola mobile e il test «la testa tocca il soffitto» cambiava di un fotogramma.
   Con x e y multipli di 2^-20 (un milionesimo di cella: invisibile) ogni somma con un intero e' esatta
   e la fisica e' la stessa a ogni quota: la certificazione di un pezzo vale in ogni torre, i bot
   rigiocano le vie senza perdersi, e il motore Python (coordinate assolute) fara' gli stessi conti. */
var QG = 1048576;
// gli epsilon dei test di cella devono essere piu' grandi dell'errore di qz (fino a 4,8e-7): prima erano 1e-9 e un
// corpo arrotondato a y=8,80000019 contava la riga del soffitto dentro di se' e attraversava i muri (trovato dal designer della zona 3)
var EPSQ = 4e-6, PUSHQ = 8e-6;
function qz(v) { return Math.round(v * QG) / QG; }
DPM.qz = qz;

function moveX(M, x, y, dx, air, vy) {
  if (dx === 0) { _m.x = x; _m.hit = false; _m.pop = false; return; }
  var hw = K.R, nx = x + dx, cy0 = Math.floor(y + EPSQ), cy1 = Math.floor(y + K.PH - EPSQ), cx, cy;
  _m.pop = false;
  if (dx > 0) {
    var cxa = Math.floor(x + hw - EPSQ), cxb = Math.floor(nx + hw - EPSQ);
    for (cx = cxa; cx <= cxb; cx++) for (cy = cy0; cy <= cy1; cy++) if (M.solido(cx, cy)) {
      if (tryPop(M, cx, cy, x, y, air, vy, 1)) return;
      _m.x = cx - hw - PUSHQ; _m.hit = true; return;
    }
    _m.x = nx; _m.hit = false; return;
  }
  var cxa2 = Math.floor(x - hw + EPSQ), cxb2 = Math.floor(nx - hw + EPSQ);
  for (cx = cxa2; cx >= cxb2; cx--) for (cy = cy0; cy <= cy1; cy++) if (M.solido(cx, cy)) {
    if (tryPop(M, cx, cy, x, y, air, vy, -1)) return;
    _m.x = cx + 1 + hw + PUSHQ; _m.hit = true; return;
  }

  prep: function (tr) { tr.dir = tr.dir || 'd'; tr.e = 0; tr.fase = tr.fase || 0; },
  agg: function (tr, T, dt, S) {

    if (f < 0.40) e = 0;

  },

};
// rettangolo del blocco che sporge dall'alloggio [x0,y0,x1,y1]
DPM.pressaRett = function (tr) {
  var e = Math.max(0, tr.e);
  if (tr.dir === 'd') return [tr.x0, tr.base - e, tr.x1, tr.base];
  if (tr.dir === 'u') return [tr.x0, tr.base, tr.x1, tr.base + e];
  if (tr.dir === 'r') return [tr.base, tr.x0, tr.base + e, tr.x1];

/* LAMA A PENDOLO — {px,py (perno), L, amp (rad), per, fase, r} */
TIPI.pendolo = {
  prep: function (tr) { tr.fase = tr.fase || 0; },
  agg: function (tr, T, dt, S) {
    var th = tr.amp * DPM.dsin(TAU * fr(T, tr.per, tr.fase));
    var prevTh = tr.th;
    tr.th = th; tr.w = tr.amp * TAU / tr.per * DPM.dcos(TAU * fr(T, tr.per, tr.fase));

/* LASER A TEMPO — {x,y (emettitore), dir, per, fase, on, tele} */
TIPI.laser = {
  prep: function (tr, M) {
    var d = DIRV[tr.dir]; tr.on = tr.on || 0.34; tr.tele = tr.tele || 0.22; tr.fase = tr.fase || 0;
    tr.len = raggio(M, tr.x + d[0] * 0.05, tr.y + d[1] * 0.05, d[0], d[1], 20);
  },
  agg: function (tr, T, dt, S) {

    if (f < a) st = 0; else if (f < 1 - tr.on) st = 1; else st = 2;
    if (S && S.ev && tr.st === 1 && st === 2) S.ev.push({ k:'laser', tr:tr });

  },
  colpo: function (tr, b) {

    return rectBox(Math.min(x0, x1) - (d[0] ? 0 : w), Math.min(y0, y1) - (d[1] ? 0 : w), Math.max(x0, x1) + (d[0] ? 0 : w), Math.max(y0, y1) + (d[1] ? 0 : w), b);

/* GETTO DI FUOCO — {x,y (ugello), dir, len, per, fase, on, tele} */
TIPI.fuoco = {
  prep: function (tr, M) {

    var d = DIRV[tr.dir]; tr.len = Math.min(tr.len || 3, raggio(M, tr.x + d[0] * 0.05, tr.y + d[1] * 0.05, d[0], d[1], 8));
  },
  agg: function (tr, T, dt, S) {
    var f = fr(T, tr.per, tr.fase), a = 1 - tr.on - tr.tele, st;
    if (f < a) st = 0; else if (f < 1 - tr.on) st = 1; else st = 2;
    if (S && S.ev && tr.st !== 2 && st === 2) S.ev.push({ k:'fuoco', tr:tr });

TIPI.mina = {
  prep: function (tr) { tr.st = 0; tr.tt = 0; },
  agg: function (tr, T, dt, S) {
    tr.tt += dt;

      }

/* LANCIAMISSILI — {x,y (torretta), gitt, cd}. Punta il corridore bersaglio (S.bersaglio). */
TIPI.missili = {
  prep: function (tr) { tr.st = 0; tr.tt = 0; tr.ang = tr.ang0 || 0; tr.gitt = tr.gitt || 9; tr.cd = tr.cd || 2.3; tr.m = []; tr.boom = []; tr.mira = 0; tr.tgt = null; },
  agg: function (tr, T, dt, S) {

      if (!esplode && S.massi) for (var mm = 0; mm < S.massi.length; mm++) if (DPM.hyp(S.massi[mm].x - m.x, S.massi[mm].y - m.y) < 0.7) esplode = true;
      if (esplode) { tr.boom.push({ x: m.x, y: m.y, t: 0 }); if (S.ev) S.ev.push({ k:'boom', x:m.x, y:m.y, tr:tr }); tr.m.splice(i, 1); }

    for (var i = 0; i < tr.m.length; i++) if (cerchioBox(tr.m[i].x, tr.m[i].y, 0.3, b)) return true;

/* SPUNTONI dalla mappa — {x,y,w,dir} striscia */
TIPI.spine = {
  prep: function (tr) {},
  agg: function () {},
  colpo: function (tr, b) {
    var h = 0.42, x0, y0, x1, y1;
    if (tr.dir === 'u') { x0 = tr.x + 0.1; x1 = tr.x + tr.w - 0.1; y0 = tr.y; y1 = tr.y + h; }
    else if (tr.dir === 'd') { x0 = tr.x + 0.1; x1 = tr.x + tr.w - 0.1; y0 = tr.y + 1 - h; y1 = tr.y + 1; }
    else if (tr.dir === 'r') { x0 = tr.x; x1 = tr.x + h; y0 = tr.y + 0.1; y1 = tr.y + tr.w - 0.1; }
    else { x0 = tr.x + 1 - h; x1 = tr.x + 1; y0 = tr.y + 0.1; y1 = tr.y + tr.w - 0.1; }

DPM.TIPI = TIPI;

/* ---------- blocchi che crollano ----------

function Crolli(M) {
  this.M = M; this.celle = []; this.st = []; this.t = [];

  var k = this.idx[cy * M.W + cx]; if (k < 0 || this.st[k] !== 0) return;

    else if (s === 2 && this.t[k] >= 2.6) {

      if (S) for (var j = 0; j < S.corr.length; j++) { var c = S.corr[j]; if (!c.vivo) continue;
        if (c.p.x + 0.36 > cx && c.p.x - 0.36 < cx + 1 && c.p.y + 1.2 > cy && c.p.y < cy + 1) libero = false; }
      if (libero) { this.st[k] = 3; this.t[k] = 0; M.rotto[i] = 0; if (S && S.ev) S.ev.push({ k:'riforma', x:cx + 0.5, y:cy + 0.5 }); }

// chi e' appoggiato o scivola su un blocco lo fa tremare
Crolli.prototype.contatti = function (c, S) {

DPM.Crolli = Crolli;

// scatola che muore di un corpo
DPM.scatola = function (p, b) {
  var h = DPM.K.HURT;

})();

/* ---------- un passo: timer, casse, oggetti piazzati, massi, dardi, spinte ---------- */

    if (c.invT > 0) c.invT = Math.max(0, c.invT - dt);

    if (c.missCd > 0) c.missCd = Math.max(0, c.missCd - dt);

      vie:(p.vie || []).map(function (v) { return { nome:v.nome, tipo:v.tipo || '', oggetto:v.oggetto || 0, tappe:v.tappe.map(function (t) { return [t[0], base + t[1], t[2], t[3], t[4]]; }) }; }) });
    p.trappole.forEach(function (tr0) {
      var tr = JSON.parse(JSON.stringify(tr0)); tr.stanza = k;
      if (tr.y !== undefined) tr.y += base;
      if (tr.py !== undefined) tr.py += base;
      if (tr.punti) tr.punti.forEach(function (q) { q[1] += base; });
      if (tr.t === 'pressa') { if (tr.dir === 'd' || tr.dir === 'u') tr.base += base; else { tr.x0 += base; tr.x1 += base; } }
      L.trappole.push(tr);
    });
    // spuntoni: strisce contigue orizzontali (^ v) e verticali (< >)
    for (var r2 = 0; r2 < h; r2++) {
      var rg = p.mappa[h - 1 - r2], c2 = 0;
      while (c2 < W) {
        var ch2 = rg[c2];
        if (ch2 === '^' || ch2 === 'v') { var c0 = c2; while (c2 < W && rg[c2] === ch2) c2++; L.trappole.push({ t:'spine', x:c0, y:base + r2, w:c2 - c0, dir: ch2 === '^' ? 'u' : 'd', stanza:k }); }
        else c2++;
      }
    }
    for (var c3 = 0; c3 < W; c3++) {
      var r3 = 0;
      while (r3 < h) {
        var ch3 = p.mappa[h - 1 - r3][c3];
        if (ch3 === '<' || ch3 === '>') { var r0 = r3; while (r3 < h && p.mappa[h - 1 - r3][c3] === ch3) r3++; L.trappole.push({ t:'spine', x:c3, y:base + r0, w:r3 - r0, dir: ch3 === '>' ? 'r' : 'l', stanza:k }); }
        else r3++;
      }
    }
    base += h;
  });

  // disegnate sono quasi tutte fisse (per le vie da oggetto): senza queste in una gara 5 oggetti su 12 non uscivano mai.
  // Non toccano la fisica e stanno fuori dalle vie: la certificazione per pezzo resta valida (costruisciProva non le mette).
  if (!pezzi.prova) L.stanze.forEach(function (st, k) {
    if (st.zona < 1 || st.zona > 3) return;
    L.casse.push({ x:(k % 2 ? 1.5 : W - 1.5), y:st.y0 + 1, stanza:k, zona:st.zona, id:0, vestibolo:true });
  });
  for (var yy = H - 4; yy < H; yy++) { M.t[yy * W] = 1; M.t[yy * W + W - 1] = 1; }
  L.trappole.forEach(function (tr) { DPM.TIPI[tr.t].prep(tr, M); });
  L.arrivoY = L.stanze[L.stanze.length - 1].y0 + 1;
  L.crolli = new DPM.Crolli(M);
  return L;
};

   Stesso codice nella pagina e nei banchi node. Nessun disegno qui: la pagina legge S.ev.
   Il tempo e' un CONTATORE DI FOTOGRAMMI (T = F/60): la pagina, il pianificatore e i bot
   vedono le trappole nello stesso identico istante. */
(function(){

  RINASCITA: 0.85,     // s da morto a di nuovo in gioco
  VIA: 3.0,            // conto alla rovescia
  // 19/09 REGOLE DEL PROPRIETARIO: la lava parte dopo 2 minuti e sale piu' piano (prima: 8 s, V0 1, ACC 0,03, VMAX 4,2,
  // in vetta verso gli 80 s). Ora in vetta verso i 218 s. Chi e' preso dalla lava e' FUORI (non rinasce).
  LAVA_RITARDO: 120.0,
  LAVA_Y0: -3.0,
  LAVA_V0: 0.80,
  LAVA_ACC: 0.015,
  LAVA_VMAX: 3.0
};
DPM.lavaY = function (Tg) {
  var t = Tg - REGOLE.LAVA_RITARDO;
  if (t <= 0) return REGOLE.LAVA_Y0;
  var tv = (REGOLE.LAVA_VMAX - REGOLE.LAVA_V0) / REGOLE.LAVA_ACC;
  if (t < tv) return REGOLE.LAVA_Y0 + REGOLE.LAVA_V0 * t + 0.5 * REGOLE.LAVA_ACC * t * t;
  return REGOLE.LAVA_Y0 + REGOLE.LAVA_V0 * tv + 0.5 * REGOLE.LAVA_ACC * tv * tv + REGOLE.LAVA_VMAX * (t - tv);
};
var FVIA = Math.round(REGOLE.VIA * 60);

  opz = opz || {};

  this.lava = REGOLE.LAVA_Y0; this.senzaLava = !!opz.senzaLava;

}

  var c = { id:o.id, nome:o.nome, look:o.look || 0, umano:!!o.umano, bot:!!o.bot,
    p:DPM.nuovoCorpo(o.x, o.y), vivo:true, tMorte:0, morti:0, stanza:0, cp:[o.x, o.y], cpK:0,
    arrivato:false, tArrivo:0, tFuori:0, yFuori:0, causa:'', inp:{ mx:0, my:0, jp:0, jh:0, usa:0, ux:0, uy:0 }, quota:o.y };
  DPM.OGGETTI.nuovoCorr(c);

};

    this.fuori(c); return;

    if (E.atterra) this.ev.push({ k:'atterra', c:c, forza:E.impatto });
    if (E.bonk) this.ev.push({ k:'bonk', c:c });
    if (E.pop) this.ev.push({ k:'pop', c:c });
    if (E.rimbalzo) this.ev.push({ k:'rimbalzo', c:c, forza:E.impatto });
    if (E.arrivoTiro) this.ev.push({ k:'aggancio', c:c });
    if (E.skid) this.ev.push({ k:'frena', c:c });

DPM.Gara = Gara;
})();

</script>

   rivettate, telai rosso sangue, acciaio verde-grigio. Il fondo e' dipinto (immagine

<script>/* client/arte_trappole.js */
/* DEAD PEAK MEAT — disegno delle trappole.
   Ogni trappola ha tre tempi leggibili: ANTICIPO (avviso: trema, si carica, lampeggia),
   COLPO (veloce, con scie e scintille), RIMBALZO (polvere, scossa, sangue che resta).
   Le lame tengono il sangue di chi ci e' morto: la mappa racconta dove muoiono gli altri. */
(function(){
var DPM = globalThis.DPM, A = DPM.ARTE, PAL = A.PAL, TAU = Math.PI * 2;
var cache = {};

function sprSega(r, S, sangue) {
  var key = 'sega' + r + '_' + S + (sangue ? 'b' : '');
  if (cache[key]) return cache[key];
  var R = r * S, pad = S * 0.25, sz = Math.ceil(2 * R + 2 * pad), c = A.tela(sz, sz), g = c.getContext('2d');
  var cx = sz / 2, cy = sz / 2, o = Math.max(2, S * 0.08);
  var n = Math.round(8 + r * 9);
  function denti(rad, ri) {
    g.beginPath();
    for (var i = 0; i < n; i++) {
      var a0 = i / n * TAU, a1 = (i + 0.55) / n * TAU, a2 = (i + 1) / n * TAU;
      var p0x = cx + Math.cos(a0) * ri, p0y = cy + Math.sin(a0) * ri;
      var p1x = cx + Math.cos(a1) * rad, p1y = cy + Math.sin(a1) * rad;
      var p2x = cx + Math.cos(a2) * ri, p2y = cy + Math.sin(a2) * ri;
      if (i === 0) g.moveTo(p0x, p0y);
      g.lineTo(p1x, p1y); g.lineTo(p2x, p2y);
    }
    g.closePath();
  }
  if (!sangue) {
    denti(R, R * 0.8); g.fillStyle = PAL.ink; g.lineJoin = 'round'; g.lineWidth = o * 2; g.stroke(); g.fill();
    denti(R - o * 0.5, R * 0.8 - o * 0.4); g.fillStyle = PAL.saw; g.fill();
    // ombra netta a mezzaluna
    g.save(); denti(R - o * 0.5, R * 0.8 - o * 0.4); g.clip();
    g.fillStyle = PAL.sawS; g.beginPath(); g.arc(cx + R * 0.28, cy + R * 0.28, R * 1.0, 0, TAU); g.arc(cx - R * 0.05, cy - R * 0.05, R * 1.02, 0, TAU, true); g.fill();
    g.restore();
    // anello interno e fori
    g.strokeStyle = PAL.sawS; g.lineWidth = o * 0.6; g.beginPath(); g.arc(cx, cy, R * 0.62, 0, TAU); g.stroke();
    for (var k = 0; k < 3; k++) {
      var a = k / 3 * TAU + 0.4; g.fillStyle = PAL.ink;
      g.beginPath(); g.ellipse(cx + Math.cos(a) * R * 0.42, cy + Math.sin(a) * R * 0.42, R * 0.13, R * 0.07, a + 1.2, 0, TAU); g.fill();
    }
    g.fillStyle = PAL.sawL; g.beginPath(); g.ellipse(cx - R * 0.35, cy - R * 0.4, R * 0.2, R * 0.07, -0.7, 0, TAU); g.fill();
    // mozzo
    g.fillStyle = PAL.ink; g.beginPath(); g.arc(cx, cy, R * 0.22 + o * 0.6, 0, TAU); g.fill();
    g.fillStyle = PAL.hub; g.beginPath(); g.arc(cx, cy, R * 0.22, 0, TAU); g.fill();
    g.fillStyle = PAL.sawS; g.beginPath(); g.arc(cx, cy, R * 0.08, 0, TAU); g.fill();
  } else {
    // strato di sangue: denti sporchi e schizzi, gira con la lama
    var Rn = DPM.rng(Math.round(r * 1000));
    g.save(); denti(R - o * 0.5, R * 0.8 - o * 0.4); g.clip();
    for (var j = 0; j < n; j++) {
      if (Rn() < 0.55) continue;
      var aa = (j + 0.5) / n * TAU;
      g.fillStyle = Rn() < 0.5 ? PAL.blood : PAL.bloodD;
      g.beginPath(); g.ellipse(cx + Math.cos(aa) * R * 0.86, cy + Math.sin(aa) * R * 0.86, R * 0.16, R * 0.08, aa, 0, TAU); g.fill();
    }
    for (var q = 0; q < 5; q++) {
      var ab = Rn() * TAU, rd = R * (0.35 + Rn() * 0.4);
      g.fillStyle = PAL.blood; g.beginPath(); g.arc(cx + Math.cos(ab) * rd, cy + Math.sin(ab) * rd, R * (0.04 + Rn() * 0.07), 0, TAU); g.fill();
    }
    // colata curva (la lama la trascina)
    g.strokeStyle = PAL.blood; g.lineWidth = R * 0.09; g.lineCap = 'round';
    g.beginPath(); g.arc(cx, cy, R * 0.72, 0.3, 1.6); g.stroke();
    g.strokeStyle = PAL.bloodL; g.lineWidth = R * 0.025; g.beginPath(); g.arc(cx, cy, R * 0.72, 0.5, 1.0); g.stroke();
    g.restore();
  }
  cache[key] = c; return c;
}

function sega(g, V, cx, cy, r, ang, sangue, veloce) {
  var S = V.S, sp = sprSega(r, S), sz = sp.width, x = V.sx(cx), y = V.sy(cy);
  g.save(); g.translate(x, y);
  // sfocatura rotazionale: due copie in coda
  g.globalAlpha = 0.22; g.rotate(-ang + 0.22); g.drawImage(sp, -sz / 2, -sz / 2);
  g.rotate(-0.11); g.globalAlpha = 0.35; g.drawImage(sp, -sz / 2, -sz / 2);
  g.rotate(-0.11); g.globalAlpha = 1; g.drawImage(sp, -sz / 2, -sz / 2);
  if (sangue > 0) { g.globalAlpha = Math.min(1, 0.35 + sangue * 0.22); g.drawImage(sprSega(r, S, true), -sz / 2, -sz / 2); g.globalAlpha = 1; }
  g.restore();
  // archi di velocita'
  var R = r * S * 1.1;
  g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = Math.max(1.5, S * 0.05); g.lineCap = 'round';
  var a0 = -V.t * 7.3 % TAU;
  g.beginPath(); g.arc(x, y, R, a0, a0 + 0.9); g.stroke();
  g.beginPath(); g.arc(x, y, R, a0 + Math.PI, a0 + Math.PI + 0.9); g.stroke();
  if (veloce > 1) {   // scia di movimento lungo il binario
    g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = r * S * 1.2;
    var ux = V.trvx || 0, uy = V.trvy || 0;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - ux * S * 0.06, y + uy * S * 0.06); g.stroke();
  }
}
A.sega = sega;

function binario(g, V, P, chiuso) {
  var S = V.S, o = Math.max(2, S * 0.08);
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  for (var i = 0; i < P.length; i++) { var x = V.sx(P[i][0]), y = V.sy(P[i][1]); if (i) g.lineTo(x, y); else g.moveTo(x, y); }
  if (chiuso) g.closePath();
  g.strokeStyle = PAL.ink; g.lineWidth = S * 0.36; g.stroke();
  g.strokeStyle = '#3b2e28'; g.lineWidth = S * 0.36 - o * 1.6; g.stroke();
  g.strokeStyle = '#6a5a50'; g.lineWidth = S * 0.06; g.stroke();
  for (var j = 0; j < P.length; j++) {   // tappi alle estremita'
    var x2 = V.sx(P[j][0]), y2 = V.sy(P[j][1]);
    g.fillStyle = PAL.ink; g.beginPath(); g.arc(x2, y2, S * 0.24, 0, TAU); g.fill();
    g.fillStyle = PAL.steel; g.beginPath(); g.arc(x2, y2, S * 0.16, 0, TAU); g.fill();
    A.rivet(g, x2, y2, S * 0.06, PAL.steelL, PAL.steelS);
  }
}

/* ---------- disegno per tipo ---------- */
var D = {};
D.sega = { dietro:true, f:function (g, tr, V) { sega(g, V, tr.cx, tr.cy, tr.r, tr.a, tr.sangue || 0, 0); } };
D.binario = { dietro:false, f:function (g, tr, V) {
  binario(g, V, tr.punti, tr.chiuso);
  V.trvx = tr.vx; V.trvy = tr.vy;
  sega(g, V, tr.cx, tr.cy, tr.r, tr.a, tr.sangue || 0, tr.vel);
} };
D.giostra = { dietro:false, f:function (g, tr, V) {
  var S = V.S, x = V.sx(tr.x), y = V.sy(tr.y);
  // anello-guida tratteggiato: si vede dove passeranno
  g.save(); g.setLineDash([S * 0.25, S * 0.2]); g.strokeStyle = 'rgba(36,21,15,0.35)'; g.lineWidth = S * 0.08;
  g.beginPath(); g.arc(x, y, tr.R * S, 0, TAU); g.stroke(); g.restore();
  for (var i = 0; i < tr.n; i++) {
    var px = V.sx(tr.pp[i][0]), py = V.sy(tr.pp[i][1]);
    g.strokeStyle = PAL.ink; g.lineWidth = S * 0.26; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y); g.lineTo(px, py); g.stroke();
    g.strokeStyle = PAL.steelS; g.lineWidth = S * 0.12; g.stroke();
  }
  for (var j = 0; j < tr.n; j++) sega(g, V, tr.pp[j][0], tr.pp[j][1], tr.r, tr.a + j, tr.sangue || 0, 0);
  g.fillStyle = PAL.ink; g.beginPath(); g.arc(x, y, S * 0.42, 0, TAU); g.fill();
  g.fillStyle = PAL.frame; g.beginPath(); g.arc(x, y, S * 0.32, 0, TAU); g.fill();
  A.rivet(g, x, y, S * 0.1, PAL.frameL, PAL.frameS);
} };
D.muro = { dietro:true, f:function (g, tr, V) {
  if (tr.out > 0.001 || tr.tele > 0) {
    var sh = tr.tele > 0 ? (Math.sin(V.t * 90) * 0.04 * tr.tele) : 0;
    sega(g, V, tr.cx, tr.cy + sh, tr.r, tr.a, tr.sangue || 0, 0);
  }
}, sopra:function (g, tr, V) {
  // feritoia nel muro, a strisce; si accende di rosso durante l'avviso
  var S = V.S, x = V.sx(tr.x), y = V.sy(tr.y), h = tr.r * 2.1 * S, w = S * 0.22;
  g.fillStyle = PAL.ink; g.fillRect(x - w, y - h / 2 - S * 0.08, w * 2, h + S * 0.16);
  var acc = tr.tele > 0 ? (0.5 + 0.5 * Math.sin(V.t * 40)) : 0;
  g.fillStyle = acc > 0 ? 'rgba(255,' + Math.round(60 + 80 * (1 - acc)) + ',40,1)' : '#2d1f1a';
  g.fillRect(x - w * 0.45, y - h / 2, w * 0.9, h);
  if (tr.tele > 0) {

  var io = !spec && (win === mioUid || (!!pari && pari.indexOf(mioUid) >= 0));
  var wc = null, wi = -1; for (var i = 0; i < RC.length; i++) if (RC[i] && RC[i].uid === win) { wc = RC[i]; wi = i; }
  // i rivali si disegnano 100 ms indietro: lo stato vero del vincitore e' nell'ULTIMO snapshot (il server lo manda
  // con over=true subito prima dell'over). Da li' si prende dove sta e se e' arrivato in vetta.
  var ult = NET.snaps.length ? NET.snaps[NET.snaps.length - 1] : null, riga = ult && ult.p && wi >= 0 ? ult.p[wi] : null;
  if (wc && wc !== me && riga) { wc.p.x = riga[1]; wc.p.y = riga[2]; wc.arrivato = !!(riga[5] & 2); wc.fuori = !!(riga[5] & 4); wc.vivo = !!(riga[5] & 1); }
  var inVetta = !!(wc && wc.arrivato && !wc.fuori);
  if (m.annullata) { annuncia('ANNULLATA', 'stanza'); }
  else if (wc || io) {
    var sotto = pari ? 'ARRIVATI INSIEME: PIATTO DIVISO' : (inVetta ? 'PRIMO IN VETTA' : (wc && !wc.fuori ? "L'ULTIMO RIMASTO IN GARA" : "L'ULTIMO A RESISTERE ALLA LAVA"));
    var nome = io ? (pari ? 'PARI: HAI VINTO!' : 'HAI VINTO!') : (pari ? 'PARI IN VETTA!' : (wc.nome || '') + (inVetta ? ' IN VETTA!' : ' VINCE!'));
    G.scena = { c: wc || me, t0: performance.now() };
    cam.trauma = 0;
    annuncia(nome, 'vincitore', sotto);
    AU.suona('arrivo'); if (io) vibra(50);
    var cc = G.scena.c;
    if (cc && cc.an) A.animaEvento(cc.an, { k:'arrivo' });
    var n = 0;
    clearInterval(fuochi.t);
    fuochi.t = setInterval(function () {
      if (++n > SCENA_S / 0.35 || !G.scena || !G.scena.c) { clearInterval(fuochi.t); return; }
      var q = G.scena.c.p; SG.scintille(q.x + Math.sin(n * 1.7) * 1.4, q.y + 1.2 + (n % 3) * 0.5, 18, Math.cos(n * 2.1), 1, 12);
      if (n % 3 === 0) AU.suona('cp', 0.5);
    }, 350);
  }
  else annuncia('PAREGGIO', 'stanza');
  setTimeout(function () {
    PONTE.sistema('fine_scena');
    if (PONTE.modo === 'ws') mostraClassifica(win);
  }, (G.scena ? SCENA_S : 1.6) * 1000);
}
function mostraClassifica(win) {
  var tab = document.getElementById('classifica'); if (!tab) return;
  tab.innerHTML = '';
  classifica().forEach(function (c, i) {
    var tr = document.createElement('tr'); if (c === me) tr.className = 'io';
    var td0 = document.createElement('td'); td0.textContent = (c.uid === win ? '🏆 ' : '') + (i + 1) + '°';
    var td1 = document.createElement('td'); td1.textContent = c.nome;
    var td3 = document.createElement('td'); td3.textContent = '☠ ' + c.morti;
    tr.appendChild(td0); tr.appendChild(td1); tr.appendChild(td3); tab.appendChild(tr);
  });
  mostra('fine', true);
}

/* ANTEPRIMA DEL LOOK (per il negozio): deadpeak.html?anteprima=1&c=blu&h=minatore&o=occhiali
   Il personaggio a tutto schermo che fa le sue pose; la pagina puo' cambiarlo con
   postMessage({dp:'giu', m:{t:'look', c, h, o}}). Nessuna rete, nessuna partita. */
function avviaAnteprima() {
  document.body.classList.add('anteprima');
  var lk = DPM.LOOK_API.crea({ colore:Q.c, cappello:Q.h, occhi:Q.o }), an = A.nuovaAnim(), t0 = performance.now(), k = 0;
  var c = { id:0, p:{ x:0, y:0, vx:0, vy:0, grounded:true, wallside:0, stun:0, skidT:0, wjLock:0, face:1, tiroT:0, magT:0, dashT:0 }, vivo:true, catT:0, ogg:0, invT:0 };
  window.addEventListener('message', function (ev) { if (ev.origin !== location.origin) return; var d = ev.data; if (d && d.dp === 'giu' && d.m && d.m.t === 'look') lk = DPM.LOOK_API.crea({ colore:d.m.c, cappello:d.m.h, occhi:d.m.o }); });
  var POSE = ['salto', 'atterra', 'arrivo', 'spinta_data', 'paura', 'bonk'];
  (function giro() {
    requestAnimationFrame(giro);
    var t = (performance.now() - t0) / 1000;
    if (t > (k + 1) * 1.4) { k++; A.animaEvento(an, { k:POSE[k % POSE.length], forza:12, dir:1 }); }
    A.animaPasso(an, c, 1 / 60, { pericolo:0, guardaX:null, guardaY:null, stordito:false, oggetto:0 });
    g.fillStyle = '#1b1f2a'; g.fillRect(0, 0, CW, CH);
    var SS = Math.min(CW, CH) * 0.34;
    A.corpo(g, c, an, CW / 2, CH * 0.78, SS, 1, lk);
  })();
}
