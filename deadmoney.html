const LANG = (new URLSearchParams(location.search).get("lang") === "en") ? "en" : "it";
const T = (it, en) => LANG === "en" ? en : it;
const BANCA = {"voce":[{"id":"intro_00","ev":"intro","it":"Benvenuti all'Hotel Ultima Mano. Il check-out è facile: basta sopravvivere.","en":"Welcome to the Hotel Ultima Mano. Checking out is easy. Staying alive is the hard part."},{"id":"intro_01","ev":"intro","it":"Accomodatevi, signori. Le sedie sono ancora calde dei vostri predecessori.","en":"Do sit down. The chairs are still warm from the last guests. Well, lukewarm."},{"id":"intro_02","ev":"intro","it":"Sono Monsieur Fiche. Una sola regola: la casa vince sempre. Anche da morta.","en":"I am Monsieur Fiche. One rule here: the house always wins. Even after it dies."},{"id":"intro_03","ev":"intro","it":"Avete un debito con la casa. Lo pagherete... in risposte.","en":"You owe the house. Tonight you'll pay it off... one answer at a time."},{"id":"intro_04","ev":"intro","it":"Puntate pure. Qui le fiche sono di plastica. Le ossa no.","en":"Place your bets. The chips are plastic. The bones are very much not."},{"id":"intro_05","ev":"intro","it":"Cent'anni chiuso, e stasera riapro solo per voi. Sentitevi onorati. E un po' condannati.","en":"Closed for a century, reopened just for you. Feel honoured. And slightly doomed."},{"id":"intro_06","ev":"intro","it":"Il mio cilindro è vuoto, il mio petto pure. Il vostro conto, invece, è pienissimo.","en":"My hat is empty, my ribcage too. Your tab, however, is very, very full."},{"id":"intro_07","ev":"intro","it":"Stasera si gioca a quiz. Chi sbaglia scende in cantina. E dalla cantina si sale male.","en":"Tonight's game is trivia. Wrong answers go to the cellar. Nobody comes back up the same."},{"id":"intro_08","ev":"intro","it":"Mi chiamano Fiche. Non perché valgo poco: perché vi cambio in fretta.","en":"They call me Fiche. Not because I'm cheap. Because I cash people in."},{"id":"intro_09","ev":"intro","it":"Niente paura: qui nessuno è mai morto di noia. Di tutto il resto, sì.","en":"Relax. Nobody here has ever died of boredom. Of everything else, yes."},{"id":"intro_10","ev":"intro","it":"Le luci si spengono a mezzanotte. Chi è ancora qui entra nel personale. A vita.","en":"Lights out at midnight. Anyone still here joins the staff. Permanently."},{"id":"intro_11","ev":"intro","it":"Mani sul tavolo, anime nel piatto. Si comincia.","en":"Hands on the table, souls in the pot. Let's begin."},{"id":"tutti_giusti_00","ev":"tutti_giusti","it":"Tutti giusti? Che noia. Mi state rovinando la serata.","en":"All correct? How tedious. You're ruining my evening."},{"id":"tutti_giusti_01","ev":"tutti_giusti","it":"Nessuno in cantina. Il becchino piange. Piangerei anch'io, ma non ho le ghiandole.","en":"Nobody for the cellar. The gravedigger weeps. So would I, if I had tear ducts."},{"id":"tutti_giusti_02","ev":"tutti_giusti","it":"Bravi tutti. Sospetto. Molto sospetto. Qualcuno conta le carte?","en":"Everyone's right. Suspicious. Very suspicious. Is someone counting cards?"},{"id":"tutti_giusti_03","ev":"tutti_giusti","it":"Il banco perde una mano. Capita. Raramente. Sempre più raramente.","en":"The house loses a hand. It happens. Rarely. Increasingly rarely."},{"id":"tutti_giusti_04","ev":"tutti_giusti","it":"Tutti vivi. Aggiungerò la mia delusione al vostro conto.","en":"All alive. I'll be adding my disappointment to your bill."},{"id":"tutti_giusti_05","ev":"tutti_giusti","it":"Che peccato, avevo appena lucidato le bare.","en":"Pity. I'd just polished the coffins."},{"id":"tutti_giusti_06","ev":"tutti_giusti","it":"Applaudirei, ma mi cadono le falangi.","en":"I'd applaud, but my knuckles keep falling off."},{"id":"tutti_giusti_07","ev":"tutti_giusti","it":"Nessun morto? E io che avevo già prenotato il carro funebre.","en":"No deaths? And I'd already booked the hearse."},{"id":"tutti_giusti_08","ev":"tutti_giusti","it":"Tutti giusti. Godetevela: la fortuna è una fiche, e le fiche rotolano.","en":"All correct. Enjoy it. Luck is a chip, and chips roll."},{"id":"tutti_giusti_09","ev":"tutti_giusti","it":"Bene, bene. Alzo la posta. La prossima ve la faccio pagare.","en":"Well, well. I'm raising the stakes. You'll pay for the next one."},{"id":"tutti_giusti_10","ev":"tutti_giusti","it":"La cantina resta vuota. Come il mio petto. Letteralmente.","en":"The cellar stays empty. Like my chest. Literally."},{"id":"tutti_giusti_11","ev":"tutti_giusti","it":"Che serata da principianti... per me.","en":"What a beginner's night. For me, sadly."},{"id":"tutti_sbagliati_00","ev":"tutti_sbagliati","it":"Tutti sbagliati! Ecco, così mi piacete.","en":"All wrong! Now that's the spirit I like."},{"id":"tutti_sbagliati_01","ev":"tutti_sbagliati","it":"Nessuno? Nemmeno uno? Il becchino fa gli straordinari.","en":"Not a single one? The gravedigger's on overtime tonight."},{"id":"tutti_sbagliati_02","ev":"tutti_sbagliati","it":"Un en plein di errori. Il banco ringrazia.","en":"A clean sweep of mistakes. The house thanks you."},{"id":"tutti_sbagliati_03","ev":"tutti_sbagliati","it":"Tutti in cantina, prego. In fila per uno, come al cimitero.","en":"Everyone to the cellar, please. Single file, like at the cemetery."},{"id":"tutti_sbagliati_04","ev":"tutti_sbagliati","it":"Meraviglioso. Era la domanda più facile dell'hotel.","en":"Marvellous. That was the easiest question in the hotel."},{"id":"tutti_sbagliati_05","ev":"tutti_sbagliati","it":"Zero per tutti. Sembrava la roulette, invece era ignoranza.","en":"Zero across the board. Looked like roulette. Was just ignorance."},{"id":"tutti_sbagliati_06","ev":"tutti_sbagliati","it":"Brindo a voi! Con un calice di quello buono. Avvelenato, s'intende.","en":"A toast to you! With the good stuff. Poisoned, naturally."},{"id":"tutti_sbagliati_07","ev":"tutti_sbagliati","it":"Sbagliare tutti insieme: che bello lo spirito di squadra.","en":"All wrong, all together. I do love team spirit."},{"id":"tutti_sbagliati_08","ev":"tutti_sbagliati","it":"Signori, la cantina ha posto per tutti. Ve l'avevo detto.","en":"Ladies and gentlemen, the cellar has room for everyone. I did warn you."},{"id":"tutti_sbagliati_09","ev":"tutti_sbagliati","it":"Che strage di neuroni. Ora passiamo al resto di voi.","en":"Such a massacre of neurons. Now for the rest of you."},{"id":"tutti_sbagliati_10","ev":"tutti_sbagliati","it":"La casa fa jackpot. E il jackpot siete voi.","en":"The house hits the jackpot. And the jackpot is you."},{"id":"tutti_sbagliati_11","ev":"tutti_sbagliati","it":"Tutti sbagliati. Mi commuovete. Quasi mi torna il battito.","en":"All wrong. I'm touched. I almost feel a pulse."},{"id":"giusto_pochi_00","ev":"giusto_pochi","it":"Pochi eletti, molti dannati. Proporzione perfetta.","en":"Few chosen, many damned. Perfect ratio."},{"id":"giusto_pochi_01","ev":"giusto_pochi","it":"Qualcuno ci è arrivato. Gli altri arriveranno in cantina.","en":"Some of you got there. The rest will get to the cellar."},{"id":"giusto_pochi_02","ev":"giusto_pochi","it":"Una manciata di geni e una mandria di condannati.","en":"A handful of geniuses and a herd of the condemned."},{"id":"giusto_pochi_03","ev":"giusto_pochi","it":"Alcuni salvi, altri saldati. Il conto torna.","en":"Some saved, some settled. The books balance."},{"id":"giusto_pochi_04","ev":"giusto_pochi","it":"La mano si divide: chi ride e chi scava.","en":"The table splits: some laugh, some dig."},{"id":"giusto_pochi_05","ev":"giusto_pochi","it":"Pochi giusti. La cantina ringrazia la maggioranza.","en":"Only a few got it. The cellar thanks the majority."},{"id":"giusto_pochi_06","ev":"giusto_pochi","it":"Complimenti ai sopravvissuti. Condoglianze agli altri. In anticipo.","en":"Congratulations to the survivors. Condolences to the rest. In advance."},{"id":"giusto_pochi_07","ev":"giusto_pochi","it":"Pochi vincitori, come in ogni casinò che si rispetti.","en":"Few winners. As in any self-respecting casino."},{"id":"giusto_pochi_08","ev":"giusto_pochi","it":"Chi ha risposto bene si goda il tavolo. Chi no, si goda il buio.","en":"Got it right? Enjoy the table. Didn't? Enjoy the dark."},{"id":"giusto_pochi_09","ev":"giusto_pochi","it":"Il banco vince a metà. Mi accontento. Per ora.","en":"The house wins half. I'll take it. For now."},{"id":"giusto_pochi_10","ev":"giusto_pochi","it":"Abbastanza vivi per fare pubblico, abbastanza condannati per fare spettacolo.","en":"Enough alive for an audience, enough doomed for a show."},{"id":"giusto_pochi_11","ev":"giusto_pochi","it":"Pochi giusti e tanti in debito. La mia divisione preferita.","en":"Few right, many in debt. My favourite split."},{"id":"fuga_inizio_00","ev":"fuga_inizio","it":"Mezzanotte si avvicina. Correte verso la porta, se avete ancora le gambe.","en":"Midnight approaches. Run for the door, if you still have legs."},{"id":"fuga_inizio_01","ev":"fuga_inizio","it":"È l'ora di chiusura, signori. Chi resta dentro diventa arredamento.","en":"Closing time, ladies and gentlemen. Anyone left inside becomes furniture."},{"id":"fuga_inizio_02","ev":"fuga_inizio","it":"La porta è laggiù. Il buio è qui dietro. Buona fortuna: ne servirà parecchia.","en":"The door's over there. The dark is right behind you. Good luck. You'll need plenty."},{"id":"fuga_inizio_03","ev":"fuga_inizio","it":"Comincia la fuga! I vivi corrono, i morti fluttuano. Io guardo.","en":"The escape begins! The living run, the dead float. I watch."},{"id":"fuga_inizio_04","ev":"fuga_inizio","it":"Uscirà un solo vivo. Gli altri mi terranno compagnia. Per sempre.","en":"Only one living soul walks out. The rest keep me company. Forever."},{"id":"fuga_inizio_05","ev":"fuga_inizio","it":"Il casinò chiude. Ultimo giro, ultima mano, ultima occasione.","en":"The casino is closing. Last round, last hand, last chance."},{"id":"fuga_inizio_06","ev":"fuga_inizio","it":"Correte! Il corridoio è lungo, le luci poche e io la bolletta non la pago.","en":"Run! The corridor is long, the lights are few, and I don't pay the electric bill."},{"id":"fuga_inizio_07","ev":"fuga_inizio","it":"Fantasmi, è il vostro momento: rubate una vita e tornate al tavolo.","en":"Ghosts, this is your moment. Steal a life and come back to the table."},{"id":"fuga_inizio_08","ev":"fuga_inizio","it":"Dodici passi verso la libertà. Contateli bene: la casa li conta meglio.","en":"Twelve steps to freedom. Count them carefully. The house counts better."},{"id":"fuga_inizio_09","ev":"fuga_inizio","it":"Le fiche non servono più. Ora conta solo chi sa le cose. E chi corre.","en":"Chips don't matter now. Only knowing things does. And running."},{"id":"fuga_inizio_10","ev":"fuga_inizio","it":"Il buio della chiusura ha fame. Io gli darei uno di voi. Anzi, tutti.","en":"The closing dark is hungry. I'd feed it one of you. Or all of you."},{"id":"fuga_inizio_11","ev":"fuga_inizio","it":"Chi arriva primo alla porta vince. Chi arriva ultimo... resta.","en":"First to the door wins. Last to the door... stays."},{"id":"buio_00","ev":"buio","it":"Il buio avanza. Chi resta indietro, resta per sempre.","en":"The dark creeps forward. Fall behind and you stay behind. Forever."},{"id":"buio_01","ev":"buio","it":"Si spegne un'altra luce. Risparmio energetico. E di clienti.","en":"Another light goes out. Saving energy. And guests."},{"id":"buio_02","ev":"buio","it":"Sentite? È il buio che mastica.","en":"Hear that? That's the dark chewing."},{"id":"buio_03","ev":"buio","it":"Un passo in più per il buio, uno in meno per voi.","en":"One more step for the dark. One fewer for you."},{"id":"buio_04","ev":"buio","it":"Il buio non ha fretta. Voi sì.","en":"The dark is in no hurry. You should be."},{"id":"buio_05","ev":"buio","it":"Le lampadine scoppiano una a una. Come certi giocatori.","en":"The bulbs pop one by one. Much like certain players."},{"id":"buio_06","ev":"buio","it":"Correte: il buio ha le gambe lunghe e nessuna pietà.","en":"Run. The dark has long legs and no mercy."},{"id":"buio_07","ev":"buio","it":"La chiusura si avvicina. Il personale della notte prende servizio.","en":"Closing time draws near. The night staff are clocking in."},{"id":"buio_08","ev":"buio","it":"Un'altra fila di tavoli inghiottita. Ed erano tavoli bellissimi.","en":"Another row of tables swallowed. Lovely tables, too."},{"id":"buio_09","ev":"buio","it":"Il buio vi sta alle calcagna. E le calcagna sono una prelibatezza.","en":"The dark is at your heels. And heels are a delicacy."},{"id":"buio_10","ev":"buio","it":"Spengo, spengo... qualcuno ha visto l'interruttore? Nemmeno io. Peccato.","en":"Lights going... anyone seen the switch? Me neither. Shame."},{"id":"buio_11","ev":"buio","it":"Il buio accelera. Gli piace il finale.","en":"The dark is speeding up. It loves a finale."},{"id":"domanda_n0","ev":"domanda","it":"Prossima domanda.","en":"Next question."},{"id":"domanda_n1","ev":"domanda","it":"Ascoltate bene.","en":"Listen carefully."},{"id":"domanda_n2","ev":"domanda","it":"Ecco la domanda. Venti secondi.","en":"Here is the question. Twenty seconds."},{"id":"domanda_n3","ev":"domanda","it":"Rien ne va plus. Rispondete.","en":"Rien ne va plus. Answer."},{"id":"domanda_n4","ev":"domanda","it":"Pensateci bene. Ma non troppo.","en":"Think it over. But not too long."},{"id":"sala_ingresso_n0","ev":"sala_ingresso","it":"Benvenuti nella Sala del Debito. Accomodatevi: non vi alzerete facilmente.","en":"Welcome to the Debt Room. Make yourselves comfortable: you will not be getting up easily."},{"id":"sala_ingresso_n1","ev":"sala_ingresso","it":"La Sala del Debito è aperta. Le regole sono semplici. Sopravvivere no.","en":"The Debt Room is open. The rules are simple. Surviving is not."},{"id":"sala_ingresso_n2","ev":"sala_ingresso","it":"Entrate, entrate. Il banco vi aspettava.","en":"Come in, come in. The house has been expecting you."},{"id":"morte_n0","ev":"morte","it":"Addio. Le sue fiche restano sul tavolo.","en":"Farewell. Their chips stay on the table."},{"id":"morte_n1","ev":"morte","it":"Un'altra anima per la mia collezione.","en":"Another soul for my collection."},{"id":"morte_n2","ev":"morte","it":"Che peccato. Era quasi simpatico.","en":"What a pity. They were almost likeable."},{"id":"morte_n3","ev":"morte","it":"Riposi in pace. O almeno, riposi.","en":"Rest in peace. Or at least, rest."},{"id":"morte_n4","ev":"morte","it":"E il banco incassa. Come sempre.","en":"And the house collects. As always."},{"id":"salvo_n0","ev":"salvo","it":"Sopravvissuto. Per ora.","en":"Survived. For now."},{"id":"salvo_n1","ev":"salvo","it":"Fortunato. La fortuna, però, si paga.","en":"Lucky. Luck, however, has a price."},{"id":"salvo_n2","ev":"salvo","it":"Vivo. Non abituartici.","en":"Alive. Do not get used to it."},{"id":"salvo_n3","ev":"salvo","it":"Ti è andata bene. Stavolta.","en":"You got away with it. This time."},{"id":"fantasma_n0","ev":"fantasma","it":"Benvenuto tra le anime. Da qui si gioca ancora, ma senza fiato.","en":"Welcome among the souls. You still play from here, just without breathing."},{"id":"fantasma_n1","ev":"fantasma","it":"Morto, ma non finito. Le anime possono ancora vincere.","en":"Dead, but not finished. Souls can still win."},{"id":"raddoppio_n0","ev":"raddoppio","it":"Raddoppio! Il coraggio mi piace. Il debito ancora di più.","en":"Double! I like courage. I like debt even more."},{"id":"raddoppio_n1","ev":"raddoppio","it":"Doppio o niente. Io tifo per niente.","en":"Double or nothing. I am rooting for nothing."},{"id":"mazzetta_n0","ev":"mazzetta","it":"Una mazzetta? Nel mio hotel? ...Accetto.","en":"A bribe? In my hotel? ...Accepted."},{"id":"mazzetta_n1","ev":"mazzetta","it":"Corruzione. Finalmente qualcuno che capisce come funziona.","en":"Corruption. Finally someone who understands how things work."},{"id":"malocchio_n0","ev":"malocchio","it":"Un malocchio dall'aldilà. Che meraviglia.","en":"An evil eye from beyond. How marvellous."},{"id":"malocchio_n1","ev":"malocchio","it":"Le anime si vendicano. Io guardo.","en":"The souls take their revenge. I just watch."},{"id":"ruba_vita_n0","ev":"ruba_vita","it":"Un'anima ha rubato una vita! Nessuno è al sicuro.","en":"A soul has stolen a life! Nobody is safe."},{"id":"ruba_vita_n1","ev":"ruba_vita","it":"Preso! La vita passa di mano, come le fiche.","en":"Got you! Life changes hands, just like chips."},{"id":"vittoria_n0","ev":"vittoria","it":"Abbiamo un vincitore. La porta si apre, il piatto è suo.","en":"We have a winner. The door opens, the pot is theirs."},{"id":"vittoria_n1","ev":"vittoria","it":"Fuori! Qualcuno ha battuto il banco. Che fastidio.","en":"Out! Somebody beat the house. How annoying."},{"id":"porta_fallita_n0","ev":"porta_fallita","it":"La porta resta chiusa. Indietro, indietro!","en":"The door stays shut. Back, back!"},{"id":"porta_fallita_n1","ev":"porta_fallita","it":"Sbagliato sulla soglia. Che crudeltà. Adoro.","en":"Wrong on the threshold. How cruel. I love it."},{"id":"sala_calici","ev":"sala_calici","it":"Stasera, per voi: I Calici!","en":"Tonight, just for you: The Chalices!"},{"id":"sala_mate","ev":"sala_mate","it":"Signori e signore... Matematica!","en":"Ladies and gentlemen... Mathematics!"},{"id":"sala_ruota","ev":"sala_ruota","it":"Ed ecco a voi: La Ruota del Perdente!","en":"And here it is: The Loser Wheel!"},{"id":"sala_monta","ev":"sala_monta","it":"Questa sì che mi diverte: Il Montacarichi!","en":"Now this one amuses me: The Dumbwaiter!"},{"id":"sala_gratta","ev":"sala_gratta","it":"Stasera, per voi: Gratta e Vinci!","en":"Tonight, just for you: Scratch and Win!"},{"id":"sala_mente","ev":"sala_mente","it":"Signori e signore... Mente Unica!","en":"Ladies and gentlemen... Mind Meld!"},{"id":"sala_avidita","ev":"sala_avidita","it":"Ed ecco a voi: Avidità!","en":"And here it is: Greed!"},{"id":"sala_prendi","ev":"sala_prendi","it":"Questa sì che mi diverte: Prendi o Lascia!","en":"Now this one amuses me: Take or Leave!"},{"id":"sala_memoria","ev":"sala_memoria","it":"Stasera, per voi: Memoria!","en":"Tonight, just for you: Memory!"},{"id":"sala_trecarte","ev":"sala_trecarte","it":"Signori e signore... Le Tre Carte!","en":"Ladies and gentlemen... Three Card Monte!"},{"id":"sala_slot","ev":"sala_slot","it":"Ed ecco a voi: La Slot da Fermare!","en":"And here it is: The Stop Slot!"},{"id":"sala_roulette","ev":"sala_roulette","it":"Questa sì che mi diverte: Roulette Coperta!","en":"Now this one amuses me: Covered Roulette!"},{"id":"sala_asta","ev":"sala_asta","it":"Stasera, per voi: L'Asta delle Anime!","en":"Tonight, just for you: The Soul Auction!"},{"id":"sala_bj","ev":"sala_bj","it":"Signori e signore... Blackjack del Banco!","en":"Ladies and gentlemen... House Blackjack!"},{"id":"sala_dadi","ev":"sala_dadi","it":"Ed ecco a voi: I Dadi del Teschio!","en":"And here it is: Skull Dice!"},{"id":"sala_cassaforte","ev":"sala_cassaforte","it":"Questa sì che mi diverte: La Cassaforte!","en":"Now this one amuses me: The Safe!"},{"id":"sala_conta","ev":"sala_conta","it":"Stasera, per voi: Conta le Fiche!","en":"Tonight, just for you: Count the Chips!"},{"id":"sala_barile","ev":"sala_barile","it":"Signori e signore... Il Barile del Banchiere!","en":"Ladies and gentlemen... The Banker's Barrel!"},{"id":"sala_tatuaggi","ev":"sala_tatuaggi","it":"Ed ecco a voi: Il Tatuatore!","en":"And here it is: The Tattoo Artist!"},{"id":"sala_specchio","ev":"sala_specchio","it":"Questa sì che mi diverte: Lo Specchio della Tredici!","en":"Now this one amuses me: The Mirror of Room Thirteen!"},{"id":"sala_ritratto","ev":"sala_ritratto","it":"Stasera, per voi: Il Ritratto!","en":"Tonight, just for you: The Portrait!"},{"id":"sala_battuta","ev":"sala_battuta","it":"Signori e signore... La Battuta Peggiore!","en":"Ladies and gentlemen... The Worst Joke!"},{"id":"sala_plinko","ev":"sala_plinko","it":"Ed ecco a voi: Il Plinko!","en":"And here it is: Plinko!"},{"id":"sala_password","ev":"sala_password","it":"Questa sì che mi diverte: La Password!","en":"Now this one amuses me: The Password!"},{"id":"sala_dita","ev":"sala_dita","it":"Stasera, per voi: Il Pegno del Dito!","en":"Tonight, just for you: The Finger Forfeit!"},{"id":"sala_duello","ev":"sala_duello","it":"Signori e signore... Il Duello!","en":"Ladies and gentlemen... The Duel!"},{"id":"sala_macchie","ev":"sala_macchie","it":"Ed ecco a voi: Le Macchie!","en":"And here it is: The Stains!"},{"id":"sala_ordini","ev":"sala_ordini","it":"Questa sì che mi diverte: Gli Ordini del Croupier!","en":"Now this one amuses me: The Croupier's Orders!"}],"dati":{"frasi":{"intro":[{"it":"Benvenuti all'Hotel Ultima Mano. Il check-out è facile: basta sopravvivere.","en":"Welcome to the Hotel Ultima Mano. Checking out is easy. Staying alive is the hard part."},{"it":"Accomodatevi, signori. Le sedie sono ancora calde dei vostri predecessori.","en":"Do sit down. The chairs are still warm from the last guests. Well, lukewarm."},{"it":"Sono Monsieur Fiche. Una sola regola: la casa vince sempre. Anche da morta.","en":"I am Monsieur Fiche. One rule here: the house always wins. Even after it dies."},{"it":"Avete un debito con la casa. Lo pagherete... in risposte.","en":"You owe the house. Tonight you'll pay it off... one answer at a time."},{"it":"Puntate pure. Qui le fiche sono di plastica. Le ossa no.","en":"Place your bets. The chips are plastic. The bones are very much not."},{"it":"Cent'anni chiuso, e stasera riapro solo per voi. Sentitevi onorati. E un po' condannati.","en":"Closed for a century, reopened just for you. Feel honoured. And slightly doomed."},{"it":"Il mio cilindro è vuoto, il mio petto pure. Il vostro conto, invece, è pienissimo.","en":"My hat is empty, my ribcage too. Your tab, however, is very, very full."},{"it":"Stasera si gioca a quiz. Chi sbaglia scende in cantina. E dalla cantina si sale male.","en":"Tonight's game is trivia. Wrong answers go to the cellar. Nobody comes back up the same."},{"it":"Mi chiamano Fiche. Non perché valgo poco: perché vi cambio in fretta.","en":"They call me Fiche. Not because I'm cheap. Because I cash people in."},{"it":"Niente paura: qui nessuno è mai morto di noia. Di tutto il resto, sì.","en":"Relax. Nobody here has ever died of boredom. Of everything else, yes."},{"it":"Le luci si spengono a mezzanotte. Chi è ancora qui entra nel personale. A vita.","en":"Lights out at midnight. Anyone still here joins the staff. Permanently."},{"it":"Mani sul tavolo, anime nel piatto. Si comincia.","en":"Hands on the table, souls in the pot. Let's begin."}],"domanda":[{"it":"Categoria: {cat}. Rispondete bene, il becchino è in pausa caffè.","en":"Category: {cat}. Answer well, the gravedigger is on his coffee break."},{"it":"Ecco a voi {cat}. Puntate il cervello: è l'ultima fiche che vi resta.","en":"Next up: {cat}. Bet your brain. It's the last chip you've got."},{"it":"{cat}. Facile, se siete vivi. Per ora lo siete.","en":"{cat}. Easy, if you're alive. Which, for now, you are."},{"it":"Giro la carta: {cat}. Vinca il più sveglio. O il meno morto.","en":"Turning the card: {cat}. May the sharpest win. Or the least dead."},{"it":"Domanda su {cat}. Venti secondi. Io ho avuto cent'anni, e guardate come sono ridotto.","en":"A question on {cat}. Twenty seconds. I had a hundred years, and look at me."},{"it":"{cat}! La mia materia preferita. Subito dopo i funerali.","en":"{cat}! My favourite subject. Right after funerals."},{"it":"Rien ne va plus: {cat}. Le risposte sono servite.","en":"Rien ne va plus: {cat}. Answers are on the table."},{"it":"Parliamo di {cat}. Chi sbaglia ne parla poi con me. In privato. Al piano di sotto.","en":"Let's talk {cat}. Get it wrong and we'll talk in private. Downstairs."},{"it":"{cat}. Pensateci bene: la casa non dà resto.","en":"{cat}. Think carefully. The house doesn't give change."},{"it":"Mischio, taglio, servo: {cat}.","en":"Shuffle, cut, deal: {cat}."},{"it":"Ecco {cat}. Vi trema la mano? Normale. Vi trema lo scheletro? Benvenuti nel club.","en":"Here's {cat}. Shaky hands are normal. Shaky bones? Welcome to the club."},{"it":"Prossima mano: {cat}. Non guardate me: io ho occhi solo per chi perde.","en":"Next hand: {cat}. Don't look at me. I only have eyes for losers."}],"tutti_giusti":[{"it":"Tutti giusti? Che noia. Mi state rovinando la serata.","en":"All correct? How tedious. You're ruining my evening."},{"it":"Nessuno in cantina. Il becchino piange. Piangerei anch'io, ma non ho le ghiandole.","en":"Nobody for the cellar. The gravedigger weeps. So would I, if I had tear ducts."},{"it":"Bravi tutti. Sospetto. Molto sospetto. Qualcuno conta le carte?","en":"Everyone's right. Suspicious. Very suspicious. Is someone counting cards?"},{"it":"Il banco perde una mano. Capita. Raramente. Sempre più raramente.","en":"The house loses a hand. It happens. Rarely. Increasingly rarely."},{"it":"Tutti vivi. Aggiungerò la mia delusione al vostro conto.","en":"All alive. I'll be adding my disappointment to your bill."},{"it":"Che peccato, avevo appena lucidato le bare.","en":"Pity. I'd just polished the coffins."},{"it":"Applaudirei, ma mi cadono le falangi.","en":"I'd applaud, but my knuckles keep falling off."},{"it":"Nessun morto? E io che avevo già prenotato il carro funebre.","en":"No deaths? And I'd already booked the hearse."},{"it":"Tutti giusti. Godetevela: la fortuna è una fiche, e le fiche rotolano.","en":"All correct. Enjoy it. Luck is a chip, and chips roll."},{"it":"Bene, bene. Alzo la posta. La prossima ve la faccio pagare.","en":"Well, well. I'm raising the stakes. You'll pay for the next one."},{"it":"La cantina resta vuota. Come il mio petto. Letteralmente.","en":"The cellar stays empty. Like my chest. Literally."},{"it":"Che serata da principianti... per me.","en":"What a beginner's night. For me, sadly."}],"tutti_sbagliati":[{"it":"Tutti sbagliati! Ecco, così mi piacete.","en":"All wrong! Now that's the spirit I like."},{"it":"Nessuno? Nemmeno uno? Il becchino fa gli straordinari.","en":"Not a single one? The gravedigger's on overtime tonight."},{"it":"Un en plein di errori. Il banco ringrazia.","en":"A clean sweep of mistakes. The house thanks you."},{"it":"Tutti in cantina, prego. In fila per uno, come al cimitero.","en":"Everyone to the cellar, please. Single file, like at the cemetery."},{"it":"Meraviglioso. Era la domanda più facile dell'hotel.","en":"Marvellous. That was the easiest question in the hotel."},{"it":"Zero per tutti. Sembrava la roulette, invece era ignoranza.","en":"Zero across the board. Looked like roulette. Was just ignorance."},{"it":"Brindo a voi! Con un calice di quello buono. Avvelenato, s'intende.","en":"A toast to you! With the good stuff. Poisoned, naturally."},{"it":"Sbagliare tutti insieme: che bello lo spirito di squadra.","en":"All wrong, all together. I do love team spirit."},{"it":"Signori, la cantina ha posto per tutti. Ve l'avevo detto.","en":"Ladies and gentlemen, the cellar has room for everyone. I did warn you."},{"it":"Che strage di neuroni. Ora passiamo al resto di voi.","en":"Such a massacre of neurons. Now for the rest of you."},{"it":"La casa fa jackpot. E il jackpot siete voi.","en":"The house hits the jackpot. And the jackpot is you."},{"it":"Tutti sbagliati. Mi commuovete. Quasi mi torna il battito.","en":"All wrong. I'm touched. I almost feel a pulse."}],"giusto_pochi":[{"it":"Pochi eletti, molti dannati. Proporzione perfetta.","en":"Few chosen, many damned. Perfect ratio."},{"it":"Qualcuno ci è arrivato. Gli altri arriveranno in cantina.","en":"Some of you got there. The rest will get to the cellar."},{"it":"Una manciata di geni e una mandria di condannati.","en":"A handful of geniuses and a herd of the condemned."},{"it":"Alcuni salvi, altri saldati. Il conto torna.","en":"Some saved, some settled. The books balance."},{"it":"La mano si divide: chi ride e chi scava.","en":"The table splits: some laugh, some dig."},{"it":"Pochi giusti. La cantina ringrazia la maggioranza.","en":"Only a few got it. The cellar thanks the majority."},{"it":"Complimenti ai sopravvissuti. Condoglianze agli altri. In anticipo.","en":"Congratulations to the survivors. Condolences to the rest. In advance."},{"it":"Pochi vincitori, come in ogni casinò che si rispetti.","en":"Few winners. As in any self-respecting casino."},{"it":"Chi ha risposto bene si goda il tavolo. Chi no, si goda il buio.","en":"Got it right? Enjoy the table. Didn't? Enjoy the dark."},{"it":"Il banco vince a metà. Mi accontento. Per ora.","en":"The house wins half. I'll take it. For now."},{"it":"Abbastanza vivi per fare pubblico, abbastanza condannati per fare spettacolo.","en":"Enough alive for an audience, enough doomed for a show."},{"it":"Pochi giusti e tanti in debito. La mia divisione preferita.","en":"Few right, many in debt. My favourite split."}],"sala_ingresso":[{"it":"{nomi}, da questa parte prego: {sala}. Non toccate le pareti, sono appiccicose.","en":"{nomi}, this way please: {sala}. Don't touch the walls. They're sticky."},{"it":"Benvenuti in {sala}, {nomi}. Qui l'unica cosa che si rimborsa è il dolore.","en":"Welcome to {sala}, {nomi}. The only thing we refund here is pain."},{"it":"{nomi}: il vostro tavolo è pronto. Si chiama {sala}.","en":"{nomi}, your table is ready. It's called {sala}."},{"it":"Scendete, {nomi}. {sala} vi aspetta, e ha un certo appetito.","en":"Down you go, {nomi}. {sala} is waiting. It's feeling peckish."},{"it":"{nomi}, il debito si paga in {sala}. Contanti, carta o anima.","en":"{nomi}, debts are settled in {sala}. Cash, card or soul."},{"it":"Ah, {nomi}. Vi presento {sala}. Siate gentili, è sensibile.","en":"Ah, {nomi}. Meet {sala}. Be nice, it's sensitive."},{"it":"{sala} apre le porte a {nomi}. Chiudetele piano: l'ultimo le ha sbattute. Per sempre.","en":"{sala} opens its doors for {nomi}. Close them gently. The last guest slammed them. Forever."},{"it":"{nomi}, avete vinto un soggiorno in {sala}. Tutto incluso, uscita esclusa.","en":"{nomi}, you've won a stay in {sala}. All-inclusive. Exit not included."},{"it":"Signore e signori, {nomi} giocano in {sala}. Fate il vostro gioco.","en":"Ladies and gentlemen, {nomi} are playing {sala}. Place your bets."},{"it":"{nomi}, in {sala} si vince la vita. O no. Gioco equo, più o meno.","en":"{nomi}, in {sala} you win your life. Or don't. Perfectly fair. Roughly."},{"it":"Per {nomi}, stasera, solo il meglio: {sala}.","en":"For {nomi}, only the finest tonight: {sala}."},{"it":"{nomi}: {sala}. Niente di personale. Anzi, tutto molto personale.","en":"{nomi}: {sala}. Nothing personal. Actually, it's very personal."}],"morte":[{"it":"{nome} ha incassato. Per l'ultima volta.","en":"{nome} has cashed out. For the last time."},{"it":"Addio, {nome}. Le tue fiche restano sul tavolo. Tu, un po' più sotto.","en":"Farewell, {nome}. Your chips stay on the table. You, a bit further down."},{"it":"{nome} è andato all-in con la vita. E ha perso la mano.","en":"{nome} went all-in with their life. And lost the hand."},{"it":"Rien ne va plus, {nome}. Proprio più niente.","en":"Rien ne va plus, {nome}. Nothing goes. Ever again."},{"it":"{nome} lascia il tavolo. In orizzontale.","en":"{nome} leaves the table. Horizontally."},{"it":"Ecco, {nome}: ora sei dead money. Letteralmente.","en":"There you go, {nome}. You're officially dead money."},{"it":"{nome}, la casa ringrazia per la partecipazione. E per l'anima.","en":"{nome}, the house thanks you for playing. And for the soul."},{"it":"Un minuto di silenzio per {nome}. Basta, è passato.","en":"A minute's silence for {nome}. That'll do, moving on."},{"it":"{nome} è passato a miglior tavolo.","en":"{nome} has gone on to a better table."},{"it":"Il banco ritira {nome}. Mano chiusa.","en":"The house collects {nome}. Hand over."},{"it":"{nome} ha sballato. A ventuno e anche a respirare.","en":"{nome} went bust. At twenty-one, and at breathing."},{"it":"Riposa in pace, {nome}. Anzi: in pegno.","en":"Rest in peace, {nome}. Or rather, in pawn."}],"salvo":[{"it":"{nome} si salva. Che fortuna. Che noia.","en":"{nome} survives. How lucky. How dull."},{"it":"Ancora vivo, {nome}? Ti tengo d'occhio. Quello che mi resta.","en":"Still alive, {nome}? I've got my eye on you. Well, my socket."},{"it":"{nome} esce dalla sala con tutte le ossa. Ancora dentro la pelle, per ora.","en":"{nome} leaves with every bone intact. Still inside the skin, for now."},{"it":"Complimenti, {nome}. Il becchino ti saluta: arrivederci, non addio.","en":"Well done, {nome}. The gravedigger waves. It's see you later, not goodbye."},{"it":"{nome}, hai battuto il banco. Non ci fare l'abitudine.","en":"{nome}, you beat the house. Don't make a habit of it."},{"it":"Salvo per un pelo, {nome}. Io i peli li ho persi nel 1926.","en":"Saved by a hair, {nome}. I lost mine back in 1926."},{"it":"{nome} sopravvive. La mia bara preferita resta vuota.","en":"{nome} survives. My favourite coffin stays empty."},{"it":"Bravo, {nome}. Torna al tavolo: la cantina ti ha sputato.","en":"Bravo, {nome}. Back to the table. The cellar spat you out."},{"it":"{nome} vive! Qualcuno avvisi il fioraio: ordine annullato.","en":"{nome} lives! Somebody call the florist. Cancel the wreath."},{"it":"Che mano, {nome}. Sembrava persa, e invece eccoti.","en":"What a hand, {nome}. Looked dead, and yet here you are."},{"it":"{nome}, la Morte ti ha guardato e ha detto: passo.","en":"{nome}, Death took one look at you and folded."},{"it":"Ti è andata bene, {nome}. La prossima volta porto i dadi truccati.","en":"Lucky you, {nome}. Next time I'm bringing loaded dice."}],"fantasma":[{"it":"{nome}, ora sei un'anima in pegno. Rispondi pure: i morti hanno tempo.","en":"{nome}, you're a soul in pawn now. Keep answering. The dead have time."},{"it":"Coraggio, {nome}: da morto almeno non paghi il coperto.","en":"Cheer up, {nome}. At least the dead don't pay a cover charge."},{"it":"{nome}, la trasparenza ti dona. Davvero.","en":"{nome}, transparency suits you. Truly."},{"it":"Non piangere, {nome}. Anch'io ho cominciato così, e guarda che carriera.","en":"Don't cry, {nome}. I started out like this too. Look at me now."},{"it":"{nome}, i fantasmi possono ancora rubare una vita. Io non ti ho detto niente.","en":"{nome}, ghosts can still steal a life. You didn't hear it from me."},{"it":"Ehi {nome}, attraverso i muri si sbircia benissimo.","en":"Psst, {nome}. Walls are great for peeking through now."},{"it":"{nome}, la morte è solo una pausa. Lunga. Molto lunga.","en":"{nome}, death is just a break. A long one. A very long one."},{"it":"Fantasma {nome}, niente rumore di catene durante le domande, grazie.","en":"Ghost {nome}, kindly don't rattle your chains during the questions."},{"it":"{nome}, morto ma non eliminato. È il bello di questo hotel.","en":"{nome}, dead but not out. That's the charm of this hotel."},{"it":"Su con la vita, {nome}. Ah, scusa: modo di dire.","en":"Look on the bright side of life, {nome}. Oh. Sorry. Poor choice of words."},{"it":"{nome}, da adesso giochi senza peso. Letteralmente.","en":"{nome}, from now on you play weightless. Literally."},{"it":"{nome}, dall'aldilà si vede benissimo il tavolo. Approfittane.","en":"{nome}, the afterlife has a lovely view of the table. Make use of it."}],"raddoppio":[{"it":"{nome} raddoppia! Che coraggio. O che follia. Al casinò sono sinonimi.","en":"{nome} doubles down! Such courage. Or madness. Same thing in a casino."},{"it":"Raddoppio per {nome}. Il doppio delle fiche, il doppio della bara.","en":"Double for {nome}. Twice the chips, twice the coffin."},{"it":"{nome} alza la posta. Mi piaci: hai la faccia di chi perde in grande.","en":"{nome} ups the stakes. I like you. You've got the face of a big loser."},{"it":"Raddoppio! {nome}, spero che tu sappia la risposta. Io sì.","en":"Double! {nome}, I hope you know the answer. I certainly do."},{"it":"{nome} punta doppio. Il becchino prende le misure due volte.","en":"{nome} bets double. The gravedigger measures twice."},{"it":"Ah, {nome}, la febbre del gioco. Qui la curiamo col freddo della cantina.","en":"Ah, {nome}, gambling fever. We cure it with a cold cellar."},{"it":"{nome} raddoppia. O si vola alto, o si cade in basso. Molto in basso.","en":"{nome} doubles. Either you fly high or fall low. Basement low."},{"it":"Doppio o niente per {nome}. Io tifo niente.","en":"Double or nothing for {nome}. I'm rooting for nothing."},{"it":"{nome} raddoppia! Applausi. E una pala, per sicurezza.","en":"{nome} doubles! Applause. And a shovel, just in case."},{"it":"Che audacia, {nome}. Gli audaci me li ricordo tutti. Dalle lapidi.","en":"Bold move, {nome}. I remember all the bold ones. By their headstones."},{"it":"{nome} ha detto RADDOPPIO. Il banco ha detto: finalmente.","en":"{nome} said DOUBLE. The house said: finally."},{"it":"Raddoppio accettato, {nome}. Regole semplici: o gloria, o metà di tutto.","en":"Double accepted, {nome}. Simple rules: glory, or half of everything."}],"mazzetta":[{"it":"{nome} mi allunga una mazzetta. Che maleducato. Accetto.","en":"{nome} slips me a bribe. How rude. Accepted."},{"it":"Corruzione? Nel mio hotel? {nome}, mi conosci troppo bene.","en":"Bribery? In my hotel? {nome}, you know me far too well."},{"it":"Grazie, {nome}. La cantina può aspettare. Le tue fiche no.","en":"Thank you, {nome}. The cellar can wait. Your chips cannot."},{"it":"{nome} paga e passa. I soldi non fanno la felicità, ma la salvezza sì.","en":"{nome} pays and walks. Money can't buy happiness. Survival, though..."},{"it":"Millecinquecento fiche, {nome}? Per te chiudo un occhio. Anzi, due orbite.","en":"Fifteen hundred chips, {nome}? For you, I'll look away. With both empty sockets."},{"it":"Affare fatto, {nome}. Non ho visto niente. Non ti ho mai visto.","en":"Deal, {nome}. I saw nothing. I never saw you."},{"it":"{nome} unge le ossa del croupier. Una nobile tradizione.","en":"{nome} greases the croupier's bones. A fine old tradition."},{"it":"Che eleganza, {nome}: pagare per non soffrire. Un vero signore.","en":"Such class, {nome}. Paying to skip the suffering. A true gentleman."},{"it":"Mazzetta incassata. {nome}, sei libero. Più povero, ma libero.","en":"Bribe pocketed. {nome}, you're free. Poorer, but free."},{"it":"{nome}, ricordati chi ti ha salvato. Te lo ricorderò io, durante la fuga.","en":"{nome}, remember who saved you. I'll remind you during the escape."},{"it":"Ah, {nome}, il profumo delle fiche fresche. Vai, vai.","en":"Ah, {nome}, the scent of fresh chips. Off you go."},{"it":"{nome} compra un biglietto per uscire dalla cantina. Solo andata.","en":"{nome} buys a ticket out of the cellar. One way only."}],"malocchio":[{"it":"{nome} getta il malocchio su {vittima}. Le risposte ballano, il timer sparisce.","en":"{nome} puts the evil eye on {vittima}. Answers dance, the timer vanishes."},{"it":"Brrr. {vittima}, senti freddo? È {nome} che ti fissa dall'aldilà.","en":"Brr. Feeling a chill, {vittima}? That's {nome} staring at you from beyond."},{"it":"{nome} ha scelto {vittima}. I fantasmi non perdonano. E non dimenticano.","en":"{nome} has picked {vittima}. Ghosts don't forgive. Or forget."},{"it":"Malocchio! Per {vittima}, da {nome}, con affetto.","en":"Evil eye! For {vittima}, from {nome}, with love."},{"it":"{vittima}, qualcuno ti ha maledetto. Indizio: è morto e si chiama {nome}.","en":"{vittima}, someone's cursed you. Hint: they're dead and their name is {nome}."},{"it":"{nome} soffia sulle carte di {vittima}. Che vento gelido. Che mano sfortunata.","en":"{nome} blows on {vittima}'s cards. Icy wind. Unlucky hand."},{"it":"Uh, {vittima}, {nome} ti ha portato iella. Tocca ferro. Ah, è arrugginito.","en":"Ooh, {vittima}, {nome} just jinxed you. Knock on wood. Ah. It's rotten."},{"it":"{nome} si vendica su {vittima}. Nel mio hotel i conti si saldano sempre.","en":"{nome} takes revenge on {vittima}. In my hotel, every debt gets settled."},{"it":"Le risposte di {vittima} non stanno ferme. Colpa di {nome}, non mia. Stavolta.","en":"{vittima}'s answers won't sit still. Blame {nome}. Not me. This time."},{"it":"{nome} ha uno sguardo che uccide. Per {vittima}, non è un modo di dire.","en":"{nome} has a look that kills. For {vittima}, that's not a metaphor."},{"it":"Maledizione servita: da {nome} a {vittima}. Buon appetito.","en":"Curse served: from {nome} to {vittima}. Bon appétit."},{"it":"{vittima}, non   for (const n of SND_NOMI) carica("snd/"+n+".mp3").then(b => { if (b) AU.buf[n] = b; });
  for (const n of MUS_NOMI) carica("mus/"+n+".mp3").then(b => { if (b){ AU.musBuf[n] = b; if (AU.musName === n && !AU.cur) musica(n, true); } });

    case "tic": return tone(900,0.04,"square",0.04);

    case "fiche": case "soldi": case "jackpot": case "pioggia": case "mazzetta": case "raddoppio": tone(1320,0.06,"square",0.05); return tone(1760,0.1,"square",0.05,0,0.06);

  const l = VOCI[ev]; if (!l || !AU.vocOn || !AU.ctx || AUTO) return null;

const ATMO = { mode:"salone", parts:[], fog:[], t:0, run:true };
function atmoInit(){
  const cv = $("#atmo"), x = cv.getContext("2d");
  const fit = () => { cv.width = Math.round(cv.clientWidth * 0.75); cv.height = Math.round(cv.clientHeight * 0.75); };
  fit(); addEventListener("resize", fit);
  for (let i=0;i<46;i++) ATMO.parts.push({x:Math.random(), y:Math.random(), r:rnd(0.6,2.2), v:rnd(0.004,0.018), a:rnd(0,6.28), s:rnd(0.2,0.8)});
  for (let i=0;i<6;i++) ATMO.fog.push({x:Math.random(), y:rnd(0.45,1), r:rnd(0.35,0.7), v:rnd(-0.01,0.01)});
  let last = 0;
  const loop = ts => {
    requestAnimationFrame(loop);
    if (document.hidden || ts - last < 33) return; const dt = Math.min(0.1,(ts-last)/1000); last = ts; ATMO.t += dt;
    const W = cv.width, H = cv.height; x.clearRect(0,0,W,H);
    const m = ATMO.mode;
    const fogCol = m === "sala" ? "120,20,30" : m === "fuga" ? "40,30,20" : "121,227,210";
    for (const f of ATMO.fog){ f.x += f.v*dt; if (f.x < -0.4) f.x = 1.4; if (f.x > 1.4) f.x = -0.4;
      const g = x.createRadialGradient(f.x*W, f.y*H, 0, f.x*W, f.y*H, f.r*W); g.addColorStop(0,`rgba(${fogCol},${m==="titolo"?0.10:0.07})`); g.addColorStop(1,`rgba(${fogCol},0)`);
      x.fillStyle = g; x.fillRect(0,0,W,H); }
    for (const p of ATMO.parts){
      p.a += dt*p.s;
      if (m === "sala"){ p.y -= p.v*dt*4; p.x += Math.sin(p.a)*0.0008; if (p.y < -0.02){ p.y = 1.02; p.x = Math.random(); } }
      else { p.y += p.v*dt*0.6; p.x += Math.sin(p.a)*0.0006; if (p.y > 1.02){ p.y = -0.02; p.x = Math.random(); } }
      const fl = 0.5 + 0.5*Math.sin(p.a*3);
      x.fillStyle = m === "sala" ? `rgba(255,${90+fl*60|0},40,${0.35+fl*0.4})` : m === "fuga" ? `rgba(255,220,150,${0.15+fl*0.25})` : `rgba(255,236,190,${0.12+fl*0.25})`;
      x.beginPath(); x.arc(p.x*W, p.y*H, p.r*(m==="sala"?1.1:1), 0, 6.283); x.fill();
    }
    /* sfarfallio della luce */
    const fl = Math.random() < 0.012 ? rnd(0.08,0.2) : 0;
    if (fl){ x.fillStyle = `rgba(0,0,0,${fl})`; x.fillRect(0,0,W,H); }
  };
  if (!AUTO) requestAnimationFrame(loop);
}

/* un bot disegna: qualità q 0..1 → tremolio, tratti persi, pasticci. `seme` = lo stesso disegno su ogni telefono

function rngSeme(a){ a = (a >>> 0) || 1; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  const R = rngSeme(seme), U = (x,y) => x + R()*(y-x);
  const pezzi = soggetti.slice(0, q > 0.45 ? 2 : 1).map(k => (SOGGETTI[k]||SOGGETTI.teschio)());
  const posti = pezzi.length === 1 ? [[50,50,0.9]] : [[33,52,0.56],[70,46,0.52]];
  const amp = (1-q)*7, rot = (R()-0.5)*(1-q)*0.6, out = [];

    }

  if (!out.length) out.push(pezzi[0][0].map(([x,y]) => [x + U(-amp,amp), y + U(-amp,amp)]));
  if (q < 0.3){ const k = 1 + Math.floor(R()*3); for (let n=0;n<k;n++){ let x = U(20,80), y = U(20,80); out.push(Array.from({length:14},()=>[x+=U(-9,9), y+=U(-9,9)])); } }
  return out;
}

const trattiDaFilo = t => (t||[]).map(st => { const o = []; for (let i=0;i+1<st.length;i+=2) o.push([st[i], st[i+1]]); return o; }).filter(s => s.length);
function trattiSulFilo(strokes, maxPunti=900){

  return strokes.slice(0,60).map(st => { const o = []; st.forEach(([x,y],i) => { if (i % passo === 0 || i === st.length-1) o.push(Math.max(0,Math.min(100,Math.round(x))), Math.max(0,Math.min(100,Math.round(y)))); }); return o; }).filter(s => s.length >= 2);

/* i tratti ritagliati sul loro ingombro, dentro un'immagine W×H trasparente (la parola scritta sullo specchio) */
function trattiInImmagine(strokes, W, H, color, lw){
  const xs = strokes.flat().map(p=>p[0]), ys = strokes.flat().map(p=>p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  const s = Math.min((W*0.9)/Math.max(1,x1-x0), (H*0.8)/Math.max(1,y1-y0)), ox = (W - (x1-x0)*s)/2, oy = (H - (y1-y0)*s)/2;
  x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = color; x.lineWidth = Math.max(3, lw*s*0.9);
  for (const st of strokes){ x.beginPath(); st.forEach(([a,b],i) => { const X = ox+(a-x0)*s, Y = oy+(b-y0)*s; i ? x.lineTo(X,Y) : x.moveTo(X,Y); }); if (st.length===1) x.lineTo(ox+(st[0][0]-x0)*s+0.1, oy+(st[0][1]-y0)*s); x.stroke(); }

function tracciaTratti(ctx, strokes, o={}){

/* la lavagna del giocatore: un canvas dove si disegna col dito, i tratti escono in 0..100 */
function lavagna(host, fondo, o={}){
  const cv = document.createElement("canvas"); cv.width = cv.height = 640; cv.className = "lav"; host.appendChild(cv);
  const ctx = cv.getContext("2d"), strokes = []; let cur = null, col = o.color || "#1b140c";
  const ridisegna = () => { FONDI[fondo](ctx); tracciaTratti(ctx, strokes, {color:col, lw:o.lw, pad:0}); };
  const pt = e => { const r = cv.getBoundingClientRect(); return [Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)), Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))]; };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = [pt(e)]; cur.c = col; strokes.push(cur); ridisegna(); sfx("blip",{vol:.15,vary:true}); });
  cv.addEventListener("pointermove", e => { if (!cur) return; const p = pt(e), l = cur[cur.length-1]; if (Math.hypot(p[0]-l[0],p[1]-l[1]) > 0.7){ cur.push(p); ridisegna(); } });
  const su = () => { cur = null; }; cv.addEventListener("pointerup", su); cv.addEventListener("pointercancel", su);
  ridisegna();
  return { cv, strokes, colore(c){ col = c; }, annulla(){ strokes.pop(); ridisegna(); }, pulisci(){ strokes.length = 0; ridisegna(); } };
}

  if (nuovo) show(testa(g, T("risultato","result"), "") + `<div class="list">${barre(g, 14)}</div>`);
};
const COL4 = [[T("ROSSO","RED"),"#e0364b"],[T("VERDE","GREEN"),"#3fbf6a"],[T("ORO","GOLD"),"#e2b347"],[T("BLU","BLUE"),"#4c8fe0"]];
const SEMI4 = [["♥",T("CUORI","HEARTS"),"#e0364b"],["♦",T("QUADRI","DIAMONDS"),"#e0364b"],["♣",T("FIORI","CLUBS"),"#efe4cc"],["♠",T("PICCHE","SPADES"),"#efe4cc"]];
function ordineHTML(o){
  let d, bt;
  if (o.t === "basso" || o.t === "alto"){ d = o.t === "alto" ? T("Tocca il numero PIÙ ALTO","Tap the HIGHEST number") : T("Tocca il numero PIÙ BASSO","Tap the LOWEST number"); bt = o.n.map(x => `<b class="on">${x}</b>`); }
  else if (o.t === "colore"){ d = T("Tocca la parola scritta in ","Tap the word written in ") + COL4[o.k][0]; bt = o.parole.map((w,i) => `<b class="on" style="color:${COL4[o.tinte[i]][1]}">${COL4[w][0]}</b>`); }
  else if (o.t === "seme"){ d = T("Tocca la carta di ","Tap the card of ") + SEMI4[o.k][1]; bt = o.semi.map(s => `<b class="on" style="color:${SEMI4[s][2]};font-size:40px">${SEMI4[s][0]}</b>`); }
  else { d = T("NON toccare il teschio","DON'T tap the skull"); bt = [0,1,2,3].map(i => i === o.sk ? `<b class="on" style="font-size:38px">☠</b>` : `<b class="on" style="font-size:38px;color:#e2b347">◉</b>`); }
  return `<div class="big ord">${d}</div><div class="ordg">${bt.map((h,i)=>`<button data-i="${i}">${h}</button>`).join("")}</div>`;
}

/* ---------- LA RUOTA ---------- */
VISTE_SALA.ruota = (g, S, nuovo) => {
  if (g.passo === "gira"){
    if (nuovo){ const sono = tocca(g);
      show(testa(g, "", sono ? T("Tocca a te. Gira.","Your turn. Spin.") : T("I condannati girano la ruota…","The condemned spin the wheel…"), sono) + (sono ? `<button class="cta" id="g">${T("GIRA LA RUOTA","SPIN THE WHEEL")}</button>` : "") + guarda(g, T("ha girato","spun")));
      $("#g") && ($("#g").onclick = () => { sfx("lock"); salaAct(1); $("#g").disabled = true; });
    } else aggiornaVivo(g.fatto, T("ha girato","spun"));
    return;
  }
  if (!nuovo) return;
  const r = g.riv || {}, vita = r.vita || {}, fin = r.fin || {};
  show(testa(g, T("la ruota gira","the wheel spins"), "") + `<div class="ruote">${condP(g).map(p => { const v = vita[p.id];
    const segs = Array(6).fill(0).map((_,i)=> i===v ? "#3fbf6a" : (i%2?"#7d0f1f":"#15100c"));
    return `<div class="r1"><div class="sl-who">${avatarHTML(p)}<b>${esc(nomeDi(p))}</b></div><div class="wheelPin"></div><div class="wheel sm" id="wh${p.id}" style="background:conic-gradient(${segs.map((c,i)=>`${c} ${i*60}deg ${(i+1)*60}deg`).join(",")})">${Array(6).fill(0).map((_,i)=>`<b style="transform:rotate(${i*60+30}deg) translate(-50%,-62px) rotate(90deg);color:${i===v?"#04210f":"#efe4cc"}">${i===v?T("VITA","LIFE"):"☠"}</b>`).join("")}</div></div>`; }).join("")}</div>`);
  dopoRivela(g, S, async () => { await sleep(60); sfx("ruota");
    for (const p of condP(g)){ const w = $("#wh"+p.id); const f = fin[p.id]; if (w){ w.style.transitionDuration = "3.4s"; w.style.transform = `rotate(${360*5 + (360 - (f*60 + 30))}deg)`; } }
    await sleep(3500); for (const p of condP(g)) if (fin[p.id] === vita[p.id]){ sfx("salvo"); flash("g"); } else { sfx("teschio"); } });
};

/* ---------- IL MONTACARICHI ---------- */
VISTE_SALA.monta = (g, S, nuovo) => {
  const sc = g.scelte || {};
  const porte = (cliccabile) => `<div class="doors">${[0,1].map(d => `<${cliccabile?"button":"div"} class="door ${cliccabile && sc[ST.me]===d?"sel":""}" data-d="${d}" id="dr${d}"><span class="dn">${d?T("DESTRA","RIGHT"):T("SINISTRA","LEFT")}</span><span class="who">${condP(g).filter(p=>sc[p.id]===d).map(p=>avatarHTML(p)).join("")}</span></${cliccabile?"button":"div"}>`).join("")}</div>`;
  if (g.passo === "scegli"){
    const gioco = inCond(g) && !ST.spec;
    const firma = JSON.stringify(sc);
    if (nuovo || firma !== ST.loc.firma){
      if (!nuovo && ST.loc.firma) sfx("passo",{vol:.5});
      ST.loc.firma = firma;
      show(testa(g, g.solo ? T("in uno c'è la bomba","one has the bomb") : T("vedete le scelte, potete cambiare","you see the choices, you can switch"), "", gioco) + porte(gioco));
      document.querySelectorAll("button.door").forEach(b => b.onclick = () => { sfx("tap"); salaAct(+b.dataset.d); });
    }
    return;
  }
  if (!nuovo) return;
  const r = g.riv || {};
  show(testa(g, T("si sale","going up"), "") + porte(false));
  dopoRivela(g, S, async () => { sfx("ascensore"); await sleep(1200);
    if (r.cade >= 0){ const d = $("#dr"+r.cade); if (d){ d.classList.add("fall"); d.querySelector(".dn").textContent = T("GIÙ!","DOWN!"); } sfx("crollo"); shake(); }
    else sayQ(T("Tutti nello stesso ascensore. Che spirito di squadra. Salite, salite.","All in the same lift. Such team spirit. Up you go."), {espr:"deluso"}); });
};

/* ---------- GRATTA E VINCI ---------- */
VISTE_SALA.gratta = (g, S, nuovo) => {
  const ap = g.aperte || {};
  const cella = (v) => v === "c" ? `<span class="cc">◉</span>` : v === "x" ? "☠" : "·";
  const griglia = (sg, cliccabile) => { const a = new Map((ap[sg]||[]).map(([i,v]) => [i,v]));
    return `<div class="grid3">${Array(9).fill(0).map((_,i)=> a.has(i) ? `<div class="cell open ${a.get(i)==="c"?"coinc":a.get(i)==="x"?"skull":""}">${cella(a.get(i))}</div>` : `<${cliccabile?"button":"div"} class="cell" data-i="${i}"></${cliccabile?"button":"div"}>`).join("")}</div>`; };
  const conta = sg => (ap[sg]||[]).filter(([i,v]) => v === "c").length;
  const firma = JSON.stringify(ap);
  if (!nuovo && firma === ST.loc.firma && g.passo !== "rivela") return;
  const prima = ST.loc.firma ? JSON.parse(ST.loc.firma) : {};
  ST.loc.firma = firma;
  const gioco = inCond(g) && !ST.spec && g.passo === "gratta" && !(g.fatto || []).includes(ST.me);
  const altri = condP(g).filter(p => !p.me || ST.spec);
  show(testa(g, g.passo === "rivela" ? T("le carte","the cards") : T("trova 3 fiche prima del teschio","find 3 chips before the skull"), "", gioco) +
    (inCond(g) && !ST.spec ? `<div class="sl-who">${avatarHTML(io())}<b>${T("La tua carta","Your card")}</b><span>${conta(ST.me)}/3</span></div>` + griglia(ST.me, gioco) : "") +
    `<div class="mini">${altri.map(p => `<div><div class="sl-who">${avatarHTML(p)}<b>${esc(nomeDi(p))}</b><span>${conta(p.id)}/3</span></div>${griglia(p.id, false)}</div>`).join("")}</div>`);
  document.querySelectorAll("button.cell").forEach(b => b.onclick = () => { sfx("gratta",{vary:true}); haptic("soft"); salaAct(+b.dataset.i); b.disabled = true; });
  for (const p of condP(g)){ const n = (ap[p.id]||[]).length, n0 = (prima[p.id]||[]).length; if (n > n0){ const v = ap[p.id][n-1][1]; if (v === "x"){ sfx("teschio"); if (p.me) shake(); } else if (v === "c") sfx("fiche",{vol:.5}); else sfx("gratta",{vol:.4}); } }
};

/* ---------- MENTE UNICA ---------- */
VISTE_SALA.mente = (g, S, nuovo) => {
  if (g.passo === "scrivi"){
    if (nuovo){ const sono = tocca(g);
      show(testa(g, "", esc(fl(g.cat)), sono) + (sono ? `<div class="note">${inCond(g) ? T("Non scrivere quello che scriverebbero gli altri.","Don't write what the others would.") : T("Se scrivi la stessa parola del condannato, muore e tu prendi 500 fiche.","If you write the same word as the condemned, they die and you get 500 chips.")}</div><div class="field"><input type="text" id="w" maxlength="20" autocomplete="off" placeholder="${T("scrivi...","write...")}"></div><button class="cta" id="ok">${T("CONFERMA","CONFIRM")}</button>` : "") + guarda(g, T("ha scritto","wrote")));
      const inp = $("#w"); if (inp){ setTimeout(() => inp.focus(), 50); inp.oninput = () => sfx("blip");
        const go = () => { const v = inp.value.trim(); if (!v) return; sfx("lock"); salaAct(null, null, {tx:v}); inp.disabled = true; $("#ok").disabled = true; }; $("#ok").onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); }; }
    } else aggiornaVivo(g.fatto, T("ha scritto","wrote"));
    return;
  }
  if (!nuovo) return;
  const pa = (g.riv || {}).parole || {};
  show(testa(g, esc(fl(g.cat)), "") + `<div class="list" id="ml"></div>`);
  dopoRivela(g, S, async () => { for (const sg of (g.scrivono || [])){ const p = pDi(sg); const el = $("#ml"); if (!el || !p) continue; const morto = (g.morti||[]).includes(sg);
    el.insertAdjacentHTML("beforeend", `<div class="li ${morto?"dead":(g.cond||[]).includes(sg)?"safe":""}">${avatarHTML(p)}<span>${esc(nomeDi(p))}</span><span class="s">${esc(fl(pa[sg]) || "—")}</span></div>`); sfx(morto?"teschio":"carta",{vol:.6}); await sleep(450); } });
};

/* ---------- AVIDITÀ ---------- */
function cursore(id, max, passo, val){ return `<div class="num" id="${id}v">${fmt(val)}</div><input type="range" id="${id}" min="0" max="${max}" step="${passo}" value="${val}" aria-label="valore">`; }
VISTE_SALA.avidita = (g, S, nuovo) => {
  if (g.passo === "scegli"){
    if (nuovo){ const sono = tocca(g);
      show(testa(g, inCond(g) ? "" : T("giochi anche tu, ma non rischi","you play too, without risk"), sono ? T("Quante fiche vuoi?","How many chips do you want?") : T("Scrivono quante fiche vogliono…","Writing how many chips they want…"), sono) +
        (sono ? cursore("r", 1000, 10, 500) + `<button class="cta" id="ok">${T("SIGILLA","SEAL IT")}</button>` : "") + guarda(g, T("busta sigillata","envelope sealed")));
      const r = $("#r"); if (r){ r.oninput = () => { $("#rv").textContent = fmt(+r.value); sfx("tic",{vol:.4,rate:0.8+r.value/1000}); }; $("#ok").onclick = () => { sfx("lock"); salaAct(+r.value); r.disabled = true; $("#ok").disabled = true; }; }
    } else aggiornaVivo(g.fatto, T("busta sigillata","envelope sealed"));
    return;
  }
  if (!nuovo) return;
  const r = g.riv || {}, num = r.num || {};
  show(testa(g, T(`il più alto ${r.hi}, il più basso ${r.lo}`, `highest ${r.hi}, lowest ${r.lo}`), "") + `<div class="list" id="al"></div>`);
  dopoRivela(g, S, async () => { for (const [sg, v] of Object.entries(num).sort((a,b) => a[1]-b[1])){ const p = pDi(+sg); const el = $("#al"); if (!el || !p) continue;
    el.insertAdjacentHTML("beforeend", `<div class="li ${(g.morti||[]).includes(+sg)?"dead":""}">${avatarHTML(p)}<span>${esc(nomeDi(p))}</span><span class="s">${v}</span></div>`); sfx("fiche",{vol:.4}); await sleep(300); } });
};

/* ---------- PRENDI O LASCIA ---------- */
VISTE_SALA.prendi = (g, S, nuovo) => {
  if (g.passo === "scegli"){
    if (nuovo){ const sono = tocca(g);
      show(testa(g, "", T("Una mazzetta da 2000 fiche","A 2000-chip bribe"), sono) + `<div class="note">${T("Se qualcuno prende, chi lascia muore. Se prendono tutti, muoiono tutti. Se lasciano tutti, vivono tutti.","If anyone takes, those who leave die. If all take, all die. If all leave, all live.")}</div>` +
        (sono ? `<div class="row"><button class="cta alt" id="p">${T("PRENDO","TAKE")}</button><button class="cta ghost" id="l">${T("LASCIO","LEAVE")}</button></div>` : "") + guarda(g, T("ha deciso","decided")));
      $("#p") && ($("#p").onclick = () => { sfx("mazzetta"); salaAct(1); $("#panel .row").innerHTML = `<div class="big">${T("PRENDI.","TAKEN.")}</div>`; });
      $("#l") && ($("#l").onclick = () => { sfx("tap"); salaAct(0); $("#panel .row").innerHTML = `<div class="big">${T("LASCI.","LEFT.")}</div>`; });
    } else aggiornaVivo(g.fatto, T("ha deciso","decided"));
    return;
  }
  if (!nuovo) return;
  const pr = (g.riv || {}).prende || {};
  show(testa(g, T("le mani si aprono","hands open"), "") + `<div class="list" id="pl"></div>`);
  dopoRivela(g, S, async () => { for (const p of condP(g)){ const el = $("#pl"); if (!el) return; el.insertAdjacentHTML("beforeend", `<div class="li ${(g.morti||[]).includes(p.id)?"dead":"safe"}">${avatarHTML(p)}<span>${esc(nomeDi(p))}</span><span class="s">${pr[p.id] ? T("PRENDE","TAKES") : T("LASCIA","LEAVES")}</span></div>`); sfx(pr[p.id]?"mazzetta":"carta",{vol:.6}); await sleep(500); } });
};

/* ---------- MEMORIA ---------- */
const COL6 = ["#d0263a","#15100c","#d9a63c","#3f8fd6","#efe4cc","#a35fd6"];
VISTE_SALA.memoria = (g, S, nuovo) => {
  if (g.passo === "mostra"){
    if (nuovo){ show(testa(g, T("guardate bene","look closely"), T("4 secondi","4 seconds")) + `<div class="seq" id="sq"></div>`);
      (async () => { for (const c of (g.seq || [])){ const sq = $("#sq"); if (!sq) return; sq.insertAdjacentHTML("beforeend", `<i style="--cc:${COL6[c]};animation:mk .3s var(--ease-pop)"></i>`); sfx("fiche",{vol:.35,rate:1+c*0.06}); await sleep(160); } })(); }
    return;
  }
  if (g.passo === "rifai"){
    if (nuovo){ const sono = tocca(g); ST.loc.got = [];
      const draw = () => { const got = ST.loc.got;
        show(testa(g, "", sono ? T("Rimettile in ordine","Put them back in order") : T("Rimettono le fiche in ordine…","Putting the chips back in order…"), sono) +
          (sono ? `<div class="seq">${Array(6).fill(0).map((_,i)=>got[i]!=null?`<i style="--cc:${COL6[got[i]]}"></i>`:`<i class="empty"></i>`).join("")}</div><div class="seq">${COL6.map((c,i)=>`<button data-c="${i}" aria-label="${i+1}" style="--cc:${c}"></button>`).join("")}</div>` : "") + guarda(g, T("ha finito","finished")));
        document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { sfx("puntata",{vol:.6,vary:true}); got.push(+b.dataset.c); if (got.length === 6){ salaAct(got.reduce((a,c,i) => a + c*Math.pow(6,i), 0)); ST.loc.mandato = true; show(testa(g, "", T("Fatto.","Done."), false) + guarda(g, T("ha finito","finished"))); } else draw(); }); };
      draw();
    } else aggiornaVivo(g.fatto, T("ha finito","finished"));
    return;
  }
  if (nuovo){ const r = g.riv || {}; show(testa(g, T("la sequenza era","the sequence was"), "") + `<div class="seq">${(r.seq||[]).map(c=>`<i style="--cc:${COL6[c]}"></i>`).join("")}</div>` + listHTML(condP(g), p => ({t: ((r.punti||{})[p.id]||0) + "/6", cls: (g.morti||[]).includes(p.id) ? "dead" : "safe"}))); }
};

/* ---------- LE TRE CARTE ---------- */
VISTE_SALA.trecarte = (g, S, nuovo) => {
  const L = i => (i*35) + "%";
  const VEL = [T("lento","slow"), T("medio","medium"), T("veloce","fast")];
  if (g.passo === "voto"){
    if (nuovo){ const sono = tocca(g);
      show(testa(g, "", sono ? T("Quanto in fretta mischia il croupier?","How fast does the croupier shuffle?") : T("Chi è fuori sceglie la velocità…","Those outside pick the speed…"), sono) + (sono ? `<div class="row">${VEL.map((v,i)=>`<button class="cta ${i===2?"":"alt"}" data-i="${i}">${v.toUpperCase()}</button>`).join("")}</div>` : "") + guarda(g, T("ha votato","voted")));
      document.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { sfx("tap"); salaAct(+b.dataset.i); $("#panel .row").innerHTML = `<div class="big">${b.textContent}</div>`; });
    } else aggiornaVivo(g.fatto, T("ha votato","voted"));
    return;
  }
  if (g.passo === "mischia"){
    if (!nuovo) return;
    sayQ(T(`Si mischia <b>${VEL[g.vel]}</b>. Seguite la regina.`, `Shuffling <b>${VEL[g.vel]}</b>. Follow the queen.`), {espr:"carte"});
    show(testa(g, VEL[g.vel], "") + `<div class="cards3" id="c3">${[0,1,2].map(i=>`<div class="card3 face ${i?"x":""}" id="cd${i}" style="left:${L(i)}">${i?"7":"Q"}</div>`).join("")}</div><div class="note">${T("Guarda dov'è la Q.","Watch where the Q goes.")}</div>`);
    (async () => { const pos = [0,1,2]; sfx("carta"); await sleep(1600);
      [0,1,2].forEach(i => { const c = $("#cd"+i); if (c){ c.classList.remove("face"); c.textContent = ""; } }); sfx("carta"); await sleep(500);
      for (const [ca, cb] of (g.scambi || [])){ [pos[ca], pos[cb]] = [pos[cb], pos[ca]];
        for (let c=0;c<3;c++){ const el = $("#cd"+c); if (!el) return; el.style.transitionDuration = g.ms/1000 + "s"; el.style.left = L(pos[c]); }
        sfx("mischia",{vol:.4,rate:1.3}); await sleep(g.ms + 40); }
      ST.loc.pos = pos; })();
    return;
  }
  if (g.passo === "scegli"){
    if (!nuovo) { aggiornaVivo(g.fatto, T("ha scelto","chose")); return; }
    const sono = tocca(g);
    show(testa(g, "", sono ? T("Dov'è la regina?","Where's the queen?") : T("Cercano la regina…","Looking for the queen…"), sono) + `<div class="cards3" id="c3">${[0,1,2].map(s=>`<${sono?"button":"div"} class="card3" data-s="${s}" style="left:${L(s)}"></${sono?"button":"div"}>`).join("")}</div>` + guarda(g, T("ha scelto","chose")));
    document.querySelectorAll("button.card3").forEach(b => b.onclick = () => { sfx("carta"); salaAct(+b.dataset.s); b.classList.add("sel"); document.querySelectorAll("button.card3").forEach(x => x.disabled = true); });
    return;
  }
  if (!nuovo) return;
  const r = g.riv || {}, sc = r.scelte || {};
  show(testa(g, T("si girano","face up"), "") + `<div class="cards3">${[0,1,2].map(s=>`<div class="card3 face ${s===r.regina?"":"x"}" style="left:${L(s)}">${s===r.regina?"Q":"7"}<span class="who">${Object.entries(sc).filter(([k,v]) => v === s).map(([k]) => avatarHTML(pDi(+k))).join("")}</span></div>`).join("")}</div>`);
  dopoRivela(g, S, () => sfx("carta"));
};

/* ---------- LA SLOT ---------- */
const SIMB = ["7","BAR","♥","♣","☠"];
VISTE_SALA.slot = (g, S, nuovo) => {
  const fermi = g.fermi || {};
  const mie = fermi[ST.me] || [];
  const gioco = inCond(g) && !ST.spec && g.passo === "gira" && mie.length < 3;
  if (nuovo){
    ST.loc.t0 = performance.now() - Math.max(0, (g.dur - g.resta_s)) * 1000;
    show(testa(g, g.passo === "rivela" ? T("i rulli","the reels") : T("due uguali: vivi","two alike: you live"), "", gioco) +
      (inCond(g) && !ST.spec ? `<div class="reels" id="mr">${[0,1,2].map(i=>`<div class="reel spin" id="rl${i}"><span></span></div>`).join("")}</div>` + (gioco ? `<button class="cta" id="st">STOP</button><div class="note" style="margin-top:8px">${T("Ogni rullo gira più veloce del precedente. Due teschi = morto.","Each reel spins faster than the last. Two skulls = dead.")}</div>` : "") : "") +
      `<div class="mini" id="altri"></div>`);
    if ($("#st")) $("#st").onclick = () => { const i = (ST.S.sala.gioco.fermi[ST.me] || []).length + (ST.loc.premuti || 0); if (i > 2) return;
      const k = Math.floor((performance.now() - ST.loc.t0) / g.spd[i]); ST.loc.premuti = (ST.loc.premuti || 0) + 1;
      salaAct(k, i); sfx("rullo_stop"); haptic(); const el = $("#rl"+i); if (el){ el.classList.remove("spin"); el.classList.add("stop"); ST.loc["f"+i] = g.seq[i][k % g.seq[i].length]; } };
    if (inCond(g) && !ST.spec && g.passo === "gira"){ sfx("rullo");
      clearInterval(ST.loc.iv); ST.loc.iv = setInterval(() => { const gg = ST.S && ST.S.sala && ST.S.sala.gioco; if (!gg || gg.id !== "slot" || gg.passo !== "gira") return clearInterval(ST.loc.iv);
        const fm = (gg.fermi || {})[ST.me] || [];
        for (let i=0;i<3;i++){ const el = $("#rl"+i); if (!el) continue; let sym;
          if (i < fm.length) sym = fm[i]; else if (ST.loc["f"+i] != null) sym = ST.loc["f"+i]; else { const k = Math.floor((performance.now() - ST.loc.t0) / gg.spd[i]); sym = gg.seq[i][k % gg.seq[i].length]; }
          el.firstChild.textContent = SIMB[sym]; el.classList.toggle("sk", sym === 4); if (i < fm.length){ el.classList.remove("spin"); el.classList.add("stop"); } } }, 50); }
  }
  for (let i=0;i<3;i++){ const el = $("#rl"+i); if (el && i < mie.length){ el.firstChild.textContent = SIMB[mie[i]]; el.classList.remove("spin"); el.classList.add("stop"); el.classList.toggle("sk", mie[i] === 4); } }
  if (mie.length >= 3 && $("#st")) $("#st").disabled = true;

function quadrante(id, c){ return `<div class="safe-dial" id="${id}">${c.map((d,i)=>`<div class="dg"><button data-i="${i}" data-s="1">▲</button><b>${d}</b><button data-i="${i}" data-s="-1">▼</button></div>`).join("")}</div>`; }

    if (gioco){ legaQuadrante("q", ST.loc.c); $("#ok").onclick = () => { const c = ST.loc.c; sfx("rullo_stop"); salaAct(c[0]*100 + c[1]*10 + c[2]); $("#ok").disabled = true; setTimeout(() => { const b = $("#ok"); if (b) b.disabled = false; }, 700); }; }

const DIS = { tatuaggi:{fondo:"schiena", lw:2.6, colori:["#14202a","#b0182b","#1d5a3a","#7a5410"], intro:[ "Bruno si toglie la giacca. Ha la schiena libera. Il tema è","Bruno takes off his jacket. His back is free. The theme is"]},

function operaTratti(o){ if (!o) return []; if (o.bot) return scarabocchio(o.s || ["teschio"], o.q || 0.5, o.seme || 1); return ST.opere[o.chiave] || []; }
function disegnaOpera(cv, o, cfg, anima){ const st = operaTratti(o); const c = cv.getContext("2d"); if (anima) return animaTratti(cv, FONDI[cfg.fondo], st, {color:cfg.colori[0], lw:cfg.lw, pad:0}, 1100); FONDI[cfg.fondo](c); tracciaTratti(c, st, {color:cfg.colori[0], lw:cfg.lw, pad:0}); }
function salaDisegni(g, S, nuovo){
  const cfg = DIS[g.id]; const tema = g.tema || {}; const m = mio(g);
  if (g.passo === "disegna"){
    if (!nuovo){ aggiornaVivo(g.fatto, T("ha posato il pennello","put down the brush")); return; }
    sayQ(`${T(cfg.intro[0], cfg.intro[1])} <b>«${esc(fl(tema))}»</b>.`, {espr:"indica"});
    const sono = tocca(g);
    show(testa(g, T("disegna col dito","draw with your finger"), esc(fl(tema)), sono));
    if (sono){ const box = $("#panel"); const w = document.createElement("div"); w.className = "lavw"; box.appendChild(w);
      const lav = lavagna(w, cfg.fondo, {color:cfg.colori[0], lw:cfg.lw}); ST.loc.lav = lav; attrezzi(box, lav, cfg.colori);
      const b = document.createElement("button"); b.className = "cta"; b.textContent = T("HO FINITO","DONE"); box.appendChild(b);
      b.onclick = () => { sfx("lock"); salaAct(null, null, {pts: trattiSulFilo(lav.strokes)}); b.disabled = true; w.style.pointerEvents = "none"; b.textContent = T("CONSEGNATO","HANDED IN"); };
      ST.loc.manda = () => { if (!b.disabled && lav.strokes.length){ salaAct(null, null, {pts: trattiSulFilo(lav.strokes)}); b.disabled = true; } };
      clearTimeout(ST.loc.tmo); ST.loc.tmo = setTimeout(() => ST.loc.manda && ST.loc.manda(), Math.max(0, (g.resta_s - 1.2) * 1000));
    }
    $("#panel").insertAdjacentHTML("beforeend", guarda(g, T("ha posato il pennello","put down the brush")));
    return;

    return;

/* ---------- LO SPECCHIO ---------- */
const MANO_FANTASMA = "'Homemade Apple', cursive";
const MANI = ["'Caveat', cursive","'Reenie Beanie', cursive","'Nanum Pen Script', cursive","'Rock Salt', cursive","'Covered By Your Grace', cursive","'Shadows Into Light', cursive"];
const parolaSp = i => { const L = (DATI.specchio || {})[LANG] || (DATI.specchio || {}).it || []; return L[i] || "?"; };
function scrittaS(c){ if (c.mano){ const st = ST.opere[c.mano]; return st && st.length ? `<img src="${trattiInImmagine(st, 420, 150, "#26343a", 2.4)}" alt="">` : `<span style="font-family:${MANI[0]}">…</span>`; }
  return `<span style="font-family:${c.f ? MANI[(c.f-1) % MANI.length] : MANO_FANTASMA};transform:rotate(${c.rot}deg) skewX(${c.sk}deg);font-size:${c.fs}px">${esc(parolaSp(c.w))}</span>`; }
VISTE_SALA.specchio = (g, S, nuovo) => {
  if (g.passo === "mostra"){
    if (!nuovo) return;
    show(testa(g, "", "") + `<div class="mirror"><div class="fog"></div><div class="scr" id="sw"><span style="font-family:${MANO_FANTASMA};transform:rotate(-3deg);font-size:30px">${esc(parolaSp(g.w0))}</span></div></div><div class="note">${T("La sua calligrafia. Guardala bene.","Her handwriting. Look closely.")}</div>`);
    sfx("fantasma"); setTimeout(() => $("#sw")?.classList.add("go"), 400);
    sayQ(T(`La signora della stanza 13 scrive «${esc(parolaSp(g.w0))}» sullo specchio. Ora ne scrive un'altra. Chi è fuori scriverà le sue, false.`, `The lady in room 13 writes «${esc(parolaSp(g.w0))}» on the mirror. Now she writes another. Those outside will write fakes.`), {espr:"sorpreso"});
    return;
  }
  if (g.passo === "falsi"){
    if (!nuovo){ aggiornaVivo(g.fatto, T("ha scritto","wrote")); return; }
    const sono = tocca(g);
    show(testa(g, sono ? T("sei fuori","you're outside") : "", sono ? T("Scrivi col dito una parola falsa","Write a fake word with your finger") : T("Chi è fuori scrive parole false…","Those outside write fake words…"), sono) +
      (sono ? `<div class="note">${T("Imita la sua mano: ","Imitate her hand: ")}<span class="hand" style="font-family:${MANO_FANTASMA}">${esc(parolaSp(g.w0))}</span>. ${T("Se un condannato sceglie la tua, muore e prendi 500 fiche.","If a condemned player picks yours, they die and you get 500 chips.")}</div>` : ""));
    if (sono){ const box = $("#panel"); const w = document.createElement("div"); w.className = "lavw"; box.appendChild(w);
      const lav = lavagna(w, "vapore", {color:"#26343a", lw:2.2}); attrezzi(box, lav, []);
      const b = document.createElement("button"); b.className = "cta"; b.textContent = T("SCRITTO","WRITTEN"); box.appendChild(b);
      b.onclick = () => { sfx("lock"); salaAct(null, null, {pts: trattiSulFilo(lav.strokes)}); b.disabled = true; w.style.pointerEvents = "none"; };
      clearTimeout(ST.loc.tmo); ST.loc.tmo = setTimeout(() => { if (!b.disabled && lav.strokes.length){ salaAct(null, null, {pts: trattiSulFilo(lav.strokes)}); b.disabled = true; } }, Math.max(0, (g.resta_s - 1.2) * 1000)); }
    $("#panel").insertAdjacentHTML("beforeend", guarda(g, T("ha scritto","wrote")));
    return;
  }
  const cand = g.cand || [];
  const specchioH = (btn) => `<div class="mirror tall"><div class="fog"></div><div class="mlist">${cand.map((c,i)=>`<${btn?"button":"div"} class="mw" data-i="${i}" id="mw${i}">${scrittaS(c)}<b class="who"></b></${btn?"button":"div"}>`).join("")}</div></div>`;
  if (g.passo === "scegli"){
    if (!nuovo){ aggiornaVivo(g.fatto, T("ha scelto","chose")); return; }
    const sono = tocca(g);
    show(testa(g, inCond(g) ? T("sei condannato","you're condemned") : "", sono ? T("Quale ha scritto lei?","Which one did she write?") : T("Cercano la sua calligrafia…","Searching for her handwriting…"), sono) + `<div class="note">${T("Prima aveva scritto ","Before, she wrote ")}<span class="hand" style="font-family:${MANO_FANTASMA}">${esc(parolaSp(g.w0))}</span>.</div>` + specchioH(sono) + guarda(g, T("ha scelto","chose")));
    document.querySelectorAll("button.mw").forEach(b => b.onclick = () => { sfx("lock"); b.classList.add("sel"); salaAct(+b.dataset.i); document.querySelectorAll("button.mw").forEach(x => x.disabled = true); });
    return;
  }
  if (!nuovo) return;
  const r = g.riv || {};
  show(testa(g, T("la verità","the truth"), "") + specchioH(false));
  dopoRivela(g, S, async () => { await sleep(500);
    for (const [sg, i] of Object.entries(r.scelte || {})){ const el = $("#mw"+i+" .who"); if (el) el.insertAdjacentHTML("beforeend", avatarHTML(pDi(+sg))); sfx("tap",{vol:.5}); await sleep(300); }
    await sleep(600); $("#mw"+r.vera)?.classList.add("vera"); sfx("fantasma",{vol:.7}); await sleep(900);
    cand.forEach((c,i) => { if (i !== r.vera){ const el = $("#mw"+i); const da = (r.da||[])[i]; if (el){ el.classList.add("falsa"); el.insertAdjacentHTML("beforeend", `<i class="by">${da != null ? esc(nomeDi(pDi(da))) : T("del banco","the house")}</i>`); } } }); sfx("carta"); });
};

/* ---------- LA BATTUTA PEGGIORE ---------- */

    if (nuovo){ sayQ(T(`La domanda è: <b>«${esc(dom)}»</b>. Fate ridere, o almeno non fate pena.`, `The prompt is: <b>«${esc(dom)}»</b>. Be funny, or at least not pathetic.`), {espr:"ride"});
      const sono = tocca(g);
      show(testa(g, "", esc(dom), sono) + (sono ? `<div class="field"><input type="text" id="w" maxlength="60" autocomplete="off" placeholder="${T("scrivi la tua...","write yours...")}"></div><button class="cta" id="ok">${T("CONSEGNA","HAND IN")}</button>` : "") + guarda(g, T("ha consegnato","handed in")));
      const inp = $("#w"); if (inp){ setTimeout(() => inp.focus(), 50); inp.oninput = () => sfx("blip",{vol:.4});
        const go = () => { const v = inp.value.trim(); if (!v) return; sfx("lock"); salaAct(null, null, {tx:v}); inp.disabled = true; $("#ok").disabled = true; }; $("#ok").onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); };
        clearTimeout(ST.loc.tmo); ST.loc.tmo = setTimeout(() => { const v = inp.value.trim(); if (v && !inp.disabled){ salaAct(null, null, {tx:v}); inp.disabled = true; } }, Math.max(0, (g.resta_s - 1.2) * 1000)); }
    } else aggiornaVivo(g.fatto, T("ha consegnato","handed in"));
    return;
  }
  const fr = g.frasi || []; const mk = mio(g).mio_k;
  if (g.passo === "vota"){
    if (!nuovo){ aggiornaVivo(g.fatto, T("ha votato","voted")); return; }
    const sono = tocca(g);
    show(testa(g, T("vota","vote"), T("Qual è la peggiore?","Which is the worst?"), sono) + `<div class="note">${esc(dom)}</div><div class="list">${fr.map((f,i)=>`<button class="btn quip" data-i="${i}" ${(!sono || i===mk || !fl(f)) ? "disabled" : ""}>«${esc(fl(f) || "…")}»${i===mk ? T(" (tua)"," (yours)") : ""}</button>`).join("")}</div>` + guarda(g, T("ha votato","voted")));
    document.querySelectorAll(".quip:not([disabled])").forEach(b => b.onclick = () => { sfx("puntata"); salaAct(+b.dataset.i); document.querySelectorAll(".quip").forEach(x => x.disabled = true); b.classList.add("sel"); });
    return;
  }
  if (!nuovo) return;
  const r = g.riv || {};
  show(testa(g, T("i voti","the votes"), "") + `<div class="note">${esc(dom)}</div><div class="list" id="bl"></div>`);
  dopoRivela(g, S, async () => { const idx = fr.map((f,i)=>i).sort((a,b) => ((r.voti||[])[a]||0) - ((r.voti||[])[b]||0));
    for (const i of idx){ const a = (r.autori||[])[i]; const p = a === -9 ? {nome:"Monsieur Fiche", foto: img("host_neutro")} : pDi(a); const el = $("#bl"); if (!el) return;
      el.insertAdjacentHTML("beforeend", `<div class="li ${(r.perd||[]).includes(i)?"dead":""}">${avatarHTML(p)}<span class="qt">«${esc(fl(fr[i]) || "…")}»</span><span class="s">${(r.voti||[])[i]||0}</span></div>`); sfx("carta",{vol:.5}); await sleep(450); } });
};

/* ---------- IL PLINKO ---------- */
VISTE_SALA.plinko = (g, S, nuovo) => {
  const N = 9, RIGHE = 8;
  const board = () => `<div class="plinko" id="pk">${Array(RIGHE).fill(0).map((_,r)=>Array(N - (r%2)).fill(0).map((_,c)=>`<i class="peg" style="left:${((c + (r%2?1:0.5))/N*100).toFixed(2)}%;top:${(8 + r*10)}%"></i>`).join("")).join("")}<div class="pk-b">${Array(N).fill(0).map((_,i)=>`<span id="pb${i}">${i+1}</span>`).join("")}</div></div>`;
  if (g.passo === "scegli"){
    if (nuovo){ const sono = tocca(g), cond = inCond(g);
      const tit = !sono ? T("Veleni e fiche…","Poison and chips…") : cond ? T("Da dove la lasci cadere?","Where do you drop it?") : T("Avvelena una buca","Poison a slot");
      show(testa(g, "", tit, sono) + (sono && !cond ? `<div class="note">${T("Se la fiche di un condannato ci cade dentro, muore e prendi 500 fiche.","If a condemned player's chip lands in it, they die and you get 500 chips.")}</div>` : "") +
        (sono ? `<div class="pk-z ${cond?"top":""}">${Array(N).fill(0).map((_,i)=>`<button data-i="${i}">${cond?"▼":i+1}</button>`).join("")}</div>` : "") + board() + guarda(g, T("ha scelto","chose")));
      document.querySelectorAll(".pk-z button").forEach(b => b.onclick = () => { sfx(cond ? "fiche" : "veleno",{vol:.6}); salaAct(+b.dataset.i); b.classList.add("sel"); document.querySelectorAll(".pk-z button").forEach(x => x.disabled = true); });
    } else aggiornaVivo(g.fatto, T("ha scelto","chose"));
    return;
  }
  if (!nuovo) return;
  const r = g.riv || {};
  show(testa(g, T("si cade","dropping"), "") + board());
  dopoRivela(g, S, async () => { const pk = $("#pk"); if (!pk) return;
    const palle = condP(g).map(p => { const b = document.createElement("div"); b.className = "pk-ball"; b.innerHTML = avatarHTML(p); pk.appendChild(b); return {p, b, pr: (r.percorsi||{})[p.id] || [4]}; });
    const pos = (b, cx, cy) => { b.style.left = ((cx+0.5)/N*100)+"%"; b.style.top = cy+"%"; };
    palle.forEach(x => pos(x.b, x.pr[0], 0)); await sleep(250);
    for (let k=1;k<=RIGHE;k++){ palle.forEach(x => pos(x.b, x.pr[Math.min(k, x.pr.length-1)], 8 + (k-1)*10 + 4)); sfx("tic",{vol:.5,rate:0.8+Math.random()*0.6}); await sleep(230); }
    palle.forEach(x => pos(x.b, (r.buca||{})[x.p.id], 92)); await sleep(350);
    for (const z of (r.veleni||[])) $("#pb"+z)?.classList.add("pois");
    for (const x of palle){ const z = (r.buca||{})[x.p.id]; const morto = (g.morti||[]).includes(x.p.id); $("#pb"+z)?.classList.add(morto ? "hit" : "ok"); }
    sfx((g.morti||[]).length ? "veleno" : "fiche"); });
};
