<meta charset="utf-8">
<title>DEAD MONEY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#06100c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Bowlby+One+SC&family=Barlow+Condensed:wght@500;600;700;800&family=Special+Elite&family=Courier+Prime:wght@400;700&family=Homemade+Apple&family=Caveat:wght@600&family=Reenie+Beanie&family=Nanum+Pen+Script&family=Rock+Salt&family=Covered+By+Your+Grace&family=Shadows+Into+Light&display=swap">
<style>
/* DEAD MONEY · un telefono = palco (sfondo dipinto vivo, Monsieur Fiche, fumetto, fiche dei giocatori) sopra e
   pannello comandi sotto; sopra tutto un livello «cinema» per i cartelli che sbattono. Mondo unico scuro: casinò anni
   '20 chiuso da cent'anni, panno verde, ottone, sangue, ossa, anime acquamarina. */
:root{
  --ink:#06100c; --felt:#10291f; --felt2:#173a2c; --bone:#efe4cc; --bone2:#b9ad93; --paper:#f3ead2;
  --brass:#d9a63c; --brass2:#7a5410; --blood:#d0263a; --blood2:#7d0f1f; --ghost:#79e3d2; --ghost2:#2a7d70; --ok:#4fcf7e;
  --f-logo:"Creepster","Bowlby One SC",Impact,sans-serif;
  --f-head:"Bowlby One SC","Arial Black",Impact,sans-serif;
  --f-body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-host:"Courier Prime","Courier New",monospace;
  --ease-pop:cubic-bezier(.2,1.6,.4,1); --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;overflow:clip}
body{background:#030806;color:var(--bone);font-family:var(--f-body);font-size:17px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ghost);outline-offset:2px}
img{-webkit-user-drag:none}

#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--ink);isolation:isolate;box-shadow:0 0 80px rgba(0,0,0,.9)}
@media (min-width:560px){ body{background:radial-gradient(70% 90% at 50% 40%,#0e2219,#020504)} #app{height:min(100%,940px);top:50%;transform:translateY(-50%);border-radius:22px;border:1px solid rgba(217,166,60,.25)} }

/* ---------- fondale ---------- */
#bg{position:absolute;inset:0;z-index:0;overflow:hidden}
#bg .lay{position:absolute;inset:-6%;background-size:cover;background-position:center 30%;opacity:0;transition:opacity 1.1s ease;animation:kb 38s ease-in-out infinite alternate}
#bg .lay.on{opacity:1}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1.5%,1%)}}
#bg .lay.fallback{background:radial-gradient(120% 60% at 50% -10%,#3b2a12 0%,transparent 55%),radial-gradient(90% 70% at 50% 40%,var(--felt2),var(--felt) 60%,var(--ink))}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,12,.35) 0%,rgba(6,16,12,.05) 25%,rgba(6,16,12,.55) 52%,rgba(6,16,12,.94) 70%)}
#app[data-scene="sala"] #bg::after{background:linear-gradient(180deg,rgba(40,0,6,.45) 0%,rgba(30,0,4,.1) 25%,rgba(20,2,4,.6) 52%,rgba(10,2,3,.95) 70%)}
#app[data-scene="titolo"] #bg::after{background:linear-gradient(180deg,rgba(6,16,12,0) 0%,rgba(6,16,12,.1) 40%,rgba(6,16,12,.85) 75%)}
#atmo{position:absolute;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
#grain{position:absolute;inset:-50%;z-index:60;pointer-events:none;opacity:.09;animation:grain .5s steps(4) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.9'/></svg>")}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
#vign{position:absolute;inset:0;z-index:59;pointer-events:none;background:radial-gradient(110% 85% at 50% 45%,transparent 55%,rgba(0,0,0,.7)),repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
#flash{position:absolute;inset:0;z-index:58;pointer-events:none;opacity:0}
#flash.r{animation:flashr .7s}
#flash.w{animation:flashw .5s}
#flash.g{animation:flashg .8s}
@keyframes flashr{15%{opacity:.55;background:var(--blood)}100%{opacity:0;background:var(--blood)}}
@keyframes flashw{10%{opacity:.6;background:#fff8e0}100%{opacity:0;background:#fff8e0}}
@keyframes flashg{15%{opacity:.4;background:var(--ghost)}100%{opacity:0;background:var(--ghost)}}
#app.shake{animation:shake .5s}
@keyframes shake{10%{transform:translate(-6px,3px) rotate(-.6deg)}25%{transform:translate(6px,-4px) rotate(.6deg)}40%{transform:translate(-5px,2px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}
@media (min-width:560px){ #app.shake{animation:shakeD .5s} @keyframes shakeD{10%{transform:translateY(-50%) translate(-6px,3px)}30%{transform:translateY(-50%) translate(6px,-4px)}60%{transform:translateY(-50%) translate(-3px,2px)}100%{transform:translateY(-50%)}} }

/* ---------- struttura ---------- */
#ui{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;padding-block:calc(8px + env(safe-area-inset-top,0px)) 4px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
#tRound{font-family:var(--f-head);font-size:12px;letter-spacing:.02em;color:var(--bone);text-shadow:0 2px 0 #000;background:rgba(0,0,0,.45);border:1px solid rgba(217,166,60,.4);padding:4px 8px;border-radius:999px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#top .sp{flex:1}
#tPot{display:flex;align-items:center;gap:6px;font-family:var(--f-head);font-size:13px;color:var(--brass);background:rgba(0,0,0,.45);border:1px solid rgba(217,166,60,.4);padding:4px 8px 4px 4px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
#tPot:empty{display:none}
#tPot i{width:16px;height:16px;border-radius:50%;background:repeating-conic-gradient(var(--brass) 0 30deg,var(--brass2) 30deg 60deg);box-shadow:0 0 0 2px #000 inset}
.tb{flex:none;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(217,166,60,.35);display:grid;place-items:center}
.tb svg{width:17px;height:17px;fill:none;stroke:var(--bone);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-pressed="false"]{opacity:.45}

#stage{position:relative;flex:0 0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#hostRow{position:relative;display:flex;align-items:flex-end;min-height:150px}
#host{position:relative;width:132px;flex:0 0 132px;height:160px;margin-left:-6px;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
#host img,#host svg{position:absolute;bottom:0;left:0;width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 8px 14px rgba(0,0,0,.7)) drop-shadow(0 0 1px #000)}
#host.talk{animation:breathe 3.6s ease-in-out infinite,talk .26s ease-in-out infinite alternate}
#host.pop{animation:hpop .45s var(--ease-pop)}
@keyframes breathe{50%{transform:scale(1.015,1.03)}}
@keyframes talk{from{rotate:-1.2deg;translate:0 0}to{rotate:1.2deg;translate:0 -3px}}
@keyframes hpop{0%{transform:scale(.85,1.12)}60%{transform:scale(1.06,.95)}100%{transform:scale(1)}}
#host svg #jaw{transition:transform .08s}
#host.talk svg #jaw{animation:jaw .22s infinite alternate}
@keyframes jaw{to{transform:translateY(4px)}}
#bubble{position:relative;flex:1;min-width:0;align-self:center;background:var(--paper);color:#1d1710;font-family:var(--f-host);font-weight:700;font-size:16.5px;line-height:1.3;padding:11px 13px;border-radius:16px;min-height:66px;margin:6px 0 18px 4px;
  box-shadow:4px 5px 0 var(--blood2),0 10px 24px rgba(0,0,0,.5);border:2.5px solid #1d1710;transform-origin:0 100%;transition:transform .25s var(--ease-pop)}
#bubble.in{animation:bin .35s var(--ease-pop)}
@keyframes bin{from{transform:scale(.7) rotate(-3deg);opacity:.2}}
#bubble::before{content:"";position:absolute;left:-15px;bottom:14px;width:18px;height:16px;background:var(--paper);border-left:2.5px solid #1d1710;border-bottom:2.5px solid #1d1710;transform:skewY(-28deg);border-radius:0 0 0 3px}
#bubble b{color:var(--blood)}
#bubble .cur{display:inline-block;width:7px;height:14px;background:#1d1710;vertical-align:-2px;margin-left:1px;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#bubble .skip{position:absolute;right:8px;bottom:4px;font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.1em;color:rgba(29,23,16,.4);text-transform:uppercase}

#chips{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:3px;margin-top:-4px;justify-items:center}
.chip{width:100%;max-width:62px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;transition:transform .35s var(--ease-pop),opacity .4s}
.chip .disc{width:100%;max-width:52px;aspect-ratio:1;border-radius:50%;padding:11%;position:relative;
  background:radial-gradient(circle,transparent 62%,rgba(0,0,0,.25) 63%),repeating-conic-gradient(var(--c) 0 22.5deg,var(--bone) 22.5deg 30deg,var(--c) 30deg 45deg);box-shadow:0 3px 0 rgba(0,0,0,.6),0 0 0 1.5px #000}
.chip .disc img,.chip .disc .ini{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#1a2a22;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.chip .disc .ini{display:grid;place-items:center;font-family:var(--f-head);font-size:16px;color:var(--bone)}
.chip .nm{font-size:13.5px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1;text-shadow:0 1px 2px #000}
.chip .fi{font-size:12.5px;line-height:1.1;color:var(--brass);font-variant-numeric:tabular-nums;font-weight:700;text-shadow:0 1px 2px #000}
.chip.me .nm{color:var(--ghost)}
.chip.dead .disc{background:radial-gradient(circle,transparent 62%,rgba(0,0,0,.25) 63%),repeating-conic-gradient(#4d5d58 0 22.5deg,#9fb3ad 22.5deg 30deg,#4d5d58 30deg 45deg);opacity:.62;box-shadow:0 0 14px rgba(121,227,210,.45),0 0 0 1.5px #000}
.chip.dead .disc img{filter:grayscale(1) sepia(.3) hue-rotate(120deg) brightness(.95)}
.chip.dead .disc::after{content:"";position:absolute;left:50%;top:-8px;width:62%;height:9px;transform:translateX(-50%);border-radius:50%;border:2px solid var(--ghost);box-shadow:0 0 8px var(--ghost)}
.chip.dead{animation:float 3.2s ease-in-out infinite}
.chip.dead .nm{color:var(--ghost)}
@keyframes float{50%{transform:translateY(-4px)}}
.chip.cond .disc{animation:pulse .9s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--blood),0 0 14px var(--blood)}50%{box-shadow:0 0 0 4px var(--blood),0 0 28px var(--blood)}}
.chip .mk{position:absolute;top:31px;right:-1px;width:17px;height:17px;font-size:11px;border-radius:50%;display:none;place-items:center;font-weight:800;font-size:13px;border:2px solid #000;z-index:3}
.chip.ok .mk{display:grid;background:var(--ok);color:#042;animation:mk .4s var(--ease-pop)} .chip.ok .mk::after{content:"✓"}
.chip.ko .mk{display:grid;background:var(--blood);color:#fff;animation:mk .4s var(--ease-pop)} .chip.ko .mk::after{content:"✗"}
@keyframes mk{from{transform:scale(0) rotate(-90deg)}}
.chip .dot{position:absolute;right:2px;top:0;width:12px;height:12px;border-radius:50%;background:var(--brass);border:2px solid #000;z-index:2;display:none;animation:mk .3s var(--ease-pop)}
.chip.ans .dot{display:block}
.chip .tag{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:.06em;background:var(--brass);color:#2a1a00;padding:1px 4px;border-radius:4px;display:none;z-index:3;white-space:nowrap;border:1px solid #000}
.chip.bounty .tag.b{display:block}
.chip.cursed .tag.c{display:block;background:var(--ghost);color:#032;top:auto;bottom:24px}
.chip.dying{animation:dying 1s forwards}
@keyframes dying{0%{transform:scale(1)}20%{transform:scale(1.35) rotate(-10deg)}45%{transform:scale(.8) rotate(12deg)}100%{transform:scale(1)}}
.chip.gain .fi{animation:gain .6s}
@keyframes gain{30%{transform:scale(1.5);color:#fff}}

/* ---------- pannello ---------- */
#panel{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(18px + env(safe-area-inset-bottom,0px))}
#panel>*{animation:pin .45s var(--ease-out) both}
@keyframes pin{from{opacity:0;transform:translateY(14px)}}
.timer{position:relative;width:54px;height:54px;flex:0 0 54px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tr{fill:none;stroke:rgba(255,255,255,.12);stroke-width:5}
.timer .tf{fill:none;stroke:var(--brass);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .3s}
.timer.low .tf{stroke:var(--blood)}
.timer.low{animation:tlow .5s infinite alternate}
@keyframes tlow{to{transform:scale(1.08)}}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-head);font-size:18px;color:var(--bone);font-variant-numeric:tabular-nums}
.timer.hide{visibility:hidden}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qhead .ql{flex:1;min-width:0}
.eyebrow{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--brass);margin-bottom:4px;text-shadow:0 1px 3px #000}
.big{font-family:var(--f-head);font-size:23px;line-height:1.08;text-wrap:balance;margin-bottom:10px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.q{font-weight:800;font-size:23.5px;line-height:1.16;text-wrap:balance;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.note{color:#e3d8bf;font-size:16.5px;line-height:1.32;margin-bottom:10px;text-shadow:0 1px 3px #000}
.ans{display:grid;gap:9px}
.btn{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-weight:800;font-size:19px;line-height:1.1;padding:12px 14px 12px 12px;border-radius:13px;background:var(--paper);color:#1b140c;border:2.5px solid #1b140c;box-shadow:0 4px 0 #1b140c;transition:transform .09s,box-shadow .09s,background .2s,opacity .3s}
.ans .btn{animation:ain .5s var(--ease-pop) both}
.ans .btn:nth-child(2){animation-delay:.07s}.ans .btn:nth-child(3){animation-delay:.14s}.ans .btn:nth-child(4){animation-delay:.21s}
@keyframes ain{from{opacity:0;transform:translateX(-30px) rotate(-2deg)}}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b140c}
.btn .k{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-size:14px;color:var(--bone);background:radial-gradient(circle,var(--kc,#222) 55%,transparent 56%),repeating-conic-gradient(var(--kc,#222) 0 20deg,#fff 20deg 30deg);border:2px solid #1b140c}
.btn .who{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.btn .who img,.btn .who .ini{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid #1b140c;display:grid;place-items:center;background:#333;color:var(--bone);font-size:10px;animation:mk .35s var(--ease-pop) both}
.btn.sel{background:var(--brass);transform:scale(1.02)}
.btn.right{background:var(--ok);animation:right .7s var(--ease-pop)}
@keyframes right{30%{transform:scale(1.06) rotate(-1deg)}}
.btn.wrong{background:#e2707c;animation:wrong .45s}
@keyframes wrong{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.btn.dim{opacity:.38}
.btn[disabled]{pointer-events:none}
.cta{position:relative;display:block;width:100%;font-family:var(--f-head);font-size:20px;letter-spacing:.03em;padding:15px 14px;border-radius:15px;background:linear-gradient(180deg,#e43046,var(--blood));color:var(--bone);border:2.5px solid #1b0306;box-shadow:0 5px 0 #1b0306,inset 0 2px 0 rgba(255,255,255,.25);text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #1b0306}
.cta.alt{background:linear-gradient(180deg,#f0be56,var(--brass));color:#271800;border-color:#2a1a00;box-shadow:0 5px 0 #2a1a00,inset 0 2px 0 rgba(255,255,255,.35);text-shadow:none}
.cta.gh{background:linear-gradient(180deg,#9df0e2,var(--ghost));color:#032;border-color:#032;box-shadow:0 5px 0 #032;text-shadow:none}
.cta.ghost{background:rgba(0,0,0,.35);border:2px solid var(--bone2);box-shadow:none;color:var(--bone2);font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.list{display:grid;gap:6px;margin:8px 0}
.li{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.4);border:1px solid rgba(239,228,204,.08);border-radius:11px;padding:6px 10px 6px 6px;font-weight:700;font-size:17px}
.li img,.li .ini{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:0 0 30px;display:grid;place-items:center;background:#333;font-size:12px}
.li .s{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--brass);text-align:right}
.li.dead{color:#ff8a96;border-color:rgba(208,38,58,.5);background:rgba(125,15,31,.35)}
.li.safe{color:#8ff0b0;border-color:rgba(79,207,126,.4)}
.li.gh{color:var(--ghost)}
.meter{height:10px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),#f6d58a);transition:width .3s}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;padding:9px 4px;border-radius:10px;background:rgba(0,0,0,.4);border:1.5px solid rgba(239,228,204,.15);font-weight:800;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--brass);color:#271800;border-color:#2a1a00}
.field{display:grid;gap:6px;margin-bottom:12px}
.field>label,.flabel{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--brass)}
.field input[type=text]{font:inherit;font-size:19px;font-weight:700;padding:11px 12px;border-radius:11px;border:2px solid var(--bone2);background:rgba(0,0,0,.5);color:var(--bone);width:100%;user-select:text;-webkit-user-select:text}
input[type=range]{width:100%;accent-color:var(--brass);height:36px}
.num{font-family:var(--f-head);font-size:46px;text-align:center;color:var(--brass);font-variant-numeric:tabular-nums;text-shadow:0 3px 0 #000}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(217,166,60,.35);font-weight:800;font-size:13px;color:var(--brass)}

/* ---------- titolo ---------- */
.tit{display:flex;flex-direction:column;gap:12px}
.logo{display:block;width:min(100%,400px);margin:0 auto -4px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.6)) drop-shadow(0 0 24px rgba(208,38,58,.35));animation:logo 1s var(--ease-pop) both}
@keyframes logo{from{opacity:0;transform:scale(1.6) rotate(-6deg)}}
.logoT{font-family:var(--f-logo);font-size:84px;line-height:.82;color:var(--blood);text-align:center;text-shadow:0 5px 0 #000,0 0 30px rgba(208,38,58,.5);animation:logo 1s var(--ease-pop) both}
.sub{font-family:var(--f-host);font-size:15px;color:var(--bone);text-align:center;letter-spacing:.14em;text-shadow:0 2px 4px #000}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feat div{background:rgba(0,0,0,.45);border:1px solid rgba(217,166,60,.25);border-radius:12px;padding:9px 10px;font-size:14px;line-height:1.25;color:var(--bone2)}
.feat b{display:block;font-family:var(--f-head);font-size:13px;color:var(--bone);letter-spacing:.04em;margin-bottom:2px}
details.set{background:rgba(0,0,0,.45);border:1px solid rgba(239,228,204,.12);border-radius:13px;padding:10px 12px}
details.set summary{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--bone2);cursor:pointer;list-style:none}
details.set summary::after{content:" ▾"}
details.set[open] summary{margin-bottom:10px}
.me-row{display:flex;align-items:center;gap:12px}
.me-row .chip{flex:0 0 64px}
.me-row .chip .disc{max-width:64px}

/* ---------- carica ---------- */
#load{position:absolute;inset:0;z-index:90;background:radial-gradient(80% 60% at 50% 40%,#173a2c,#050c09);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#load.off{opacity:0;pointer-events:none}
#load .spin{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,#1b140c 48%,transparent 49%),repeating-conic-gradient(var(--blood) 0 22.5deg,var(--bone) 22.5deg 30deg,var(--blood) 30deg 45deg);animation:spin 1.4s linear infinite;box-shadow:0 0 30px rgba(208,38,58,.4)}
@keyframes spin{to{transform:rotate(360deg)}}
#load .bar{width:180px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .2s}
#load p{font-family:var(--f-host);color:var(--bone2);font-size:14px;letter-spacing:.1em}
#tapgo{position:absolute;inset:0;z-index:91;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(3,8,6,.6);backdrop-filter:blur(2px)}
#tapgo.on{display:flex}
#tapgo b{font-family:var(--f-head);font-size:22px;color:var(--bone);animation:tlow .8s infinite alternate}

/* ---------- cinema ---------- */
#cine{position:absolute;inset:0;z-index:50;pointer-events:none;display:none;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;text-align:center;padding:24px}
#cine.on{display:flex;pointer-events:auto}
#cine .bgc{position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 45%,rgba(60,4,12,.92),rgba(5,0,2,.97));animation:fadein .3s both}
#cine .bgc.green{background:radial-gradient(70% 55% at 50% 45%,rgba(16,58,44,.94),rgba(2,8,6,.97))}
#cine .bgc.gold{background:radial-gradient(70% 55% at 50% 45%,rgba(90,62,10,.9),rgba(6,4,0,.97))}
#cine .rays{position:absolute;left:50%;top:44%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(rgba(255,230,180,.07) 0 8deg,transparent 8deg 20deg);animation:rays 18s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0}}
#cine .kick{position:relative;font-weight:800;letter-spacing:.24em;text-transform:uppercase;font-size:15px;color:var(--brass);animation:drop .5s var(--ease-pop) both}
#cine .art{position:relative;width:min(64vw,270px);aspect-ratio:1;max-width:100%;object-fit:contain;filter:drop-shadow(0 14px 30px rgba(0,0,0,.8));animation:slamArt .7s var(--ease-pop) .15s both}
@keyframes slamArt{from{opacity:0;transform:scale(2.6) rotate(-14deg)}}
#cine .ttl{position:relative;font-family:var(--f-head);font-size:38px;line-height:1;color:var(--bone);text-shadow:0 4px 0 #000,0 0 26px rgba(208,38,58,.6);margin-top:8px;text-wrap:balance}
#cine .ttl .w{display:inline-block;white-space:nowrap;animation:none}
#cine .ttl .w span{display:inline-block;animation:letter .45s var(--ease-pop) both}
@keyframes letter{from{opacity:0;transform:translateY(-60px) rotate(-20deg) scale(1.8)}}
#cine .rule{position:relative;max-width:330px;color:var(--bone);font-size:18.5px;font-weight:600;line-height:1.3;margin-top:10px;animation:drop .5s var(--ease-out) .9s both}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}}
#cine .tap{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(239,228,204,.35);font-weight:800}
#cine .card{position:relative;width:200px;height:280px;border-radius:18px;background:var(--paper);border:4px solid #1b140c;box-shadow:0 18px 40px rgba(0,0,0,.7),inset 0 0 0 8px var(--paper),inset 0 0 0 10px var(--blood);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#1b140c;animation:cardin .7s var(--ease-pop) both}
@keyframes cardin{from{transform:perspective(700px) rotateY(180deg) scale(.4);opacity:0}}
#cine .card .n{font-family:var(--f-head);font-size:16px;color:var(--blood);letter-spacing:.1em}
#cine .card .s{font-size:64px;line-height:1;color:var(--blood)}
#cine .card .c{font-family:var(--f-head);font-size:24px;line-height:1.05;padding:0 12px;text-wrap:balance}
#cine .card .d{position:absolute;font-family:var(--f-head);font-size:15px;color:var(--blood)}
#cine .card .d.a{top:12px;left:14px} #cine .card .d.b{bottom:12px;right:14px;transform:rotate(180deg)}
#cine .who{position:relative;width:150px;height:150px;border-radius:50%;padding:14px;background:radial-gradient(circle,transparent 62%,rgba(0,0,0,.25) 63%),repeating-conic-gradient(var(--c) 0 22.5deg,var(--bone) 22.5deg 30deg,var(--c) 30deg 45deg);box-shadow:0 0 0 3px #000,0 20px 50px rgba(0,0,0,.8);animation:slamArt .6s var(--ease-pop) both}
#cine .who img,#cine .who .ini{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#1a2a22;font-family:var(--f-head);font-size:48px}
#cine .who.die{animation:slamArt .6s var(--ease-pop) both,diechip 1.6s .7s forwards}
@keyframes diechip{30%{filter:grayscale(1) brightness(1.4)}100%{filter:grayscale(1) brightness(.7);transform:scale(.92)}}
#cine .crack{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cine .crack path{fill:none;stroke:#000;stroke-width:4;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;animation:crack .5s .8s forwards}
#cine .crack path.w{stroke:rgba(255,255,255,.7);stroke-width:1.5}
@keyframes crack{to{stroke-dashoffset:0}}
#cine .soul{position:absolute;width:120px;height:120px;border-radius:50%;opacity:0;filter:grayscale(1) sepia(.4) hue-rotate(120deg) brightness(1.3);box-shadow:0 0 40px var(--ghost);animation:soul 1.6s 1.3s ease-out forwards;overflow:hidden}
#cine .soul img,#cine .soul .ini{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font-family:var(--f-head);font-size:40px;background:#244}
@keyframes soul{0%{opacity:0;transform:translateY(0) scale(.9)}25%{opacity:.85}100%{opacity:0;transform:translateY(-190px) scale(1.15)}}
#cine .stamp{position:relative;font-family:var(--f-logo);font-size:76px;line-height:.9;color:var(--blood);text-shadow:4px 4px 0 #000;transform:rotate(-8deg);margin-top:-30px;animation:stamp .55s var(--ease-pop) 1s both}
#cine .stamp.g{color:var(--ghost)} #cine .stamp.y{color:var(--brass)} #cine .stamp.v{color:var(--ok)}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(3)}}
#cine .nome{position:relative;font-family:var(--f-head);font-size:26px;margin-top:6px;text-shadow:0 3px 0 #000}
.coin{position:absolute;z-index:57;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,var(--brass) 45%,transparent 46%),repeating-conic-gradient(var(--brass) 0 30deg,var(--brass2) 30deg 60deg);box-shadow:0 0 0 1.5px #000;top:-30px;animation:dropc linear forwards;pointer-events:none}
@keyframes dropc{to{transform:translateY(105vh) rotate(900deg)}}
.fly{position:absolute;z-index:57;pointer-events:none;font-family:var(--f-head);font-size:15px;opacity:0;animation-fill-mode:both!important;color:var(--brass);text-shadow:0 2px 0 #000;animation:fly 1.2s var(--ease-out) forwards}
@keyframes fly{from{opacity:1;transform:translateY(0) scale(.6)}20%{transform:translateY(-10px) scale(1.2)}to{opacity:0;transform:translateY(-70px) scale(1)}}

/* ---------- sale ---------- */
.room-card{display:flex;gap:12px;align-items:center;border:2px solid var(--blood);border-radius:15px;padding:10px 12px;background:linear-gradient(135deg,rgba(125,15,31,.55),rgba(30,2,6,.6));margin-bottom:10px}
.room-card img{width:66px;height:66px;object-fit:contain;flex:0 0 66px;filter:drop-shadow(0 4px 6px #000)}
.room-card .big{color:#ff6b7a;margin-bottom:3px;font-size:21px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.cell{aspect-ratio:1;border-radius:12px;background:linear-gradient(145deg,#e0c98f,#b8964e);box-shadow:inset 0 0 0 3px #7a5c22,0 4px 0 #3a2a08;display:grid;place-items:center;font-family:var(--f-head);font-size:28px;color:#1b140c;max-width:100%;position:relative;overflow:hidden}
.cell::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.15) 0 4px,transparent 4px 9px)}
.cell.open{background:#20302a;box-shadow:inset 0 0 0 3px #3a4f46;color:var(--bone);animation:scr .3s}
.cell.open::after{display:none}
@keyframes scr{from{transform:scale(.9)}}
.cell.coinc{color:var(--brass);font-size:34px} .cell.skull{background:var(--blood);color:#fff;animation:wrong .4s}
.chal{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.chal button,.chal>div{display:grid;justify-items:center;gap:2px;padding:6px 2px 8px;border-radius:13px;background:rgba(0,0,0,.4);border:1.5px solid rgba(217,166,60,.25);font-weight:800}
.chal button.sel{background:rgba(217,166,60,.35)} .chal .pois{background:rgba(40,120,60,.45);border-color:#4fcf7e}
.chal svg{width:46px;height:58px}
.chal span{font-size:11.5px;line-height:1.1;color:var(--bone2)}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.door{position:relative;border-radius:14px 14px 6px 6px;padding:10px 6px 12px;background:linear-gradient(90deg,#3a2e1a,#6a5530 48%,#2a200f 50%,#6a5530 52%,#3a2e1a);border:4px solid var(--brass);min-height:170px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 0 #2a1a00}
.door::before{content:"";width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#ffeaa0,#d9a63c);box-shadow:0 0 12px #f6d58a}
.door.sel{box-shadow:0 0 0 4px var(--ghost),0 6px 0 #2a1a00}
.door.fall{background:linear-gradient(#5a1520,#200508);border-color:var(--blood);animation:fall .8s ease-in forwards}
@keyframes fall{60%{transform:translateY(12px)}100%{transform:translateY(40px);opacity:.6}}
.door .dn{font-family:var(--f-head);font-size:17px;text-shadow:0 2px 0 #000}
.door .who{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.door .who img,.door .who .ini{width:30px;height:30px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#333;font-size:11px;border:2px solid #000;animation:mk .3s var(--ease-pop) both}
.wheel{width:240px;height:240px;max-width:100%;border-radius:50%;margin:4px auto 12px;position:relative;border:8px solid var(--brass);box-shadow:0 0 0 3px #000,0 10px 30px rgba(0,0,0,.6),inset 0 0 0 3px #000;transition:transform 3.4s cubic-bezier(.12,.7,.15,1)}
.wheel::after{content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:radial-gradient(circle,#ffeaa0,#7a5410);box-shadow:0 0 0 3px #000}
.wheel b{position:absolute;left:50%;top:50%;font-family:var(--f-head);font-size:13px;transform-origin:0 0}
.wheelPin{width:0;height:0;border:14px solid transparent;border-top:24px solid var(--bone);margin:0 auto -12px;position:relative;z-index:2;filter:drop-shadow(0 2px 0 #000)}
.cards3{position:relative;height:160px;margin:8px 0 14px}
.card3{position:absolute;top:0;width:30%;height:150px;border-radius:13px;transition:left .3s ease-in-out;display:grid;place-items:center;font-family:var(--f-head);font-size:44px;
  background:repeating-linear-gradient(45deg,var(--blood2) 0 8px,#4a0a14 8px 16px);border:4px solid var(--paper);box-shadow:0 6px 0 rgba(0,0,0,.6),0 0 0 2px #000}
.card3.face{background:var(--paper);color:var(--blood);animation:flip .35s}
.card3.face.x{color:#1b140c}
@keyframes flip{from{transform:rotateY(90deg)}}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;padding:10px;border-radius:18px;background:linear-gradient(#5a1520,#2a050c);border:4px solid var(--brass);box-shadow:0 0 0 2px #000,0 8px 0 #2a1a00}
.reel{height:100px;border-radius:10px;background:linear-gradient(#fff8e6,#cfc3a4);color:#1b140c;display:grid;place-items:center;font-family:var(--f-head);font-size:36px;box-shadow:inset 0 8px 12px rgba(0,0,0,.45),inset 0 -8px 12px rgba(0,0,0,.35),0 0 0 2px #000;overflow:hidden}
.reel.spin span{animation:rspin .12s linear infinite}
@keyframes rspin{from{transform:translateY(-30%);filter:blur(1px)}to{transform:translateY(30%);filter:blur(1px)}}
.reel.stop{box-shadow:inset 0 8px 12px rgba(0,0,0,.45),0 0 0 3px var(--ghost);animation:rstop .25s var(--ease-pop)}
@keyframes rstop{from{transform:translateY(-6px)}}
.reel.sk{color:var(--blood)}
.bj{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.pc{width:48px;height:68px;border-radius:8px;background:var(--paper);color:#1b140c;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 0 2px #000;animation:deal .35s var(--ease-pop) both}
@keyframes deal{from{opacity:0;transform:translate(60px,-40px) rotate(20deg)}}
.pc.r{color:var(--blood)} .pc.hole{background:repeating-linear-gradient(45deg,var(--blood2) 0 6px,#4a0a14 6px 12px)}
.seq{display:flex;gap:7px;justify-content:center;margin:8px 0 12px;flex-wrap:wrap}
.seq i,.seq button{width:42px;height:42px;border-radius:50%;display:block;background:radial-gradient(circle,var(--cc) 52%,transparent 53%),repeating-conic-gradient(var(--cc) 0 22.5deg,#fff 22.5deg 30deg,var(--cc) 30deg 45deg);box-shadow:0 3px 0 #000,0 0 0 2px #000}
.seq i.empty{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.seq button{width:50px;height:50px}
.dice{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
.die{width:50px;height:50px;border-radius:11px;background:var(--paper);border:3px solid #1b140c;box-shadow:0 4px 0 #000;display:grid;place-items:center;font-family:var(--f-head);font-size:24px;color:#1b140c;animation:roll .5s var(--ease-pop) both}
.die.sk{background:#1b140c;color:var(--bone);border-color:var(--bone)}
@keyframes roll{from{transform:rotate(-200deg) scale(.4)}}
.safe-dial{display:flex;gap:10px;justify-content:center;margin:8px 0}
.safe-dial .dg{display:flex;flex-direction:column;align-items:center;gap:4px}
.safe-dial .dg button{width:52px;height:34px;border-radius:9px;background:rgba(0,0,0,.4);border:1.5px solid rgba(217,166,60,.35);font-weight:800}
.safe-dial .dg b{width:56px;height:64px;border-radius:12px;background:#1b140c;border:3px solid var(--brass);display:grid;place-items:center;font-family:var(--f-head);font-size:32px;color:var(--brass)}
.tries{display:grid;gap:5px;margin:8px 0}
.tries div{display:flex;gap:6px;align-items:center;font-family:var(--f-head);font-size:20px}
.tries i{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-style:normal;color:#000}
.tries i.g{background:var(--ok)} .tries i.y{background:var(--brass)} .tries i.n{background:#555;color:#ddd}
.holes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:14px;border-radius:50% / 22%;background:repeating-linear-gradient(90deg,#6a4520 0 22px,#4d3015 22px 26px);border:5px solid #2a1a08;box-shadow:inset 0 0 30px #000,0 8px 0 #000}
.holes button,.holes div{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#000 55%,#2a1a08 60%);box-shadow:0 0 0 3px #8a5f2a;color:var(--bone);font-weight:800;font-size:12px;display:grid;place-items:center;max-width:100%}
.holes .sel{box-shadow:0 0 0 4px var(--ghost)} .holes .blade{background:radial-gradient(circle,#c9d4d8 30%,#000 60%);box-shadow:0 0 0 3px var(--blood)}
#coinRain{position:relative;height:200px;border-radius:14px;background:radial-gradient(circle at 50% 120%,#1f4a39,#0b1d16);overflow:hidden;border:2px solid rgba(217,166,60,.3)}
#coinRain i{position:absolute;width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 2px #000;background:radial-gradient(circle,var(--cc) 50%,transparent 51%),repeating-conic-gradient(var(--cc) 0 22.5deg,#fff 22.5deg 30deg,var(--cc) 30deg 45deg)}

/* ---------- fuga ---------- */
#corr{display:none;position:relative;height:178px;margin-top:2px;border-radius:14px;overflow:hidden;border:2px solid rgba(217,166,60,.5);box-shadow:0 10px 30px rgba(0,0,0,.6);background:#140c06 center/cover no-repeat}
#corr.on{display:block}
#corr .grid{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/13 - 1px),rgba(255,230,180,.12) calc(100%/13 - 1px) calc(100%/13))}
#corr .exit{position:absolute;right:0;top:0;bottom:0;width:calc(100%/13);background:linear-gradient(90deg,rgba(255,220,140,.15),rgba(255,230,160,.65));box-shadow:0 0 40px #f6d58a;animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 70px #ffe7a6;opacity:.85}}
#corr .dark{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#000 82%,rgba(0,0,0,0));transition:width 1s cubic-bezier(.6,0,.4,1);z-index:3}
#corr .dark.flick{animation:flick .6s}
@keyframes flick{20%,60%{opacity:.6}40%,80%{opacity:1}}
#corr .tok{position:absolute;width:30px;height:30px;margin-left:-15px;border-radius:50%;transition:left .75s var(--ease-pop),top .4s;z-index:2;border:3px solid var(--c);background:#222;overflow:hidden;display:grid;place-items:center;font-size:11px;font-weight:800;box-shadow:0 3px 6px rgba(0,0,0,.7)}
#corr .tok img{width:100%;height:100%;object-fit:cover}
#corr .tok.gh{opacity:.7;filter:grayscale(1) sepia(.3) hue-rotate(120deg);border-color:var(--ghost);box-shadow:0 0 12px var(--ghost)}
#corr .tok.me{box-shadow:0 0 0 2px var(--bone),0 3px 6px #000}
#corr .tok.out{opacity:.12}
#corr .tok.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-14px)}}
#corr .lab{position:absolute;bottom:3px;font-size:10px;color:rgba(239,228,204,.55);font-weight:800;margin-left:-4px;text-shadow:0 1px 2px #000}
.items{display:grid;gap:9px}
.items .btn{animation:ain .45s var(--ease-pop) both}
.items .btn:nth-child(2){animation-delay:.08s}.items .btn:nth-child(3){animation-delay:.16s}

/* ---------- fine ---------- */
.receipt{position:relative;background:var(--paper);color:#1b140c;font-family:var(--f-host);padding:18px 16px 22px;border-radius:4px;box-shadow:0 12px 30px rgba(0,0,0,.6);margin:6px 0 14px;animation:rcpt .8s var(--ease-out) both;
  -webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle at 6px 100%,transparent 6px,#000 6.5px) bottom/12px 10px repeat-x;mask:linear-gradient(#000,#000) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle at 6px 100%,transparent 6px,#000 6.5px) bottom/12px 10px repeat-x}
@keyframes rcpt{from{transform:translateY(-40px);clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.receipt h3{text-align:center;font-family:var(--f-head);font-size:20px;letter-spacing:.06em;margin:0}
.receipt .c{text-align:center;font-size:12px;letter-spacing:.12em;margin-bottom:10px}
.receipt .r{display:flex;gap:6px;font-size:14px;line-height:1.6;align-items:baseline}
.receipt .r .d{flex:1;border-bottom:2px dotted rgba(27,20,12,.35);transform:translateY(-4px)}
.receipt .r.w{font-weight:700;color:var(--blood2)}
.receipt .r.x{text-decoration:line-through;opacity:.55}
.receipt hr{border:0;border-top:2px dashed rgba(27,20,12,.4);margin:8px 0}
.receipt .tot{display:flex;justify-content:space-between;font-family:var(--f-head);font-size:17px}
.receipt .st{position:absolute;right:16px;bottom:58px;font-family:var(--f-head);font-size:20px;color:var(--blood);border:3px solid var(--blood);padding:2px 8px;transform:rotate(12deg);opacity:.85;border-radius:6px;animation:stamp .5s var(--ease-pop) .9s both}
.cart{border-radius:14px;overflow:hidden;max-width:100%;box-shadow:0 8px 20px rgba(0,0,0,.6);margin-bottom:12px;border:2px solid rgba(217,166,60,.4)}
.cart img{display:block;width:100%}
.credits{font-size:12px;color:var(--bone2);opacity:.7;line-height:1.35;margin-top:14px}

/* ---------- seconda ala: sale a mano e le altre ---------- */
.lavw{width:min(100%,340px);margin:0 auto 8px;aspect-ratio:1;border-radius:14px;overflow:hidden;border:3px solid #1b140c;box-shadow:0 0 0 2px var(--brass),0 8px 24px rgba(0,0,0,.6);touch-action:none}
.lav{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tools{display:flex;align-items:center;gap:7px;width:min(100%,340px);margin:0 auto 12px}
.tools .sp{flex:1}
.ink{width:32px;height:32px;border-radius:50%;background:var(--ic);border:2px solid rgba(239,228,204,.35);flex:none}
.ink.on{border-color:var(--bone);box-shadow:0 0 0 3px var(--brass)}
.tl{font-weight:800;font-size:15px;padding:8px 11px;border-radius:9px;background:rgba(0,0,0,.55);border:1px solid rgba(239,228,204,.25);color:var(--bone)}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gal .op{position:relative;border-radius:12px;overflow:hidden;border:2.5px solid #1b140c;box-shadow:0 0 0 2px rgba(217,166,60,.5);background:#000;padding:0;transition:transform .25s,box-shadow .25s,filter .4s}
.gal .op canvas{display:block;width:100%;height:auto;aspect-ratio:1}
.gal .lb{position:absolute;top:6px;left:6px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:#1b140c;color:var(--brass);font-family:var(--f-head);font-size:14px;display:grid;place-items:center}
.gal .au{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding:18px 8px 7px;background:linear-gradient(transparent,rgba(0,0,0,.9));font-weight:800;font-size:15px;color:#fff;animation:drop .3s}
.gal .au img,.gal .au .ini{width:24px;height:24px;border-radius:50%;object-fit:cover}
.gal .vt{position:absolute;top:6px;right:6px;padding:3px 9px;border-radius:10px;background:var(--brass);color:#271800;font-weight:800;font-size:14px;animation:mk .3s var(--ease-pop)}
.gal .op.lose,.gal .op.worst{box-shadow:0 0 0 3px var(--blood),0 0 22px var(--blood);transform:scale(1.03);animation:wrong .5s}
.gal .op.lose canvas,.gal .op.worst canvas{filter:sepia(.4) saturate(1.6) hue-rotate(-20deg)}
.gal.vote .op:disabled{opacity:.4}
.gal.vote .op:not(:disabled):active{transform:scale(.96)}
.hand{font-size:1.3em;color:var(--ghost)}
.mirror{position:relative;width:min(100%,330px);margin:4px auto 12px;aspect-ratio:3/2;border-radius:48% 48% 14px 14px/38% 38% 14px 14px;background:radial-gradient(70% 70% at 50% 40%,#d3dedb,#8a9e99);border:8px solid #9a7426;box-shadow:inset 0 0 0 3px #1b140c,0 0 0 3px #1b140c,0 0 0 7px var(--brass),0 10px 30px rgba(0,0,0,.7);overflow:hidden;display:grid;place-items:center}
.mirror.tall{aspect-ratio:auto;border-radius:22px;padding:14px 10px}
.mirror .fog{position:absolute;inset:0;background:radial-gradient(40% 30% at 30% 30%,rgba(255,255,255,.35),transparent),radial-gradient(50% 40% at 70% 70%,rgba(255,255,255,.25),transparent);pointer-events:none;animation:fadein 2s}
.mirror .scr{position:relative;color:#16262a;clip-path:inset(0 100% 0 0);transition:clip-path 1.6s steps(14)}
.mirror .scr.go{clip-path:inset(0 0 0 0)}
.mirror .scr span{display:inline-block}
.mlist{position:relative;display:grid;gap:8px;width:100%}
.mw{position:relative;display:flex;align-items:center;justify-content:center;min-height:64px;border-radius:12px;background:rgba(255,255,255,.2);border:2px dashed rgba(27,20,12,.3);color:#16262a;padding:4px 40px;transition:background .3s,border-color .3s,opacity .4s}
.mw span{display:inline-block;line-height:1.2}
.mw img{max-height:60px;max-width:100%}
.mw.sel{border-color:var(--blood);border-style:solid}
.mw .who{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
.mw .who img,.mw .who .ini{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid #1b140c;animation:mk .3s var(--ease-pop)}
.mw.vera{background:rgba(121,227,210,.55);border:2px solid var(--ghost);box-shadow:0 0 18px var(--ghost)}
.mw.falsa{opacity:.6}
.mw .by{position:absolute;left:8px;bottom:3px;font-style:normal;font-weight:800;font-size:12px;letter-spacing:.06em;color:#7d0f1f;text-transform:uppercase}
.btn.quip{font-family:var(--f-host);font-size:17px;font-weight:400}
.btn.cut{opacity:.35;filter:grayscale(1);text-decoration:line-through}
.li .qt{flex:1;min-width:0;font-family:var(--f-host);font-weight:400;font-size:16px}
.pk-z{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-bottom:8px}
.pk-z button{padding:10px 0;border-radius:8px;background:rgba(0,0,0,.55);border:1.5px solid rgba(217,166,60,.6);font-family:var(--f-head);font-size:15px;color:var(--brass)}
.pk-z.top{margin-bottom:2px}
.pk-z.top button{padding:6px 0;background:var(--brass);color:#271800}
.plinko{position:relative;width:100%;aspect-ratio:1/1.05;max-height:46vh;margin:0 auto 8px;border-radius:14px;background:radial-gradient(90% 70% at 50% 30%,var(--felt2),var(--felt) 70%,#081a12);border:3px solid #1b140c;box-shadow:0 0 0 2px var(--brass),inset 0 0 30px rgba(0,0,0,.6);overflow:hidden}
.peg{position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c8,var(--brass) 55%,#5a3c08);box-shadow:0 2px 2px rgba(0,0,0,.6)}
.pk-b{position:absolute;left:0;right:0;bottom:0;height:12%;display:grid;grid-template-columns:repeat(9,1fr)}
.pk-b span{display:grid;place-items:center;border-left:2px solid rgba(217,166,60,.5);font-family:var(--f-head);font-size:14px;color:var(--bone);background:rgba(0,0,0,.4);transition:background .3s}
.pk-b span:first-child{border-left:0}
.pk-b span.pois{background:rgba(63,191,106,.4);color:#e2ffe9}
.pk-b span.hit{background:var(--blood);color:#fff;animation:wrong .5s}
.pk-b span.ok{background:var(--brass);color:#271800}
.pk-ball{position:absolute;width:30px;height:30px;margin:-15px;border-radius:50%;border:3px solid var(--brass);background:#000;overflow:hidden;transition:left .22s cubic-bezier(.3,0,.7,1),top .22s cubic-bezier(.5,0,1,1);z-index:2;box-shadow:0 4px 10px rgba(0,0,0,.7)}
.pk-ball img,.pk-ball .ini{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font-weight:800}
.pw{display:grid;gap:6px;margin:8px 0 12px}
.pwr{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);border-radius:11px;padding:6px 8px;border:1px solid rgba(239,228,204,.12)}
.pwr img,.pwr .ini{width:30px;height:30px;border-radius:50%;object-fit:cover}
.pwr .pn{flex:1;min-width:0;font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pwr .pl{display:flex;gap:4px}
.pwr .pl b{width:30px;height:36px;border-radius:7px;display:grid;place-items:center;background:#1b140c;border:2px solid rgba(239,228,204,.25);font-family:var(--f-head);font-size:18px;text-transform:uppercase;color:var(--bone)}
.pwr .pl b.k{background:var(--ok);color:#04210f;border-color:#04210f;animation:mk .3s var(--ease-pop)}
.pwr.dead{border-color:var(--blood);background:rgba(125,15,31,.45)}
.pwr.dead .pl b{background:var(--blood);color:#fff}
.dita{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dita button{display:grid;place-items:center;gap:2px;padding:14px 0 10px;border-radius:14px;background:var(--paper);border:2.5px solid #1b140c;box-shadow:0 4px 0 #1b140c,inset 0 -6px 0 var(--kc);color:#1b140c}
.dita span{font-size:30px}
.dita b{font-family:var(--f-head);font-size:20px}
.duel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.duel button{display:grid;place-items:center;gap:6px;padding:16px 4px;border-radius:14px;background:linear-gradient(180deg,#2a1a10,#120b06);border:2px solid var(--brass);font-family:var(--f-head);font-size:15px;color:var(--bone)}
.duel button span{font-size:32px}
.stain{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(100%,300px);margin:0 auto 12px}
.stain button{aspect-ratio:1;border-radius:9px;background:var(--felt2);border:2px solid rgba(0,0,0,.5);box-shadow:inset 0 0 12px rgba(0,0,0,.5)}
.stain button.m{background:radial-gradient(circle at 45% 40%,#e0364b 0 28%,#a1142a 45%,transparent 62%),radial-gradient(circle at 70% 70%,#a1142a 0 12%,transparent 14%),var(--felt2)}
.stain button.hit{box-shadow:0 0 0 3px var(--ok)}
.stain button.miss{box-shadow:0 0 0 3px var(--blood);background:var(--felt2)}
.big.ord{text-align:center;color:var(--brass)}
.ordg{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:10px}
.ordg button{height:78px;border-radius:14px;background:linear-gradient(180deg,#1f1610,#0c0805);border:2px solid rgba(217,166,60,.55);display:grid;place-items:center}
.ordg b.on{font-family:var(--f-head);font-size:30px;color:var(--bone)}
.ordg button:active{transform:scale(.95)}

.safe-live{display:grid;gap:8px}
.sl-who{display:flex;align-items:center;gap:8px;font-size:17px}
.sl-who img,.sl-who .ini{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--brass)}
.sl-who span{margin-left:auto;color:var(--bone2);font-weight:700}
.safe-door{position:relative;margin:4px auto;width:min(100%,280px);padding:22px 10px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#2b5a45,#123326 70%);border:4px solid #1b140c;box-shadow:0 0 0 3px var(--brass),inset 0 0 0 6px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.7);transform-origin:left center;transition:transform .9s var(--ease-out)}
.safe-door::before,.safe-door::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 2px #1b140c;top:10px;left:10px}
.safe-door::after{left:auto;right:10px}
.safe-door.open{transform:perspective(700px) rotateY(-62deg);box-shadow:0 0 0 3px var(--ok),0 0 40px rgba(79,207,126,.6)}
.safe-door.shut{animation:wrong .5s;box-shadow:0 0 0 3px var(--blood),0 0 30px rgba(208,38,58,.6)}
.safe-dial.live .dg b{width:64px;height:76px;font-size:40px;transition:transform .08s}
.safe-dial.live .dg b.spin{transform:translateY(-3px);color:var(--bone2);filter:blur(.6px)}
.tries i{font-size:18px}

/* ---------- quattro morti ---------- */
#cine .dwrap{display:contents}
#cine .death{position:relative;width:150px;height:150px}
#cine .death .who{position:absolute;inset:0;animation:slamArt .6s var(--ease-pop) both}
#cine .death .crack path{animation-delay:calc(var(--t) + .05s)}
#cine .death ~ .soul{animation-delay:calc(var(--t) + .55s)}
#cine .death ~ .stamp{animation-delay:calc(var(--t) + .35s);font-size:56px;margin-top:18px}
#cine .death ~ .nome{animation:drop .4s var(--ease-out) calc(var(--t) + .5s) both}
#cine .death .who.die2{animation:slamArt .6s var(--ease-pop) both,diechip 1.4s calc(var(--t) + .2s) forwards}
/* pugnalato */
#cine .m-coltello .who.die2{animation:slamArt .6s var(--ease-pop) both,stabbed .5s var(--t) forwards,diechip 1.4s calc(var(--t) + .3s) forwards}
@keyframes stabbed{0%{transform:none}25%{transform:translateX(-14px) rotate(-9deg)}60%{transform:translateX(5px) rotate(4deg)}100%{transform:rotate(-3deg)}}
.mk-knife{position:absolute;left:58%;top:38%;width:130px;z-index:3;transform-origin:left center;animation:knifeIn .32s cubic-bezier(.6,0,.9,.4) calc(var(--t) - .32s) both}
.mk-knife svg{display:block;width:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.6))}
@keyframes knifeIn{from{transform:translate(260px,-120px) rotate(-38deg);opacity:0}70%{opacity:1}to{transform:translate(0,0) rotate(-14deg);opacity:1}}
.mk-drop{position:absolute;left:58%;top:44%;width:14px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#c3122b;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),0 0 0 2px #1b140c;opacity:0;z-index:2;animation:spray .7s cubic-bezier(.2,.8,.4,1) var(--t) both}
@keyframes spray{0%{opacity:1;transform:translate(0,0) scale(.4)}60%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1.1)}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 60px)) scale(.8)}}
/* freddato */
.mk-gun{position:absolute;right:112%;top:-6%;width:150px;z-index:3;transform-origin:70% 60%;animation:gunIn .45s var(--ease-out) .15s both,recoil .35s var(--t) forwards}
.mk-gun svg{display:block;width:100%;filter:drop-shadow(0 8px 8px rgba(0,0,0,.6))}
@keyframes gunIn{from{transform:translateX(-160px) rotate(10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes recoil{0%{transform:none}30%{transform:translateX(-16px) rotate(-16deg)}100%{transform:rotate(-2deg)}}
.mk-muzzle{position:absolute;left:96%;top:22%;width:70px;height:70px;margin:-20px 0 0 -10px;background:radial-gradient(circle,#fff 0 18%,#ffe36b 32%,#ff8a1a 52%,transparent 62%);clip-path:polygon(50% 0,60% 35%,100% 20%,68% 50%,100% 80%,60% 65%,50% 100%,40% 65%,0 80%,32% 50%,0 20%,40% 35%);opacity:0;animation:muzzle .18s var(--t) both}
@keyframes muzzle{0%{opacity:1;transform:scale(.4)}50%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.4)}}
.mk-smoke{position:absolute;left:100%;top:30%;width:26px;height:26px;border-radius:50%;background:rgba(230,230,230,.55);filter:blur(3px);opacity:0;animation:smoke 1.4s calc(var(--t) + .1s) both}
@keyframes smoke{0%{opacity:.8;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(30px,-70px) scale(2.4)}}
.mk-hole{position:absolute;left:44%;top:36%;width:30px;height:30px;border-radius:50%;z-index:2;background:radial-gradient(circle,#000 0 34%,#3a2a20 40%,rgba(0,0,0,.6) 52%,transparent 60%);opacity:0;animation:hole .2s var(--t) both}
.mk-hole::before,.mk-hole::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:2.5px;margin:-1px -23px;background:#111;transform:rotate(35deg)}
.mk-hole::after{transform:rotate(-50deg);width:38px;margin-left:-19px}
@keyframes hole{from{opacity:0;transform:scale(2.4)}to{opacity:1;transform:scale(1)}}
#cine .m-sparo .who.die2{animation:slamArt .6s var(--ease-pop) both,shot .45s var(--t) forwards,diechip 1.4s calc(var(--t) + .3s) forwards}
@keyframes shot{0%{transform:none}20%{transform:translateX(26px) rotate(14deg) scale(.94)}100%{transform:translateX(6px) rotate(6deg)}}
/* avvelenato */
#cine .m-veleno .who.die2{animation:slamArt .6s var(--ease-pop) both,toxic 1.1s .3s forwards,melt .9s var(--t) forwards}
@keyframes toxic{0%{filter:none}40%{filter:hue-rotate(70deg) saturate(1.8)}60%{transform:rotate(-6deg) scale(1.05)}80%{transform:rotate(6deg) scale(.97)}100%{filter:hue-rotate(80deg) saturate(2) brightness(.9);transform:none}}
@keyframes melt{0%{transform:none;filter:hue-rotate(80deg) saturate(2)}100%{transform:translateY(34px) scale(1.18,.62);filter:hue-rotate(80deg) saturate(.4) grayscale(.7) brightness(.6);border-radius:50% 50% 46% 46%/40% 40% 60% 60%}}
.mk-bub{position:absolute;left:var(--x);bottom:24%;width:var(--s);height:var(--s);border-radius:50%;border:2px solid #7dff9e;background:rgba(80,230,120,.25);box-shadow:0 0 8px #3fbf6a;opacity:0;z-index:2;animation:bub 1.3s ease-in var(--d) infinite}
@keyframes bub{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-130px) scale(1.2)}}
.mk-skullbub{position:absolute;left:50%;top:6%;font-style:normal;font-size:40px;color:#7dff9e;text-shadow:0 0 14px #3fbf6a;opacity:0;z-index:3;animation:skb 1.2s calc(var(--t) - .25s) both}
@keyframes skb{0%{opacity:0;transform:translate(-50%,40px) scale(.4)}40%{opacity:1;transform:translate(-50%,-30px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-90px) scale(1.5)}}
/* schiacciato */
.mk-shadow{position:absolute;left:50%;bottom:-14px;width:170px;height:26px;margin-left:-85px;border-radius:50%;background:rgba(0,0,0,.65);filter:blur(3px);z-index:0;animation:shadowGrow var(--t) ease-in both}
@keyframes shadowGrow{from{transform:scale(.15);opacity:.2}to{transform:scale(1);opacity:1}}
.mk-anvil{position:absolute;left:50%;top:-6px;width:170px;margin-left:-85px;z-index:3;animation:anvilFall var(--t) cubic-bezier(.55,0,1,.45) both,anvilSet .5s var(--t) forwards}
.mk-anvil svg{display:block;width:100%;filter:drop-shadow(0 10px 8px rgba(0,0,0,.6))}
@keyframes anvilFall{from{transform:translateY(-110vh)}to{transform:translateY(0)}}
@keyframes anvilSet{0%{transform:translateY(0)}30%{transform:translateY(-14px)}100%{transform:translateY(34px)}}
#cine .m-schiaccia .who.die2{animation:slamArt .6s var(--ease-pop) both,squash .45s var(--t) forwards}
@keyframes squash{0%{transform:none}60%{transform:translateY(58px) scale(1.7,.16)}100%{transform:translateY(62px) scale(1.6,.14);filter:grayscale(.8) brightness(.6)}}
.mk-dust{position:absolute;bottom:-6px;width:60px;height:40px;border-radius:50%;background:radial-gradient(circle,rgba(220,200,170,.8),transparent 70%);opacity:0;animation:dust .8s var(--t) both}
.mk-dust.l{left:-30px;--dx:-50px} .mk-dust.r{right:-30px;--dx:50px}
@keyframes dust{0%{opacity:1;transform:translateX(0) scale(.4)}100%{opacity:0;transform:translateX(var(--dx)) translateY(-20px) scale(1.8)}}

/* ---------- la Fuga rifatta ---------- */
#app[data-scene="fuga"] #hostRow{min-height:100px}
#app[data-scene="fuga"] #host{width:84px;flex-basis:84px;height:104px}
#app[data-scene="fuga"] #bubble{font-size:15.5px;min-height:54px;margin-bottom:8px}
#corr{height:190px;background-size:auto 100%;background-position:0% 50%;transition:background-position 1.2s var(--ease-out)}
#corr .grid,#corr .exit{display:none}
#corr::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,12,.35),transparent 30%,transparent 62%,rgba(0,0,0,.55));pointer-events:none;z-index:1}
#corr .track{position:absolute;left:0;right:0;bottom:0;height:38px;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));grid-template-rows:38px;overflow:hidden;z-index:2;background:linear-gradient(180deg,#5a0f18,#3a0910);border-top:2px solid var(--brass)}
#corr .tile{position:relative;display:grid;place-items:center;height:38px;min-height:0;overflow:hidden;border-right:1px solid rgba(217,166,60,.35);background:repeating-linear-gradient(45deg,rgba(217,166,60,.08) 0 4px,transparent 4px 9px)}
#corr .tile b{font-family:var(--f-head);font-size:13px;color:var(--bone);text-shadow:0 1px 2px #000}
#corr .tile:nth-child(odd){background-color:rgba(0,0,0,.18)}
#corr .tile.door{background:linear-gradient(180deg,#ffe9a8,#d9a63c);box-shadow:0 0 22px #f6d58a,inset 0 0 0 2px #1b140c;animation:glow 2s ease-in-out infinite alternate}
#corr .tile.door b{font-size:8.5px;color:#271800;text-shadow:none;letter-spacing:.02em}
#corr .dark{z-index:6;background:linear-gradient(90deg,#000 78%,rgba(0,0,0,.85) 88%,rgba(0,0,0,0))}
#corr .dark .eyes{position:absolute;width:22px;height:7px;animation:eyes 3.2s infinite}
#corr .dark .eyes::before,#corr .dark .eyes::after{content:"";position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:#ff3048;box-shadow:0 0 8px #ff3048}
#corr .dark .eyes::before{left:0} #corr .dark .eyes::after{right:0}
@keyframes eyes{0%,40%,100%{opacity:0}48%,88%{opacity:1}52%{transform:scaleY(.1)}56%{transform:none}}
#corr .tok{width:34px;height:34px;margin-left:-17px;top:auto;transition:left .38s var(--ease-out),bottom .3s;z-index:4}
#corr .tok.hop{animation:hop2 .38s ease-out}
@keyframes hop2{40%{transform:translateY(-16px) scale(1.08)}}
#corr .tok.me{box-shadow:0 0 0 3px var(--bone),0 0 14px rgba(239,228,204,.6)}
#corr .tok.me::after{content:"TU";position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--bone);text-shadow:0 1px 2px #000}
#corr .tok.grab{animation:grab .7s ease-in-out;z-index:8}
@keyframes grab{50%{transform:translateY(-26px) scale(1.4);box-shadow:0 0 26px var(--ghost)}}
#corr .tok.grabbed{animation:grabbed .7s}
@keyframes grabbed{30%,70%{transform:translateX(-5px)}50%{transform:translateX(5px)}100%{filter:grayscale(1)}}
#corr .tok.eaten{animation:eaten .9s ease-in forwards;z-index:7}
@keyframes eaten{0%{transform:none}30%{transform:translateY(-10px)}100%{transform:translateX(-80px) scale(.3);opacity:0}}
.howto{display:grid;gap:8px;margin:6px 0 10px}
.howto div{display:flex;gap:10px;align-items:flex-start;background:rgba(0,0,0,.45);border:1px solid rgba(217,166,60,.25);border-radius:12px;padding:9px 11px;font-size:16.5px;line-height:1.3;animation:ain .45s var(--ease-pop) both}
.howto div:nth-child(2){animation-delay:.12s}.howto div:nth-child(3){animation-delay:.24s}.howto div:nth-child(4){animation-delay:.36s}
