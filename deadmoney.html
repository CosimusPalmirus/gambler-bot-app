VISTE_SALA.password = (g, S, nuovo) => {
  const noto = g.noto || {};
  const griglia = () => `<div class="pw">${condP(g).map(p => `<div class="pwr ${(g.presi||[]).includes(p.id)?"dead":""}">${avatarHTML(p)}<span class="pn">${esc(nomeDi(p))}</span><span class="pl">${(noto[p.id]||[null,null,null,null]).map(c=>`<b class="${c?"k":""}">${c ? esc(c) : "·"}</b>`).join("")}</span></div>`).join("")}</div>`;
  const cacc = (g.cacciatori || []).map(i => i === -9 ? "Monsieur Fiche" : nomeDi(pDi(i)));
  if (g.passo === "parola"){
    if (nuovo){ const sono = tocca(g);
      show(testa(g, inCond(g) ? T("sei condannato","you're condemned") : "", sono ? T("Scegli una parola di 4 lettere","Pick a 4-letter word") : T("Scelgono la password…","Picking passwords…"), sono) +
        (sono ? `<div class="note">${T(`Deve esistere: il dizionario dell'hotel ne conosce ${g.n_diz}. Niente nomi, niente sigle.`, `It must exist: the hotel dictionary knows ${g.n_diz}. No names, no acronyms.`)}</div><div class="field"><input type="text" id="w" maxlength="4" autocomplete="off" placeholder="${T("es. dado","e.g. bone")}" style="text-transform:lowercase;letter-spacing:.3em"></div><button class="cta" id="ok">${T("BLOCCA","LOCK")}</button>` : "") + guarda(g, T("bloccata","locked")));
      const inp = $("#w"); if (inp){ setTimeout(() => inp.focus(), 50); inp.oninput = () => sfx("blip",{vol:.4});
        const go = () => { const v = inp.value.toLowerCase().trim(); if (!/^[a-z]{4}$/.test(v)){ toast(T("Servono 4 lettere.","4 letters needed.")); sfx("sbagliato",{vol:.5}); return; } sfx("lock"); salaAct(null, null, {tx:v}); };
        $("#ok").onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); }; }
    } else { aggiornaVivo(g.fatto, T("bloccata","locked")); if ((g.fatto||[]).includes(ST.me) && $("#w") && !$("#w").disabled){ $("#w").disabled = true; $("#ok").disabled = true; } }
    return;
  }
  if (g.passo === "caccia"){
    if (nuovo){ const sono = tocca(g);
      if (g.giro_k === 0) sayQ(T(`Password bloccate. ${cacc.map(x=>"<b>"+esc(x)+"</b>").join(", ")} ${cacc.length>1?"hanno":"ha"} ${g.giri} tentativi per scassinarle.`, `Passwords locked. ${cacc.map(x=>"<b>"+esc(x)+"</b>").join(", ")} ${cacc.length>1?"have":"has"} ${g.giri} tries to crack them.`), {espr:"indica"});
      show(testa(g, T(`tentativo ${g.giro_k+1} di ${g.giri}`, `try ${g.giro_k+1} of ${g.giri}`), sono ? T("Prova una parola","Try a word") : T("I cacciatori provano…","The hunters are guessing…"), sono) + griglia() +
        (inCond(g) && mio(g).parola ? `<div class="note">${T("La tua: ","Yours: ")}<b>${esc(mio(g).parola)}</b></div>` : "") +
        (sono ? `<div class="field"><input type="text" id="w" maxlength="4" autocomplete="off" placeholder="${T("4 lettere","4 letters")}" style="letter-spacing:.3em"></div><button class="cta" id="ok">${T("PROVA","TRY")}</button>` : "") + guarda(g, T("ha provato","tried")));
      const inp = $("#w"); if (inp){ setTimeout(() => inp.focus(), 50); const go = () => { const v = inp.value.toLowerCase().trim(); if (/^[a-z]{4}$/.test(v)){ sfx("lock"); salaAct(null, null, {tx:v}); inp.disabled = true; $("#ok").disabled = true; } else sfx("sbagliato",{vol:.4}); };
        $("#ok").onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); }; }
    } else aggiornaVivo(g.fatto, T("ha provato","tried"));
    return;
  }
  if (g.passo === "giro"){
    if (!nuovo) return;
    const ul = (g.storia || [])[(g.storia || []).length - 1] || [];
    show(testa(g, T("giro ","round ") + g.giro_k, "") + `<div class="note">${T("Tentativi: ","Guesses: ")}${ul.map(([h,w]) => `<b>${esc(w)}</b> (${esc(h === -9 ? "Monsieur Fiche" : nomeDi(pDi(h)))})`).join(" · ") || T("nessuno","none")}</div>` + griglia());
    sfx((g.presi||[]).length > (ST.loc.np || 0) ? "teschio" : "rullo_stop"); ST.loc.np = (g.presi||[]).length;
    return;
  }
  if (!nuovo) return;
  const pa = (g.riv || {}).parole || {};
  show(testa(g, T("le password","the passwords"), "") + listHTML(condP(g), p => ({t: esc(pa[p.id] || "—"), cls: (g.morti||[]).includes(p.id) ? "dead" : "safe"})));
};

/* ---------- IL DUELLO ---------- */
VISTE_SALA.duello = (g, S, nuovo) => {
  const M = [T("ATTACCA","ATTACK"), T("PARA","PARRY"), T("INCASSA","CASH IN")], IC = ["⚔","🛡","◉"];
  if (g.passo === "scegli"){
    if (nuovo){ const sono = tocca(g);
      show(testa(g, T(`${g.cond.length} al tavolo`, `${g.cond.length} at the table`), sono ? T("Che fai?","What do you do?") : T("Scelgono la mossa…","Choosing their move…"), sono) + (sono ? `<div class="note">${T("L'attacco batte chi incassa. La parata batte l'attacco. Chi incassa batte la parata (e prende 500). Se incassano tutti, muoiono tutti.","Attack beats cash. Parry beats attack. Cash beats parry (and takes 500). If everyone cashes in, everyone dies.")}</div><div class="duel">${M.map((x,i)=>`<button data-k="${i}"><span>${IC[i]}</span>${x}</button>`).join("")}</div>` : "") + guarda(g, T("pronto","ready")));
      document.querySelectorAll(".duel button").forEach(b => b.onclick = () => { sfx("lock"); salaAct(+b.dataset.k); document.querySelectorAll(".duel button").forEach(x => x.disabled = true); b.classList.add("sel"); });
    } else aggiornaVivo(g.fatto, T("pronto","ready"));
    return;
  }
  if (!nuovo) return;
  const mo = (g.riv || {}).mosse || {};
  show(testa(g, T("le mani si scoprono","hands revealed"), "") + `<div class="list" id="dl"></div>`);
  dopoRivela(g, S, async () => { for (const p of condP(g)){ const el = $("#dl"); if (!el) return; const k = mo[p.id];

/* ---------- il filo col guscio ---------- */
function su(m){ try { parent.postMessage({dm:"su", m}, location.origin); } catch(e){} }
function act(a, ax, ay, extra){
  if (ST.spec) return;
  const m = {t:"act", a, ax: (ax == null ? null : ax), ay: (ay == null ? null : ay), power: ST.S ? ST.S.tok : null};
  if (extra && extra.tx != null) m.tx = String(extra.tx).slice(0, 60);
  if (extra && extra.pts) m.pts = extra.pts;
  su(m);
}
const salaAct = (ax, ay, extra) => act("sala", ax, ay, extra);
function alGuscio(o){ try { parent.postMessage(o, location.origin); } catch(e){} }
window.addEventListener("message", ev => {
  if (ev.origin !== location.origin) return;
  const d = ev.data; if (!d || typeof d !== "object" || d.dm !== "giu") return;
  try { ricevi(d.m); } catch(e){ alGuscio({dm:"err", msg: String(e && e.stack || e).slice(0, 300)}); }
});
window.addEventListener("error", e => alGuscio({dm:"err", msg: String(e.message || "").slice(0, 200)}));

function ricevi(m){
  if (!m || typeof m !== "object") return;
  switch (m.t){
    case "start": return suStart(m);
    case "s": if (m.g === "deadmoney") suSnap(m); return;
    case "err":
      if (m.code === "dm_act_no" && m.perche && !/vecchia|tempo/.test(m.perche)) toast(traduciNo(m.perche));
      return;
    case "over": return suOver(m);
    case "lobby": return suLobby(m);
    case "esce": if (m.x) toast(LANG === "en" ? String(m.x).replace(" ha lasciato il tavolo", " left the table") : m.x); return;
    case "pausa": ST.pausa = true; if (AU.ctx && AU.ctx.state === "running") AU.ctx.suspend(); return;
    case "riprendi": ST.pausa = false; if (AU.ctx && AU.ctx.state === "suspended") AU.ctx.resume(); return;
    case "bordi": { const r = document.documentElement.style; r.setProperty("--b-top", (m.top|0)+"px"); r.setProperty("--b-bot", (m.bottom|0)+"px"); return; }
    case "chat": return;
  }
}
const NO_EN = {"non e' nel dizionario dell'hotel":"Not in the hotel's dictionary","servono 4 lettere":"4 letters needed","hai gia' risposto":"You already answered",
  "da vivo al massimo due voci":"Alive: two options at most","quel dito non c'e' piu'":"That finger is gone","non adesso":"Not now"};
function traduciNo(p){ if (p === "non e' nel dizionario dell'hotel") return T("Non è nel dizionario dell'hotel. Un'altra.", NO_EN[p]); return LANG === "en" ? (NO_EN[p] || p) : p; }

/* ---------- start: i giocatori ---------- */
function suStart(m){
  ST.start = m; ST.spec = !!m.spec; ST.over = null; ST.fineVista = false; ST.key = ""; ST.primo = true; ST.fatti.clear(); ST.rivFatte.clear(); ST.opere = {};
  const mi = m.map || {}, prof = m.profiles || {};
  ST.me = -1;
  ST.P = (mi.seggi || []).map(s => {
    const pr = prof[s.uid] || {};
    const foto = s.bot ? fotoBot(s.sg) : (pr.photo_url || null);
    return {id:s.sg, uid:s.uid, nome: s.nome || (pr.name || "?"), foto, bot:!!s.bot, col: COLORI[s.sg % 8], me:false, vivo:true, fiche:0};
  });
  if (!ST.spec && m.you != null){ const mio = ST.P.find(p => p.uid === m.you); if (mio){ mio.me = true; ST.me = mio.id; } }
  $("#chips").innerHTML = "";
  const pot = Number(m.pot_eur) || 0;
  $("#tPot").innerHTML = m.practice ? `<i></i>${T("ALLENAMENTO","PRACTICE")}` : pot > 0 ? `<i></i>${eur(pot)}` : `<i></i>${T("GRATIS","FREE")}`;
  scena("salone");
}
function fotoBot(sg){ return img("bot_" + String((sg % 12) + 1).padStart(2,"0")) || null; }
function aggiornaGiocatori(S){
  for (const g of (S.giocatori || [])){ const p = ST.P[g.sg]; if (!p) continue; p.vivo = g.vivo; p.fiche = g.fiche; p.via = g.via; p.fuori = g.fuori; p.pos = g.pos; }
  if (S.you && S.you.sg >= 0 && !ST.spec){ ST.me = S.you.sg; ST.P.forEach(p => p.me = p.id === ST.me); }
}
const io = () => ST.P[ST.me] || null;
function puo(a){ const S = ST.S; return !!(S && S.you && (S.you.puo || []).includes(a)); }

/* ---------- la coda (prima dello start) ---------- */
function suLobby(m){
  if (ST.start && !ST.over) return;
  scena("salone"); setRound(T("Hotel Ultima Mano","Hotel Ultima Mano"));
  show(`<div class="attesa"><div class="eyebrow">${T("Hall dell'hotel","Hotel lobby")}</div><div class="big">${T("Aspettiamo gli altri ospiti…","Waiting for the other guests…")}</div>
    <div class="num">${m.players || 1}<small>/${m.cap || 8}</small></div>
    <div class="note">${m.starts_in != null ? T("Si parte fra ","Starting in ") + Math.max(0, Math.round(m.starts_in)) + " s" : T("Servono almeno 3 giocatori.","At least 3 players needed.")}</div></div>`);
}

/* ---------- il fotogramma ---------- */
function suSnap(S){
  const primo = !ST.S;
  ST.S = S; ST.clockT = performance.now();
  aggiornaGiocatori(S);
  const feed = S.feed || [];
  for (const v of feed){
    if (v.s <= ST.ultimoFeed) continue;
    ST.ultimoFeed = v.s;
    const vecchio = (S.t - v.t) > 4 || primo;      // al rientro non si rivedono le scene passate
    if (v.k === "opera"){ ST.opere[v.ch] = trattiDaFilo(v.tratti); continue; }
    if (!vecchio) try { evento(v, S); } catch(e){ alGuscio({dm:"err", msg:"evento " + v.k + ": " + e}); }
  }
  try { render(); } catch(e){ alGuscio({dm:"err", msg:"render: " + String(e && e.stack || e).slice(0, 280)}); }
}
const resta = o => o ? Math.max(0, (Number(o.resta_s) || 0) - (performance.now() - ST.clockT)/1000) : 0;

/* ---------- la voce in coda: una battuta alla volta, al massimo una in attesa ---------- */
function sayEvQ(ev, vars={}, o={}){ ST.sayQ.push(() => sayEv(ev, vars, o)); if (ST.sayQ.length > 2) ST.sayQ.splice(0, ST.sayQ.length - 2); giraSay(); }
function sayQ(html, o={}){ ST.sayQ.push(() => say(html, o)); if (ST.sayQ.length > 2) ST.sayQ.splice(0, ST.sayQ.length - 2); giraSay(); }
async function giraSay(){ if (ST.sayBusy) return; ST.sayBusy = true; while (ST.sayQ.length){ const f = ST.sayQ.shift(); try { await f(); } catch(e){} } ST.sayBusy = false; }
function cineQ(f){ ST.cineQ = ST.cineQ.then(() => f()).catch(() => {}); return ST.cineQ; }

/* ---------- gli eventi del registro ---------- */
function evento(v, S){
  const p = pDi(v.sg);
  switch (v.k){
    case "carta": { const d = S.domanda || {}; cineQ(() => cineCarta(v.k_ || S.k, S.nd, catNome(d), d.cat)); sayEvQ("domanda", {cat: catNome(d)}, {extra:-700}); break; }
    case "risposto": if (v.sg !== ST.me) sfx("altro", {vary:true}); break;

    case "fiche": if (p && v.d && v.m !== "totomorto" && v.m !== "mazzetta") flyText(p, (v.d > 0 ? "+" : "−") + fmt(Math.abs(v.d))); if (v.m === "dead_money"){ sfx("pioggia"); coins(26);
        sayQ(T(`DEAD MONEY: <b>${fmt(v.d)}</b> fiche dei morti vanno a <b>${esc(nomeDi(p))}</b>, il più veloce.`, `DEAD MONEY: <b>${fmt(v.d)}</b> chips from the dead go to <b>${esc(nomeDi(p))}</b>, the fastest.`), {espr:"soldi", extra:-500}); } break;
    case "sala": { SALA_ORA = v.sala; const nomi = (v.cond || []).map(i => nomeDi(pDi(i))).join(", ");
      scena("sala"); cineQ(() => cineSala({id:v.sala, nome: salaNome(v.sala), reg: salaReg(v.sala)}));   /* la voce della sala la dice cineSala */
      sayQ(frase("sala_ingresso", {nomi, sala: salaNome(v.sala)}), {espr:"indica"}); break; }
    case "mazzetta": sfx("mazzetta"); sayEvQ("mazzetta", {nome: nomeDi(p)}, {extra:-600}); break;

      if (ps.me) sayEvQ("fantasma", {nome: nomeDi(ps)});
      break; }
    case "fuga": scena("fuga"); cineQ(() => cineTitolo(T("Ultimo atto","Final act"), T("LA FUGA","THE ESCAPE"), T("Corri alla porta prima che si spengano le luci. Chi esce prende il piatto.","Run for the door before the lights go out. Whoever gets out takes the pot."), "gold"));
      sayEvQ("fuga_inizio"); break;
    case "fuga_domanda": sfx("carta"); break;
    case "ruba": { const vit = pDi(v.vittima); sfx("fantasma"); setTimeout(() => { sfx("ruba"); flash("g"); shake(); haptic("dead"); }, 700);
      sayEvQ("ruba_vita", {nome: nomeDi(p), vittima: nomeDi(vit)}); break; }
    case "passi": corsa(v.prima || [], v.pos || []); break;

    case "porta_rivela": { const fu = S.fuga || {}; const po = fu.porta || {};
      for (const [k, x] of Object.entries(po)){ const pp = pDi(+k); if (!pp) continue; cineQ(() => cineFugaPorta(pp, !!x.ok)); if (!x.ok) sayEvQ("porta_fallita", {nome: nomeDi(pp)}, {extra:-400}); } break; }
    case "buio": { sfx("buio"); const d = $("#corr .dark"); if (d){ d.classList.remove("flick"); void d.offsetWidth; d.classList.add("flick"); }

        await cine(`<div class="rays"></div><div class="kick">${v.motivo === "porta" ? T("È uscito dalla porta","Out of the door") : T("Il più vicino alla porta","Closest to the door")}</div><div class="who" style="--c:${w.col}">${avatarHTML(w)}</div><div class="stamp y">${T("FUGGITO","ESCAPED")}</div><div class="nome">${esc(nomeDi(w))}</div>`, "gold", 1200, 3500);
        ST.fineScena = true; alGuscio({dm:"fine_scena"}); });

function etichetta(S){
  const f = S.fase;
  if (["ingresso"].includes(f)) return T("Il tavolo","The table");
  if (["scelta","domanda","rivela"].includes(f)) return T(`Domanda ${S.k} di ${S.nd}`, `Question ${S.k} of ${S.nd}`);
  if (["cartello","mazzetta","toto","sala","esito_sala"].includes(f)) return T("Sala del Debito","The Debt Room") + (S.sala && S.sala.id ? " · " + salaNome(S.sala.id) : "");
  if (["fuga_intro","voci","voci_rivela","passi","porta","porta_rivela"].includes(f)) return T("La Fuga","The Escape") + (S.fuga && S.fuga.fk ? " · " + S.fuga.fk : "");
  return T("Il conto","The bill");
}

const CIRC = 138.2;
function timerHTML(o, opt={}){
  const r = resta(o), tot = Math.max(1, opt.tot || (o && o.tot_s) || r || 1);
  const fine = performance.now() + r*1000;
  return `<div class="timer${opt.nascosto ? " hide" : ""}" data-fine="${fine}" data-tot="${tot}" data-mio="${opt.mio ? 1 : 0}"><svg viewBox="0 0 54 54"><circle class="tr" cx="27" cy="27" r="22"/><circle class="tf" cx="27" cy="27" r="22" stroke-dasharray="${CIRC}" stroke-dashoffset="0"/></svg><b>${Math.ceil(r)}</b></div>`;
}
setInterval(() => {
  for (const tm of document.querySelectorAll(".timer[data-fine]")){
    const fine = +tm.dataset.fine, tot = +tm.dataset.tot, r = Math.max(0, (fine - performance.now())/1000);
    const tf = tm.querySelector(".tf"), b = tm.querySelector("b"); if (tf) tf.style.strokeDashoffset = CIRC * (1 - Math.min(1, r/tot));
    const s = Math.ceil(r);
    if (b && b.textContent !== String(s)){ b.textContent = s; if (tm.dataset.mio === "1" && !tm.classList.contains("hide")){ if (s <= 3 && s > 0){ sfx("tic_forte"); tm.classList.add("low"); } else if (s <= 10 && s > 3) sfx("tic"); } }
  }
}, 100);

  let key = S.fase + "|" + S.tok;
  if (S.fase === "sala" && S.sala && S.sala.gioco) key += "|" + S.sala.gioco.passo;

}

    const d = c.querySelector(".dark"); if (d && !d.querySelector(".eyes")) d.innerHTML = `<i class="eyes" style="right:18%;top:22%"></i><i class="eyes" style="right:46%;top:52%;animation-delay:1.3s"></i><i class="eyes" style="right:70%;top:30%;animation-delay:2.1s"></i>`;
  }
  if (ST.corsa) return;           // durante la corsa i gettoni li muove la corsa
  const W = 100/(LEN+1);
  const pos = sg => (ST.posVista && ST.posVista[sg] != null) ? ST.posVista[sg] : (pDi(sg) ? pDi(sg).pos || 0 : 0);
  for (const p of ST.P){
    let t = c.querySelector("#tk"+p.id);
    if (!t){ t = document.createElement("div"); t.className = "tok"; t.id = "tk"+p.id; t.style.setProperty("--c", p.col); t.innerHTML = avatarHTML(p); c.appendChild(t); }
    const same = ST.P.filter(o => pos(o.id) === pos(p.id) && !o.fuori); const k = Math.max(0, same.indexOf(p));
    t.style.left = `${(pos(p.id)+0.5)*W}%`; t.style.bottom = (40 + k*19) + "px"; t.style.zIndex = 10 - k;
    t.className = "tok" + (p.vivo?"":" gh") + (p.me?" me":"") + (p.fuori?" out":"") + (hop && hop.has(p.id) ? " hop" : "");
  }
  const buio = S.fuga ? S.fuga.buio : -1;
  c.querySelector(".dark").style.width = buio >= 0 ? ((buio+1)*W)+"%" : "0";
  const lead = Math.max(0, ...ST.P.filter(p => !p.fuori).map(p => pos(p.id)));
  c.style.backgroundPosition = `${Math.min(100, lead/LEN*100)}% 50%`;
}
async function corsa(prima, dopo){
  ST.posVista = prima.slice(); ST.corsa = false; corrDrawS(ST.S);
  const max = Math.max(0, ...dopo.map((x,i) => x - (prima[i]||0)));
  ST.corsa = true;
  for (let k=1;k<=max;k++){
    const hop = new Set();
    for (let i=0;i<dopo.length;i++){ if (ST.posVista[i] < dopo[i]){ ST.posVista[i]++; hop.add(i); } }
    ST.corsa = false; corrDrawS(ST.S, hop); ST.corsa = true;
    sfx("passo",{vary:true}); if (hop.size > 2) sfx("passo",{vary:true,delay:.08});
    await sleep(420);
  }
  ST.corsa = false; ST.posVista = null; corrDrawS(ST.S);
}
function cartaFugaS(cat, voci, o){
  return `<div class="fq ${o.porta?"porta":""}"><div class="fk">${o.porta ? T("LA PORTA · risposta perfetta","THE DOOR · perfect answer") : T("SÌ O NO? · domanda ","YES OR NO? · question ") + o.n}</div><div class="fc">${esc(cat)}</div>
    <div class="fr"><span>${T("Tocca <b>TUTTE</b> quelle giuste","Tap <b>ALL</b> the right ones")}</span>${o.porta ? `<span class="pill">${T("tutte giuste e niente di più","all right, nothing more")}</span>` : `<span class="pill ok">${T("✔ = 1 passo","✔ = 1 step")}</span><span class="pill ko">${T("✖ = resti fermo","✖ = you stay put")}</span>`}</div>${o.timer || ""}</div>
    <div class="fopts">${voci.map((x,i)=>`<button class="fopt" data-i="${i}" id="fo${i}"><i class="box"></i><span class="tx">${esc(x)}</span><span class="who"></span><span class="ver"></span></button>`).join("")}</div>`;
}
FASI.fuga_intro = (S, nuovo) => {
  if (!nuovo) return;
  scena("fuga"); $("#chips").innerHTML = "";
  const v = ST.P.filter(p => p.vivo).sort((a,b) => (b.pos||0) - (a.pos||0));
  show(`<div class="eyebrow">${T("La Fuga · come si corre","The Escape · how to run")}</div><div class="howto">
    <div><b>1</b><span>${T("Una domanda <b>SÌ o NO</b> con <b>3 voci</b>. Ne possono essere giuste una, due o tre.","A <b>YES or NO</b> question with <b>3 options</b>. One, two or three can be right.")}</span></div>
    <div><b>2</b><span>${T("Tocca <b>tutte</b> quelle giuste: <b>ogni voce giusta è un passo</b>. Se ne tocchi una sbagliata, resti fermo.","Tap <b>all</b> the right ones: <b>each right option is a step</b>. Tap a wrong one and you stay put.")}</span></div>
    <div><b>3</b><span>${T("I vivi ne toccano al massimo <b>2</b>, le anime tutte e <b>3</b>. Un'anima che ti raggiunge <b>ti ruba la vita</b>.","The living tap <b>2</b> at most, souls all <b>3</b>. A soul that catches you <b>steals your life</b>.")}</span></div>
    <div><b>4</b><span>${T("Dalla terza domanda <b>il buio avanza</b> e si mangia chi resta indietro. Alla porta serve una risposta perfetta.","From the third question <b>the dark advances</b> and swallows the stragglers. At the door you need a perfect answer.")}</span></div></div>
    <div class="note">${T("Si parte in base alle fiche: ","Starting positions by chips: ")}${v.map(p => `<b>${esc(nomeDi(p))}</b> ${T("casella","tile")} ${p.pos||0}`).join(", ")}${T(". Le anime partono da zero.",". Souls start at zero.")}</div>`);
};
FASI.voci = (S, nuovo) => {
  const fu = S.fuga || {}; const q = (fu.q && (fu.q[LANG] || fu.q.it)) || {cat:"", voci:[]};
  const m = io(); const posso = puo("voci");
  if (nuovo){
    espr("carte"); ST.loc.sel = new Set();
    const maxSel = m && m.vivo ? 2 : 3;
    if (posso){
      show(cartaFugaS(q.cat, q.voci, {n: fu.fk, timer: timerHTML(S.orologio, {mio:true})}) + `<div class="fcount" id="fcn"></div><button class="cta" id="ok">${T("NESSUNA · RESTO FERMO","NONE · STAY PUT")}</button>`);
      const s = ST.loc.sel;
      const agg = () => { document.querySelectorAll(".fopt").forEach(b => b.classList.toggle("sel", s.has(+b.dataset.i)));
        $("#fcn").innerHTML = m.vivo ? T(`Scelte <b>${s.size}/2</b> · sei vivo, al massimo due`, `Picked <b>${s.size}/2</b> · alive, two at most`) : T(`Scelte <b>${s.size}/3</b> · da anima puoi toccarle tutte`, `Picked <b>${s.size}/3</b> · as a soul you can tap them all`);
        $("#ok").textContent = s.size ? T(`CORRO · fino a ${s.size} ${s.size===1?"passo":"passi"}`, `RUN · up to ${s.size} ${s.size===1?"step":"steps"}`) : T("NESSUNA · RESTO FERMO","NONE · STAY PUT"); };
      document.querySelectorAll(".fopt").forEach(b => b.onclick = () => { const i = +b.dataset.i; if (s.has(i)){ s.delete(i); sfx("tap"); } else if (s.size < maxSel){ s.add(i); sfx("puntata",{vol:.6}); haptic("soft"); } else { sfx("sbagliato",{vol:.35}); b.classList.add("nope"); setTimeout(()=>b.classList.remove("nope"),400); } agg(); });
      $("#ok").onclick = () => { sfx("lock"); act("voci", [...s].reduce((a,i) => a | (1<<i), 0)); document.querySelectorAll(".fopt").forEach(b => b.disabled = true); $("#ok").disabled = true; $("#ok").textContent = T("FATTO · si aspetta","DONE · waiting"); };
      agg();
    } else {
      show(cartaFugaS(q.cat, q.voci, {n: fu.fk, timer: timerHTML(S.orologio)}) + `<div class="note">${m && m.fuori ? T("Il buio ti ha preso: guardi gli altri correre.","The dark got you: you watch the others run.") : T("Hai scelto. Gli altri ci pensano…","You've chosen. The others are thinking…")}</div>`);
      document.querySelectorAll(".fopt").forEach(b => { b.disabled = true; if ((S.you && S.you.voci || []).includes(+b.dataset.i)) b.classList.add("sel"); });
    }
  }
};
FASI.voci_rivela = (S, nuovo) => {
  if (!nuovo) return;
  const fu = S.fuga || {}; const q = (fu.q && (fu.q[LANG] || fu.q.it)) || {cat:"", voci:[]}; const e = fu.esito || {};
  show(cartaFugaS(q.cat, q.voci, {n: fu.fk}));
  document.querySelectorAll(".fopt").forEach(b => b.disabled = true);
  (async () => {
    (e.sel || []).forEach((s, sg) => { for (const i of (s || [])){ const w = $("#fo"+i+" .who"); if (w && pDi(sg)) w.insertAdjacentHTML("beforeend", avatarHTML(pDi(sg))); } });
    sfx("puntata",{vol:.6}); await sleep(700);
    for (let i=0;i<q.voci.length;i++){ const b = $("#fo"+i); if (!b) continue; const si = (e.si||[])[i];
      b.classList.add("flip", si ? "si" : "no"); b.querySelector(".ver").textContent = si ? T("SÌ ✔","YES ✔") : T("NO ✖","NO ✖");
      sfx(si ? "giusto" : "sbagliato",{vol:.55}); await sleep(650); }
    const p = $("#panel"); if (!p) return;
    p.insertAdjacentHTML("beforeend", `<div class="fsteps">${(e.passi||[]).map((n, sg) => { const pp = pDi(sg); if (!pp || pp.fuori) return ""; return `<span class="${n?"go":"st"} ${pp.vivo?"":"gh"}">${avatarHTML(pp)}${n ? "+"+n : T("fermo","stuck")}</span>`; }).join("")}</div>`);
    if (io() && !io().fuori) ((e.passi||[])[ST.me] ? haptic("ok") : haptic("ko"));
  })();
};
FASI.passi = (S, nuovo) => { if (nuovo) show(`<div class="eyebrow">${T("La Fuga","The Escape")}</div><div class="big">${T("Si corre!","Run!")}</div>`); };
FASI.porta = (S, nuovo) => {
  const fu = S.fuga || {}; const po = fu.porta || {};
  if (!nuovo) return;
  if (puo("porta")){
    const mio = po[String(ST.me)] || {}; const q = (mio.q && (mio.q[LANG] || mio.q.it)) || {cat:"", voci:[]};
    const s = ST.loc.sel = new Set();
    show(cartaFugaS(q.cat, q.voci, {porta:true, timer: timerHTML(S.orologio, {mio:true})}) + `<button class="cta alt" id="ok">${T("APRI LA PORTA","OPEN THE DOOR")}</button>`);
    document.querySelectorAll(".fopt").forEach(b => b.onclick = () => { const i = +b.dataset.i; s.has(i) ? (s.delete(i), sfx("tap")) : (s.add(i), sfx("puntata",{vol:.6})); b.classList.toggle("sel", s.has(i)); });
    $("#ok").onclick = () => { sfx("lock"); act("porta", [...s].reduce((a,i) => a | (1<<i), 0)); document.querySelectorAll(".fopt").forEach(b => b.disabled = true); $("#ok").disabled = true; };
  } else {
    const chi = Object.keys(po).map(k => pDi(+k)).filter(Boolean);
    show(`<div class="eyebrow">${T("Davanti alla porta","At the door")}</div><div class="big">${chi.map(p => esc(nomeDi(p))).join(", ")} ${chi.length > 1 ? T("provano","try") : T("prova","tries")} ${T("ad aprirla","to open it")}</div>` + vivoHTML(chi.map(p => p.id)));
  }
};
FASI.porta_rivela = (S, nuovo) => {
  if (!nuovo) return;
  const fu = S.fuga || {}; const po = fu.porta || {};
  let h = "";
  for (const [k, x] of Object.entries(po)){ const p = pDi(+k); const q = (x.q && (x.q[LANG] || x.q.it)) || {cat:"", voci:[]};
    h += `<div class="eyebrow">${esc(nomeDi(p))} · ${x.ok ? T("APERTA","OPEN") : T("CHIUSA","SHUT")}</div><div class="fq porta"><div class="fc">${esc(q.cat)}</div></div><div class="fopts">${q.voci.map((t,i) => `<div class="fopt flip ${(x.si||[])[i]?"si":"no"} ${(x.sel||[]).includes(i)?"sel":""}"><i class="box"></i><span class="tx">${esc(t)}</span><span class="ver">${(x.si||[])[i] ? T("SÌ ✔","YES ✔") : T("NO ✖","NO ✖")}</span></div>`).join("")}</div>`; }
  show(h);
};

/* ---------- la fine ---------- */
FASI.fine = (S, nuovo) => { if (nuovo) disegnaFine(); };
function suOver(m){
  ST.over = m;
  if (typeof loadBalance === "function") try { loadBalance(); } catch(e){}
  disegnaFine();
  if (!ST.fineScena){ setTimeout(() => { if (!ST.fineScena){ ST.fineScena = true; alGuscio({dm:"fine_scena"}); } }, 6000); }
}
function disegnaFine(){
  const S = ST.S || {}, m = ST.over;
  const fi = S.fine || (m ? {vincitore: m.vincitore, becchino: m.becchino, motivo: m.motivo} : null);
  if (!fi && !m) return;
  if (m && m.annullata){
    show(`<div class="receipt"><h3>HOTEL ULTIMA MANO</h3><div class="c">${T("TAVOLO ANNULLATO","TABLE CANCELLED")}</div><div class="r"><span>${T("La partita non è arrivata in fondo.","The game didn't finish.")}</span></div><hr><div class="tot"><span>${T("POSTA","STAKE")}</span><span>${T("RESA","REFUNDED")}</span></div></div>` + tastiFine());
    legaTastiFine(); return;
  }
  const w = fi ? pDi(fi.vincitore) : null, b = fi && fi.becchino != null ? pDi(fi.becchino) : null;
  const ord = ST.P.slice().sort((a,c) => (c.id === (fi&&fi.vincitore) ? 1 : 0) - (a.id === (fi&&fi.vincitore) ? 1 : 0) || (c.pos||0) - (a.pos||0) || c.fiche - a.fiche);
  const pot = Number(m && m.pot_eur || ST.start && ST.start.pot_eur) || 0;
  const mioPremio = m ? Number(m.your_cut_eur != null ? m.your_cut_eur : 0) : 0;
  const soldi = pot > 0 && !(ST.start && ST.start.practice);
  show(`<div class="receipt"><h3>HOTEL ULTIMA MANO</h3><div class="c">${T("RICEVUTA · TAVOLO VERDE","RECEIPT · GREEN TABLE")} · ${new Date().toLocaleDateString(LANG === "en" ? "en-GB" : "it-IT")}</div>
    ${ord.map(p => `<div class="r ${p === w || p === b ? "w" : ""} ${!p.vivo && p !== w ? "x" : ""}"><span>${esc(nomeDi(p))}${p === w ? " 🚪" : p === b ? T(" ⚰ becchino"," ⚰ gravedigger") : ""}</span><span class="d"></span><span>${fmt(p.fiche)} f</span></div>`).join("")}
    ${soldi ? `<hr><div class="r"><span>${T("Piatto","Pot")}</span><span class="d"></span><span>${eur(pot)}</span></div><div class="r"><span>${T("Alla casa","To the house")} (5%)</span><span class="d"></span><span>${eur(Math.floor(pot*5)/100)}</span></div>${b ? `<div class="r"><span>${T("Becchino","Gravedigger")}: ${esc(nomeDi(b))}</span><span class="d"></span><span>20%</span></div>` : ""}` : ""}
    <hr><div class="tot"><span>${soldi ? T("A TE","TO YOU") : T("VINCE","WINNER")}</span><span>${soldi ? (mioPremio > 0 ? "+" + eur(mioPremio) : eur(0)) : esc(nomeDi(w))}</span></div><div class="st">${w && w.me ? T("VINTO","WON") : (b && b.me && mioPremio > 0 ? T("BECCHINO","GRAVEDIGGER") : T("SALDATO","SETTLED"))}</div></div>` + tastiFine());
  legaTastiFine();
  if (w && w.me && m && !ST.fatti.has("vinto")){ ST.fatti.add("vinto"); sfx("soldi"); coins(30); }
}
function tastiFine(){ return ST.spec ? `<button class="cta" id="fEsci">${T("ESCI","EXIT")}</button>` : `<div class="row"><button class="cta alt" id="fAgain">${T("RIGIOCA","PLAY AGAIN")}</button><button class="cta ghost" id="fEsci">${T("ESCI","EXIT")}</button></div>`; }
function legaTastiFine(){ const a = $("#fAgain"), e = $("#fEsci"); if (a) a.onclick = () => { sfx("lock"); alGuscio({dm:"rigioca"}); }; if (e) e.onclick = () => { sfx("tap"); alGuscio({dm:"esci"}); }; }

/* ---------- avvio ---------- */
async function avvioRete(){
  wireAudioButtons(); atmoInit(); espr("neutro");
  scena("salone"); setRound("Hotel Ultima Mano");
  show(`<div class="attesa"><div class="eyebrow">Hotel Ultima Mano</div><div class="big">${T("L'hotel apre le porte…","The hotel opens its doors…")}</div></div>`);
  $("#bubble").innerHTML = T("Ah, un nuovo debitore. Accomodati: <b>il casinò riapre solo per chi ha perso tutto</b>.","Ah, a new debtor. Do sit down: <b>the casino only reopens for those who've lost everything</b>.");
  const sblocca = () => { sbloccaAudio(); if (AU.ctx && AU.ctx.state === "suspended") AU.ctx.resume(); };
  addEventListener("pointerdown", sblocca, {capture:true});
  try { sbloccaAudio(); } catch(e){}
  const bar = $("#load .bar i");
  await Promise.race([caricaImmagini(f => bar && (bar.style.width = (f*100)+"%")), new Promise(r => setTimeout(r, 4000))]);
  $("#load").classList.add("off");
  ST.pronto = true;
  alGuscio({dm:"pronto"});
}

avvioRete();

</script>
