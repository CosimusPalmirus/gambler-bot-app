<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BISCA</title>
<style>
/* TAPPO — la pagina in iframe (12/10/2026). Un file solo, niente da fuori origine.
   Le carte sono DOM (<img> da carte/NN.webp), mai una tela; nessun rAF a tavolo fermo. */
@font-face{font-family:'Bungee';font-style:normal;font-weight:400;font-display:swap;src:url(tappo/font/bungee.woff2) format('woff2')}
@font-face{font-family:'Rubik';font-style:normal;font-weight:500 800;font-display:swap;src:url(tappo/font/rubik.woff2) format('woff2')}
:root{--tp-sat:0px;--tp-sab:0px;--tp-sal:0px;--tp-sar:0px;--cw:104px;--mw:17px;--dw:60px;--hw:46px;--qw:60px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1512;overflow:hidden}
body{font-family:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;color:#f6efdc;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:fixed;left:0;top:0;right:0;bottom:0;padding:var(--tp-sat) var(--tp-sar) var(--tp-sab) var(--tp-sal);overflow:hidden;
  background:radial-gradient(120% 85% at 50% 36%,#22664b 0%,#164534 44%,#0c271f 78%,#081a15 100%)}
#app::after{content:'';position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,rgba(0,0,0,.02) 2px 4px)}
#tav{position:relative;width:100%;height:100%}
#tav>*{position:absolute}

/* la barra in alto: SOLO a sinistra (l'angolo alto-destro 96x44 e' di ESCI) */
#barra{left:8px;top:6px;height:36px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 112px)}
#bGuida{appearance:none;border:0;width:36px;height:36px;border-radius:11px;background:rgba(8,20,16,.7);color:#ffe9a8;
  font-size:18px;line-height:36px;padding:0;box-shadow:inset 0 0 0 1.5px rgba(255,220,130,.45);cursor:pointer}
#titolo{font-family:'Bungee','Rubik',sans-serif;font-size:17px;letter-spacing:.04em;color:#ffd866;text-shadow:0 2px 0 rgba(0,0,0,.45);line-height:1}
#sotto{font-size:11px;color:#bfe0cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
#barraTesti{min-width:0}

/* le targhe degli altri */
.tg{position:absolute;width:var(--pw);height:var(--ph);margin:calc(var(--ph)/-2) 0 0 calc(var(--pw)/-2);border-radius:13px;
  background:rgba(7,19,15,.78);box-shadow:inset 0 0 0 2px var(--col),0 4px 10px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px 4px;
  transition:opacity .3s,filter .3s,transform .18s}
.tgNome{max-width:100%;font-size:11px;line-height:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.tgNome i{font-style:normal;color:#ffb4a8;font-size:9px}
.mini{position:relative;height:calc(var(--mw)*1.5);width:calc(var(--mw) + var(--mw)*1.8)}
.mini img{position:absolute;top:0;width:var(--mw);height:calc(var(--mw)*1.5);filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));transition:opacity .2s}
.mini img:nth-child(1){left:0}.mini img:nth-child(2){left:calc(var(--mw)*.6)}
.mini img:nth-child(3){left:calc(var(--mw)*1.2)}.mini img:nth-child(4){left:calc(var(--mw)*1.8)}
.tg.vuota .mini img{opacity:0}
.vite{display:flex;gap:2px;align-items:center;height:12px;font-size:11px;line-height:12px;color:#ffd0c8}
.cuore{width:11px;height:11px;display:block;transition:transform .25s,opacity .25s}
.cuore.perso{opacity:.22;filter:grayscale(1)}
.cuore.scoppia{animation:tpScoppia .7s ease-out}
.tgSegno{position:absolute;right:-7px;top:-8px;min-width:24px;height:24px;border-radius:12px;padding:0 6px;
  font-size:12px;line-height:24px;text-align:center;color:#10231b;background:#ffe27a;box-shadow:0 2px 5px rgba(0,0,0,.45);
  transform:scale(0);transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.tgSegno.su{transform:scale(1)}
.tgSegno.ok{background:#63e09a}
.tgSegno.ultimo{background:#ff5a47;color:#fff;font-size:10px;top:-18px;height:20px;line-height:20px;border-radius:10px}   /* INTEGRAZIONE: anche il tempo dell’ultimo sta sopra la targa */
.tgSegno.tempo{font-size:10px;background:#f3ead2;top:-18px;height:20px;line-height:20px;border-radius:10px}   /* INTEGRAZIONE 12/10: il tempo sta SOPRA la targa, non sul nome (a 7 al telefono lo copriva) */
.tg.fuori{opacity:.4;filter:grayscale(1)}
.tg.assente{opacity:.62}
.tg.perde{animation:tpTrema .5s 2}
.tg.attivo{transform:scale(1.06)}

/* il centro: il mazzo e la pila delle mani */
#mazzo{width:var(--dw);height:calc(var(--dw)*1.5);margin:calc(var(--dw)*-.75) 0 0 calc(var(--dw)/-2);transition:opacity .25s,transform .12s;cursor:pointer;touch-action:none}
/* BISCA SENZA TASTO (13/10): il mazzo E' il tasto. ::before allarga il bersaglio per il dito, ::after e' l'anello di stato */
#mazzo::before{content:'';position:absolute;left:-18px;top:-18px;right:-18px;bottom:-18px;border-radius:20px}
#mazzo::after{content:'';position:absolute;left:-10px;top:-10px;right:-10px;bottom:-10px;border-radius:15px;border:3px solid transparent;pointer-events:none;z-index:5}
#mazzo[data-st=riposo]::after{border:2px dashed rgba(255,255,255,.3)}
#mazzo[data-st=quart]::after{border-color:#ffd65a;box-shadow:0 0 26px rgba(255,214,90,.9),inset 0 0 14px rgba(255,214,90,.5);animation:tpAnello .45s infinite alternate}
#mazzo[data-st=gara]::after{border-color:#ff5a3c;box-shadow:0 0 30px rgba(255,90,60,.95),inset 0 0 16px rgba(255,90,60,.55);animation:tpAnello .24s infinite alternate}
#mazzo[data-st=messa]::after{border-color:#2fbf7a;box-shadow:0 0 14px rgba(47,191,122,.6)}
#mazzo.no{animation:tpTrema .3s}
body.spet #mazzo{cursor:default}
#pila,.manina{pointer-events:none}
#tocca{transform:translateX(-50%);white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:6px;height:24px;border-radius:12px;padding:0 11px 0 8px;
  font-family:'Bungee','Rubik',sans-serif;font-size:13px;line-height:24px;transition:opacity .25s}
#tocca .ico{flex:none;width:17px;height:17px}
#tocca .ico svg{display:block;width:100%;height:100%}
#tocca[data-st=riposo]{font-family:'Rubik',sans-serif;font-weight:700;font-size:11px;color:#d5e8dc;background:rgba(0,0,0,.38)}
#tocca[data-st=quart]{color:#3b2500;background:linear-gradient(#ffe88a,#f2b21c);box-shadow:0 0 16px rgba(255,214,90,.7)}
#tocca[data-st=gara]{color:#fff;background:linear-gradient(#ff7d60,#dd2616);box-shadow:0 0 18px rgba(255,90,60,.8)}
#tocca[data-st=messa]{color:#eafff2;background:linear-gradient(#2a9c63,#1b7347)}
#tocca[data-st=spento],#tocca[data-st=esci],#tocca[data-st=fine],body.spet #tocca,#mazzo.via+#tocca{opacity:0}
body.largo #tocca{height:28px;border-radius:14px;font-size:15px;line-height:28px}
body.largo #tocca[data-st=riposo]{font-size:12px}
#mazzo img{position:absolute;left:0;top:0;width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#mazzo img:nth-child(1){transform:translate(-4px,4px) rotate(-5deg)}
#mazzo img:nth-child(2){transform:translate(3px,2px) rotate(4deg)}
#mazzo.colpo{animation:tpColpo .22s}
#mazzo.via,#pila.via{opacity:0}
#mazzo.via{pointer-events:none}
#pila{width:0;height:0;transition:opacity .25s}
.manina{position:absolute;left:0;top:0;width:var(--hw);height:var(--hw);margin:calc(var(--hw)/-2) 0 0 calc(var(--hw)/-2);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.55));animation:tpSchiaffo .16s cubic-bezier(.2,.9,.3,1.2) both}
.manina svg{display:block;width:100%;height:100%}
#rivela{width:0;height:0;display:flex;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity .25s;pointer-events:none}
#rivela.su{opacity:1}
#rivela .rv{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px}
#rivela .rv b{font-size:10px;line-height:12px;color:#fff;max-width:calc(var(--qw) + 8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rivela .rv.vince .carta{filter:drop-shadow(0 0 7px #ffe27a) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
#rivela .carta{width:var(--qw);height:calc(var(--qw)*1.5)}
#rivela.venta{gap:0}
#rivela.venta .rv+.rv{margin-left:calc(var(--qs) - var(--qw))}
#targhe{transition:opacity .25s}
#targhe.giu{opacity:.12}

/* le carte: gli angoli sono gia' nel file (niente border-radius, niente box-shadow) */
.carta{position:relative;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.carta img{display:block;width:100%;height:100%;pointer-events:none}
.carta.rotta{background:#f4ecd8;border-radius:6.2%}
.carta.rotta img{visibility:hidden}
.carta.rotta::after{content:attr(data-nome);position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
  text-align:center;color:#2a2114;font-size:13px;line-height:15px;padding:4px;white-space:pre-line}
.volo{position:absolute;left:0;top:0;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));will-change:transform}

/* la riga del banditore: il testo NON sta mai sopra le carte */
#detto{left:8px;right:8px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
#dettoA{font-family:'Bungee','Rubik',sans-serif;font-size:15px;line-height:19px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dettoB{font-size:12px;line-height:16px;color:#cfe8da;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
#detto.oro #dettoA{color:#ffe27a}
#detto.rosso #dettoA{color:#ff8e7e}
#detto.verde #dettoA{color:#8ef0b8}
#detto.botto #dettoA{animation:tpBotto .3s}
#tempo{left:14%;right:14%;height:5px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;opacity:0;transition:opacity .2s}
#tempo.su{opacity:1}
#tempo i{display:block;height:100%;width:0;background:#ffe27a;border-radius:3px}
#tempo.gara i{background:#ff5a47}

/* io */
#mio{left:8px;right:8px;height:22px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#fff}
#mio .vite{height:16px;font-size:14px;line-height:16px}
#mio .cuore{width:15px;height:15px}
#mio .pall{width:10px;height:10px;border-radius:5px;background:var(--col)}
#mio .mioSegno{min-width:22px;height:20px;border-radius:10px;padding:0 7px;font-size:11px;line-height:20px;text-align:center;color:#10231b;background:#ffe27a}
#mio .mioSegno.ultimo{background:#ff5a47;color:#fff}
#mio .mioSegno.tempo{background:#f3ead2}
#mano{height:calc(var(--cw)*1.5)}
.slot{position:absolute;top:0;width:var(--cw);height:calc(var(--cw)*1.5);transition:transform .14s cubic-bezier(.2,.8,.3,1.2),opacity .15s;cursor:pointer;touch-action:none}
.slot.scelta{transform:translateY(-16px)}
.slot.vuoto{opacity:0;pointer-events:none}
.slot.gira{animation:tpGira .26s ease-in-out}
#mano.quart .slot .carta{filter:drop-shadow(0 0 8px #ffe27a) drop-shadow(0 0 2px #ffb300)}
#mano.quart .slot{animation:tpSalto .5s infinite alternate}
#mano.quart .slot:nth-child(2){animation-delay:.08s}#mano.quart .slot:nth-child(3){animation-delay:.16s}#mano.quart .slot:nth-child(4){animation-delay:.24s}

/* IL TASTO: grande, sempre nello stesso punto, mai sotto ESCI */
#bMano{appearance:none;border:0;border-radius:18px;font-family:'Bungee','Rubik',sans-serif;font-size:21px;line-height:24px;color:#d5e8dc;
  background:linear-gradient(#3b5248,#2a3b34);box-shadow:0 5px 0 #17231e,0 10px 18px rgba(0,0,0,.4);cursor:pointer;touch-action:none;
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:0 10px;transition:transform .05s}
#bMano .ico{flex:none;width:34px;height:34px}
#bMano .ico svg{display:block;width:100%;height:100%}
#bMano .tx{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
#bMano small{font-family:'Rubik',sans-serif;font-weight:600;font-size:11px;line-height:13px;opacity:.85;white-space:nowrap}
#bMano.quart{color:#3b2500;background:linear-gradient(#ffe88a,#f2b21c);box-shadow:0 5px 0 #8a5d00,0 0 22px rgba(255,214,90,.7);animation:tpPulsa .45s infinite alternate}
#bMano.gara{color:#fff;background:linear-gradient(#ff7d60,#dd2616);box-shadow:0 5px 0 #7a0f06,0 0 26px rgba(255,90,60,.8);animation:tpPulsa .24s infinite alternate}
#bMano.messa{color:#eafff2;background:linear-gradient(#2a9c63,#1b7347);box-shadow:0 2px 0 #0d3a24;transform:translateY(3px)}
#bMano.spento{opacity:.36}
#bMano:not(.esci){display:none}   /* BISCA SENZA TASTO (13/10): la mano si mette toccando il mazzo */
/* CURA G3 (13/10): a riposo (si passano le carte, niente quartetto) il tasto e' piu' basso di 14 px in cima:
   il dito che sceglie una carta non lo sfiora. Col quartetto e a gara aperta torna pieno. */
#bMano.riposo{margin-top:var(--bhm,10px);height:var(--bhr,60px)!important}
/* CURA G6: chi ha finito le vite non ha un tasto «aspetta»: ha l'uscita */
#bMano.esci{color:#fff;background:linear-gradient(#5b6f8f,#3c4c66);box-shadow:0 5px 0 #1d2636,0 10px 18px rgba(0,0,0,.4)}
#bMano.esci .ico{display:none}
#bMano.esci .tx{align-items:center}
/* CURA G4: il segno della rete lenta, accanto alle mie vite */
#mio .rete{height:18px;border-radius:9px;padding:0 7px;font-size:10px;line-height:18px;color:#3b2500;background:#ffb84a;white-space:nowrap}
/* CURA 11: il finale copre davvero quello che ha sotto */
#bMano.giu{transform:translateY(4px) scale(.985)}
#bMano.no{animation:tpTrema .3s}
body.spet #bMano,body.spet #mano,body.spet #mio{display:none}

/* effetti a tutto schermo (sotto i tasti: non rubano i tocchi) */
#lampo{left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,226,122,.75),rgba(255,120,60,.25) 60%,transparent 80%)}
#lampo.via{animation:tpLampo .32s ease-out}
#lampo.rosso{background:radial-gradient(circle at 50% 60%,transparent 35%,rgba(255,40,20,.55) 100%)}

/* il finale: sopra la zona degli altri, mai sopra la mia mano */
#fine{left:10px;right:10px;border-radius:18px;background:rgb(6,16,13);box-shadow:inset 0 0 0 2px rgba(255,220,130,.5),0 12px 30px rgba(0,0,0,.5);
  display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:14px}
#fine.su{display:flex;animation:tpEntra .35s cubic-bezier(.2,.9,.3,1.15)}
#fTimbro{font-family:'Bungee','Rubik',sans-serif;font-size:30px;line-height:34px;color:#ffe27a;text-shadow:0 3px 0 rgba(0,0,0,.5)}
#fine.perso #fTimbro{color:#fff}
#fChi{font-size:15px;color:#fff}
#fPerche{font-size:13px;color:#bfe0cf}
#fSoldi{font-size:16px;color:#8ef0b8;min-height:20px}

/* il velo (attesa, cartello) e la guida */
#velo{left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  background:radial-gradient(120% 85% at 50% 36%,#22664b 0%,#164534 44%,#0c271f 78%,#081a15 100%);z-index:30}
#velo.via{display:none}
#vTitolo{font-family:'Bungee','Rubik',sans-serif;font-size:40px;color:#ffd866;text-shadow:0 4px 0 rgba(0,0,0,.45);letter-spacing:.04em}
#vCarte{display:flex}
#vCarte img{width:58px;height:87px;margin:0 -9px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
#vCarte img:nth-child(1){transform:rotate(-12deg) translateY(6px)}#vCarte img:nth-child(2){transform:rotate(-4deg)}
#vCarte img:nth-child(3){transform:rotate(4deg)}#vCarte img:nth-child(4){transform:rotate(12deg) translateY(6px)}
#vTesto{font-size:15px;color:#e6f5ec}
#guida{left:0;top:0;right:0;bottom:0;z-index:40;display:none;flex-direction:column;background:rgba(6,16,13,.97);padding:10px 14px 14px}
#guida.su{display:flex}
#gTesta{height:44px;flex:none;display:flex;align-items:center;padding-right:104px;font-family:'Bungee','Rubik',sans-serif;font-size:17px;color:#ffd866}
#gCorpo{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.gv{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06)}
.gv b{display:block;font-family:'Bungee','Rubik',sans-serif;font-size:13px;color:#ffe27a;margin-bottom:4px}
.gv span{font-size:14px;line-height:19px;color:#eef7f1;font-weight:500}
#gChiudi{flex:none;height:52px;border:0;border-radius:14px;margin-top:8px;font-family:'Bungee','Rubik',sans-serif;font-size:17px;color:#10231b;background:linear-gradient(#ffe88a,#f2b21c);cursor:pointer}

body.largo #titolo{font-size:20px}
body.largo #dettoA{font-size:20px;line-height:25px}
body.largo #dettoB{font-size:14px;line-height:18px}
body.largo .tgNome{font-size:13px;line-height:16px}
body.largo #bMano{font-size:25px;line-height:28px}
body.largo #bMano small{font-size:13px;line-height:15px}
body.largo #bMano .ico{width:44px;height:44px}
body.largo #fTimbro{font-size:42px;line-height:46px}

@keyframes tpPulsa{from{transform:scale(1)}to{transform:scale(1.035)}}
@keyframes tpAnello{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes tpTrema{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes tpColpo{0%{transform:scale(1)}40%{transform:scale(.9) translateY(3px)}100%{transform:scale(1)}}
@keyframes tpSchiaffo{from{opacity:0;transform:var(--tr) scale(2.3)}to{opacity:1;transform:var(--tr) scale(1)}}
@keyframes tpScoppia{0%{transform:scale(1);opacity:1;filter:none}40%{transform:scale(1.9);opacity:1;filter:none}100%{transform:scale(1);opacity:.22;filter:grayscale(1)}}
@keyframes tpLampo{from{opacity:1}to{opacity:0}}
@keyframes tpBotto{from{transform:scale(1.25)}to{transform:scale(1)}}
@keyframes tpEntra{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes tpGira{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes tpSalto{from{transform:translateY(0)}to{transform:translateY(-7px)}}
</style>
</head>
<body>
<div id="app">
  <div id="tav">
    <div id="lampo"></div>
    <div id="barra">
      <button id="bGuida" type="button" aria-label="guida">📖</button>
      <div id="barraTesti"><div id="titolo">BISCA</div><div id="sotto"></div></div>
    </div>
    <div id="targhe" style="left:0;top:0"></div>
    <div id="mazzo" data-st="spento"><img alt="" draggable="false"><img alt="" draggable="false"><img alt="" draggable="false"></div>
    <div id="tocca" data-st="spento"><span class="ico"></span><b id="toccaA"></b></div>
    <div id="pila"></div>
    <div id="rivela"></div>
    <div id="detto"><div id="dettoA"></div><div id="dettoB"></div></div>
    <div id="tempo"><i></i></div>
    <div id="mio"></div>
    <div id="mano"></div>
    <button id="bMano" type="button" class="spento"><span class="ico"></span><span class="tx"><span id="bManoA"></span><small id="bManoB"></small></span></button>
    <div id="voli" style="left:0;top:0;width:0;height:0;pointer-events:none"></div>
    <div id="fine"><div id="fTimbro"></div><div id="fChi"></div><div id="fPerche"></div><div id="fSoldi"></div></div>
    <div id="velo"><div id="vTitolo">BISCA</div><div id="vCarte"></div><div id="vTesto"></div></div>
    <div id="guida"><div id="gTesta"></div><div id="gCorpo"></div><button id="gChiudi" type="button"></button></div>
  </div>

  if (v === IN_PAUSA) { if (!v) misura(); return; }
  IN_PAUSA = v;
  if (v) { Suono.acceso = false; svegliaPause(); finisciVoli(); }
  else { Suono.acceso = true; chiaveTempo = ''; misura(); if (!inScena) allinea(); aggTasti(); aggTempo(); }
}
function suBordi(m) {
  const d = document.documentElement, lati = ['top', 'bottom', 'left', 'right'], sigle = ['sat', 'sab', 'sal', 'sar'];
  for (let i = 0; i < 4; i++) {
    let k = m[lati[i]];
    if (typeof k !== 'number' || !isFinite(k) || k < 0) k = 0;
    if (k > 200) k = 200;
    d.style.setProperty('--tp-' + sigle[i], Math.round(k) + 'px');
  }
  misura();
}
function errorePagina(msg) {
  TPG.errori.push(String(msg));
  if (RETE) TPG.manda({ tp: 'err', msg: String(msg).slice(0, 300) });
  else if (window.console) console.error('TAPPO: ' + msg);
}
function smista(m) {
  try {
    switch (m.t) {
      case 'start': if (m.game == null || m.game === 'tappo') suStart(m); break;
      case 's': if (m.g === 'tappo') riceviS(m); break;
      case 'over': if (m.game == null || m.game === 'tappo') riceviOver(m); break;
      case 'err': if (typeof m.code === 'string' && m.code.indexOf('tp_') === 0) riceviErr(m); break;
      case 'esce': if (m.game === 'tappo') riceviEsce(m); break;
      case 'chat': break;
      case 'pausa': suPausa(true); break;
      case 'riprendi': suPausa(false); break;
    }
  } catch (e) { errorePagina('smista ' + m.t + ': ' + (e && e.message)); }
}

/* ---------- TPG: IL GUSCIO (copia di KJG di kaiju.html, chiave `tp`) */
const TPG = (() => {
  const G = { pronto: false, coda: [], errori: [] };
  const CODA_MAX = 2000;
  G.manda = o => {
    if (!RETE || !window.parent || window.parent === window) return false;
    try { window.parent.postMessage(o, location.origin); } catch (e) { G.errori.push('postMessage: ' + (e && e.message)); return false; }
    return true;
  };
  G.su = m => { if (SPET || MOSSE.indexOf(m.a) < 0) return false; STAT.su++; return G.manda({ tp: 'su', m: m }); };
  G.ricevi = m => {
    if (!m || typeof m !== 'object' || typeof m.t !== 'string') { STAT.scartati++; return; }
    STAT.giu++;
    if (m.t === 'bordi') { suBordi(m); return; }
    if (!G.pronto) { if (G.coda.length < CODA_MAX) G.coda.push(m); else STAT.scartati++; return; }
    smista(m);
  };
  G.fattoPronto = () => {
    if (G.pronto) return;
    G.pronto = true;
    const c = G.coda; G.coda = [];
    c.forEach(smista);
    G.manda({ tp: 'pronto' });
  };
  if (RETE) {
    addEventListener('message', ev => {
      if (ev.source !== window.parent || ev.origin !== location.origin) return;
      const d = ev.data;
      if (!d || typeof d !== 'object' || d.tp !== 'giu' || !d.m) return;
      G.ricevi(d.m);
    });
    addEventListener('error', ev => { errorePagina('pagina: ' + (ev && ev.message ? ev.message : 'errore')); });
    addEventListener('unhandledrejection', ev => { errorePagina('promessa: ' + (ev && ev.reason && ev.reason.message ? ev.reason.message : 'errore')); });
  }
  return G;
})();

/* ---------- TPF: IL FILO (una partita registrata dal banco del motore, recitata coi suoi tempi) */
const TPF = (() => {
  const F = { filo: null, i: 0, tm: 0, finito: false };
  F.carica = arr => { F.filo = Array.isArray(arr) ? arr : null; };
  F.parti = () => {
    clearTimeout(F.tm); F.i = 0; F.finito = false;
    if (!F.filo || !F.filo.length) { $('#vTesto').textContent = T('Partita non trovata'); return; }
    F.passo();
  };
  F.passo = () => {
    if (!F.filo || F.i >= F.filo.length) { F.finito = true; return; }
    if (IN_PAUSA) { F.tm = setTimeout(F.passo, 200); return; }
    const p = F.filo[F.i++];
    TPG.ricevi(p.m);
    const pross = F.filo[F.i];
    if (pross) F.tm = setTimeout(F.passo, Math.max(0, (pross.dt || 0) * 1000 / VEL)); else F.finito = true;
  };
  return F;
})();
const FONTE = { su: m => (RETE ? TPG.su(m) : false) };

/* ---------- LA GUIDA: i numeri vengono da `map.reg`, mai scritti a mano */
function guida() {
  const r = (ANAG && ANAG.reg) || {}, n = x => (x == null ? '?' : String(Math.round(x * 10) / 10));
  const voci = [
    ['LE CARTE', T('Si gioca con tanti quartetti (4 carte dello stesso valore) quanti sono i giocatori ancora in gara. Quattro carte a testa: le tue le vedi solo tu.')],
    ['IL GIRO', T('Tutti insieme scegliete una carta da passare al vicino di sinistra. Avete {s} secondi: a chi non sceglie, il banco passa una carta a caso.', { s: n(r.passa_s) }) +
      (r.banco_giri > 0 ? ' ' + T('Dopo {g} giri senza un quartetto le carte le passa il banco, finché qualcuno chiude: tu guarda la tua mano e il mazzo.', { g: n(r.banco_giri) }) : '')],
    ['LA MANO', T('Appena hai 4 carte uguali tocca il MAZZO al centro del tavolo: è la tua mano sul mazzo. Da quel momento tutti devono toccarlo: l’ULTIMO perde una vita.')],
    ['A VUOTO', T('Se tocchi il mazzo senza avere 4 carte uguali, e nessuno l’ha ancora toccato, la vita la perdi tu. Il mazzo non si tocca a caso.')],
    ['I TEMPI', T('Chi non mette la mano entro {s} secondi perde una vita. Se gli ultimi due arrivano a meno di {p} millesimi uno dall’altro è pari: nessuno perde e si ridanno le carte.', { s: n(r.mano_max_s), p: n(r.pari_ms) })],
    ['LA RETE', (+r.lat_cap_ms > 0)
      ? T('Il server misura la tua connessione e la toglie dal tuo tempo (fino a {l} millesimi): conta il riflesso, non la rete. Sotto i {u} millesimi non si guadagna niente: più veloce di così non è un riflesso.', { l: n(r.lat_cap_ms), u: n(r.umano_min_ms) })
      : T('A questo tavolo c’è un premio: conta l’ordine di ARRIVO al server e la rete non si toglie dal tempo. Con una connessione lenta parti svantaggiato: se accanto alle tue vite vedi 📶, la tua rete è oltre i {a} millesimi. Sotto i {u} millesimi dal segnale non si guadagna niente: più veloce di così non è un riflesso.', { a: RETE_LENTA_MS, u: n(r.umano_min_ms) })],
    ['LE VITE', r.vite === 1 ? T('Si parte con una vita sola. Chi la perde è fuori. L’ultimo che resta al tavolo prende tutto il piatto.') : T('Si parte con {v} vite. A zero sei fuori. L’ultimo che resta al tavolo prende tutto il piatto.', { v: n(r.vite) })]
  ];
  if (GEO && GEO.largo) voci.splice(4, 0, ['SUL PC', T('La barra spaziatrice vale come un tocco sul mazzo: stessa regola, a vuoto costa una vita.')]);   // cura G3
  $('#gTesta').textContent = T('📖 COME SI GIOCA');
  $('#gCorpo').innerHTML = voci.map(v => '<div class="gv"><b>' + esc(T(v[0])) + '</b><span>' + esc(v[1]) + '</span></div>').join('');
  $('#gChiudi').textContent = T('HO CAPITO');
  $('#guida').classList.add('su');
}

/* ---------- AVVIO */
window.TP_GIU = m => TPG.ricevi(m);                                    // per i banchi: un messaggio senza postMessage
window.TP_STATO = () => ULT;
window.TP_VISTA = () => ({ IO: IO, SPET: SPET, TOK: TOK, FASE: FASE, V: V, maxS: maxS, coda: CODA.length, inScena: inScena, over: OVER,
  finale: finaleFatto, fineMandata: fineMandata, puoMano: PUO_MANO, puoPassa: PUO_PASSA, messaTok: MESSA_TOK, geo: GEO, stat: STAT,
  mosse: MOSSE.slice(), mancanti: Array.from(MANCANTI), chiavi: Object.keys(DIZ).length, errori: TPG.errori.slice(), vel: VEL, lingua: EN ? 'en' : 'it',
  filo: FILO, filoFinito: TPF.finito });
window.TP_FILO = arr => { TPF.carica(arr); TPG.fattoPronto(); TPF.parti(); };  // per i banchi: un filo senza fetch
(function avvio() {
  $('#vCarte').innerHTML = [9, 19, 29, 39].map(c => '<img alt="" draggable="false" src="' + fileCarta(c) + '">').join('');
  $('#bManoA').textContent = T('METTI LA MANO'); $('#bManoB').textContent = T('aspetta');
  bMano.querySelector('.ico').innerHTML = svgMano('#d5e8dc');
  bMano.addEventListener('pointerdown', ev => toccoMano(ev, true));  // resta solo l'uscita di chi ha finito le vite
  $('#mazzo').addEventListener('pointerdown', ev => { if (SPET || !ANAG || $('#guida').classList.contains('su')) return; toccoMano(ev, false); });   // BISCA SENZA TASTO: il mazzo e' la mano
  addEventListener('keydown', ev => {                                 // sul PC: la barra spaziatrice e' la mano
    if (ev.repeat || (ev.code !== 'Space' && ev.key !== ' ')) return;
    if ($('#guida').classList.contains('su') || !ANAG || SPET) return;
    ev.preventDefault(); toccoMano(null);
  });
  addEventListener('pointerdown', () => Suono.sveglia(), { passive: true });
  $('#bGuida').addEventListener('click', () => { Suono.tasto(); if (!SPET && IO >= 0 && inGara() && V && V.vite[IO] > 0) return; guida(); });   // cura G1
  $('#gChiudi').addEventListener('click', () => { Suono.tasto(); $('#guida').classList.remove('su'); });
  addEventListener('resize', misura);
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => misura()); } catch (e) {}
  misura();
  if (RETE) {
    $('#vTesto').textContent = T('IN ATTESA DEI GIOCATORI…');
    // pronto quando il dorso e' arrivato (e' la prima cosa che si vede), o dopo 4 s
    const i = new Image(); i.onload = i.onerror = () => TPG.fattoPronto(); i.src = DORSO;
    setTimeout(TPG.fattoPronto, 4000);
  } else if (FILO) {
    $('#vTesto').textContent = T('Carico la partita…');
    TPG.fattoPronto();
    fetch(FILO).then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(arr => { TPF.carica(arr); TPF.parti(); })
      .catch(() => { $('#vTesto').textContent = T('Partita non trovata'); });
  } else {
    $('#vTesto').textContent = T('Apri BISCA da Gambler Bot');
    TPG.fattoPronto();
  }
})();
</script>
