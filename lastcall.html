var LARGO = 1;
window.addEventListener('resize', function () { misuraTavolo(); });

/* ⭐ L'IMPAGINATO. `t` dice quanto lo schermo e' «da PC»: 0 un telefono in
   piedi, 1 uno schermo orizzontale. Ogni misura e' una miscela fra le due
   pagine, cosi' una finestra quadrata non e' ne' l'una ne' l'altra a scatti.
     · PILE: larghe l'11,5% della colonna sul PC (il 34% dello schermo sul
       telefono), e fra i BORDI una carta intera di aria sul PC.
     · AVVERSARI: una fila in alto, distribuita sul 78% della colonna.
     · MANO: in fondo, alta il 28% dello schermo sul PC; sul telefono sopra il
       suggerimento e il tasto.
   ⭐ LA CAMERA SI RICAVA. Con l'occhio a `oY` dietro e le pile a y=0,95:
       d = oY + 0,95;  k_pila = Wbb·(d−0,6)/(d·0,80)   (Wbb = bordo vicino, px)
       occhioH = q·(d+0,6)/1,5   (q = altezza/larghezza della pila a schermo)
       f = k_pila·d;  orizzonte = Ypila − occhioH·k_pila
   e la profondita' degli avversari dall'altezza a cui devono stare:
       Ypila − Yavv = occhioH·k_pila·(1 − d/d_avv). */
function impagina() {
  var a = LARG / Math.max(1, ALT), t = limita((a - 0.75) / (1.35 - 0.75), 0, 1);
  var CW = Math.min(LARG, 1.9 * ALT), fs = limita(0.009 * ALT + 5, 12, 19);
  var L = { t: t, CW: CW, fs: fs, largo: false };
  L.fsTarga = Math.max(12, Math.round(fs * 0.95));
  /* ⚠️ i nomi degli avversari sul PC crescono con l'altezza: a 1920 erano in
     corpo 13, schiacciati sotto la testata (i giudici del 13/09, tutti e tre) */
  L.fsNome = Math.max(12, Math.round(mixN(fs * 0.92, limita(0.0165 * ALT, 12, 22), t)));
  /* ── le pile ── */
  var Wbb = mixN(PILA_TEL * LARG, Math.min(PILA_PC * CW, 0.20 * ALT), t);
  var q = mixN(0.80, 1.0, t);
  var Yp = mixN(0.365, 0.385, t) * ALT;
  /* ⚠️ sul PC l'occhio va piu' INDIETRO (3,4 invece di 2,2): con l'occhio
     vicino il campo orizzontale era di 109° e le pile fuori centro uscivano
     come parallelogrammi storti. Piu' lontano = prospettiva piu' morbida,
     la stessa impaginazione. */
  var oY = mixN(OCCHIO_Y, 3.4, t), d = oY + 0.95;
  Y_MANO = 1.0 - oY; POSTI.mano.y = Y_MANO;
  var kp = Wbb * (d - 0.6) / (d * WPILA);
  var oH = q * (d + 0.6) / 1.5;
  var f = kp * d, oriz = Yp - oH * kp;
  C = lcCamera({ cx: LARG / 2, orizzonte: oriz, f: f, occhioY: oY, occhioH: oH });
  L.Wbb = Wbb; L.kp = kp; L.Yp = Yp;
  /* distanza fra i centri, in px: sul PC 1,1 pile (fra i bordi una pila di
     aria); sul telefono quanto ci sta lasciando lo spazio allo sparpaglio */
  /* ⚠️ il bordo VICINO della pila e' piu' largo e piu' in fuori del centro
     (k vicino / k centro = d/(d-0,6) = 1,235): i conti si fanno li' */
  var vic = d / (d - 0.6);
  var dx = Math.min(0.82 * Wbb, (LARG / 2 - 12 - 0.70 * Wbb) / vic);
  POSTI.mazzo.x = -dx / kp;
  POSTI.scarti.x = dx / kp;
  /* ⚠️ lo sparpaglio degli scarti e' legato allo spazio: sul telefono meno */
  L.sparpX = mixN(0.05, 0.08, t) * WPILA / 0.8;
  L.sparpY = mixN(0.05, 0.08, t);
  L.sparpR = mixN(0.22, 0.34, t);
  /* ⭐ la bancarotta scoperta sporge dal lato LIBERO (verso il bordo del
     tavolo): prima sporgeva verso gli scarti, che la coprivano fino al 40% */
  var bordoMazzoPx = LARG / 2 - dx * vic - Wbb * 0.5;
  var sporgePx = limita(bordoMazzoPx - 10, 0.22 * Wbb, 0.42 * Wbb);
  /* sul PC poco girata: girata di 0,20 copriva mezzo fianco del mazzo */
  POSTI.banca = { dx: -sporgePx / kp, dy: -0.10 - (1 - t) * 0.08, piega: -mixN(0.18, 0.10, t) };
  /* ⛔ ...ma NON oltre il bordo dello schermo. Il tetto di prima era legato
     solo allo spazio del tavolo, e sul telefono la carta girata usciva a
     sinistra con meta' etichetta (430x860, 390x844: i giudici l'hanno vista
     tutti e tre). Si misura lo spigolo vero della carta girata e si rientra. */
  for (var gb = 0; gb < 8; gb++) {
    var qb = lcCartaQuad(C, POSTI.mazzo.x + POSTI.banca.dx, POSTI.mazzo.y + POSTI.banca.dy, 0.02, WPILA, { piega: POSTI.banca.piega });
    var sx = Math.min(qb[0], qb[2], qb[4], qb[6]) - 8;
    if (sx >= 0) break;
    POSTI.banca.dx = Math.min(-0.10 * Wbb / kp, POSTI.banca.dx - sx / kp);
    POSTI.banca.piega *= 0.8;
  }
  /* ── la riga delle targhe, sotto le pile ── */
  var fondoPile = C.proietta(0, POSTI.mazzo.y - WPILA * LC_RAPPORTO / 2 - L.sparpY, 0)[1];
  var cimaPile = C.proietta(0, POSTI.mazzo.y + WPILA * LC_RAPPORTO / 2, altoMazzo(52))[1];
  L.pileTop = cimaPile; L.pileBot = fondoPile;
  L.targaH = L.fsTarga * 1.9;
  L.rigaY = fondoPile + L.targaH / 2 + 6;
  L.xMazzo = LARG / 2 - dx * vic; L.xScarti = LARG / 2 + dx * vic;       /* al bordo vicino, dove sta la riga */
  /* ⚠️ la pagina «da PC» (tasto nella riga, suggerimento e diario ai lati)
     vale solo se a sinistra del mazzo c'e' davvero posto per il suggerimento:
     a 1000x900 non c'era, e il testo finiva sotto il tasto PESCA */
  L.largo = t >= 0.5 && (L.xMazzo - Wbb * 0.92 - 36) >= 170;
  /* il tasto PESCA (sul PC) nella riga, subito a destra della targa MAZZO */
  var pescaH = fs * 1.2 * 1.25 + fs * 1.2 * 1.5 + 4;
  L.pescaH = pescaH;
  /* ── la mano ── */
  var sopraTasti = Math.max(64, fs * 5.4) + fs * 2.9 + 6;       /* suggerimento + tasto, sul telefono */
  L.manoFondo = L.largo ? ALT - Math.max(8, ALT * 0.022) : ALT - sopraTasti;
  var sottoRiga = L.rigaY + (L.largo ? Math.max(pescaH, L.targaH) : L.targaH) / 2 + Math.max(10, ALT * 0.022);
  /* ⭐ sul PC fra la riga del mazzo e la mano c'e' la FASCIA DEL SUGGERIMENTO:
     due righe centrate, dove si guarda (prima il testo stava a sinistra del
     mazzo, a 600 px dal centro, e fra riga e mano restavano 130 px di feltro
     vuoto). Il resto dell'altezza va alla mano: 30% invece del 27%. */
  L.fasciaAiuto = L.largo ? Math.round(fs * 1.35 * 2 + 12) : 0;
  L.hMano = Math.min(mixN(Math.min(0.31 * ALT, 0.42 * LARG * 1.5), 0.30 * ALT, t), L.manoFondo - sottoRiga - L.fasciaAiuto);
  L.manoLargo = Math.min(LARG - 32, mixN(LARG - 24, CW * 0.94, t));
  L.arco = L.manoLargo * mixN(3.2, 4.2, t);   /* le punte ruotano al massimo di ~9° (sul PC ~7°: l'arco mangiava altezza) */
  L.corridoio = sottoRiga;
  L.manoCima = sottoRiga + L.fasciaAiuto;     /* la cima della mano a riposo: sotto la fascia del suggerimento */
  /* ── sopra: la testata (e sul telefono il diario) ── */
  L.sopra = L.largo ? fs * 2.7 : fs * 3 + fs * 4.3 + 4;
  /* ── il palco: legato alla carta in mano ── */
  var hp = limita(1.35 * L.hMano, 0.30 * ALT, Math.min(0.48 * ALT, LARG * 0.62 * 1.5));
  L.palco = { x: LARG / 2, y: mixN(0.40, 0.47, t) * ALT, h: Math.round(hp) };
  /* ⭐ sul PC il palco sta DI FIANCO agli scarti, non sopra le pile: al
     centro copriva mazzo, scarti e targhe proprio mentre si raccontava una
     mossa su di loro (i giudici del 13/09). Dalla parte degli scarti, nel
     feltro dove a riposo sta il diario (che sotto il velo si spegne). */
  if (L.largo) {
    var wp = hp / LC_RAPPORTO;
    L.palco.x = Math.min(L.xScarti + Wbb * 0.62 + 26 + wp / 2, LARG - wp / 2 - 16);
  }
  LARGO = mixN(1, 1.9, t);
  L.stamp = LARG + 'x' + ALT;
  LAY = L;
}

var WPILA = 0.80;
/* ⭐ quanto sono larghe le pile SULLO SCHERMO: il 34% di un telefono, l'11,5%
   della colonna di un PC. Dal 13/09 WPILA e' solo l'unita' del mondo (la
   camera la compensa): la grandezza vera la decidono questi due numeri. */
var PILA_TEL = 0.34, PILA_PC = 0.115;
var POSTI = {              /* dove vivono le cose sul tavolo */
  pila:   { x: 0.46 },
  mazzo:  { x: -0.46, y: 0.95 },
  scarti: { x:  0.46, y: 0.95 },
  mano:   { y: Y_MANO, z: 0.35 },
  banca:  { dx: -0.30, dy: -0.10, piega: -0.2 }
};

/* dallo schermo al piano del tavolo (a quota z): serve a mettere le cose
   dove l'impaginato le vuole */
function mondoDaSchermo(X, Y, z) {
  var y = (C.occhioH - (z || 0)) * C.f / Math.max(1, Y - C.orizzonte) - C.occhioY;
  return { x: (X - C.cx) * (C.occhioY + y) / C.f, y: y };
}
/* l'angolo a schermo dell'asse «in su» di una carta (0 = dritta) */
function angoloSu(x, y, z, w, becca, piega) {
  var q = lcCartaQuad(C, x, y, z, w, { becca: becca, piega: piega });
  return Math.atan2((q[0] + q[2]) / 2 - (q[4] + q[6]) / 2, (q[5] + q[7]) / 2 - (q[1] + q[3]) / 2);
}
/* ⭐ il ventaglio di un avversario in fondo a destra si inclinava verso il
   centro (la prospettiva): gli si da' una piega che lo raddrizza a schermo */
function raddrizza(x, y, z, w, becca) {
  var a0 = angoloSu(x, y, z, w, becca, 0), a1 = angoloSu(x, y, z, w, becca, 0.1);
  var dd = (a1 - a0) / 0.1;
  return Math.abs(dd) > 1e-4 ? -a0 / dd : 0;
}

/* ⭐ I POSTI DEGLI AVVERSARI: una fila distribuita sulla colonna. Sul PC i
   centri vanno dal 11% all'89% (a sette posti 300 px l'uno dall'altro, prima
   117); sul telefono, se le targhe non ci stanno, uno si e uno no va un passo
   indietro. Il ventaglio e' largo in PIXEL quanto l'impaginato vuole, e il
   mondo si adegua. */
function avvLayout(n) {
  if (AVV && AVV.n === n && AVV.stamp === LAY.stamp) return AVV;
  var L = LAY, nOpp = Math.max(1, n - 1), posti = [], i;
  var span = nOpp > 1 ? mixN(Math.min(0.84 * LARG, (nOpp - 1) * 0.36 * LARG), Math.min(0.78 * L.CW, (nOpp - 1) * 0.28 * L.CW), L.t) : 0;
  var passo = nOpp > 1 ? span / (nOpp - 1) : 9999;
  var wPx = Math.min(mixN(limita(0.085 * LARG, 26, 44), Math.min(limita(0.045 * L.CW, 50, 100), 0.075 * ALT), L.t), passo * 0.56);
  /* ⚠️ il ventaglio delle punte non esce dallo schermo (a 430 px e sette
     posti il primo sporgeva): la fila si stringe quanto serve */
  var spanMax = LARG - 2 * (0.95 * wPx + 6);
  if (span > spanMax) { span = spanMax; passo = nOpp > 1 ? span / (nOpp - 1) : 9999; wPx = Math.min(wPx, passo * 0.56); }
  var plateH = L.fsNome * 1.75, plateW = L.fsNome * 4.6 + 16;
  var sfalsa = nOpp > 2 && passo < plateW + 6;
  var fanH = 1.42 * wPx;                               /* dal piano alla cima del ventaglio */
  var dietro = sfalsa ? fanH * 0.66 + plateH * 0.2 : 0;
  var Yo = Math.max(mixN(0.215, 0.195, L.t) * ALT, L.sopra + plateH + fanH + dietro + 6);
  for (i = 1; i < n; i++) {
    var tt = nOpp > 1 ? (i - 1) / (nOpp - 1) : 0.5;
    var X = LARG / 2 + (tt - 0.5) * span;
    var Yb = Yo - (sfalsa && i % 2 === 0 ? dietro : 0);
    var m = mondoDaSchermo(X, Yb, 0);
    var k = C.k(m.y), wO = wPx / k;
    var hh = wO * LC_RAPPORTO / 2, zc = hh * Math.sin(BECCA_AVV) * 0.80;
    var pg = raddrizza(m.x, m.y, zc, wO, BECCA_AVV);
    var q0 = lcCartaQuad(C, m.x, m.y, zc, wO, { becca: BECCA_AVV, piega: pg });
    var top = Math.min(q0[1], q0[3]) - wPx * 0.08, bot = Math.max(q0[5], q0[7]);
    posti[i] = { x: m.x, y: m.y, z: zc, w: wO, piega: pg, k: k, X: X, Yb: Yb,
                 cy: (top + bot) / 2, top: top, bot: bot, wPx: wPx,
                 targaY: top - plateH / 2 - 2, targaTop: top - plateH - 2 };
  }
  AVV = { n: n, stamp: L.stamp, posti: posti, sfalsa: sfalsa, wPx: wPx, plateH: plateH, passo: passo };
  return AVV;
}
function postoDi(i, n) {
  var p = avvLayout(n).posti[i];
  return p ? { x: p.x, y: p.y } : { x: 0, y: 2.7 };
}

/* ══════════════════════════════════════════════════════════════════════════
   3 · LO STATO DELLA PARTITA — RISCRITTA (tavolo remoto, piano §8.1)
   ⭐ Le regole stanno sul server. Qui `G` e' il «G FANTASMA»: lo ricostruisce
      `LCN` dal fotogramma che la scena sta mostrando, con la forma che il
      disegno e la regia leggono (posto 0 = io, sempre).
   ══════════════════════════════════════════════════════════════════════════ */
var G = null;                  /* il fantasma, di LCN */
var IO = 0;                    /* il posto di chi guarda: sempre lo zero (LCN ruota i seggi) */
var attesa = null;             /* il pannello aperto (il suo titolo), o null */
var selezione = [];            /* gli indici dei gettoni scelti in mano */
var manoQuad = [];             /* i quadrilateri della mano, per il tocco */
var finestraFin = 0;           /* quando scade la finestra del NON VALE (ora locale) */
var finestraTot = 1;           /* la sua durata, per l anello */
var finestraPend = null;       /* la chiave della finestra accesa, o null */
var narrati = {};              /* le uscite gia' raccontate dalla regia */
var nomi = [];                 /* i nomi per posto LOCALE (0 = TU), da LCN */

function nomeGiocatore(i) { return nomi[i] || ""; }

function ora() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
/* ══════════════════════════════════════════════════════════════════════════
   4 · ⭐ LA REGIA — chi racconta cosa e' successo (vedi `_lc_regia.js`)
   Le regole vanno avanti subito; la regia mette in fila il racconto. Il
   PONTE le da' le misure e le ancore: dove sta un posto, il mazzo, gli scarti.
   ══════════════════════════════════════════════════════════════════════════ */
/* ⭐ 13/09: il posto di un avversario e' il centro del suo ventaglio, e
   `top` e' il bordo alto della sua targa (li' si posano i distintivi); il TUO
   posto e' il centro della mano, non un punto fisso al 70% dello schermo */
function ancoraPosto(i) {
  if (i === IO) {
    var lm = layoutMano(G ? G.giocatori[IO].mano.length : 5);
    return { x: LARG / 2, y: lm.top + lm.h / 2, top: lm.top };
  }
  var p = avvLayout(G ? G.n : 2).posti[i];
  if (!p) return { x: LARG / 2, y: ALT * 0.2, top: ALT * 0.15 };
  return { x: p.X, y: p.cy, top: p.targaTop, bot: p.bot };
}
/* ⭐ l'ancora piatta di una pila e' la sua CIMA VERA: il baricentro del
   quadrilatero all'altezza del mazzo, alto quanto la cima a schermo (prima:
   z 0,02, meta' del riquadro e altezza presa dalla larghezza, 23 px piu' in
   basso e il 56% piu' alta) */
function ancoraPila(nome) {
  var z = nome === 'mazzo' && G ? altoMazzo(G.mazzo.length) + 0.004 : 0.004;
  var q = lcCartaQuad(C, POSTI[nome].x, POSTI[nome].y, z, WPILA, {});
  var ys = [q[1], q[3], q[5], q[7]];
  return { x: (q[0] + q[2] + q[4] + q[6]) / 4, y: (q[1] + q[3] + q[5] + q[7]) / 4,
           h: Math.max.apply(null, ys) - Math.min.apply(null, ys) };
}
/* dove cade sullo schermo una posa di tavolo, come carta piatta: centro,
   altezza (dal bordo basso al bordo alto) e rotazione */
function schermoDi(p) {
  var q = lcCartaQuad(C, p.x, p.y, p.z, p.w, { becca: p.becca, gira: p.gira, piega: p.piega });
  var tx = (q[0] + q[2]) / 2, ty = (q[1] + q[3]) / 2, bx = (q[4] + q[6]) / 2, by = (q[5] + q[7]) / 2;
  return { x: (q[0] + q[2] + q[4] + q[6]) / 4, y: (q[1] + q[3] + q[5] + q[7]) / 4,
           h: Math.sqrt((tx - bx) * (tx - bx) + (ty - by) * (ty - by)), rot: Math.atan2(tx - bx, by - ty),
           /* l'ingombro vero (la regia tiene le carte dentro lo schermo) */
           l: Math.min(q[0], q[2], q[4], q[6]), r: Math.max(q[0], q[2], q[4], q[6]),
           t: Math.min(q[1], q[3], q[5], q[7]), b: Math.max(q[1], q[3], q[5], q[7]) };
}
var posaGiocata = null;        /* la carta che hai appena mandato sul palco, com'era nel ventaglio */

/* ⭐ 13/09: il palco lo misura la pagina, e la regia lo chiede qui */
function palcoPonte(dove) {
  var p = LAY.palco, o = { x: p.x, y: p.y, h: p.h };
  if (LAY.largo) {
    /* le didascalie degli effetti nella corsia fra avversari e pile: nella
       riga del mazzo finivano sotto il tasto PESCA */
    var a = avvLayout(G ? G.n : 4), fondo = 0;
    for (var i = 1; i < a.posti.length; i++) if (a.posti[i]) fondo = Math.max(fondo, a.posti[i].bot);
    o.dy = (fondo + LAY.pileTop) / 2;
    /* il palco (di fianco agli scarti) non sale sulla fila degli avversari */
    o.y = Math.max(Math.min(p.y, LAY.manoFondo - p.h / 2), fondo + p.h / 2 + 12);
    /* ⛔ collaudo 13/09 · LO STRISCIONE SCEGLIE IL POSTO COL TESTO VERO.
       Prima la soglia era fissa (250 px a destra) e poi il testo si
       restringeva fino a starci: a 1920 la BANCAROTTA scendeva a 8 px. E sotto
       la carta c'era la MANO (a ogni PC largo meno di ~1800 px). Adesso la
       pagina da' due posti e la regia prende il primo dove il testo ci sta
       leggibile (andando a capo, mai sotto i 16 px): DI FIANCO alla carta, a
       destra; oppure un NASTRO sulla cima della carta, largo quanto serve

    o.sLim = LARG - o.sx - 16;
    /* ⛔ collaudo 13/09 giro 2 · fra 1440 e 1800 px a destra ci sono 150-200
       px, e il nastro in cima alla carta copriva il SEGNO in alto a sinistra
       (il «×2» di RADDOPPIO, l'icona del CONTO), con un nastro largo 490 px su
       una carta da 283. Il secondo posto e' A SINISTRA della carta, sopra la
       colonna degli scarti (col velo non raccontano niente), fino a meta' fra
       mazzo e scarti. Il nastro resta l'ultimo, SOTTO il segno (dal 20%
       dell'altezza) e mai piu' largo della carta. */
    o.sinistra = p.x - wp / 2 - 22;
    o.limSin = o.sinistra - Math.max(16, LARG / 2 - LAY.Wbb * 0.5);
    o.nastro = { x: p.x, top: o.y - p.h / 2 + p.h * 0.20, lim: wp - 8, limLargo: Math.min(LARG - 32, Math.max(wp * 1.9, 600)) };
    /* ⛔ collaudo 13/09 giro 3 · IL PALCO DEL MAZZO. La carta che peschi (e
       la bomba, e quello che nel mazzo ci rientra) saliva dalla cima del mazzo,
       passava SOPRA la pila degli scarti coprendone la targa (sembrava presa
       dagli scarti) e si girava nel terzo destro dello schermo: 692 px dal
       mazzo a 1920, 914 a 2560. Il proprietario: «dove peschi sono lontani dal
       mazzo». Questi momenti hanno un palco A SINISTRA del mazzo, nella fascia
       di feltro vuota (larga 300-820 px a ogni PC misurato, e la carta del
       palco 189-389): la carta non attraversa gli scarti e si gira accanto a
       dove e' nata. Lo striscione le sta a sinistra, o e' un nastro che non
       sconfina verso il mazzo. */
    if (dove === 'mazzo') {
      var q0 = lcCartaQuad(C, POSTI.mazzo.x, POSTI.mazzo.y, 0, WPILA, {});
      var bordo = Math.min(q0[0], q0[6]);
      if (G && G.bancarottaScoperta && G.mazzo.indexOf('bancarotta') >= 0) {
        var qb = lcCartaQuad(C, POSTI.mazzo.x + POSTI.banca.dx, POSTI.mazzo.y + POSTI.banca.dy, 0.02, WPILA, { piega: POSTI.banca.piega });
        bordo = Math.min(bordo, qb[0], qb[2], qb[4], qb[6]);
      }
      var destra = bordo - 24, hM = p.h;
      /* se la fascia e' stretta la carta cala, ma mai sotto la carta in mano */
      if (destra - hM / LC_RAPPORTO < 16) hM = Math.max(LAY.hMano, (destra - 16) * LC_RAPPORTO);
      if (destra - hM / LC_RAPPORTO >= 8) {
        var wm = hM / LC_RAPPORTO, m = { x: destra - wm / 2, y: o.y, h: Math.round(hM), dy: o.dy, mazzo: true };
        m.y = Math.max(Math.min(p.y, LAY.manoFondo - m.h / 2), fondo + m.h / 2 + 12);
        m.sy = m.y - m.h * 0.28;
        m.sinistra = m.x - wm / 2 - 22; m.limSin = m.sinistra - 16; m.righeSin = 3;
        m.nastro = { x: m.x, top: m.y - m.h / 2 + m.h * 0.20, lim: wm - 8, limLargo: destra - 16, destraMax: destra };
        return m;
      }
    }
  } else {
    /* ⛔ collaudo 13/09 giro 3 · SUL TELEFONO lo striscione del palco stava 34
       px sopra la carta, cioe' sulla fila delle targhe: con quattro al tavolo
       copriva al 100% la targa dell'avversario centrale (spesso chi giocava,
       con la sua ▶) per tutta la finestra del NON VALE; con sette fino a cinque
       targhe. Adesso e' un nastro DENTRO la carta, sotto il segno (dal 20%
       dell'altezza), largo quanto il testo: copre il quadro, non chi siede. */
    o.nastro = { x: p.x, top: p.y - p.h / 2 + p.h * 0.20, lim: LARG - 24 };
  }
  return o;
}

/* ⛔ collaudo 13/09 giro 2 · DOVE PARLA UN EFFETTO. La didascalia stava nella
   corsia fra i ventagli e le pile: 47 px a 1920, 30 a 1536 con sette, e li'
   l'effetto posa il ×N, il CONTO, il PASSO e alza le carte dal mazzo; sul
   telefono (al 13% dell'altezza) copriva la targa di chi subiva. I posti liberi
   mentre la regia racconta sono due: la FASCIA fra la riga MAZZO/SCARTI e la
   mano (dove sta il suggerimento, che intanto tace) e la corsia sopra le pile.
   La regia dice cosa non va coperto (`evita`, rettangoli di schermo); qui si
   sceglie l'altezza che ne copre meno, a parita' la fascia. Si chiama per nome:
   il banco (P18) la puo' rimettere com'era. */
function didascaliaY(w, h, evita) {
  var n = G ? G.giocatori[IO].mano.length : 5, lm = layoutMano(n), a = avvLayout(G ? G.n : 4), fondo = 0, i;
  for (i = 1; i < a.posti.length; i++) if (a.posti[i]) fondo = Math.max(fondo, a.posti[i].bot);
  var rigaFondo = LAY.rigaY + (LAY.largo ? Math.max(LAY.pescaH, LAY.targaH) : LAY.targaH) / 2;
  var sa = rigaFondo + 4, sb = lm.top - 4;
  var cand = [
    (sb - sa >= h) ? (sa + sb) / 2 : sa + h / 2,
    sa + h / 2,
    Math.max(sa + h / 2, sb - h / 2),
    Math.max((fondo + LAY.pileTop) / 2, fondo + 4 + h / 2)
  ];
  function sopra(r, cy) {
    var x0 = Math.max(r[0], LARG / 2 - w / 2), x1 = Math.min(r[2], LARG / 2 + w / 2);
    var y0 = Math.max(r[1], cy - h / 2), y1 = Math.min(r[3], cy + h / 2);
    return (x1 > x0 && y1 > y0) ? (x1 - x0) * (y1 - y0) : 0;
  }
  var meglio = cand[0], punti = 1e18, k;
  for (k = 0; k < cand.length; k++) {
    var s = 0;
    for (i = 0; i < evita.length; i++) s += sopra(evita[i], cand[k]);
    /* coprire le carte in mano o i ventagli pesa poco, ma pesa */
    s += 0.15 * (sopra([0, lm.top, LARG, ALT], cand[k]) + sopra([0, 0, LARG, fondo], cand[k]));
    if (s < punti - 1) { punti = s; meglio = cand[k]; }
  }
  return meglio;
}

/* giro 3 · l'ingombro a schermo delle due pile [mazzo, scarti], targa
   compresa: la regia non ci posa lo striscione nei momenti in cui le pile
   raccontano (e il banco, P17, lo misura con la stessa funzione) */
function ingombroPile() {
  var pile = [], nomeP, qa, qz;
  for (nomeP in { mazzo: 1, scarti: 1 }) {
    qa = lcCartaQuad(C, POSTI[nomeP].x, POSTI[nomeP].y, 0, WPILA + (nomeP === 'scarti' ? 2 * LAY.sparpX : 0), {});
    qz = lcCartaQuad(C, POSTI[nomeP].x, POSTI[nomeP].y, nomeP === 'mazzo' ? altoMazzo(G ? G.mazzo.length : 30) : 0.02, WPILA, {});
    pile.push([Math.min(qa[0], qa[6], qz[0], qz[6]), Math.min(qa[1], qa[3], qz[1], qz[3]), Math.max(qa[2], qa[4], qz[2], qz[4]),
               Math.max(qa[5], qa[7], LAY.rigaY + LAY.targaH / 2)]);
  }
  return pile;
}
/* giro 3 · il posto nella mano della PRIMA carta con quell'id (SEGNATO su di

function slotCartaMano(id) {
  var me = G ? G.giocatori[IO] : null, i = me ? me.mano.indexOf(id) : -1;

  var s = layoutMano(me.mano.length).slots[i];
  return s ? { x: s.x, y: s.y, h: s.h, rot: s.rot, i: i } : null;
}

var R = lcRegia({

/* il banco gioca centinaia di mosse: puo' chiedere la regia accelerata */

/* ⭐ RISCRITTA (remoto): nessuna `nuova()`, la partita nasce dallo `start` del

/* ══════════════════════════════════════════════════════════════════════════
   5 · IL TURNO DELL'UMANO — RISCRITTA (remoto)
   ⭐ Qui non si decide niente: si MANDA la mossa al genitore (LCN.manda) e si
      aspetta il fotogramma dopo. Le regole le ha il server.
   ══════════════════════════════════════════════════════════════════════════ */
function mioTurno() {
  return !!(G && !G.fine && LCN.mioTurno() && !attesa && !finestraPend && !R.occupata());
}

function ioPesco() {
  if (!mioTurno()) return;

}

}

/* giocare una carta dalla mano: per le quattro carte col bersaglio il
   pannello CHI si apre PRIMA di mandare (arg = posto locale scelto) */
function ioGioco(carta, arg) {
  if (!mioTurno()) return;
  var k = LCN.CODICI.indexOf(carta);
  if (k < 0) { lcSuona("no"); return; }
  var conBers = CARTE_BERSAGLIO.indexOf(carta) >= 0;
  if (posaGiocata) LCN.posaInviata = posaGiocata;
  if (conBers && arg == null) { chiediBersaglioGioca(carta); return; }
  if (LCN.manda("gioca", k, conBers ? LCN.rs(arg) : -1)) aggiorna();
}
/* ══════════════════════════════════════════════════════════════════════════
   6 · I PANNELLI DI SCELTA — RISCRITTA (remoto)
   ⭐ Stessi pannelli e stessi nomi della pagina locale, ma si aprono
      dall'ATTESA dell'ULTIMO fotogramma (`you.attesa`), appena la regia ha
      raccontato l'evento che li ha causati. Una scelta non tocca niente: MANDA
      la mossa al server e chiude.
   ⚠️ `attesa` resta l'unico lucchetto dei tocchi; `pannelloAttesa` e' la
      chiave dell'attesa del server che il pannello sta servendo.
   ══════════════════════════════════════════════════════════════════════════ */
var elScelta = document.getElementById("scelta"),
    elTitolo = document.getElementById("sTitolo"),
    elTesto = document.getElementById("sTesto"),
    elRighe = document.getElementById("righe"), elFigura = document.getElementById("sFigura");

  if (scheda) chiudiScheda();

  pannelloDaAttesa = false;
  elTitolo.textContent = lcT(titolo);
  elTesto.textContent = lcT(testo);

  elFigura.innerHTML = "";

  elScelta.classList.add("on");
}

function bottone(testo, fn) {
  var b = document.createElement("div");
  b.className = "scelta";
  b.textContent = lcT(testo);

}
function altezzaMini(quante) {
  if (!LAY || !LAY.largo) {
    if ((quante || 3) <= 3) {
      var interno = Math.min(LARG * 0.92, 460) - 32, padX = LARG < 400 ? 14 : 24;
      var posto = Math.floor((interno - 20) / 3) - padX - 4;
      return Math.round(limita(posto * LC_RAPPORTO, 90, 150));
    }
    return LARG < 400 ? 90 : 114;
  }
  var h = limita(Math.round(ALT * 0.28), 150, 320);
  var largo = Math.min(LARG * 0.86, 1040) - LAY.fs * 2.8;
  for (; h > 110; h -= 6) {
    var wc = h / LC_RAPPORTO + LAY.fs * 2.0, perFila = Math.max(1, Math.floor((largo + LAY.fs * 0.8) / wc));
    var file = Math.ceil(quante / perFila);

  }

}
function bottoneCarta(id, etichetta, fn, quante, figura) {
  var b = document.createElement("div");

  var hm = altezzaMini(quante || 3), wm = Math.round(hm / LC_RAPPORTO);
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var im = lcFaccia(id, Math.round(wm * dpr), Math.round(hm * dpr));
  var cv2 = document.createElement("canvas");
  cv2.width = Math.round(wm * dpr); cv2.height = Math.round(hm * dpr);
  cv2.style.width = wm + "px"; cv2.style.height = hm + "px";

  b.appendChild(cv2);

/* I BERSAGLI VALIDI sul fantasma: le stesse condizioni del server
   (`_bersagli_validi`): i vivi tranne te; per il CONTO senza un conto gia'
   aperto; per SEGNATO con la mano non vuota */
function bersagliValidi(carta) {
  var v = lcVivi(G), out = [], i, g;
  for (i = 0; i < v.length; i++) {
    g = v[i];
    if (g.id === IO) continue;
    if (carta === "conto_aperto" && g.conto != null) continue;
    if (carta === "segnato" && !g.mano.length) continue;
    out.push(g.id);
  }
  return out;
}
var CARTE_BERSAGLIO = ["paga_tu", "segnato", "conto_aperto", "occhi_chiusi"];

/* una risposta a un'attesa del server: si manda, e il pannello si chiude */
function rispondi(a, ax, ay) {
  if (!LCN.manda(a, ax, ay)) { lcSuona("no"); return false; }
  chiudiScelta();
  pannelloAttesa = null;
  return true;
}

function rigaGiocatore(id) {
  var g = G.giocatori[id];
  return g.nome + " · " + g.mano.length + " carte" + (g.conto != null ? " · conto" : "");
}

/* CHI, PRIMA di mandare la carta (la scelta e' tua, il server non aspetta niente) */
function chiediBersaglioGioca(carta) {
  apriScelta("CHI", "Scegli su chi va a finire.");
  var v = bersagliValidi(carta), i;
  for (i = 0; i < v.length; i++)
    (function (id) {
      bottone(rigaGiocatore(id), function () { chiudiScelta(); ioGioco(carta, id); });
    })(v[i]);
  if (!v.length) bottone("nessuno la puo’ ricevere", function () { chiudiScelta(); lcSuona("no"); });
}

/* CHI, quando e' il server a chiederlo (una carta rimasta senza bersaglio) */
function chiediBersaglio(att) {

/* ⭐ IL PONTE FRA L'ATTESA DEL SERVER E I PANNELLI. Ogni battito: se l'attesa
   dell'ULTIMO fotogramma e' cambiata si chiude quello che c'era; se c'e'
   un'attesa nuova e la regia ha raccontato la sua causa, si apre. */
function sincronizzaPannelli() {
  var att = LCN.attesaMia(), chiave = att ? LCN.chiaveAttesa(att) : null;
  if (pannelloAttesa !== null && pannelloAttesa !== chiave) {
    if (finestraPend) chiudiFinestra();
    if (attesa && pannelloDaAttesa) chiudiScelta();
    pannelloAttesa = null;
  }
  if (!att) return;
  if (att.tipo === "finestra" && finestraPend) {
    finestraFin = LCN.ultimoArrivo + Math.max(0, att.resta_s || 0) * 1000;
    return;
  }
  if (pannelloAttesa === chiave) return;
  if (LCN.tastiSpenti()) return;
  if (!LCN.prontoPer(att)) return;
  if (attesa && !pannelloDaAttesa) chiudiScelta();
  if (scheda) chiudiScheda();
  selezione = [];
  pannelloAttesa = chiave;
  switch (att.tipo) {
    case "finestra": apriFinestra(att); break;
    case "mazzetta": chiediMazzetta(att); break;
    case "bancarotta": chiediBancarotta(att); break;
    case "sottobanco": chiediSottobanco(att); break;
    case "impila": chiediImpila(att); break;
    case "bersaglio": chiediBersaglio(att); pannelloDaAttesa = true; break;
    case "prendi": chiediQualeCarta(att); break;
    default: pannelloAttesa = null;
  }
  aggiorna();
}

/* ⭐ IL TAVOLO VERO (dal progetto B, 13/09). Prima il bordo era una striscia
   di cuoio dritta da un lato all'altro dello schermo che tagliava a meta' i
   ventagli: i giudici ci vedevano carte appoggiate su una mensola. Adesso il
   tavolo e' un rettangolo di MONDO con gli angoli lontani arrotondati,
   proiettato con la stessa camera: i lati scendono in prospettiva, il bordo
   lontano sta dietro le targhe dei nomi, e fuori c'e' la sala buia.
   `margine` > 0 allarga (il legno), 0 e' il feltro. Il bordo lontano e la
   larghezza si decidono sullo SCHERMO: dietro l'ultima targa, e largo quanto
   serve a tenere dentro la fila degli avversari. */
function contornoTavolo(margine) {
  var a = avvLayout(G ? G.n : 4), cima = LAY.pileTop - 40, largo = 0, i, p;
  for (i = 1; i < a.posti.length; i++) {
    p = a.posti[i];
    if (!p) continue;
    cima = Math.min(cima, p.targaTop - 10);
    largo = Math.max(largo, Math.abs(p.X - LARG / 2) + p.wPx * 1.6 + LAY.fsNome * 3);
  }
  cima = Math.max(C.orizzonte + 6, cima);
  var yF = mondoDaSchermo(LARG / 2, cima, 0).y, kF = C.k(yF);
  var XT = Math.max(largo / kF, (LAY.CW * 0.5 + 12) / LAY.kp);
  var yN = mondoDaSchermo(LARG / 2, ALT * 1.6, 0).y;
  var m = margine / kF;                       /* il margine e' in px al bordo lontano */
  XT += m; yF += m;
  var r = Math.min(Math.max(30, LAY.CW * 0.05) / kF, XT * 0.45, (yF - yN) * 0.35);
  var pts = [], s, k, ang, cx, cy;
  var angoli = [[XT - r, yF - r, 0], [-XT + r, yF - r, Math.PI / 2]];
  for (s = 0; s < 2; s++) {
    cx = angoli[s][0]; cy = angoli[s][1];
    for (k = 0; k <= 8; k++) {
      ang = angoli[s][2] + k / 8 * Math.PI / 2;
      pts.push(C.proietta(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, 0));
    }
  }
  pts.push(C.proietta(-XT, yN, 0)); pts.push(C.proietta(XT, yN, 0));
  return pts;
}
function tracciaPunti(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
function feltro() {
  /* la sala: buia, con la lampada sopra il tavolo */
  var g0 = ctx.createRadialGradient(LARG / 2, ALT * 0.30, 10, LARG / 2, ALT * 0.30, Math.max(LARG, ALT) * 0.75);
  g0.addColorStop(0, '#141510'); g0.addColorStop(0.6, '#0a0b09'); g0.addColorStop(1, '#040505');
  ctx.fillStyle = g0; ctx.fillRect(0, 0, LARG, ALT);
  var spessore = Math.max(10, ALT * 0.016);
  var fuori = contornoTavolo(spessore), dentro = contornoTavolo(0);
  /* il bordo di legno */
  var gl = ctx.createLinearGradient(0, fuori[0][1], 0, LAY.Yp);
  gl.addColorStop(0, '#5a3a20'); gl.addColorStop(0.5, '#3e2614'); gl.addColorStop(1, '#24150b');
  ctx.fillStyle = gl; tracciaPunti(fuori); ctx.fill();
  /* il feltro: la luce cade sulle PILE, il centro del tavolo (era al 62%
     dell'altezza, cioe' sulla mano) */
  var g = ctx.createRadialGradient(LARG / 2, LAY.Yp, ALT * 0.05,
                                   LARG / 2, LAY.Yp, Math.max(LARG * 0.62, ALT * 0.95));
  g.addColorStop(0, '#1b4634');
  g.addColorStop(0.55, '#123024');
  g.addColorStop(1, '#07120e');
  ctx.fillStyle = g; tracciaPunti(dentro); ctx.fill();
  /* il filo di luce sullo spigolo del legno, e l'ombra del bordo sul feltro */
  ctx.save();
  ctx.strokeStyle = 'rgba(243,210,138,0.28)'; ctx.lineWidth = 1.5;
  tracciaPunti(fuori); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 4;
  tracciaPunti(dentro); ctx.stroke();
  ctx.restore();
}

/* ⭐ LE SAGOME SUL FELTRO (dal progetto B): il posto del mazzo e quello degli
   scarti tratteggiati, un filo piu' grandi delle carte. Dicono al primo
   sguardo che sono due posti diversi, anche a mazzo basso o a scarti vuoti. */
function sagomaPila(x, y) {
  var q = lcCartaQuad(C, x, y, 0.001, WPILA * 1.10, {});
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.strokeStyle = 'rgba(243,210,138,0.30)'; ctx.lineWidth = 1.5;

  ctx.restore();

/* ⭐ 13/09 · IL MAZZO VERO: un BLOCCO con le facce laterali color carta, e
   sopra il dorso con le ultime due carte appena storte. L'altezza e' quella
   vera: 0,0038 per carta. */
var mazzoQuad = null;          /* la cima del mazzo */
var mazzoCorpo = null;         /* ⭐ il blocco intero, per il tocco (la cima sola era il 77%) */
var rigaTocco = [];            /* i rettangoli della riga sotto il mazzo che si toccano per pescare */
var targhe = [];               /* le scritte che si posano per ultime */
var bancaQuad = null, bancaTarga = null;   /* 14/09 · la bancarotta che sporge e la sua targhetta (le legge P28) */
var segnateQuad = [];          /* le carte SEGNATE degli avversari: si toccano per leggerle */
var bombeViste = -1, bombePulsa = 0;

/* un poligono piatto [x0,y0,x1,y1,...]: il quadrilatero di una carta, o la
   sagoma intera del mazzo */
function tracciaQuad(q) {
  ctx.beginPath(); ctx.moveTo(q[0], q[1]);
  for (var i = 2; i < q.length; i += 2) ctx.lineTo(q[i], q[i + 1]);
  ctx.closePath();
}
/* il contorno convesso di una nuvola di punti [[x,y],...], come poligono piatto */
function inviluppo(P) {
  P = P.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
  function cr(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
  var lo = [], up = [], i, out = [];
  for (i = 0; i < P.length; i++) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], P[i]) <= 0) lo.pop(); lo.push(P[i]); }
  for (i = P.length - 1; i >= 0; i--) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], P[i]) <= 0) up.pop(); up.push(P[i]); }
  var h = lo.slice(0, -1).concat(up.slice(0, -1));
  for (i = 0; i < h.length; i++) out.push(h[i][0], h[i][1]);
  return out;
}
function corpoMazzo(x, y, alto) {
  var a = lcCartaQuad(C, x, y, 0, WPILA, {}), b = lcCartaQuad(C, x, y, alto + 0.004, WPILA, {}), P = [], i;
  for (i = 0; i < 4; i++) { P.push([a[i * 2], a[i * 2 + 1]]); P.push([b[i * 2], b[i * 2 + 1]]); }
  return inviluppo(P);
}

/* ⭐ UN BLOCCO DI CARTE: le due facce che si vedono (quella verso chi guarda e
   quella di fianco), color carta, con le righe dei bordi. */
function bloccoCarte(x, y, z0, z1, w, rot, righe) {
  if (z1 - z0 < 0.002) return;
  var a = lcCartaQuad(C, x, y, z0, w, { piega: rot }), b = lcCartaQuad(C, x, y, z1, w, { piega: rot });
  function faccia(i, j, colore, scuro) {
    ctx.beginPath();
    ctx.moveTo(b[i * 2], b[i * 2 + 1]); ctx.lineTo(b[j * 2], b[j * 2 + 1]);
    ctx.lineTo(a[j * 2], a[j * 2 + 1]); ctx.lineTo(a[i * 2], a[i * 2 + 1]); ctx.closePath();
    var gr = ctx.createLinearGradient(0, Math.min(b[i * 2 + 1], b[j * 2 + 1]), 0, Math.max(a[i * 2 + 1], a[j * 2 + 1]));
    gr.addColorStop(0, colore); gr.addColorStop(1, scuro);

      ctx.lineTo(mix2(b[j * 2], a[j * 2], t), mix2(b[j * 2 + 1], a[j * 2 + 1], t));
      ctx.stroke();

    ctx.restore();

  if (x < 0) faccia(1, 2, '#d8cbad', '#9d8f72');         /* il fianco destro */
  else faccia(0, 3, '#d8cbad', '#9d8f72');               /* il fianco sinistro */

function mix2(a, b, t) { return a + (b - a) * t; }

function disegnaMazzo() {

  /* ⭐ LA BANCAROTTA SCOPERTA SI VEDE DENTRO IL MAZZO, alla sua altezza, e

    var qbk = lcPosaTavolo(ctx, C, lcFaccia('bancarotta', W, H), x + bk.dx, y + bk.dy, zb, WPILA,
                           { piega: bk.piega, ombra: false, n: 7 });
    bloccoCarte(x, y, zb + 0.004, alto, WPILA, 0, Math.max(2, Math.round(righe * (alto - zb) / alto)));
    /* ⚠️ l'etichetta SOPRA la parte che sporge, non davanti: davanti copriva
       lo spigolo del mazzo e la scritta della carta («BANCAI», i giudici) */
    var corpoB = corpoMazzo(x, y, alto), sxB = Math.min(qbk[0], qbk[2], qbk[4], qbk[6]);
    var sxM = Math.min.apply(null, corpoB.filter(function (v, k) { return k % 2 === 0; }));
    /* sul telefono la parte che sporge e' una striscia: il solo «6ª» ci sta sopra, a meta' altezza */
    var yB = LAY.largo ? Math.min(qbk[1], qbk[3], qbk[5], qbk[7]) - LAY.fs * 0.95 : (qbk[1] + qbk[7]) / 2;
    targhe.push({ tipo: 'etichetta', x: (sxB + sxM) / 2, y: yB, banca: true,
                  testo: (LAY.largo ? 'BANCAROTTA · ' : '') + (ib + 1) + 'ª', colore: '#d9c2ff', fondo: '#2a1640' });
    bancaQuad = qbk;
  } else {
    bloccoCarte(x, y, 0, alto, WPILA, 0, righe);
  }
  /* le ultime due carte, appena storte */
  if (n > 2) lcPosaTavolo(ctx, C, img, x + 0.012, y - 0.008, alto - 0.002, WPILA, { piega: 0.035, ombra: false, n: 6 });
  if (n > 0) q = lcPosaTavolo(ctx, C, img, x, y, alto + 0.002, WPILA, { piega: -0.012, ombra: false, n: 6 });
  mazzoQuad = q ? q.slice() : lcCartaQuad(C, x, y, alto, WPILA, {});
  mazzoCorpo = corpoMazzo(x, y, alto);
  accendiMazzo(q);
}

/* la bancarotta scoperta e' la carta di cima? (una funzione a parte: la leva di P30) */
function bancaInCima(ib) { return ib === 0; }

/* ⭐ al tuo turno il mazzo SI ACCENDE, TUTTO il blocco e non solo la cima
   (dal progetto C): e' la cosa da toccare per chiudere il turno, e il suo
   bersaglio e' proprio il blocco intero */
function accendiMazzo(q) {
  if (mioTurno() && q) {
    ctx.save();
    var lu = 0.5 + 0.5 * Math.sin(ora() / 260);
    ctx.globalAlpha = 0.14 + 0.12 * lu; ctx.fillStyle = '#f3d28a';
    tracciaQuad(mazzoCorpo); ctx.fill();
    ctx.globalAlpha = 0.55 + 0.45 * lu;
    ctx.strokeStyle = '#f3d28a'; ctx.lineWidth = 3; ctx.shadowColor = '#d8b25a'; ctx.shadowBlur = 18;
    ctx.lineJoin = 'round';

    ctx.restore();
  }
}

/* ⭐ 13/09 · LA RIGA SOTTO LE PILE: il numero dei buttafuori, la targa
   MAZZO, la targa SCARTI. Stava SOPRA le pile, dove toccava i ventagli degli
   avversari (a sette posti la targa MAZZO copriva Rocco); il bollo copriva il
   59% dello spigolo del mazzo con una scritta da 8 px. Sotto c'e' il feltro
   libero, e sul PC subito sotto c'e' il tasto PESCA. */
function misuraTesto(testo, fs, peso) {
  ctx.save(); ctx.font = (peso || '800') + ' ' + fs + 'px system-ui,sans-serif';
  var w = ctx.measureText(testo).width; ctx.restore();
  return w;
}
function targaPx(x, y, testo, acceso) {
  var fs = LAY.fsTarga, w = misuraTesto(testo, fs) + fs * 1.4, h = LAY.targaH;
  ctx.save();
  ctx.font = '800 ' + fs + 'px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = acceso ? '#3a2c0cee' : '#000c';
  ctx.strokeStyle = acceso ? '#d8b25a' : '#ffffff30'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); else ctx.rect(x - w / 2, y - h / 2, w, h);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = acceso ? '#f3d28a' : '#f2e6cd';

  ctx.restore();
  return [x - w / 2, y - h / 2, x + w / 2, y + h / 2];
}
function geometriaRiga() {
  /* ⭐ sul telefono, al tuo turno, la targa dice «PESCA · MAZZO» (dal progetto
     C): il tasto sta in fondo allo schermo, e il gesto deve stare anche
     sull'oggetto. Sul PC no: il tasto PESCA e' gia' li' accanto. */
  var L = LAY, n = G ? G.mazzo.length : 0, testoM = (!L.largo && mioTurno() ? 'PESCA · MAZZO  ' : 'MAZZO  ') + n;
  var wM = misuraTesto(testoM, L.fsTarga) + L.fsTarga * 1.4;
  var r = limita(L.Wbb * 0.13, 14, 30), gap = 8;
  var gruppo = r * 2 + gap + wM;

  return { r: r, bx: x0 + r, by: L.rigaY, mx: x0 + r * 2 + gap + wM / 2, wM: wM, testoM: testoM, etich: etich };
}
function disegnaRiga() {
  if (!G) return;
  var L = LAY, gr = geometriaRiga(), n = G.mazzo.length;
  rigaTocco = [];
  var acceso = mioTurno();
  rigaTocco.push(targaPx(gr.mx, L.rigaY, gr.testoM, acceso));
  var ns = Math.max(0, G.scarti.length - R.nascosti('scarti'));
  targaPx(L.xScarti, L.rigaY, ns ? 'SCARTI  ' + ns : 'SCARTI', false);

  /* il numero dei buttafuori ANCORA IN GIRO: nel mazzo o tenuti in mano.
     ⛔ 14/09 · prima contava solo il mazzo, e scendeva di uno quando qualcuno
     pescava un buttafuori col sangue freddo senza uscire: il bollo diceva a
     tutti che quello li' se l'era tenuto. */
  var bombe = bombeInGiro();
  if (bombe !== bombeViste) { if (bombeViste >= 0) bombePulsa = ora(); bombeViste = bombe; }
  var pulsa = Math.max(0, 1 - (ora() - bombePulsa) / 900), r = gr.r;
  ctx.save();
  ctx.translate(gr.bx, gr.by);
  ctx.scale(1 + pulsa * 0.35, 1 + pulsa * 0.35);
  ctx.shadowColor = '#ff3a2a'; ctx.shadowBlur = 10 + pulsa * 30;
  ctx.fillStyle = '#1c0605'; ctx.strokeStyle = '#ff5a4a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffd9d2'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + Math.round(r * 1.05) + 'px system-ui,sans-serif';
  ctx.fillText(String(bombe), 0, r * 0.06);
  if (!gr.etich) {
    /* sul telefono non c'e' posto per la parola: un'icona sul bordo del bollo */
    ctx.font = Math.round(Math.max(11, r * 0.75)) + 'px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
    ctx.fillText('💣', r * 0.78, -r * 0.72);
  }
  ctx.restore();
  if (gr.etich) {
    var fe = Math.max(12, Math.round(r * 0.5));
    ctx.save();
    ctx.font = '800 ' + fe + 'px system-ui,sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.fillStyle = '#ff8a7a';
    ctx.strokeText('BUTTAFUORI', gr.bx - r - 7, gr.by + 1); ctx.fillText('BUTTAFUORI', gr.bx - r - 7, gr.by + 1);
    ctx.restore();
  }
  if (pulsa > 0) {
    ctx.save(); ctx.globalAlpha = pulsa; ctx.strokeStyle = '#ff5a4a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(gr.bx, gr.by, r * (1 + (1 - pulsa) * 1.8), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  rigaTocco.push([gr.bx - r, gr.by - r, gr.bx + r, gr.by + r]);
  /* le etichette dei pezzi che sporgono, per ultime */
  for (var i = 0; i < targhe.length; i++) {

    if (e.tipo !== 'etichetta') continue;
    var fe = Math.max(12, Math.round(LAY.fs * 0.85)), we = misuraTesto(e.testo, fe) + 16, he = fe * 1.7;
    var xe = limita(e.x, we / 2 + 6, LARG - we / 2 - 6), ye = e.y;
    /* ⛔ 14/09 · a 1366x768 con sette al tavolo «BANCAROTTA · 6ª» copriva il
       nome della segnata di Nadia, che sta proprio sopra il mazzo. Scende a
       passi sulla carta che sporge finche' non tocca piu' nessuna segnata. */
    for (var pe = 0; pe < 6 && ingombraSegnate(xe - we / 2, ye - he / 2, xe + we / 2, ye + he / 2); pe++) ye += he * 0.5;
    var re = etichettaXY(xe, ye, e.testo, e.colore, 1, e.fondo);

}

/* ⭐ 13/09 · GLI SCARTI BUTTATI: ogni carta ha il SUO spostamento e la SUA
   rotazione, decisi dal suo numero d'ordine. Dal 13/09 lo sparpaglio e'
   legato allo spazio (sul telefono gli scarti coprivano il bordo del mazzo) e
   va solo di lato e verso il fondo, mai verso la mano. */
function posaScarto(k, ultima) {
  function h(n) { var s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }
  var rot = (h(k * 3 + 1) - 0.5) * 2 * LAY.sparpR * (ultima ? 0.45 : 1);
  return { x: POSTI.scarti.x + (h(k * 7 + 2) - 0.5) * 2 * LAY.sparpX, y: POSTI.scarti.y + h(k * 11 + 3) * LAY.sparpY,
           z: 0.004 + Math.min(k, 40) * 0.0016, rot: rot };
}

function disegnaScarti() {
  var n = Math.max(0, G.scarti.length - R.nascosti('scarti'));
  var W = spr(WPILA * C.k(POSTI.scarti.y - 0.5)), H = Math.round(W * LC_RAPPORTO);
  /* il posto degli scarti si vede anche vuoto: senza, a inizio partita il
     mazzo stava da solo e il tavolo sembrava storto */
  sagomaPila(POSTI.scarti.x, POSTI.scarti.y + LAY.sparpY * 0.5);
  if (!n) return;
  var da = Math.max(0, n - 12), i, id, p;
  for (i = da; i < n; i++) {
    id = G.scarti[i];
    if (!lcCarta(id)) continue;
    p = posaScarto(i, i === n - 1);
    lcPosaTavolo(ctx, C, lcFaccia(id, W, H), p.x, p.y, p.z, WPILA,
                 { piega: p.rot, ombra: (i === n - 1 || i === da), n: i === n - 1 ? 8 : 5 });
  }
}

/* un rettangolo di schermo tocca una segnata o il suo nome? (3 px d'aria) */
function ingombraSegnate(x0, y0, x1, y1) {
  for (var i = 0; i < INGOMBRI_SEGN.length; i++) {
    var r = INGOMBRI_SEGN[i];
    if (x0 < r[2] + 3 && x1 > r[0] - 3 && y0 < r[3] + 3 && y1 > r[1] - 3) return true;
  }
  return false;
}

function etichettaXY(x, y, testo, colore, sc, fondo) {
  ctx.save();
  var fs = Math.max(12, Math.round(LAY.fs * 0.85 * (sc || 1)));
  ctx.font = '800 ' + fs + 'px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var w = ctx.measureText(testo).width + 16, h = fs * 1.7;
  ctx.fillStyle = fondo || '#000b';
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill(); } else ctx.fillRect(x - w / 2, y - h / 2, w, h);
  ctx.fillStyle = colore || '#f2e6cd';
  ctx.fillText(testo, x, y + 1);
  ctx.restore();
  return [x - w / 2, y - h / 2, x + w / 2, y + h / 2];
}

/* ⭐ a chi tocca, secondo il RACCONTO: lo stato e' gia' al turno dopo mentre
   la regia sta ancora mostrando la mossa di prima */
function turnoDaMostrare() {
  return (R.occupata() && R.turnoVisto != null) ? R.turnoVisto : G.turno;
}
/* e i turni dovuti seguono il racconto come la luce: mentre la carta che li
   porta e' sul palco non ci sono ancora */
function dovutiDaMostrare(i) {
  if (!G || G.fine || G.dovuti <= 0 || R.moneteVelate() || turnoDaMostrare() !== G.turno || G.turno !== i) return 0;
  return G.dovuti;
}

/* ⭐ 13/09 · GLI AVVERSARI: una targa col nome SOPRA il ventaglio, il
   ventaglio tenuto in mano (quasi dritto), le carte segnate davanti. Chi e' di
   turno ha la targa PIENA d'oro e un alone dietro: si vede senza leggere (prima
   era il colore di un nome in corpo 13 e un alone che finiva sotto le carte). */
/* la targa col nome di un avversario: testo e rettangolo (x al centro). La
   usano il disegno e i gettoni, che le stanno accanto.
   ⚠️ Sul PC il «×N» dei turni dovuti NON sta nel nome: lo dicono i gettoni,
   attaccati alla targa, e scritto due volte si leggeva «Rocco · 8 · ×3  ×3». */
function targaAvv(i) {
  var A = avvLayout(G.n), p = A.posti[i], g = G.giocatori[i], fsN = LAY.fsNome;
  var nota = g.nome;
  if (!g.vivo) nota = g.nome + ' · fuori';
  else {
    nota += ' · ' + Math.max(0, g.mano.length - R.nascosti(i));
    if (g.conto != null) nota += ' · conto';
    if (g.cieco) nota += ' · al buio';
    /* ⛔ 14/09 · niente 💣 accanto al nome: chi tiene un buttafuori col sangue
       freddo non lo deve sapere nessuno */
    /* sul telefono il «×N» resta nella targa: accanto c'e' il vicino, e i
       gettoni (piccoli, sul capo sinistro della targa) non hanno posto per la scritta */
    /* ⚠️ collaudo 13/09: con la fila sfalsata no. La targa d'oro allargata dal
       «×N» copriva il 15-17% dei ventagli vicini, e il «×N» e' gia' nella
       testata e nell'altezza della pila dei gettoni */
    if (!LAY.largo && !avvLayout(G.n).sfalsa && dovutiDaMostrare(i) > 0) nota += ' · ×' + (G.dovuti + 1);
  }
  if (g.vivo && !G.fine && turnoDaMostrare() === i) nota = '▶ ' + nota;
  var w = misuraTesto(nota, fsN) + fsN * 1.2;
  return { testo: nota, x: limita(p.X, w / 2 + 4, LARG - w / 2 - 4), y: p.targaY, w: w, h: A.plateH };
}
var INGOMBRI_SEGN = [];        /* giro 3 · dove stanno le segnate e i loro nomi (il diario le evita) */
function disegnaAvversari() {
  var A = avvLayout(G.n), i, o, ordine = [], nomi = [], segn = [], turno = turnoDaMostrare();
  segnateQuad.length = 0; INGOMBRI_SEGN.length = 0;
  for (i = 1; i < G.n; i++) ordine.push(i);
  ordine.sort(function (a, b) { return A.posti[b].y - A.posti[a].y; });
  for (o = 0; o < ordine.length; o++) {
    i = ordine[o];
    var g = G.giocatori[i], p = A.posti[i], diTurno = g.vivo && turno === i && !G.fine;
    var c0 = C.proietta(p.x, p.y, 0);
    if (diTurno) {
      ctx.save();
      var lu = 0.5 + 0.5 * Math.sin(ora() / 300);
      ctx.globalAlpha = 0.55 + 0.25 * (lu * 2 - 1);
      var rg = p.wPx * 1.45, gr = ctx.createRadialGradient(p.X, p.cy, 0, p.X, p.cy, rg);
      gr.addColorStop(0, 'rgba(243,210,138,0.85)'); gr.addColorStop(1, 'rgba(216,178,90,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.X, p.cy, rg, 0, Math.PI * 2); ctx.fill();
      /* ⭐ e un ANELLO sul feltro sotto il ventaglio (dal progetto C): a sette
         posti la sola targa d'oro si perdeva nella fila */
      ctx.globalAlpha = 0.65 + 0.35 * lu;
      ctx.strokeStyle = '#f3d28a'; ctx.lineWidth = Math.max(2, p.wPx * 0.05); ctx.shadowColor = '#d8b25a'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.ellipse(c0[0], c0[1], p.wPx * 1.30, p.wPx * 0.26, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    if (g.vivo && !R.postoVelato(i)) {
      var quante = Math.min(7, Math.max(0, g.mano.length - R.nascosti(i)));
      /* l'ombra di chi tiene le carte: una macchia bassa sul piano, non la
         sagoma di una carta distesa */
      ctx.save(); ctx.globalAlpha = 0.30; ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(c0[0], c0[1], p.wPx * 0.95, p.wPx * 0.16, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      var Wd = spr(p.wPx * 1.05), img = lcDorso(Wd, Math.round(Wd * LC_RAPPORTO));
      for (var j = 0; j < quante; j++) {
        /* il ventaglio si APRE di lato piu' che ruotare: a 0,16 per carta la
           carta davanti pendeva di 27° e tutto il ventaglio sembrava storto */
        var ang = (j - (quante - 1) / 2) * 0.09;
        lcPosaTavolo(ctx, C, img, p.x + ang * 1.5 * p.w, p.y + Math.abs(ang) * 0.10 * p.w, p.z + j * 0.004, p.w,
                     { becca: BECCA_AVV, piega: p.piega + ang - (quante - 1) * 0.02, ombra: false, n: 5 });
      }
      /* giro 3 · la segnata appena scoperta si mostra quando la regia l'ha
         riportata al posto (vedi EFFETTI.segnato) */
      var segVis = Math.max(0, g.segnate.length - R.nascosti('segnate:' + i));
      if (segVis) segn.push({ i: i, p: p, g: g, vis: segVis });
    }
    nomi.push({ i: i, vivo: g.vivo, turno: diTurno });
  }
  /* ⭐ le carte segnate: scoperte, e si toccano. Sul PC DI FIANCO al
     ventaglio (dal progetto B e C): davanti ne coprivano meta' e scendevano
     nella corsia verso il mazzo. Sul telefono la fila e' fitta e di fianco non
     c'e' posto: restano davanti, piu' piccole. */
  for (o = 0; o < segn.length; o++) {
    var S0 = segn[o], cnt = Math.min(3, S0.vis), P0 = S0.p;
    var wsPx = P0.wPx * (LAY.largo ? 0.80 : 0.74);
    var bx, by, bz, bk, qsAll = [], passoS = LAY.largo ? 0.55 : 0.62, diLato = LAY.largo;
    /* ⛔ collaudo 13/09 giro 2 · sul PC la segnata era 70x121 a 1920, col nome
       sulla faccia che a quella misura non si scrive, e con due segnate la
       prima coperta a meta', mentre fra un ventaglio e l'altro restavano 470 px
       di feltro. Dove c'e' posto la carta cresce (fin quasi al ventaglio) e le
       segnate stanno AFFIANCATE; la stretta di sotto (prima il passo, poi la
       misura) vale solo quando il posto manca. */
    if (LAY.largo) { wsPx = P0.wPx * 1.15; passoS = 1.06; }
    if (LAY.largo) {
      /* ⛔ collaudo 13/09: di fianco, ma DENTRO lo spazio fra il proprio
         ventaglio e quello del vicino (o il bordo dello schermo). A sette
         posti con tre segnate il gruppo entrava nel ventaglio dopo e quelle
         dell'ultimo uscivano dallo schermo. Prima si stringe il passo, poi
         si rimpicciolisce; se non basta ancora, davanti come sul telefono. */
      var da = P0.X + P0.wPx * 1.0 + 8, vic = null;
      for (var iv = S0.i + 1; iv < A.posti.length && !vic; iv++) if (A.posti[iv] && Math.abs(A.posti[iv].Yb - P0.Yb) < 2) vic = A.posti[iv];
      var fino = vic ? vic.X - vic.wPx * 1.0 - 8 : LARG - 10;
      var spazio = fino - da, largoG = function (w, ps) { return w * (1 + (cnt - 1) * ps) * 1.08; };
      /* prima la carta torna alla misura di prima (0,80 del ventaglio), poi
         si stringe il passo fino a 0,55, poi come prima */
      if (largoG(wsPx, passoS) > spazio) wsPx = Math.max(P0.wPx * 0.80, spazio / (1.08 * (1 + (cnt - 1) * passoS)));
      if (largoG(wsPx, passoS) > spazio) passoS = Math.max(0.55, cnt > 1 ? (spazio / (wsPx * 1.08) - 1) / (cnt - 1) : passoS);
      if (largoG(wsPx, passoS) > spazio) passoS = Math.max(0.30, cnt > 1 ? (spazio / (wsPx * 1.08) - 1) / (cnt - 1) : passoS);
      if (largoG(wsPx, passoS) > spazio) wsPx = Math.max(P0.wPx * 0.55, spazio / (1.08 * (1 + (cnt - 1) * passoS)));
      if (largoG(wsPx, passoS) > spazio + 0.5) { diLato = false; wsPx = P0.wPx * 0.74; passoS = 0.62; }
      else {
        var ms = mondoDaSchermo(da + largoG(wsPx, passoS) / 2, P0.Yb, 0);
        bk = C.k(ms.y); bx = ms.x; by = ms.y; bz = P0.z;
      }
    }
    if (!diLato) { bk = P0.k; bx = P0.x; by = P0.y - P0.w * 0.45; bz = P0.z * 0.55; }
    var Ws = spr(wsPx), Hs = Math.round(Ws * LC_RAPPORTO), ws = wsPx / bk;
    for (j = 0; j < cnt; j++) {
      var qs = lcPosaTavolo(ctx, C, lcFaccia(S0.g.segnate[j], Ws, Hs),

function disegna() {
  if (!C) return;

/* ══════════════════════════════════════════════════════════════════════════
   10 · IL TOCCO — un punto dentro un quadrilatero
   ⚠️ Si scorre la mano AL CONTRARIO: l'ultima disegnata sta sopra, e sopra
      vuol dire che e' lei quella toccata.

  }

/* ⭐ 13/09 · UNA CARTA SI TOCCA PER LEGGERLA, E SI GIOCA CON UN TASTO.
   Il proprietario: «non si capisce cosa cliccare per leggerle e come giocare».
   Prima il tocco GIOCAVA e la pressione lunga leggeva: due gesti, uno dei due
   invisibile, e quello invisibile era proprio quello sicuro. Adesso c'e' un
   gesto solo, e non costa niente: il tocco apre la SCHEDA (la carta grande,
   cosa fa, e i tasti GIOCA / INDIETRO). Una carta non parte mai per sbaglio.

      non ha strisciato: su un telefono uno scorrimento non e' una scelta.
   ⭐ E anche il MAZZO si tocca: toccarlo e' pescare. E' il gesto che uno fa
      d'istinto, e il mazzo acceso al tuo turno lo suggerisce. */

/* si scorre la mano AL CONTRARIO: l'ultima disegnata sta sopra */

   cosi' si prendeva anche l'orlo della vicina: si toccava la carta accanto e

   riposo delle vicine. Chi portava il mouse a destra per leggere la frase

  "<b>dove vuoi tu</b>, e nessuno vede dove. Ne hai una all’inizio.</p>" +
  "<p><b>I gettoni da soli non valgono niente.</b> Toccane <b>due uguali</b> e rubi una " +
  "carta alla cieca; <b>tre</b> e guardi la sua mano e scegli. Il <b>JOLLY</b> vale come " +
  "qualunque gettone.</p>" +
  "<p><b>NON VALE</b> cancella la mossa di un altro, anche fuori dal tuo turno. Quando " +
  "compare l’anello, hai pochi secondi per premerlo.</p>" +
  "<p><b>LA BANCAROTTA</b> la prima volta la rimetti nel mazzo scoperta, e da lì la " +
  "vedono tutti. La seconda volta che qualcuno la pesca, esce: <b>non c’è mazzetta " +
  "che tenga</b>.</p>" +
  "<p><b>IL TEMPO</b> lo tiene il banco: se non peschi in tempo, pesca lui per te. " +
  "Quando scade il tempo del locale scatta la CHIUSURA: il mazzo si riempie di buttafuori, e vince chi resta in piedi.</p>" +
  "<p style=\"opacity:.7\"><span class=\"k\">tocca</span> una carta della tua mano per " +
  "leggerla: si apre grande, e da lì la giochi col tasto <b>GIOCA</b>. " +
  "<span class=\"k\">tocca il mazzo</span> o <b>PESCA</b> per chiudere il turno.</p>";

document.getElementById("regoleTesto").innerHTML = lcT(TESTO_REGOLE);
document.getElementById("aiuto").onclick = function () {
  lcSuonoSveglia(); lcSuona("tocco");
  document.getElementById("regole").classList.add("on");
};
document.getElementById("bChiudiRegole").onclick = function () {
  lcSuona("tocco");
  document.getElementById("regole").classList.remove("on");
};

document.getElementById("vol").onclick = function () {
  lcSuonoSveglia();
  var m = lcSuonoMuto();
  lcSuonoVolume(m ? 0.7 : 0);
  this.textContent = m ? "🔊" : "🔇";
};
/* ══════════════════════════════════════════════════════════════════════════
   12 · IL GIRO DEI FOTOGRAMMI — RISCRITTA (remoto)
   ⭐ Un solo `requestAnimationFrame`: regia, promozione degli eventi arrivati
      (LCN.battito), pannelli e disegno. Niente bot, niente finestra a tempo
      locale, niente R.turno / R.finale dallo stato: nascono dagli eventi.
   ⚠️ In pausa il giro si FERMA (il genitore ha nascosto l'iframe).
   ══════════════════════════════════════════════════════════════════════════ */
var RAF = 0, pulsaFino = 0, ultimoMio = null;
function avviaGiro() { if (!RAF) RAF = requestAnimationFrame(battito); }
/* ⚠️ R2 del collaudo 14/09 · LA TELA A 0x0. Nel precarico l'iframe sta dentro
   `#lcrt-wrap` in display:none: la tela misura 0x0, `impagina` fa una camera
   con f=0 e `contornoTavolo` divide per zero (createLinearGradient non-finite,
   a ogni fotogramma, e ogni errore finiva al server come clog). Con la tela
   senza misura NON si disegna; appena la tela ha una misura (anche prima che
   arrivi il `resize`) il tavolo si rimisura e si disegna. La logica del giro
   (regia, fotogrammi, tasti) va avanti lo stesso: si salta solo il disegno. */
function tavoloMisurato() {
  if (LARG >= 1 && ALT >= 1) return true;
  if (cv.clientWidth < 1 || cv.clientHeight < 1) return false;
  misuraTavolo();
  return LARG >= 1 && ALT >= 1;
}
function battito() {
  RAF = 0;
  if (LCG.inPausa()) return;
  RAF = requestAnimationFrame(battito);
  var misurato = tavoloMisurato();
  if (!G) { if (misurato) disegna(); return; }
  var adesso = ora();

  R.passo(adesso);
  LCN.battito(adesso);
  if (!G) { if (misurato) disegna(); return; }
  sincronizzaPannelli();
  /* i tasti seguono il turno: si riaccendono quando la regia si libera, quando
     arriva l'ultimo fotogramma o quando scade l'attesa della risposta */
  var mt = mioTurno() + "|" + LCN.tastiSpenti() + "|" + (G.fine ? 1 : 0) + "|" + (G.giocatori[IO].vivo ? 1 : 0);
  if (mt !== ultimoMio) { ultimoMio = mt; aggiorna(); }

  if (finestraPend && elFinestra.classList.contains("on")) {
    var resta = (finestraFin - adesso);
    disegnaAnello(Math.max(0, Math.min(1, resta / finestraTot)));
    if (Math.floor(resta / 500) !== Math.floor((resta + 16) / 500) && resta > 0) lcSuona("tic");
    if (resta <= 0) chiudiFinestra();
  }
  /* la CHIUSURA DEL LOCALE: il bollo dei buttafuori pulsa finche' c'e' la striscia */
  if (pulsaFino && adesso < pulsaFino && adesso - bombePulsa > 900) bombePulsa = adesso;
  strisciaPasso(adesso);

  suggerisci();
  var occupato = !!((R.attivo && !R.attivo.turno && !R.attivo.finale) || (R.palco && !R.attivo));
  var velato = occupato && !!((R.attivo && R.attivo.velo) || (R.palco && !R.attivo));
  if (occupato !== document.body.classList.contains("occupato")) document.body.classList.toggle("occupato", occupato);
  if (velato !== document.body.classList.contains("velato")) document.body.classList.toggle("velato", velato);
  var fin = !!(R.attivo && R.attivo.finale) || !!(G.fine && R.fisso);
  if (fin !== document.body.classList.contains("finale")) document.body.classList.toggle("finale", fin);
  testataTurno();
  if ((sopra >= 0) !== document.body.classList.contains("sopraCarta")) document.body.classList.toggle("sopraCarta", sopra >= 0);
  if (misurato) disegna();
}
/* ══════════════════════════════════════════════════════════════════════════
   13 · SI COMINCIA — RISCRITTA (remoto)
   ⭐ Niente sipario ne' SI COMINCIA: il tavolo si misura, il giro parte, l'arte
      si carica (con la `v` dell'indirizzo) e il guscio dice PRONTO al
      genitore quando l'arte e' arrivata o dopo 4 secondi. La partita nasce
      dallo `start`.
   ══════════════════════════════════════════════════════════════════════════ */
function caricaArteRemota(fatto) {
  var ids = lcIds(), restano = ids.length + 1 + ids.length, arrivate = 0, V = lcArteV();
  function meno() { restano--; if (restano <= 0) fatto(arrivate); }
  function carica(url, quando) {
    var im = new Image();
    im.onload = function () { arrivate++; quando(im); meno(); };
    im.onerror = meno;
    im.src = url;
  }
  var i;
  for (i = 0; i < ids.length; i++)
    (function (id) {
      carica(LC_DIR + id + ".webp" + V, function (im) { lcArte(id, im); });
      carica(LC_DIR + "ic/" + id + ".png" + V, function (im) { lcIcona(id, im); });
    })(ids[i]);
  carica(LC_DIR + "dorso.webp" + V, function (im) { lcArte("@dorso", im); });
}

if (LC_LANG === "en") { document.documentElement.lang = "en"; lcAvvolgiTela(ctx); lcOsservaDom(); }
misuraTavolo();
avviaGiro();
if (!LC_GUSCIO) document.getElementById("fuoriGuscio").classList.add("on");
caricaArteRemota(function (quante) { LCG.arteArrivata(quante); });
setTimeout(function () { LCG.arteArrivata(-1); }, 4000);
</script>
