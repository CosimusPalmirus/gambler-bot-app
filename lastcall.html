var LC_PASSIVE = ["mazzetta", "sangue_freddo", "non_vale", "jolly"];
var LC_IN_MANO = 7;
/* ⚠️ SECONDI PER TURNO: un'ASSUNZIONE ereditata dal generatore, non una
   misura. Va rifatta sulla prima partita vera — e il banco la rimisurera'. */
var LC_SEC_TURNO = 6.0;
var LC_TETTO_STANZA = 900.0;
var LC_GETTONI_FRAZ = 0.24;

function lcCatalogo(n) {
  var g = 1.0 + 0.20 * (n - 4);
  function r(a, b) {
    var lo = Math.round(a * g), hi = Math.round(b * g);
    return [lo, Math.max(hi, lo)];
  }
  return [
    ["non_vale", r(2, 6)], ["passo", r(2, 6)], ["raddoppio", r(2, 6)],
    ["ultimo_ordine", r(0, 3)], ["pago_io", r(0, 4)], ["paga_tu", r(0, 4)],
    ["contromano", r(0, 5)],
    ["sbircia", r(2, 6)], ["sbircia_due", r(0, 3)], ["impila", r(1, 5)],
    ["impila_due", r(0, 3)], ["dal_fondo", r(0, 4)], ["sottobanco", r(0, 4)],
    ["primo_ultimo", r(0, 3)], ["rimescola", r(1, 5)],
    ["segnato", r(0, 4)], ["conto_aperto", r(0, 4)], ["occhi_chiusi", r(0, 2)],
    ["tok_colosseo", r(2, 5)], ["tok_ring", r(2, 5)], ["tok_bandiera", r(2, 5)],
    ["tok_citta", r(2, 5)], ["tok_caveau", r(2, 5)], ["jolly", r(1, 4)]
  ];
}
/* le tre uniche: o una copia sola, o niente. La probabilita' sale col tavolo */
var LC_UNICHE = [["bancarotta", 0.70, 0.98], ["si_chiude", 0.45, 0.90],
                 ["sangue_freddo", 0.35, 0.55]];

/* ⭐ QUANTE CARTE DEVE AVERE IL MAZZO INIZIALE. E' il numero che comanda
   tutto: il mazzo iniziale e' quasi il numero di turni della partita, perche'
   ogni turno o pesca una carta o ne brucia una dalla mano.
   ⚠️ E' QUI che sta l'equilibrio automatico, non nella densita': si tiene
      fermo quanti turni suoi fa ogni giocatore, e la densita' viene di
      conseguenza. Senza questo passo, a DUE giocatori la bomba e' una sola su
      un mazzo grosso e la densita' non arriva mai al 6%: il mazzo non si
      genera affatto. E' esattamente il rosso che il banco ha trovato. */
function lcBersaglioMazzo(n, rnd) {
  return Math.round((5.5 + rnd() * 2.5) * n);
}
function lcBersaglioX(n, mazzoVoluto, mazzette, bancarotta) {
  return mazzoVoluto + LC_IN_MANO * n - (mazzette - n) - (n - 1) - bancarotta;
}

/* Aggiunge o toglie copie finche' il totale non e' quello voluto, rispettando
   i range. ⛔ Non tocca mai le tre carte uniche. */
function lcPortaAlBersaglio(m, cat, bersaglio, rnd) {
  var i, g, tot, c, lo, hi;
  for (g = 0; g < 4000; g++) {
    tot = 0;
    for (i = 0; i < cat.length; i++) tot += m[cat[i][0]];
    if (tot === bersaglio) break;
    c = cat[lcInt(rnd, cat.length)];
    lo = c[1][0]; hi = c[1][1];
    if (tot < bersaglio && m[c[0]] < hi) m[c[0]]++;
    else if (tot > bersaglio && m[c[0]] > lo) m[c[0]]--;
  }
  return m;
}

/* LE TRE RIPARAZIONI CHE IL CASO DA SOLO NON GARANTISCE. */
function lcRiparaMazzo(m, cat, n, rnd) {
  var i, k, range = {}, att = 0, X = 0, gett = 0, utili = [];
  for (i = 0; i < cat.length; i++) { range[cat[i][0]] = cat[i][1]; X += m[cat[i][0]]; }

  /* 1 · LA VALVOLA: se ci sono attacchi, serve almeno un ULTIMO ORDINE */
  for (i = 0; i < LC_ATTACCHI.length; i++) att += m[LC_ATTACCHI[i]] || 0;
  if (att > 0 && m.ultimo_ordine < 1) m.ultimo_ordine = 1;

  /* 2 · I GETTONI: abbastanza da far capitare le coppie, e tre tipi con due */
  var minimo = Math.round(X * LC_GETTONI_FRAZ), giri = 0;
  function contaGettoni() {
    var s = 0, j;
    for (j = 0; j < LC_GETTONI.length; j++) s += m[LC_GETTONI[j]];
    return s;
  }
  while (contaGettoni() < minimo && giri < 400) {
    k = LC_GETTONI[lcInt(rnd, LC_GETTONI.length)];
    if (m[k] < range[k][1]) m[k]++;
    giri++;
  }
  for (i = 0; i < LC_GETTONI.length; i++) if (m[LC_GETTONI[i]] >= 2) utili.push(LC_GETTONI[i]);
  for (i = 0; i < LC_GETTONI.length && utili.length < 3; i++) {
    k = LC_GETTONI[i];
    if (m[k] < 2 && m[k] < range[k][1]) { m[k] = 2; utili.push(k); }
  }

  /* 3 · L'OCCHIO: senza carte che guardano il mazzo il gioco e' una lotteria,
         e una lotteria a soldi veri e' un altro mestiere. */
  if (m.sbircia + m.impila < 3) m.impila = Math.max(m.impila, 3 - m.sbircia);
  return m;
}

/* ⭐ IL GENERATORE. Ritenta finche' non trova un mazzo che passa i cancelli, e
   se non ci riesce ALZA LA VOCE: non consegna un mazzo storto in silenzio. */
function lcCreaMazzo(n, rnd, tentativi) {
  if (!(n >= 2 && n <= 7)) throw new Error("tavoli fra 2 e 7 giocatori, non " + n);
  tentativi = tentativi || 200;
  var ultimo = "";
  for (var t = 0; t < tentativi; t++) {
    var cat = lcCatalogo(n), m = {}, i;
    /* (a) ognuno pesca il suo numero dentro il suo range */
    for (i = 0; i < cat.length; i++) {
      var lo = cat[i][1][0], hi = cat[i][1][1];
      m[cat[i][0]] = lo + lcInt(rnd, hi - lo + 1);
    }
    /* (b) le uniche: ci sono o non ci sono */
    for (i = 0; i < LC_UNICHE.length; i++) {
      var p4 = LC_UNICHE[i][1], p7 = LC_UNICHE[i][2];
      var p = p4 + (p7 - p4) * ((n - 4) / 3.0);
      m[LC_UNICHE[i][0]] = (rnd() < Math.min(Math.max(p, 0), 1)) ? 1 : 0;
    }
    /* (c) le due che non si tirano a caso. ⚠️ Stanno nel mazzo come DATO e non
           come formula, se no il cancello che le controlla non potrebbe
           accendersi mai — e' il difetto che il banco del rosso trovo' per
           primo, dalla parte del Python. */
    m.buttafuori = n - 1;
    m.mazzetta = n + 1 + lcInt(rnd, 4);      /* una a testa + 1..4 nel mazzo */

    /* (d) si porta il totale sul bersaglio, e (e) si ripara lo scheletro */
    var voluto = lcBersaglioMazzo(n, rnd);
    m = lcPortaAlBersaglio(m, cat, lcBersaglioX(n, voluto, m.mazzetta, m.bancarotta), rnd);
    m = lcRiparaMazzo(m, cat, n, rnd);

    var male = lcCancelliMazzo(m, n);
    if (!male) return m;
    ultimo = male;
  }
  throw new Error("mazzo non generabile per " + n + " giocatori: " + ultimo);
}

/* I CONTI DI UN MAZZO — la traduzione fedele di `_conti()` del Python.
   ⚠️ `X` conta tutto TRANNE bancarotta, mazzette e buttafuori: quelle tre
      entrano nel mazzo per conto loro, e contarle due volte falserebbe la
      densita'. Se qui si sbagliasse un addendo, i cancelli misurerebbero un
      mazzo che non esiste — ed e' proprio quello che il banco R1 verifica. */
function lcConti(m, n) {
  var k, X = 0, gettoni = 0, tipiUtili = 0, salta = 0;
  for (k in m) {
    if (!m.hasOwnProperty(k)) continue;
    if (k === "bancarotta" || k === "mazzetta" || k === "buttafuori") continue;
    X += m[k];
  }
  for (k = 0; k < LC_GETTONI.length; k++) {
    gettoni += m[LC_GETTONI[k]] || 0;                 /* ⚠️ il jolly NON conta */
    if ((m[LC_GETTONI[k]] || 0) >= 2) tipiUtili++;
  }
  for (k = 0; k < LC_SALTA.length; k++) salta += m[LC_SALTA[k]] || 0;

  var buttafuori = m.buttafuori, bancarotta = m.bancarotta || 0, mazzette = m.mazzetta;
  var pescabili = X - LC_IN_MANO * n;
  var mazzo = pescabili + (mazzette - n) + buttafuori + bancarotta;
  var turniMax = (pescabili + (mazzette - n)) + mazzette + (m.sottobanco || 0)
               + bancarotta + salta + n;
  return {
    X: X, mazzo: mazzo, pescabili: pescabili, buttafuori: buttafuori,
    bancarotta: bancarotta, mazzette: mazzette, gettoni: gettoni,
    tipiUtili: tipiUtili, salta: salta, turniMax: turniMax,
    densita: mazzo > 0 ? 100.0 * buttafuori / mazzo : 0,
    minutiMax: turniMax * LC_SEC_TURNO / 60.0,
    /* ⭐ IL TETTO DELLE AZIONI. `turniMax` conta i TURNI; ma SBIRCIA, IMPILA,
       RIMESCOLA e le carte sulle persone sono azioni che NON chiudono il
       turno. Ognuna pero' brucia una carta da una mano, e le carte sono X:
       quindi le azioni sono al massimo turniMax + X. E' ancora un tetto
       aritmetico, non una stima. */
    azioniMax: turniMax + X
  };
}

/* I CANCELLI DEL MAZZO — gli stessi di `controlla()`, nello stesso ordine.
   Tornano stringa vuota se il mazzo va bene. */
function lcCancelliMazzo(m, n) {
  var k, attacchi = 0, c = lcConti(m, n);
  for (k = 0; k < LC_ATTACCHI.length; k++) attacchi += m[LC_ATTACCHI[k]] || 0;

  if (c.pescabili < n) return "non bastano le carte per la distribuzione";
  if (c.mazzo < 8) return "mazzo iniziale troppo corto: " + c.mazzo;
  if (c.buttafuori !== n - 1) return "i buttafuori non sono giocatori-1";
  if (c.mazzette < n + 1 || c.mazzette > n + 4) return "mazzette fuori range: " + c.mazzette;
  if (c.densita < 6.0 || c.densita > 22.0)
    return "densita' fuori banda: " + c.densita.toFixed(1) + "%";
  var aTesta = c.mazzo / n;                    /* banda 5,5-8,0 con margine 15% */
  if (aTesta < 5.5 * 0.85 || aTesta > 8.0 * 1.15)
    return "turni a testa fuori banda: " + aTesta.toFixed(1);
  if (c.minutiMax * 60.0 > LC_TETTO_STANZA * 1.35)
    return "il tetto dei turni sfora la stanza: " + c.minutiMax.toFixed(0) + " min";
  if (attacchi > 0 && (m.ultimo_ordine || 0) < 1)
    return "ci sono attacchi ma nessun ULTIMO ORDINE (la valvola)";
  if (c.gettoni < c.X * LC_GETTONI_FRAZ * 0.9)
    return "troppi pochi gettoni: " + c.gettoni + " su " + c.X;
  if (c.tipiUtili < 3) return "meno di tre tipi di gettone con due copie";
  if ((m.sbircia || 0) + (m.impila || 0) < 3)
    return "meno di tre carte che guardano il mazzo: e' una lotteria";
  for (k = 0; k < LC_UNICHE.length; k++)
    if ((m[LC_UNICHE[k][0]] || 0) > 1) return LC_UNICHE[k][0] + " in piu' di una copia";
  return "";
}

/* ── 3 · LA PARTITA ───────────────────────────────────────────────────────── */
function lcNuovaPartita(n, seme, nomi) {
  var rnd = lcRnd(seme);
  var m = lcCreaMazzo(n, rnd);
  var i, k, c;

  /* il sacco di tutto il pescabile: niente bombe, niente mazzette */
  var sacco = [];
  for (k in m) {
    if (!m.hasOwnProperty(k)) continue;
    if (k === "buttafuori" || k === "mazzetta" || k === "bancarotta") continue;
    for (i = 0; i < m[k]; i++) sacco.push(k);
  }
  lcMescola(rnd, sacco);

  var G = {
    n: n, rnd: rnd, seme: seme, mazzo: [], scarti: [], giocatori: [],
    turno: 0, verso: 1, dovuti: 0, log: [], mosse: 0, turniChiusi: 0,
    bancarottaScoperta: false, fine: null, uscite: [], chiudendo: false,
    pendente: null, catena: 0, composizione: m
  };

  for (i = 0; i < n; i++) {
    var mano = ["mazzetta"];
    for (c = 0; c < LC_IN_MANO; c++) mano.push(sacco.pop());
    G.giocatori.push({
      id: i, nome: (nomi && nomi[i]) || ("Bot " + i), umano: (i === 0),
      mano: mano, vivo: true, conto: null, cieco: false,
      segnate: [], bombeTenute: 0
    });
  }

  for (i = 0; i < sacco.length; i++) G.mazzo.push(sacco[i]);
  for (i = 0; i < m.buttafuori; i++) G.mazzo.push("buttafuori");
  for (i = 0; i < m.mazzetta - n; i++) G.mazzo.push("mazzetta");
  if (m.bancarotta) G.mazzo.push("bancarotta");
  lcMescola(rnd, G.mazzo);

  lcLog(G, "Mazzo: " + G.mazzo.length + " carte, " + m.buttafuori + " buttafuori.");
  return G;
}

/* ⭐ IL NOME VERO DELLA CARTA, quando c'e' chi lo sa.
   Il motore conosce solo le chiavi (`conto_aperto`), e nel diario si leggeva
   proprio cosi'. Ma se la pagina ha caricato anche `_lc_carte.js`, il nome
   scritto sulla carta esiste gia': si chiede a lui.
   ⚠️ `typeof` su un nome mai dichiarato non esplode — e' il solo modo di
      chiedere una cosa che potrebbe non esserci, senza legare i due file. */
function lcNomeDi(id) {
  if (typeof lcCarta === "function") {
    var c = lcCarta(id);
    if (c && c.it) return c.it;
  }
  return id;
}

function lcLog(G, testo) {
  G.log.push(testo);
  if (G.log.length > 240) G.log.shift();
}
function lcVivi(G) {
  var i, v = [];
  for (i = 0; i < G.giocatori.length; i++) if (G.giocatori[i].vivo) v.push(G.giocatori[i]);
  return v;
}
function lcAttuale(G) { return G.giocatori[G.turno]; }
function lcHa(p, id) { return p.mano.indexOf(id) >= 0; }
/* una carta segnata che lascia la mano smette di essere pubblica */
function lcSmarca(p, id) {
  var i = p.segnate.indexOf(id);
  if (i >= 0) p.segnate.splice(i, 1);
}
function lcTogli(p, id) {
  var i = p.mano.indexOf(id);
  if (i < 0) return false;
  p.mano.splice(i, 1);
  lcSmarca(p, id);
  return true;
}

/* ── 4 · IL GIRO ──────────────────────────────────────────────────────────── */
function lcProssimo(G) {
  var i = G.turno, giri = 0;
  do {
    i = (i + G.verso + G.n) % G.n;
    giri++;
  } while (!G.giocatori[i].vivo && giri <= G.n);
  return i;
}

/* Chiude il turno di chi gioca: se ha turni dovuti ne scala uno e resta lui. */
function lcChiudiTurno(G) {
  if (G.fine) return;
  G.turniChiusi++;
  if (G.dovuti > 0) { G.dovuti--; return; }
  G.turno = lcProssimo(G);
}

/* ── 5 · ⭐ IL SANGUE FREDDO: LA BOMBA TENUTA IN MANO ──────────────────────
   Finche' SANGUE FREDDO e' in mano, un buttafuori puo' starci dentro. Appena
   quella carta lascia la mano — giocata, rubata, qualunque motivo — la bomba
   SCATTA. E se e' la bomba a essere rubata, scatta a chi se l'e' presa.
   ⚠️ Questo controllo va chiamato DOPO ogni cosa che tocca una mano: e' il
      buco che l'Uomo Nero aveva gia' pagato una volta. */
function lcControllaFreddo(G, p) {
  if (!p || !p.vivo || G.fine) return;
  var i, bombe = 0;
  for (i = 0; i < p.mano.length; i++) if (p.mano[i] === "buttafuori") bombe++;
  if (!bombe) return;
  /* ⛔ 13/09 · UNO SOLO, anche qui. Chi tiene gia' un buttafuori col sangue
     freddo e ne RUBA un secondo con tre gettoni se ne trovava due in mano, e
     restava seduto. All'ultima chiamata usciva una volta sola per due bombe,
     e la partita finiva con DUE in piedi. Trovato dal banco della pagina (P4):
     il giocatore automatico sceglie a caso la carta da rubare, i bot no. */
  if (lcHa(p, "sangue_freddo") && bombe <= 1) return;    /* regge ancora */
  /* la bomba che scatta va negli scarti: ha fatto il suo lavoro. Le altre
     restano in mano, e lcEsce le rimette nel mazzo: non l'hanno ancora fatto. */
  for (i = p.mano.length - 1; i >= 0; i--)
    if (p.mano[i] === "buttafuori") { p.mano.splice(i, 1); G.scarti.push("buttafuori"); break; }
  lcEsce(G, p, "il buttafuori che teneva in mano");
}

/* ── 6 · PESCARE ──────────────────────────────────────────────────────────── */
function lcPescaCarta(G, daFondo) {
  if (!G.mazzo.length) return null;
  return daFondo ? G.mazzo.pop() : G.mazzo.shift();
}

/* Il cuore. `opt.daFondo` = DAL FONDO · `opt.guarda` = SOTTOBANCO.
   Torna un esito che l'interfaccia legge:
     {carta, aChi} normale · {chiedeMazzetta, chi} · {chiedePosizione, chi}
     {sottobanco, carta} la carta non e' in mano a nessuno: va rimessa nel mazzo
     {fuori, chi} · {carta:null} mazzo finito */
function lcPesca(G, opt) {
  opt = opt || {};
  var p = lcAttuale(G);
  lcRiequilibra(G);
  var c = lcPescaCarta(G, opt.daFondo);
  if (c === null) { lcUltimaChiamata(G); return { carta: null, ultimaChiamata: true }; }
  G.mosse++;

  /* ⭐ SOTTOBANCO: peschi, GUARDI, e la fai sparire. Non entra mai in mano,
     nemmeno se e' un buttafuori — ed e' li' tutto il valore della carta. */
  if (opt.guarda) return { carta: c, sottobanco: true, chi: p.id };

  /* IL CONTO APERTO: la prossima che pesca va a chi gliel'ha aperto,
     ⚠️ buttafuori compreso. E' l'unico furto in cui chi ruba rischia. */
  var dest = p;
  if (p.conto != null) {
    var cred = G.giocatori[p.conto];
    p.conto = null;
    if (cred && cred.vivo) {
      dest = cred;
      lcLog(G, p.nome + " pesca, e la carta va a " + cred.nome + " · conto aperto");
    }
  }

  if (c === "buttafuori") return lcButtafuoriA(G, dest);
  if (c === "bancarotta") return lcBancarotta(G, dest);

  dest.mano.push(c);
  if (dest === p) p.cieco = false;         /* sopravvissuto: torna a vedere */
  lcControllaFreddo(G, dest);
  if (!G.fine) lcChiudiTurno(G);
  return { carta: c, aChi: dest.id };
}

/* ⛔ 13/09 · IL MAZZO NON FINISCE MAI — deciso dal proprietario.
   «Non dovrebbero finire le carte: dovrebbe sempre esserci una bomba che
   rimane, qualcuno alla fine esplode sempre, e resta solo un vincitore.»
   I buttafuori sono giocatori−1 apposta, e il conto torna da solo: ogni bomba
   pescata fa uscire uno, o torna nel mazzo con la mazzetta. L'UNICA cosa che
   toglie una bomba dal mazzo senza far uscire nessuno e' il SANGUE FREDDO. Col
   mazzo senza piu' buttafuori si continuava a pescare carte innocue fino in
   fondo, e la partita finiva «a mazzo vuoto»: e' quello che il proprietario
   ha visto giocando. (L'ULTIMA CHIAMATA del 12/09 era una toppa su questo.)
   ⭐ La regola: prima di ogni pescata, se nel mazzo non c'e' nessun
   buttafuori, al tavolo sono ancora in due o piu' e qualcuno ne tiene uno col
   sangue freddo, ENTRA NEL MAZZO UN BUTTAFUORI NUOVO, in un punto a caso. Chi
   lo teneva se lo tiene, e il sangue freddo resta in mano.
   ⛔ 14/09 · prima tornava dentro QUELLO TENUTO, e la mano di chi lo teneva
   scendeva di una carta sulla sua targa: tutti capivano chi era. Il sangue
   freddo e' un segreto, quindi il proprietario ha cambiato la regola. Costa
   una cosa sola: da qui i buttafuori possono essere PIU' di giocatori − 1
   (`G.buttafuoriNuovi` li conta), e la partita puo' solo accorciarsi.
   Vale sempre: buttafuori nel mazzo + buttafuori in mano >= vivi − 1, quindi
   finche' si e' in due il mazzo ha una bomba, e non finisce. */
function lcBombeNelMazzo(G) {
  var i, k = 0;
  for (i = 0; i < G.mazzo.length; i++) if (G.mazzo[i] === "buttafuori") k++;
  return k;
}
function lcRiequilibra(G) {
  if (G.fine || lcVivi(G).length < 2 || lcBombeNelMazzo(G) > 0) return null;
  var giro, i, p, k;
  for (giro = 0; giro < G.n; giro++) {
    i = (G.turno + giro) % G.n;
    p = G.giocatori[i];
    k = p.vivo ? p.mano.indexOf("buttafuori") : -1;
    if (k < 0) continue;
    var pos = lcInt(G.rnd, G.mazzo.length + 1);
    G.mazzo.splice(pos, 0, "buttafuori");
    G.buttafuoriNuovi = (G.buttafuoriNuovi || 0) + 1;
    lcLog(G, "Nel mazzo non restano buttafuori: ne entra uno nuovo.");
    G.riequilibrio = { chi: p.id };            /* la pagina lo racconta, poi lo azzera */
    return G.riequilibrio;
  }
  return null;
}

function lcBombeInMano(p) {
  var i, k = 0;
  for (i = 0; i < p.mano.length; i++) if (p.mano[i] === "buttafuori") k++;
  return k;
}

/* Il buttafuori arriva a `p`. Tre strade, in quest'ordine:
   il sangue freddo, la mazzetta, la porta.

   ⛔ UNO SOLO. «Un buttafuori puo' stare nella tua mano», dice la carta: uno,
   al singolare. E non e' pignoleria sul testo, e' quello che tiene in piedi la
   promessa del gioco — vedi lcUltimaChiamata qui sotto. */
function lcButtafuoriA(G, p) {
  if (lcHa(p, "sangue_freddo") && lcBombeInMano(p) === 0) {
    p.mano.push("buttafuori");
    p.bombeTenute++;
    /* ⛔ 14/09 · niente nel diario: e' un segreto di chi lo tiene, e una riga
       che compare solo in questo caso sarebbe gia' la confessione */
    lcChiudiTurno(G);
    return { carta: "buttafuori", freddo: true, chi: p.id };
  }
  if (lcHa(p, "mazzetta")) return { carta: "buttafuori", chiedeMazzetta: true, chi: p.id };
  G.scarti.push("buttafuori");
  lcEsce(G, p, "il buttafuori");
  return { carta: "buttafuori", fuori: true, chi: p.id };
}

/* ⛔ LA BANCAROTTA. La prima volta la rimetti dove vuoi, SCOPERTA: da li' la
   vedono tutti. Dalla seconda chi la pesca esce, e non c'e' mazzetta che tenga. */
function lcBancarotta(G, p) {
  if (!G.bancarottaScoperta) {
    G.bancarottaScoperta = true;
    lcLog(G, p.nome + " pesca la BANCAROTTA: torna nel mazzo, scoperta");
    return { carta: "bancarotta", chiedePosizione: true, chi: p.id };
  }
  G.scarti.push("bancarotta");
  lcEsce(G, p, "la bancarotta");
  return { carta: "bancarotta", fuori: true, chi: p.id };
}

function lcEsce(G, p, perche) {
  if (!p || !p.vivo) return;
  p.vivo = false;
  G.uscite.push(p.id);
  lcLog(G, "⛔ " + p.nome + " è fuori: " + perche);
  /* ⭐ LA BOMBA CHE NON HA ANCORA FATTO IL SUO LAVORO TORNA NEL MAZZO.
     Le bombe sono giocatori-1 apposta: ognuna deve far uscire ESATTAMENTE una
     persona. Se uno che ne tiene una col sangue freddo esce per un altro
     motivo, quella bomba negli scarti sarebbe un posto che non si liberera'
     mai — e il mazzo finirebbe con due ancora seduti. E' successo davvero:
     R4 a tre giocatori, seme 6118. Quindi torna in circolazione.
     ⚠️ Tranne all'ultima chiamata: li' il locale sta chiudendo e non si pesca
        piu' niente, quindi la bomba si spegne con lui. */
  var i;
  /* ⭐ 14/09 · LA BOMBA CHE TI HA FATTO USCIRE RESTA IN CIMA AGLI SCARTI.
     Il chiamante l'ha appena posata, e subito dopo la mano di chi esce ci
     finiva sopra: il tavolo non la vedeva mai (il proprietario: «quando un
     buttafuori uccide si dovrebbe vedere la carta sopra gli scarti»). La mano
     va sotto di lei. Nessuna regola legge l'ordine degli scarti: solo il conto. */
  var cima = G.scarti[G.scarti.length - 1];
  var bomba = (!G.chiudendo && /^(il buttafuori|la bancarotta)/.test(perche || "") &&
               (cima === "buttafuori" || cima === "bancarotta")) ? G.scarti.pop() : null;
  for (i = 0; i < p.mano.length; i++) {
    if (p.mano[i] === "buttafuori" && !G.chiudendo)
      G.mazzo.splice(lcInt(G.rnd, G.mazzo.length + 1), 0, "buttafuori");
    else G.scarti.push(p.mano[i]);
  }
  if (bomba) G.scarti.push(bomba);
  p.mano = []; p.segnate = []; p.conto = null;
  for (i = 0; i < G.giocatori.length; i++)
    if (G.giocatori[i].conto === p.id) G.giocatori[i].conto = null;

  if (lcVivi(G).length <= 1) { lcFinisci(G, "e' rimasto uno solo"); return; }
  if (!lcAttuale(G).vivo) { G.dovuti = 0; G.turno = lcProssimo(G); }
}

/* ── ⭐ L'ULTIMA CHIAMATA — e da qui il gioco prende il nome ────────────────
   Il mazzo e' finito. Si chiude il locale, e il buttafuori che qualcuno
   teneva in mano col sangue freddo non aspetta piu': lo accompagna fuori.

   ⚠️ Non e' un ripiego per non bloccarsi: e' la RIPARAZIONE di un buco vero,
      trovato dal banco (R4, a due giocatori, seme 1132). I buttafuori sono
      giocatori-1 apposta perche' resti in piedi esattamente uno — ma il
      SANGUE FREDDO toglie una bomba dalla circolazione, e senza questa regola
      il mazzo poteva finire con DUE ancora seduti.

   ⭐ E' qui che serve il tetto di una bomba per mano: con una sola bomba a
      testa, ogni bomba sottratta al mazzo corrisponde a esattamente un
      giocatore, e il conto torna — n-1 bombe, n-1 usciti, uno in piedi. */
function lcUltimaChiamata(G) {
  lcLog(G, "🕛 Ultima chiamata: il mazzo e' finito.");
  G.chiudendo = true;              /* da qui le bombe non tornano piu' dentro */
  var giro, i, p;
  for (giro = 0; giro < G.n && !G.fine; giro++) {
    i = (G.turno + giro) % G.n;
    p = G.giocatori[i];
    if (p.vivo && lcBombeInMano(p) > 0) lcEsce(G, p, "il buttafuori che teneva in mano");
  }
  lcFinisci(G, "il mazzo e' finito");
}

function lcFinisci(G, perche) {
  if (G.fine) return;
  var vivi = lcVivi(G);
  G.fine = { vincitore: vivi.length ? vivi[0].id : null, perche: perche };
  lcLog(G, "🏁 " + (vivi.length ? vivi[0].nome + " resta in piedi" : "nessuno in piedi") + ".");
}

/* ── 7 · GIOCARE UNA CARTA, IN DUE TEMPI ──────────────────────────────────── */
function lcGiocabile(id) {
  /* ⛔ LE DUE BOMBE NON SI GIOCANO. Sembra ovvio e non lo era: la carta A
     OCCHI CHIUSI fa giocare A CASO, e un giocatore cieco che teneva un
     buttafuori col sangue freddo se lo calava sul tavolo — la bomba finiva
     negli scarti senza far uscire nessuno, e la partita restava in due.
     Trovato da R4 a quattro giocatori, seme 27755. */
  if (id === "buttafuori" || id === "bancarotta") return "non e' una carta che si gioca";
  if (LC_GETTONI.indexOf(id) >= 0) return "da solo non vale niente";
  if (id === "jolly") return "vale solo nelle combinazioni";
  if (id === "mazzetta") return "serve quando arriva il buttafuori";
  if (id === "sangue_freddo") return "vale finche' ce l'hai in mano";
  if (id === "non_vale") return "si gioca sull'azione di un altro";
  return "";
}

/* Chi, oltre all'attore, ha un NON VALE in mano. E' il server a saperlo: se la
   lista e' vuota la finestra non si apre nemmeno, e nessuno sospetta niente. */
function lcChiPuoAnnullare(G, attore) {
  var v = lcVivi(G), fuori = [], i;
  for (i = 0; i < v.length; i++)
    if (v[i].id !== attore && lcHa(v[i], "non_vale")) fuori.push(v[i].id);
  return fuori;
}

/* TEMPO 1 — la carta esce dalla mano; l'effetto NON e' ancora successo. */
function lcProponi(G, id, arg) {
  if (G.fine || G.pendente) return { ok: false, perche: "non adesso" };
  var p = lcAttuale(G);
  if (!lcHa(p, id)) return { ok: false, perche: "non ce l'hai" };
  var no = lcGiocabile(id);
  if (no) return { ok: false, perche: no };

  lcTogli(p, id);
  G.scarti.push(id);
  G.mosse++;
  G.pendente = { carta: id, arg: arg, attore: p.id };
  G.catena = 0;
  lcLog(G, p.nome + " → " + lcNomeDi(id));
  return { ok: true, annullabili: lcChiPuoAnnullare(G, p.id) };
}

/* TEMPO 1b — un NON VALE si accoda. Puo' essere negato a sua volta. */
function lcNega(G, chi) {
  if (!G.pendente) return { ok: false };
  var p = G.giocatori[chi];
  if (!p || !p.vivo || !lcTogli(p, "non_vale")) return { ok: false };
  G.scarti.push("non_vale");
  G.catena++;
  lcLog(G, p.nome + " → NON VALE");
  return { ok: true, catena: G.catena, annullabili: lcChiPuoAnnullare(G, chi) };
}

/* TEMPO 2 — la catena e' chiusa. L'effetto succede solo se i NON VALE sono
   in numero PARI (zero compreso). ⭐ Il turno dell'attore NON finisce: una
   carta annullata non e' un turno speso, e chi l'ha giocata deve ancora
   pescare o giocare qualcos'altro. */
function lcRisolvi(G) {
  var pend = G.pendente;
  if (!pend) return { ok: false };
  G.pendente = null;
  var dispari = (G.catena % 2 === 1);
  G.catena = 0;
  if (dispari) {
    lcLog(G, "Quella mossa non e' mai successa.");
    return { ok: true, annullata: true, carta: pend.carta };
  }
  if (G.fine) return { ok: true };
  return lcEffetto(G, pend.carta, pend.arg, G.giocatori[pend.attore]);
}

/* scorciatoia: proponi + risolvi, quando nessuno puo' annullare */
function lcGioca(G, id, arg) {
  var r = lcProponi(G, id, arg);
  if (!r.ok) return r;
  return lcRisolvi(G);
}

/* ⭐ GLI EFFETTI. Chiude il turno solo chi lo dichiara chiamando lcChiudiTurno:
   tutti gli altri lasciano il giocatore al tavolo, che dovra' comunque pescare
   o giocare qualcos'altro. E' la regola del foglio delle carte. */
function lcEffetto(G, id, arg, p) {
  var i, q, b, t, o, j;
  switch (id) {
    case "passo":
      lcChiudiTurno(G); return { ok: true };

    case "contromano":
      G.verso = -G.verso;
      if (lcVivi(G).length > 2) lcLog(G, "Il giro cambia senso.");
      lcChiudiTurno(G); return { ok: true };

    case "raddoppio":
      /* esci pulito: il tuo residuo passa al prossimo, piu' uno */
      q = G.dovuti; G.dovuti = 0;
      G.turno = lcProssimo(G);
      G.dovuti = q + 1;
      return { ok: true, aChi: G.turno };

    case "paga_tu":
      if (arg == null || !G.giocatori[arg] || !G.giocatori[arg].vivo || arg === p.id)
        return { ok: true, chiede: "giocatore", carta: id };
      q = G.dovuti; G.dovuti = 0;
      G.turno = arg; G.dovuti = q + 1;
      lcLog(G, "Il giro va a " + G.giocatori[arg].nome + ": due turni");
      return { ok: true, aChi: arg };

    case "pago_io":
      G.dovuti += 2;                        /* questo + 2 = tre di fila */
      lcChiudiTurno(G); return { ok: true };

    case "ultimo_ordine":
      G.dovuti = 0; lcChiudiTurno(G); return { ok: true };

    case "sbircia":
      return { ok: true, mostra: G.mazzo.slice(0, 3) };

    case "sbircia_due":
      return { ok: true, mostra: G.mazzo.slice(0, 3), anche: lcProssimo(G) };

    case "impila":
      return { ok: true, riordina: G.mazzo.slice(0, 3) };

    case "impila_due":
      return { ok: true, riordina: G.mazzo.slice(0, 3), anche: lcProssimo(G) };

    case "rimescola":
      lcMescola(G.rnd, G.mazzo);
      lcLog(G, "Il mazzo torna a zero.");
      return { ok: true };

    case "primo_ultimo":
      if (G.mazzo.length >= 2) {
        var pr = G.mazzo.shift(), ul = G.mazzo.pop();
        G.mazzo.unshift(ul); G.mazzo.push(pr);
      }
      return { ok: true };

    case "dal_fondo":
      return lcPesca(G, { daFondo: true });

    case "sottobanco":
      return lcPesca(G, { guarda: true });

    case "si_chiude":
      var bomb = 0;
      for (i = G.mazzo.length - 1; i >= 0; i--)
        if (G.mazzo[i] === "buttafuori") { G.mazzo.splice(i, 1); bomb++; }
      lcMescola(G.rnd, G.mazzo);            /* ⛔ la BANCAROTTA non si tocca */
      for (i = 0; i < bomb; i++) G.mazzo.unshift("buttafuori");
      lcLog(G, "Luci accese: " + bomb + " buttafuori tornano in cima.");
      lcChiudiTurno(G);
      return { ok: true, bombe: bomb };

    case "segnato":
      b = G.giocatori[arg];
      if (!b || !b.vivo || arg === p.id || !b.mano.length)
        return { ok: true, chiede: "giocatore", carta: id };
      j = lcInt(G.rnd, b.mano.length);
      b.segnate.push(b.mano[j]);
      lcLog(G, "Una carta di " + b.nome + " resta scoperta");
      return { ok: true, scoperta: b.mano[j], di: arg };

    case "conto_aperto":
      t = G.giocatori[arg];
      if (!t || !t.vivo || arg === p.id || t.conto != null)
        return { ok: true, chiede: "giocatore", carta: id };
      t.conto = p.id;
      lcLog(G, p.nome + " → apre un conto a " + t.nome);
      return { ok: true, a: arg };

    case "occhi_chiusi":
      o = G.giocatori[arg];
      if (!o || !o.vivo || arg === p.id) return { ok: true, chiede: "giocatore", carta: id };
      o.cieco = true;
      lcLog(G, "A " + o.nome + " spengono la luce");
      return { ok: true, a: arg };
  }
  return { ok: true };
}

/* ── 8 · LE COMBINAZIONI DI GETTONI ───────────────────────────────────────
   due uguali (o due jolly) = rubi ALLA CIECA, e sceglie il ladro
   tre                      = guardi la mano scoperta e prendi quello che vuoi */
function lcForzaCombo(carte) {
  var i, conta = {}, jolly = 0, k, max = 0;
  for (i = 0; i < carte.length; i++) {
    var c = carte[i];
    if (c === "jolly") { jolly++; continue; }
    if (LC_GETTONI.indexOf(c) < 0) return 0;
    conta[c] = (conta[c] || 0) + 1;
  }
  for (k in conta) if (conta.hasOwnProperty(k) && conta[k] > max) max = conta[k];
  if (carte.length === 2) return (max === 2 || (max === 1 && jolly === 1) || jolly === 2) ? 2 : 0;
  if (carte.length === 3) return (max + jolly >= 3) ? 3 : 0;
  return 0;
}

/* `scelta` serve solo al terzetto, ed e' l'indice nella mano del bersaglio.
   ⚠️ Le carte NON lasciano la mano finche' la scelta non e' fatta: se si
      scartassero prima, un ripensamento lascerebbe il ladro senza gettoni. */
function lcCombina(G, indici, bersaglio, scelta) {
  if (G.fine || G.pendente) return { ok: false };
  var p = lcAttuale(G), i, carte = [];
  for (i = 0; i < indici.length; i++) {
    if (indici[i] == null || p.mano[indici[i]] == null) return { ok: false, perche: "carta inesistente" };
    carte.push(p.mano[indici[i]]);
  }
  var forza = lcForzaCombo(carte);
  if (!forza) return { ok: false, perche: "non e' una combinazione" };
  var b = G.giocatori[bersaglio];
  if (!b || !b.vivo || b.id === p.id || !b.mano.length)
    return { ok: false, perche: "bersaglio non valido" };

  var j;
  if (forza === 2) {
    j = lcInt(G.rnd, b.mano.length);          /* alla cieca, e sceglie il LADRO */
  } else {
    if (scelta == null) return { ok: true, chiede: "carta", di: b.id, mano: b.mano.slice() };
    j = Math.max(0, Math.min(b.mano.length - 1, scelta));
  }

  var ord = indici.slice().sort(function (x, y) { return y - x; });
  for (i = 0; i < ord.length; i++) { G.scarti.push(p.mano[ord[i]]); p.mano.splice(ord[i], 1); }
  var c = b.mano.splice(j, 1)[0];
  lcSmarca(b, c);
  p.mano.push(c);
  G.mosse++;
  lcLog(G, p.nome + " → ruba una carta a " + b.nome + (forza === 2 ? ", alla cieca" : ""));
  /* ⭐ e adesso i due controlli che l'Uomo Nero aveva dimenticato */
  lcControllaFreddo(G, b);                  /* gli hanno tolto il sangue freddo? */
  lcControllaFreddo(G, p);                  /* si e' preso una bomba? */
  return { ok: true, rubata: c, forza: forza, di: b.id };
}

/* ── 9 · DISINNESCHI E POSIZIONI ──────────────────────────────────────────── */
function lcPos(G, pos) {
  if (pos == null) return lcInt(G.rnd, G.mazzo.length + 1);
  return Math.max(0, Math.min(G.mazzo.length, pos));
}
function lcUsaMazzetta(G, chi, pos) {
  var p = G.giocatori[chi == null ? G.turno : chi];
  if (!p || !lcTogli(p, "mazzetta")) return { ok: false };
  G.scarti.push("mazzetta");
  G.mazzo.splice(lcPos(G, pos), 0, "buttafuori");
  lcLog(G, p.nome + " → LA MAZZETTA: il buttafuori torna nel mazzo");
  lcControllaFreddo(G, p);
  if (!G.fine) lcChiudiTurno(G);
  return { ok: true };
}
/* la mazzetta si puo' anche non usare: allora si esce */
function lcRifiutaMazzetta(G, chi) {
  var p = G.giocatori[chi == null ? G.turno : chi];
  G.scarti.push("buttafuori");
  lcEsce(G, p, "il buttafuori");
  return { ok: true };
}
function lcRimettiBancarotta(G, pos) {
  G.mazzo.splice(lcPos(G, pos), 0, "bancarotta");
  lcChiudiTurno(G);
  return { ok: true };
}
function lcRimettiSottobanco(G, carta, pos) {
  G.mazzo.splice(lcPos(G, pos), 0, carta);
  lcChiudiTurno(G);
  return { ok: true };
}
/* `ordine` sono gli indici delle tre carte, dalla cima in giu' */
function lcRiordina(G, ordine) {
  var quante = Math.min(3, G.mazzo.length);
  var tre = G.mazzo.splice(0, quante), i, fuori = [], visti = {};
  for (i = 0; i < ordine.length; i++) {
    var k = ordine[i];
    if (k >= 0 && k < tre.length && !visti[k]) { fuori.push(tre[k]); visti[k] = 1; }
  }
  for (i = 0; i < tre.length; i++) if (!visti[i]) fuori.push(tre[i]);
  for (i = fuori.length - 1; i >= 0; i--) G.mazzo.unshift(fuori[i]);
  return { ok: true };
}

/* ── 10 · I BOT ────────────────────────────────────────────────────────────
   Non sono furbi e non devono esserlo: devono essere PLAUSIBILI e non
   bloccarsi mai. Un bot che non sa cosa fare pesca, ed e' sempre una mossa
   legale. ⚠️ E un bot non deve poter allungare la partita all'infinito: per
   questo le carte che saltano il turno hanno una PROBABILITA', non una regola
   — e la probabilita' cresce col pericolo, non col capriccio. */
function lcRischio(G) {
  var bombe = 0, i;
  if (!G.mazzo.length) return 1;
  for (i = 0; i < G.mazzo.length; i++)
    if (G.mazzo[i] === "buttafuori" || (G.mazzo[i] === "bancarotta" && G.bancarottaScoperta)) bombe++;
  return Math.min(0.92, (bombe / G.mazzo.length) * 3.2);
}
function lcBotBersaglio(G, p) {
  var v = lcVivi(G), cand = [], i;
  for (i = 0; i < v.length; i++) if (v[i].id !== p.id && v[i].mano.length) cand.push(v[i].id);
  if (!cand.length)
    for (i = 0; i < v.length; i++) if (v[i].id !== p.id) cand.push(v[i].id);
  return cand.length ? lcScegli(G.rnd, cand) : p.id;
}
function lcBotCercaCombo(G, p) {
  var i, j, k, pos = [];
  for (i = 0; i < p.mano.length; i++)
    if (LC_GETTONI.indexOf(p.mano[i]) >= 0 || p.mano[i] === "jolly") pos.push(i);
  var b = lcBotBersaglio(G, p);
  if (b === p.id || !G.giocatori[b].mano.length) return null;
  for (i = 0; i < pos.length; i++)
    for (j = i + 1; j < pos.length; j++) {
      for (k = j + 1; k < pos.length; k++)
        if (lcForzaCombo([p.mano[pos[i]], p.mano[pos[j]], p.mano[pos[k]]]) === 3)
          return { indici: [pos[i], pos[j], pos[k]], bersaglio: b, forza: 3 };
      if (lcForzaCombo([p.mano[pos[i]], p.mano[pos[j]]]) === 2)
        return { indici: [pos[i], pos[j]], bersaglio: b, forza: 2 };
    }
  return null;
}

function lcBotMossa(G) {
  var p = lcAttuale(G), r = G.rnd, i;

  /* ⚠️ CIECO: non vede la mano. Se gioca, gioca a caso — ed e' proprio la
     regola della carta, non una scorciatoia del bot. */
  if (p.cieco) {
    if (r() < 0.35) {
      var leg = [];
      for (i = 0; i < p.mano.length; i++) if (!lcGiocabile(p.mano[i])) leg.push(p.mano[i]);
      if (leg.length) return { tipo: "gioca", carta: lcScegli(r, leg), arg: lcBotBersaglio(G, p) };
    }
    return { tipo: "pesca" };
  }

  var combo = lcBotCercaCombo(G, p);
  if (combo && r() < (combo.forza === 3 ? 0.8 : 0.55))
    return { tipo: "combina", indici: combo.indici, bersaglio: combo.bersaglio, forza: combo.forza };

  /* guardare il mazzo conviene quasi sempre, e non chiude il turno */
  if (lcHa(p, "impila") && r() < 0.6) return { tipo: "gioca", carta: "impila" };
  if (lcHa(p, "impila_due") && r() < 0.3) return { tipo: "gioca", carta: "impila_due" };
  if (lcHa(p, "sbircia") && r() < 0.5) return { tipo: "gioca", carta: "sbircia" };
  if (lcHa(p, "sbircia_due") && r() < 0.2) return { tipo: "gioca", carta: "sbircia_due" };

  if (lcVivi(G).length >= 3) {
    if (lcHa(p, "segnato") && r() < 0.22) return { tipo: "gioca", carta: "segnato", arg: lcBotBersaglio(G, p) };

    var tf = (ord[i] - (ord.length - 1) / 2);
    /* sale al suo posto in aria */
    fuori.push(lcVolo(
      { x: mazzo.x, y: mazzo.y, z: 0.02 + i * 0.01, w: 0.46, becca: 0, gira: 0, piega: 0 },
      { x: mazzo.x + t * 0.34, y: mazzo.y - 0.16, z: 0.34, w: 0.42,
        becca: 0.55, gira: 0, piega: t * 0.12 },
      su, { arco: 0.06, curva: lcEaseOut, ritardo: (opt.ritardo || 0) + i * 60 }));
    /* scivola nel posto nuovo e scende */
    fuori.push(lcVolo(
      { x: mazzo.x + t * 0.34, y: mazzo.y - 0.16, z: 0.34, w: 0.42,
        becca: 0.55, gira: 0, piega: t * 0.12 },
      { x: mazzo.x, y: mazzo.y, z: 0.02 + ord[i] * 0.01, w: 0.46,
        becca: 0, gira: 0, piega: 0 },
      giu, { arco: 0.10, curva: lcEaseInOut,
             ritardo: (opt.ritardo || 0) + su + 160 + tf * 40 }));
  }
  return fuori;
}

/* MEZZO GIRO sul posto — una carta si volta senza spostarsi. */
function lcGestoVolta(dove, opt) {
  opt = opt || {};
  return [lcVolo(
    { x: dove.x, y: dove.y, z: dove.z || 0.02, w: dove.w || 0.5,
      becca: dove.becca || 0, gira: 0, piega: dove.piega || 0 },
    { x: dove.x, y: dove.y, z: dove.z || 0.02, w: dove.w || 0.5,
      becca: dove.becca || 0, gira: Math.PI, piega: dove.piega || 0 },
    opt.durata || 340,
    { arco: opt.arco == null ? 0.10 : opt.arco, curva: lcEaseInOut,
      faccia: (opt.faccia == null ? true : opt.faccia),
      ritardo: opt.ritardo || 0, fine: opt.fine })];
}

/* ══════════════════════════════════════════════════════════════════════════
   4 · LA SCENA — chi tiene il tempo e disegna
   ══════════════════════════════════════════════════════════════════════════ */
function lcScena(opt) {
  opt = opt || {};
  var S = { voli: [], t0: null, tempo: 0 };

  S.aggiungi = function (voli) {
    var i;
    for (i = 0; i < voli.length; i++) S.voli.push(voli[i]);
    return S;
  };
  S.durata = function () {
    var i, m = 0;
    for (i = 0; i < S.voli.length; i++) if (S.voli[i].totale > m) m = S.voli[i].totale;
    return m;
  };
  S.svuota = function () { S.voli.length = 0; S.t0 = null; S.tempo = 0; return S; };
  S.finita = function () { return S.tempo >= S.durata(); };

  /* ⭐ UNA SCENA CHE VIVE QUANTO LA PARTITA DEVE SAPER DIMENTICARE.
     La prima versione teneva ogni volo per sempre: dopo cento pescate erano
     cento carte ferme sulla loro destinazione, ridisegnate a ogni fotogramma
     — e siccome ognuna chiede uno sprite alla cache, il costo cresceva senza
     fine. Qui i voli finiti escono, e chi aveva chiesto un `fine` lo riceve
     UNA volta sola.
     ⚠️ `pota` va chiamata PRIMA di disegnare, non dopo: un volo che finisce
        in questo fotogramma deve comunque comparire al suo ultimo istante,
        ed e' per questo che si tiene finche' `tempo` non lo supera davvero. */
  S.pota = function (ms) {
    var i, v, resta = [];
    for (i = 0; i < S.voli.length; i++) {
      v = S.voli[i];
      if (ms > v.totale + 16) {
        if (v.fine && !v._fatto) { v._fatto = true; v.fine(v); }
        continue;
      }
      resta.push(v);
    }
    S.voli = resta;
    return S;
  };

  /* ⚠️ Il tempo si passa da fuori, e non si legge `performance.now()` qui
     dentro. E' quello che rende la scena MISURABILE: il banco le chiede il
     fotogramma a 137 ms e lo ottiene, senza aspettare 137 ms. Una scena che
     sa leggere solo l'orologio vero si puo' guardare, non provare. */
  S.avanza = function (ms) { S.tempo = ms; return S; };

  /* Disegna tutti i voli, dal piu' lontano al piu' vicino: e' l'ordine, non
     il caso, che fa sembrare vero un tavolo. */
  S.disegna = function (ctx, C, faccia, dorso, misura) {
    var i, v, p, ordinati = [];
    for (i = 0; i < S.voli.length; i++) {
      v = S.voli[i];
      if (S.tempo < v.ritardo) continue;          // non e' ancora partita
      p = v.posa(S.tempo);
      ordinati.push({ v: v, p: p });
    }
    ordinati.sort(function (a, b) { return b.p.y - a.p.y; });
    for (i = 0; i < ordinati.length; i++) {
      v = ordinati[i].v; p = ordinati[i].p;
      var img = v.scoperta(S.tempo)
        ? faccia(v, p, misura) : dorso(v, p, misura);
      if (!img) continue;
      lcPosaTavolo(ctx, C, img, p.x, p.y, p.z, p.w,
                   { becca: p.becca, gira: p.gira, piega: p.piega,
                     n: p.w > 0.7 ? 10 : 7 });
    }
    return ordinati.length;
  };
  return S;
}

if (typeof window !== 'undefined') {
  window.lcEaseInOut = lcEaseInOut; window.lcEaseOut = lcEaseOut;
  window.lcEaseIn = lcEaseIn; window.lcEaseIndietro = lcEaseIndietro;
  window.lcVolo = lcVolo; window.lcPosa = lcPosa; window.lcScena = lcScena;
  window.lcGestoPesca = lcGestoPesca; window.lcGestoGioca = lcGestoGioca;
  window.lcGestoRivela = lcGestoRivela; window.lcGestoSbircia = lcGestoSbircia;
  window.lcGestoRimescola = lcGestoRimescola; window.lcGestoImpila = lcGestoImpila;
  window.lcGestoVolta = lcGestoVolta;
}
</script>
<script>
/* ═══ _lc_suoni.js ═══ */
/* ══════════════════════════════════════════════════════════════════════════
   _lc_suoni.js — LA COLONNA SONORA DI LAST CALL, sintetizzata. ES5 puro.

   ⭐ NON C'E' UN SOLO FILE AUDIO. Tutto nasce qui dentro da oscillatori e
   rumore filtrato. Non e' un vezzo tecnico: sono ~11 KB di codice contro
   ~400 KB di campioni, dentro un `index.html` che viaggia gia' oltre il
   megabyte e che il proprietario carica a mano a ogni rilascio.

   ⚠️ E soprattutto: un suono sintetizzato si ACCORDA. Il tonfo del buttafuori
      e la campanella del proprio turno stanno nella stessa scala, e il
      clangore della bancarotta e' la stessa nota una quinta sotto. Con dei
      campioni presi in giro non succederebbe mai.

   ── LE TRE REGOLE CHE TENGONO INSIEME IL TUTTO ─────────────────────────────
   1 · ⛔ IL CONTESTO SI APRE SOLO AL PRIMO TOCCO. I browser (tutti, da anni)
       rifiutano l'audio prima di un gesto dell'utente, e un contesto creato
       troppo presto resta "suspended" per sempre: il gioco sarebbe muto e non
       se ne capirebbe il motivo. Quindi `lcSuonoSveglia()` al primo click.
   2 · ⭐ OGNI SUONO HA UNA CODA, MAI UNO STACCO SECCO. Un guadagno che va a
       zero di colpo fa "click": e' il difetto numero uno dell'audio
       sintetizzato. Qui si spegne sempre con una rampa esponenziale.
   3 · ⚠️ NIENTE SI SOVRAPPONE PIU' DI TRE VOLTE. Quando escono tre giocatori
       di fila, tre tonfi insieme saturano e diventano un rumore. `LC_VOCI`
       tiene il conto e scarta gli eccessi.

   ── COME SI USA ────────────────────────────────────────────────────────────
       lcSuonoSveglia();            // una volta sola, al primo gesto
       lcSuona('buttafuori');       // e basta
       lcSuonoVolume(0.6);          // 0 = muto
   ══════════════════════════════════════════════════════════════════════════ */

var LC_AC = null;           /* il contesto audio, aperto pigramente */
var LC_MASTER = null;       /* il volume generale */
var LC_VOL = 0.7;
var LC_VOCI = 0;            /* quante voci stanno suonando adesso */
var LC_RUMORE = null;       /* un secondo di rumore bianco, riusato da tutti */

function lcSuonoSveglia() {
  if (LC_AC) {
    if (LC_AC.state === "suspended" && LC_AC.resume) LC_AC.resume();
    return LC_AC;
  }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { LC_AC = new AC(); } catch (e) { return null; }
  LC_MASTER = LC_AC.createGain();
  LC_MASTER.gain.value = LC_VOL;
  /* ⭐ un compressore in fondo: e' cio' che evita che due tonfi insieme
     facciano saltare l'altoparlante del telefono */
  if (LC_AC.createDynamicsCompressor) {
    var comp = LC_AC.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.ratio.value = 8;
    comp.attack.value = 0.004;
    comp.release.value = 0.18;
    LC_MASTER.connect(comp);
    comp.connect(LC_AC.destination);
  } else {
    LC_MASTER.connect(LC_AC.destination);
  }
  /* un secondo di rumore bianco: carta, fruscii, mescolate, tutto viene da qui */
  var n = LC_AC.sampleRate;
  LC_RUMORE = LC_AC.createBuffer(1, n, n);
  var d = LC_RUMORE.getChannelData(0), i;
  for (i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return LC_AC;
}

function lcSuonoVolume(v) {
  LC_VOL = Math.max(0, Math.min(1, v));
  if (LC_MASTER) LC_MASTER.gain.value = LC_VOL;
}
function lcSuonoMuto() { return LC_VOL <= 0.001; }

/* ── I MATTONI ────────────────────────────────────────────────────────────── */

/* una voce: si annuncia, e si cancella da sola quando ha finito */
function lcVoce(durata) {
  if (LC_VOCI >= 3) return null;              /* regola 3 */
  LC_VOCI++;
  var g = LC_AC.createGain();
  g.connect(LC_MASTER);
  setTimeout(function () { LC_VOCI--; try { g.disconnect(); } catch (e) {} },
             Math.round(durata * 1000) + 60);
  return g;
}

/* ⭐ L'INVILUPPO. Attacco lineare (che deve essere netto), coda esponenziale
   (che non deve mai arrivare a zero di colpo — regola 2). */
function lcInv(par, t0, picco, attacco, durata) {
  par.setValueAtTime(0.0001, t0);
  par.linearRampToValueAtTime(picco, t0 + attacco);
  par.exponentialRampToValueAtTime(0.0001, t0 + durata);
}

/* un tono: seno/quadra/triangolo/dente, con eventuale scivolata di frequenza */
function lcTono(o) {
  if (!LC_AC) return;
  var t0 = LC_AC.currentTime + (o.rit || 0);
  var dur = o.dur || 0.2;
  var g = lcVoce(dur + (o.rit || 0));
  if (!g) return;
  var osc = LC_AC.createOscillator();
  osc.type = o.tipo || "sine";
  osc.frequency.setValueAtTime(o.f, t0);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(o.f2, 1), t0 + dur);
  lcInv(g.gain, t0, (o.vol == null ? 0.3 : o.vol), o.att || 0.006, dur);
  if (o.filtro) {
    var fl = LC_AC.createBiquadFilter();
    fl.type = o.filtro;
    fl.frequency.value = o.fc || 1200;
    fl.Q.value = o.q || 1;
    osc.connect(fl); fl.connect(g);
  } else osc.connect(g);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

/* rumore filtrato: e' la carta, la mescolata, il fruscio della banconota */
function lcFruscio(o) {
  if (!LC_AC || !LC_RUMORE) return;
  var t0 = LC_AC.currentTime + (o.rit || 0);
  var dur = o.dur || 0.15;
  var g = lcVoce(dur + (o.rit || 0));
  if (!g) return;
  var src = LC_AC.createBufferSource();
  src.buffer = LC_RUMORE;
  src.loop = true;
  var fl = LC_AC.createBiquadFilter();
  fl.type = o.filtro || "bandpass";
  fl.frequency.setValueAtTime(o.fc || 2000, t0);
  if (o.fc2) fl.frequency.exponentialRampToValueAtTime(Math.max(o.fc2, 20), t0 + dur);
  fl.Q.value = o.q || 1.2;
  lcInv(g.gain, t0, (o.vol == null ? 0.25 : o.vol), o.att || 0.004, dur);
  src.connect(fl); fl.connect(g);
  src.start(t0);
  src.stop(t0 + dur + 0.02);
}

/* ── ⭐ LA SCALA DEL GIOCO ────────────────────────────────────────────────
   Un LA minore: tutto quello che suona sta qui dentro, ed e' il motivo per
   cui il gioco non sembra una cassetta degli attrezzi. */
var LC_LA = 220.0;
function lcNota(semitoni) { return LC_LA * Math.pow(2, semitoni / 12); }

/* ── IL CATALOGO DEI SUONI ────────────────────────────────────────────────
   ⚠️ Ogni voce qui corrisponde a UN momento del gioco. Se il gioco impara a
      fare qualcosa di nuovo e qui non c'e' la riga, quel momento resta muto:
      per questo il banco confronta questa lista con gli eventi del motore. */
var LC_SUONI = {

  /* ── il tavolo ─────────────────────────────────────────────────────── */
  /* una carta che scivola fuori dal mazzo: fruscio che sale e si chiude */
  pesca: function () {
    lcFruscio({ dur: 0.16, fc: 900, fc2: 3200, q: 0.9, vol: 0.22 });
    lcTono({ f: lcNota(12), f2: lcNota(19), dur: 0.09, tipo: "sine", vol: 0.06, rit: 0.05 });
  },

  /* una carta sbattuta sul feltro: uno schiocco secco e corto */
  gioca: function () {
    lcFruscio({ dur: 0.09, fc: 2600, fc2: 700, q: 0.7, vol: 0.3, att: 0.002 });
    lcTono({ f: 150, f2: 60, dur: 0.08, tipo: "triangle", vol: 0.2 });
  },

  /* il mazzo mescolato: tre fruscii sfalsati, che e' come suona davvero */
  mescola: function () {
    var i;
    for (i = 0; i < 3; i++)
      lcFruscio({ dur: 0.13, fc: 1400 + i * 500, fc2: 600, q: 1.6, vol: 0.16, rit: i * 0.075 });
  },

  /* tre carte guardate di nascosto: un fruscio solo, basso e breve */
  sbircia: function () {
    lcFruscio({ dur: 0.2, fc: 700, fc2: 1800, q: 2.2, vol: 0.16 });
  },

  /* ── ⛔ LE DUE BOMBE ────────────────────────────────────────────────── */
  /* IL BUTTAFUORI: un tonfo di porta piu' un colpo di petto. ⭐ E' il suono
     piu' forte del gioco e deve restarlo: e' l'unico che deve far alzare la
     testa a chi sta guardando il telefono di un altro. */
  buttafuori: function () {
    lcTono({ f: 110, f2: 34, dur: 0.5, tipo: "sine", vol: 0.5, att: 0.002 });
    lcFruscio({ dur: 0.3, fc: 300, fc2: 90, q: 0.6, vol: 0.3, att: 0.002 });
    lcTono({ f: lcNota(-12), f2: lcNota(-24), dur: 0.7, tipo: "triangle", vol: 0.2, rit: 0.04 });
  },

  /* LA BANCAROTTA: vetro e cassa. La stessa nota del buttafuori una quinta
     sotto, piu' uno stridore acuto che non si sente da nessun'altra parte */
  bancarotta: function () {
    lcTono({ f: lcNota(-17), f2: lcNota(-29), dur: 0.8, tipo: "sawtooth", vol: 0.28, filtro: "lowpass", fc: 900 });
    lcFruscio({ dur: 0.45, fc: 5200, fc2: 1800, q: 0.8, vol: 0.24, att: 0.001 });
    lcTono({ f: lcNota(25), f2: lcNota(13), dur: 0.35, tipo: "square", vol: 0.09, rit: 0.06 });
  },

  /* LA MAZZETTA: banconota che fruscia, e un respiro di sollievo in due note */
  mazzetta: function () {
    lcFruscio({ dur: 0.22, fc: 3400, fc2: 1400, q: 0.9, vol: 0.2 });
    lcTono({ f: lcNota(7), dur: 0.14, tipo: "sine", vol: 0.18, rit: 0.10 });
    lcTono({ f: lcNota(12), dur: 0.26, tipo: "sine", vol: 0.16, rit: 0.20 });
  },

  /* ── le persone ────────────────────────────────────────────────────── */
  /* NON VALE: due colpi di clacson discendenti. Deve dare fastidio. */
  nonvale: function () {
    lcTono({ f: lcNota(3), dur: 0.11, tipo: "square", vol: 0.2, filtro: "lowpass", fc: 1400 });
    lcTono({ f: lcNota(-1), dur: 0.22, tipo: "square", vol: 0.2, filtro: "lowpass", fc: 1200, rit: 0.12 });
  },

  /* il furto: due gettoni che si toccano */
  ruba: function () {
    lcTono({ f: lcNota(24), f2: lcNota(19), dur: 0.1, tipo: "triangle", vol: 0.16 });
    lcTono({ f: lcNota(28), f2: lcNota(22), dur: 0.13, tipo: "triangle", vol: 0.12, rit: 0.05 });
    lcFruscio({ dur: 0.06, fc: 6000, q: 2.0, vol: 0.08, rit: 0.05 });
  },

  /* il conto aperto: una matita sul blocchetto */
  conto: function () {
    lcFruscio({ dur: 0.1, fc: 2200, fc2: 900, q: 3.0, vol: 0.14 });
    lcTono({ f: lcNota(5), dur: 0.16, tipo: "sine", vol: 0.12, rit: 0.06 });
  },

  /* a occhi chiusi: la luce che si spegne */
  buio: function () {
    lcTono({ f: lcNota(14), f2: lcNota(-10), dur: 0.5, tipo: "sine", vol: 0.2, filtro: "lowpass", fc: 2200 });
  },

  /* ── il giro ───────────────────────────────────────────────────────── */
  /* tocca a te: una campanella sola, gentile, che non fa saltare */
  tuoTurno: function () {
    lcTono({ f: lcNota(16), dur: 0.5, tipo: "sine", vol: 0.16, att: 0.01 });
    lcTono({ f: lcNota(28), dur: 0.32, tipo: "sine", vol: 0.05, att: 0.01 });
  },

  /* il turno passa a un altro: la stessa campanella, piu' bassa e piu' corta */
  turno: function () {
    lcTono({ f: lcNota(4), dur: 0.2, tipo: "sine", vol: 0.08 });
  },

  /* ⚠️ IL TICCHETTIO DELLA FINESTRA DEL NON VALE. Volutamente piccolo: il
     foglio delle carte dice che la pausa si deve nascondere dentro
     l'animazione, non annunciarsi. */
  tic: function () {
    lcTono({ f: lcNota(31), dur: 0.05, tipo: "sine", vol: 0.07 });
  },

  /* il giro cambia senso */
  contromano: function () {
    lcTono({ f: lcNota(12), f2: lcNota(0), dur: 0.18, tipo: "triangle", vol: 0.14 });
    lcTono({ f: lcNota(0), f2: lcNota(12), dur: 0.18, tipo: "triangle", vol: 0.14, rit: 0.16 });
  },

  /* ── i finali ──────────────────────────────────────────────────────── */
  /* qualcuno esce: una porta che si chiude, in lontananza */
  fuori: function () {
    lcTono({ f: lcNota(-5), f2: lcNota(-17), dur: 0.55, tipo: "sine", vol: 0.22 });
    lcFruscio({ dur: 0.25, fc: 500, fc2: 150, q: 0.8, vol: 0.16, rit: 0.03 });
  },

  /* ⭐ SI VINCE: un accordo che sale, tre note della scala del gioco */
  vinto: function () {
    lcTono({ f: lcNota(12), dur: 0.5, tipo: "triangle", vol: 0.2 });
    lcTono({ f: lcNota(16), dur: 0.5, tipo: "triangle", vol: 0.17, rit: 0.11 });
    lcTono({ f: lcNota(19), dur: 0.8, tipo: "triangle", vol: 0.17, rit: 0.22 });
  },

  /* si perde: le stesse tre note, al contrario e in minore */
  perso: function () {
    lcTono({ f: lcNota(7), dur: 0.4, tipo: "sine", vol: 0.18 });
    lcTono({ f: lcNota(3), dur: 0.5, tipo: "sine", vol: 0.16, rit: 0.14 });
    lcTono({ f: lcNota(-5), dur: 0.9, tipo: "sine", vol: 0.16, rit: 0.3 });
  },

  /* l'ultima chiamata: la campana di mezzanotte, che da' il nome al gioco */
  ultimaChiamata: function () {
    lcTono({ f: lcNota(-12), dur: 1.2, tipo: "sine", vol: 0.26, att: 0.004 });
    lcTono({ f: lcNota(-5), dur: 1.0, tipo: "sine", vol: 0.12, att: 0.004, rit: 0.02 });
    lcTono({ f: lcNota(7), dur: 0.9, tipo: "sine", vol: 0.07, att: 0.004, rit: 0.04 });
  },

  /* ── l'interfaccia ─────────────────────────────────────────────────── */
  tocco: function () { lcTono({ f: lcNota(19), dur: 0.06, tipo: "sine", vol: 0.1 }); },
  no: function () { lcTono({ f: lcNota(-8), dur: 0.12, tipo: "square", vol: 0.12, filtro: "lowpass", fc: 800 }); }
};

/* ⛔ L'UNICA PORTA. Se il suono non esiste NON si finge che vada tutto bene:
   in sviluppo lo si dice nella console, perche' un momento muto e' un difetto
   che nessuno segnala mai — semplicemente il gioco sembra meno vivo. */
function lcSuona(id) {
  if (!LC_AC || LC_VOL <= 0.001) return false;
  var f = LC_SUONI[id];
  if (!f) {
    if (typeof console !== "undefined" && console.warn) console.warn("LAST CALL: suono ignoto '" + id + "'");
    return false;
  }
  try { f(); } catch (e) { return false; }
  return true;
}

/* i nomi di tutti i suoni: serve al banco per confrontarli con gli eventi */
function lcSuoniTutti() {
  var k, out = [];
  for (k in LC_SUONI) if (LC_SUONI.hasOwnProperty(k)) out.push(k);
  return out;
}

if (typeof window !== "undefined") {
  window.lcSuonoSveglia = lcSuonoSveglia;
  window.lcSuona = lcSuona;
  window.lcSuonoVolume = lcSuonoVolume;
  window.lcSuonoMuto = lcSuonoMuto;
  window.lcSuoniTutti = lcSuoniTutti;
  window.LC_SUONI = LC_SUONI;
}
if (typeof module !== "undefined" && module.exports)
  module.exports = { lcSuoniTutti: lcSuoniTutti, LC_SUONI: LC_SUONI };
</script>
<script>
/* ═══ _lc_regia.js ═══ */
/* ══════════════════════════════════════════════════════════════════════════
   _lc_regia.js — LA REGIA DI LAST CALL (13/09/2026)
   Chi racconta al tavolo cosa e' appena successo.

   Il proprietario, dopo il secondo giro: «si deve capire bene cosa fanno gli
   altri e la carta che peschi qual e', e ogni azione di una carta deve avere
   una specifica animazione fatta molto bene; e ci vuole una mini intro e una
   mini outro per annunciare il vincitore».

   ── COME E' FATTA ─────────────────────────────────────────────────────────
   Una CODA DI MOMENTI. Ogni momento ha una durata e sa disegnarsi a ogni
   istante fra 0 e 1. Si recitano uno dopo l'altro, sopra il tavolo, in
   coordinate di SCHERMO (non di tavolo): la prospettiva racconta dove stanno
   le cose, la regia racconta cosa succede, e un palco piatto al centro si
   legge meglio di una carta scorciata.

   ⭐ LE REGOLE NON ASPETTANO LA REGIA. Lo stato del gioco cambia subito, come
      prima; la regia mette in fila il racconto. Quello che aspetta e' solo il
      RITMO: i bot non muovono finche' la coda non e' vuota, e i pannelli di
      scelta si aprono con `poi()`, dopo il momento che li ha provocati.

   ⚠️ LE CARTE IN VIAGGIO NON SONO ANCORA ARRIVATE. La mano nello stato e' gia'
      cresciuta quando la carta pescata comincia a volare: se il tavolo la
      disegnasse subito, la carta sarebbe in due posti. `nascosti(chi)` dice
      quante carte in fondo alla mano di `chi` (o in cima agli scarti) il
      tavolo deve ancora tacere.

   ⚠️ IL SEGRETO RESTA SEGRETO. La carta pescata da un avversario vola
      COPERTA; la tua si gira sul palco. Sbircia e impila dei bot si vedono
      solo di dorso. La regia non puo' mostrare cio' che il tavolo non sa.

   ES5 puro, come gli altri `_lc_*.js`. Non conosce il DOM: la pagina le passa
   un PONTE con le misure, le ancore del tavolo, i nomi e i suoni.
   ══════════════════════════════════════════════════════════════════════════ */

function lcRegia(P) {
  /* 14/09 · il gancio della lingua (tavolo remoto, piano §8.6): la FRASE INTERA
     passa da `P.tr` prima di ogni misura. Senza `P.tr` e' l'identita'. */
  var T = (P && P.tr) || function (s) { return s; };
  var R = {
    coda: [], attivo: null, inizioAttivo: 0,
    echi: [],                 /* effetti che non bloccano: un distintivo, un lampo */
    velocita: 1,
    liberaDal: 0,
    palco: null,              /* la carta che sta sul palco, fra un momento e l'altro */
    fisso: null,              /* il finale resta disegnato finche' non si ricomincia */
    segni: {},                /* distintivi persistenti sui posti: {chi: {x2:..}} */
    _nasc: {},
    onLibera: null
  };

  /* ── 1 · IL TEMPO ───────────────────────────────────────────────────────── */
  function E(t) { return t < 0 ? 0 : (t > 1 ? 1 : t); }
  function eo(t) { t = E(t); return 1 - Math.pow(1 - t, 3); }
  function ei(t) { t = E(t); return t * t * t; }
  function eio(t) { t = E(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function eback(t, k) { t = E(t); var c = (k == null ? 1.7 : k), c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  /* la fetta [a,b] del tempo t, riportata a 0..1 */
  function fetta(t, a, b) { return E((t - a) / (b - a)); }
  function mix(a, b, t) { return a + (b - a) * t; }

  /* ── 2 · LA CODA ─────────────────────────────────────────────────────────
     Un momento: { dur, inizio(), disegna(t, ms), fine(), finoA(), velo }
     `finoA` tiene il momento sull'ultimo fotogramma finche' non diventa vero
     (serve alla finestra del NON VALE: la carta resta sul palco finche' la
     finestra e' aperta). `velo` scurisce il tavolo dietro. */
  R.metti = function (m) { R.coda.push(m); return R; };
  R.poi = function (fn) { return R.metti({ dur: 0, inizio: fn }); };
  R.occupata = function () { return !!(R.attivo || R.coda.length); };

  R.passo = function (ora) {
    var giri = 0;
    while (giri++ < 60) {
      if (!R.attivo) {
        if (!R.coda.length) break;
        R.attivo = R.coda.shift();
        R.inizioAttivo = ora;
        if (R.attivo.inizio) R.attivo.inizio();
      }
      var m = R.attivo;
      var ms = (ora - R.inizioAttivo) * R.velocita;
      if (ms < m.dur) break;
      if (m.finoA && !m.finoA()) break;
      R.attivo = null;
      if (m.fine) m.fine();
      if (!R.coda.length && !R.attivo) {
        R.liberaDal = ora;
        if (R.onLibera) R.onLibera();
      }
    }
    /* gli echi si potano da soli */
    var resta = [], i;
    for (i = 0; i < R.echi.length; i++)
      if ((ora - R.echi[i].t0) * R.velocita < R.echi[i].dur) resta.push(R.echi[i]);
    R.echi = resta;
    R._ora = ora;
  };

  /* ⭐ saltare non e' fermarsi: ogni momento in coda arriva alla sua FINE
     (le carte si mostrano, i conteggi tornano), solo senza farsi guardare */
  R.salta = function () {
    var giri = 0;
    while ((R.attivo || R.coda.length) && giri++ < 400) {
      if (!R.attivo) { R.attivo = R.coda.shift(); if (R.attivo.inizio) R.attivo.inizio(); }
      if (R.attivo.finoA && !R.attivo.finoA()) break;
      var m = R.attivo; R.attivo = null;
      if (m.fine) m.fine();
    }
    if (!R.occupata()) { R.liberaDal = R._ora || 0; if (R.onLibera) R.onLibera(); }
  };

  R.azzera = function () {
    R.coda.length = 0; R.attivo = null; R.echi.length = 0;
    R.palco = null; R.fisso = null; R.segni = {}; R._nasc = {}; R.turnoVisto = null; R._righeFinale = 0;
  };

  R.eco = function (dur, disegna) {
    R.echi.push({ t0: R._ora || P.ora(), dur: dur, disegna: disegna });
  };

  /* ── 3 · LE CARTE CHE LA REGIA TIENE NASCOSTE ─────────────────────────── */
  /* `velaMazzo` puo' essere un si' o una funzione del tempo del momento: la
     mazzetta vela il mazzo solo mentre la bomba ci rientra dentro */
  R.msAttivo = function () { return R.attivo ? Math.max(0, ((R._ora || 0) - R.inizioAttivo) * R.velocita) : 0; };
  R.mazzoVelato = function () {
    if (!R.attivo || !R.attivo.velaMazzo) return false;
    return typeof R.attivo.velaMazzo === 'function' ? !!R.attivo.velaMazzo(R.msAttivo()) : true;
  };
  R.postoVelato = function () { return false; };
  /* giro 3 · la carta della TUA mano che un momento tiene sul palco: {id, i} */
  R.cartaVia = function () { return R.attivo && R.attivo.cartaVia ? R.attivo.cartaVia(R.msAttivo()) : null; };
  R.moneteVelate = function () { return !!(R.attivo && R.attivo.velaMonete); };

  R.nascondi = function (k, q) { R._nasc[k] = (R._nasc[k] || 0) + (q == null ? 1 : q); };
  R.mostra = function (k, q) { R._nasc[k] = Math.max(0, (R._nasc[k] || 0) - (q == null ? 1 : q)); };
  R.nascosti = function (k) { return R._nasc[k] || 0; };

  /* ── 4 · GLI ATTREZZI DEL DISEGNO ─────────────────────────────────────── */
  function g() { return P.ctx(); }
  function L() { return P.larg(); }
  function A() { return P.alt(); }

  /* il palco: dove una carta si mostra a tutti
     ⭐ 13/09 · lo decide la pagina (`P.palco`): la grandezza si misura
     contro la carta in MANO, non contro lo schermo. Col tetto a 440 px, a 2560
     la carta «grande» era piu' piccola di quelle in mano. E sul PC lo
     striscione va di fianco alla carta, non sopra la fila degli avversari. */
  /* ⛔ giro 3 · `dove` = 'mazzo': il palco dei momenti che nascono dal mazzo
     o ci tornano (la pescata, la bomba, la mazzetta, la bancarotta, il
     sottobanco). Sul PC sta a sinistra del mazzo; sul telefono e' lo stesso. */
  function palco(dove) {
    if (P.palco) return P.palco(dove);
    var h = Math.round(Math.min(A() * 0.40, L() * 0.60 * 1.5, 440));
    return { x: L() / 2, y: A() * 0.40, h: h };
  }
  /* il palco di un momento che riguarda il mazzo; e la carta rimasta sul
     palco fra due momenti (una scelta aperta) resta dove e' salita */
  function dovePalco() { return R.palco && (R.palco.bomba || R.palco.nascosta || R.palco.mazzo) ? 'mazzo' : null; }
  /* dove va lo striscione del palco, e dove la didascalia di un effetto */
  /* ⛔ collaudo 13/09 giro 3 · SUL TELEFONO lo striscione stava 34 px sopra la
     carta del palco, cioe' sulla fila delle targhe degli avversari: copriva al
     100% la targa di quello centrale (spesso proprio chi giocava, con la sua ▶)
     per tutta la finestra del NON VALE. La pagina ora gli da' un posto (`sy`)
     anche sul telefono; questo resta il ripiego se non lo da'. */
  function SY(pc) { return pc.sy != null ? pc.sy : pc.y - pc.h / 2 - 34; }
  function SX(pc) {
    if (pc.sx == null && pc.sinistra == null && !pc.nastro) return null;
    return { x: pc.sx, sx: !!pc.sxSinistra, lim: pc.sLim, nastro: pc.nastro, sinistraDi: pc.sinistra, limSin: pc.limSin, righeSin: pc.righeSin };
  }
  function DY() { var pc = palco(); return pc.dy != null ? pc.dy : A() * 0.13; }
  /* ⚠️ Lo sprite si chiede UNA misura sola (quella del palco) e poi si scala:
     animare la grandezza chiedendo ogni volta una misura nuova alla cache
     riempirebbe la cache di centinaia di carte. */
  function sprite(id) {
    var d = P.dpr(), H = Math.round(palco().h * d), W = Math.round(H / 1.5);
    return id ? P.faccia(id, W, H) : P.dorso(W, H);
  }

  /* Una carta sullo schermo. `volta` 0 = dorso, 1 = faccia: a meta' e' di
     taglio, ed e' li' che si cambia faccia (vale anche qui la regola di
     `_lc_anim.js`). */
  function carta(id, x, y, h, rot, volta, alpha, ombra) {
    var c = g(), w = h / 1.5;
    var sx = Math.abs(Math.cos((volta == null ? 1 : volta) * Math.PI));
    var faccia = (volta == null ? 1 : volta) > 0.5;
    if (h < 4 || sx < 0.02) return;
    if (R._disegnate) R._disegnate.push({ id: faccia ? id : null, x: x, y: y, h: h });
    var img = sprite(faccia ? id : null);
    if (!img) return;
    c.save();
    c.globalAlpha = alpha == null ? 1 : alpha;
    c.translate(x, y);
    c.rotate(rot || 0);
    c.scale(Math.max(0.02, sx), 1);
    if (ombra !== false) { c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = h * 0.08; c.shadowOffsetY = h * 0.03; }
    c.drawImage(img, -w / 2, -h / 2, w, h);
    c.restore();
  }

  /* un volo da A a B, con l'arco verso l'alto dello schermo */
  function vola(a, b, t, arco, curva) {
    var u = (curva || eio)(t);
    var r = {
      x: mix(a.x, b.x, u), y: mix(a.y, b.y, u), h: mix(a.h, b.h, u),
      rot: mix(a.rot || 0, b.rot || 0, u)
    };
    r.y -= (arco || 0) * 4 * t * (1 - t);
    return r;
  }

  function font(peso, px) { return peso + ' ' + Math.round(px) + 'px system-ui,-apple-system,"Segoe UI",sans-serif'; }
  function spazia(c, em) { if ('letterSpacing' in c) c.letterSpacing = em; }

  /* ⭐ IL TIMBRO: una parola che cade sul tavolo e rimbalza. E' la
     punteggiatura della regia: dice in una parola cosa e' successo. */
  function timbro(testo, x, y, px, colore, t, rot) {
    testo = T(testo);
    var c = g();
    var entra = fetta(t, 0, 0.22), esce = fetta(t, 0.85, 1);
    if (entra <= 0) return;
    var s = mix(2.4, 1, eback(entra, 2.2));
    c.save();
    c.font = font('900', px);
    spazia(c, '0.06em');
    var w = c.measureText(testo).width + px * 0.9, h = px * 1.45, ang = rot == null ? -0.10 : rot;
    /* ⛔ giro 2: una parola posata su un posto del bordo usciva dallo schermo
       («ASSO» per Ivo, «PASS» per Wanda a 360 px). Il centro si tiene dentro,
       misurando l'ingombro vero della scritta girata. */
    var ingW = Math.abs(w * Math.cos(ang)) + Math.abs(h * Math.sin(ang)), ingH = Math.abs(w * Math.sin(ang)) + Math.abs(h * Math.cos(ang));
    x = Math.max(ingW / 2 + 8, Math.min(L() - ingW / 2 - 8, x));
    /* ⛔ giro 3 · il timbro non passa SOTTO lo striscione dello stesso
       fotogramma («IL BUTTAFUORI!» perdeva le ultime lettere sotto «ROCCO
       pesca…» a 1280x720): se lo tocca, scende subito sotto */
    var st = R._striscione;
    if (st && st.rett && st.fot === R._fot && x + ingW / 2 > st.rett[0] && x - ingW / 2 < st.rett[2] &&
        y + ingH / 2 > st.rett[1] && y - ingH / 2 < st.rett[3]) y = st.rett[3] + ingH / 2 + 6;
    segno(x - ingW / 2, y - ingH / 2, x + ingW / 2, y + ingH / 2, testo);
    c.globalAlpha = (1 - esce) * Math.min(1, entra * 3);
    c.translate(x, y);
    c.rotate(ang);
    c.scale(s, s);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = 'rgba(8,10,9,0.78)';
    c.strokeStyle = colore; c.lineWidth = Math.max(2, px * 0.09);
    rr(c, -w / 2, -h / 2, w, h, px * 0.25); c.fill(); c.stroke();
    c.fillStyle = colore;
    c.fillText(testo, 0, px * 0.05);
    c.restore();
  }

  /* ⭐ LO STRISCIONE: chi fa cosa, in alto sul palco. Due righe al massimo:
     il NOME in oro, e il gesto sotto. */
  /* `xa` (13/09): { x, sx } — se `sx` e' vero, x e' il bordo SINISTRO
     dello striscione (sul PC sta di fianco alla carta del palco) */
  /* ⛔ collaudo 13/09 · MAI TESTO MINUSCOLO. Prima lo striscione si
     stringeva fino a starci: di fianco al palco, a 1920, la seconda riga
     scendeva a 10 px e la BANCAROTTA a 8. Adesso si prova in quest'ordine:
     una riga per parte restringendo fino al minimo leggibile (23 px il nome
     sul PC, cioe' 16 la riga sotto; 15 sul telefono); poi andando A CAPO (due
     righe per parte) fino al minimo; poi il posto dopo (`xa.nastro`, il nastro
     sulla cima della carta). Solo se niente ci sta si stringe ancora.
     `rompi(testo, larghezza)` spezza a parole, e non restituisce niente se
     servono piu' di `max` righe o una parola sola non ci sta. */
  function rompi(c, testo, lim, max) {
    if (!testo) return [];
    if (c.measureText(testo).width <= lim) return [testo];
    if (max < 2) return null;
    var parole = testo.split(' '), righe = [], riga = '', i, p;
    for (i = 0; i < parole.length; i++) {
      p = riga ? riga + ' ' + parole[i] : parole[i];
      if (c.measureText(p).width > lim && riga) { righe.push(riga); riga = parole[i]; }
      else riga = p;
    }
    if (riga) righe.push(riga);
    if (righe.length > max) return null;
    /* giro 3 · due righe si bilanciano: «LA BANCAROTTA TORNA NEL / MAZZO»
       lasciava una parola sola sotto */
    if (righe.length === 2 && parole.length > 2) {
      var meglio = null, mw = 1e9, a2, b2, w2;
      for (i = 1; i < parole.length; i++) {
        a2 = parole.slice(0, i).join(' '); b2 = parole.slice(i).join(' ');
        w2 = Math.max(c.measureText(a2).width, c.measureText(b2).width);
        if (w2 <= lim && w2 < mw) { mw = w2; meglio = [a2, b2]; }
      }
      if (meglio) righe = meglio;
    }
    for (i = 0; i < righe.length; i++) if (c.measureText(righe[i]).width > lim) return null;
    return righe;
  }
  function impaginaStriscione(c, riga1, riga2, px, lim, max, forza) {
    var dentro = lim - px * 2, r1, r2, w = 0, i;
    c.font = font('900', px); spazia(c, '0.08em');
    r1 = rompi(c, riga1, dentro, max);
    if (!r1 && forza) r1 = [riga1];
    if (!r1) return null;
    for (i = 0; i < r1.length; i++) w = Math.max(w, c.measureText(r1[i]).width);
    c.font = font('600', px * 0.72); spazia(c, '0.02em');
    r2 = rompi(c, riga2, dentro, max);
    if (!r2 && forza) r2 = riga2 ? [riga2] : [];
    if (!r2) return null;
    for (i = 0; i < r2.length; i++) w = Math.max(w, c.measureText(r2[i]).width);
    var h1 = px * 1.12, h2 = px * 0.72 * 1.28;
    var h = r1.length * h1 + r2.length * h2 + (r2.length ? px * 0.06 : 0) + px * 0.5;
    return { px: px, r1: r1, r2: r2, w: Math.min(lim, w + px * 2), h: h, h1: h1, h2: h2 };
  }
  /* ⛔ collaudo 13/09 giro 2 · LA DIDASCALIA NON COPRE IL GESTO. Stava nella
     corsia fra i ventagli e le pile (47 px a 1920, 30 a 1536 con sette), cioe'
     proprio dove l'effetto posa il ×N, il cartellino del CONTO, il timbro PASSO
     e le carte che salgono dal mazzo: si leggeva la frase e non si vedeva il
     segno (sul telefono copriva la targa di chi subiva). Adesso `y` puo' essere
     una DOMANDA: { evita: [rettangoli] }. Il momento dichiara dove succede la
     sua cosa, e la pagina (`P.didascalia`, che conosce le fasce libere)
     risponde con l'altezza. La scelta si fa UNA volta per momento: uno
     striscione che salta a meta' racconto si legge peggio di uno fermo. */
  function striscione(riga1, riga2, y, t, colore, xa) {
    riga1 = T(riga1); riga2 = T(riga2);
    var c = g(), a = fetta(t, 0, 0.15) * (1 - fetta(t, 0.9, 1));
    if (a <= 0) return;
    var px0 = Math.max(15, Math.min(26, Math.max(L() * 0.05, A() * 0.024)));
    var pc = L() >= 1000, min1 = pc ? 23 : 15, min2 = pc ? 23 : 12;
    var domanda = (y && typeof y === 'object') ? y : null;
    if (domanda) y = domanda.cy != null ? domanda.cy : DY();
    /* i posti possibili, in ordine di preferenza */
    var opz = [];
    if (!xa) opz.push({ lim: L() - 16, cx: L() / 2, cy: y });
    else {
      if (xa.x != null) {
        if (xa.sx) opz.push({ lim: xa.lim != null ? xa.lim : L() - xa.x - 16, sinistra: xa.x, cy: y });
        else opz.push({ lim: 2 * Math.min(xa.x, L() - xa.x) - 16, cx: xa.x, cy: y });
      }
      /* ⛔ giro 2: fra 1440 e 1800 px a destra della carta non c'era posto, e
         il nastro copriva il SEGNO in alto a sinistra, quello che fa
         riconoscere la carta al volo. Prima si prova a SINISTRA della carta,
         sopra la colonna degli scarti (che col velo non raccontano niente).
         ⛔ giro 3: ...ma nei momenti in cui le pile RACCONTANO (i gettoni di un
         furto che cadono negli scarti, la mazzetta, la bancarotta che rientra)
         a 1680 quel posto copriva proprio la carta che atterrava. Il momento lo
         dice (`xa.pile`) e il posto vale solo se copre al piu' il 10% di ogni pila */
      if (xa.sinistraDi != null) opz.push({ lim: xa.limSin, destra: xa.sinistraDi, cy: y, righe: xa.righeSin || 3, pile: xa.pile });
      if (xa.nastro) opz.push({ lim: xa.nastro.lim, cx: xa.nastro.x, cima: xa.nastro.top, dMax: xa.nastro.destraMax });
      /* ...e solo se la frase e' troppo lunga anche per quello (la BANCAROTTA
         a 1100 px), un nastro piu' largo della carta, sempre sotto il segno */
      if (xa.nastro && xa.nastro.limLargo > xa.nastro.lim) opz.push({ lim: xa.nastro.limLargo, cx: xa.nastro.x, cima: xa.nastro.top, dMax: xa.nastro.destraMax });
    }
    c.save();
    var lay = null, o = null, k, px;
    for (k = 0; k < opz.length && !lay; k++) {
      o = opz[k];
      if (o.lim < 60) continue;
      for (px = px0; px >= min1 && !lay; px--) lay = impaginaStriscione(c, riga1, riga2, px, o.lim, 1);
      /* a capo solo se il posto e' largo: in 150 px «gioca PAGA / TU → TU»
         spezzava il nome della carta, e il nastro si legge meglio */
      if (o.lim >= 240 || k === opz.length - 1)
        for (px = px0; px >= min2 && !lay; px--) lay = impaginaStriscione(c, riga1, riga2, px, o.lim, o.righe || 2);
      if (lay && o.pile && k < opz.length - 1 && copreLePile([o.destra - lay.w, o.cy - lay.h / 2, o.destra, o.cy + lay.h / 2])) lay = null;
    }
    if (!lay) {
      o = opz[opz.length - 1];
      for (px = min2; px >= 10 && !lay; px--) lay = impaginaStriscione(c, riga1, riga2, px, Math.max(60, o.lim), 2);

var BECCA_MANO = 1.5707;
var BECCA_AVV = 1.20;        /* i ventagli degli avversari, tenuti in mano anche loro */
var Y_MANO = -1.2;           /* la profondita' della mano: a 1,0 dall'occhio (si rifa' in `impagina`) */

function limita(v, a, b) { return v < a ? a : (v > b ? b : v); }
function mixN(a, b, t) { return a + (b - a) * t; }
/* la risoluzione degli sprite: la misura a schermo per il DPR (con un tetto),
   altrimenti su un telefono i nomi piccoli si sfocano proprio dove sono al limite */
function spr(px) { return Math.max(4, Math.round(px * Math.min(2, DPR))); }
function altoMazzo(n) { return Math.max(0.006, Math.min(0.20, n * 0.0038)); }

function misuraTavolo() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  LARG = cv.clientWidth; ALT = cv.clientHeight;
  cv.width = Math.round(LARG * DPR); cv.height = Math.round(ALT * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  impagina();
  AVV = null;
  lcSvuota();                       /* le facce cotte vanno rifatte alla nuova scala */
  impaginaDom();
